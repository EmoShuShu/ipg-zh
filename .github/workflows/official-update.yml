name: Check official IPG update

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: official-ipg-update
  cancel-in-progress: false

jobs:
  check:
    name: Detect official PDF and save review evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[test]"

      - name: Check official update and notify once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p outputs/official-update
          set -o pipefail
          python -m ipg_pipeline.scheduled_update 2>&1 | tee outputs/official-update/check.log

      - name: Upload official update evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipg-official-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/official-update/
          if-no-files-found: warn
          retention-days: 30
