name: Check official IPG update

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      retry_closed:
        description: "重新打开已关闭的同一更新 PR（默认暂缓）"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: official-ipg-update
  cancel-in-progress: false

jobs:
  check:
    name: Detect official PDF and open review PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check official update and notify once
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_CLOSED: ${{ inputs.retry_closed || false }}
        shell: bash
        run: |
          mkdir -p outputs/official-update
          set -o pipefail
          python -m ipg_pipeline.scheduled_update 2>&1 | tee outputs/official-update/check.log

      - name: Upload official update evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipg-official-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/official-update/
            tmp/official-update-diagnostics/
            tmp/official-update-result.json
          if-no-files-found: warn
          retention-days: 30
