name: Publish IPG release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "ipg_pipeline/github_release.py"
      - "scripts/release.py"
      - "dist/rules.json"
      - "dist/IPG.md"
      - "src/ipg/current-release.txt"
      - "src/ipg/version-notes.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ipg-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[test]"

      - name: Resolve current release
        shell: bash
        run: |
          release="$(python -c 'from ipg_pipeline.release import current_release_dir; print(current_release_dir().name)')"
          echo "IPG_RELEASE_ID=$release" >> "$GITHUB_ENV"

      - name: Strictly validate source
        run: python scripts/validate.py --profile release

      - name: Run tests
        run: python -m pytest --junitxml=outputs/release-tests.xml

      - name: Build release assets deterministically
        run: >-
          python scripts/build.py --profile release --rehearsal
          --output outputs/release-artifacts

      - name: Validate and compare release assets
        shell: bash
        run: |
          python scripts/validate_output.py --input outputs/release-artifacts/rules.json
          cmp outputs/release-artifacts/rules.json dist/rules.json
          cmp outputs/release-artifacts/IPG.md dist/IPG.md
          cd outputs/release-artifacts
          sha256sum --check SHA256SUMS

      - name: Resolve deterministic tag and write release notes
        run: >-
          python scripts/release.py --artifacts outputs/release-artifacts
          --source-commit "$GITHUB_SHA"

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release.py --artifacts outputs/release-artifacts
          --source-commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --publish

      - name: Upload release evidence
        if: always() && hashFiles('outputs/release-artifacts/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ipg-release-${{ env.IPG_RELEASE_ID }}-${{ github.sha }}
          path: outputs/release-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always() && hashFiles('outputs/release-tests.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ipg-release-tests-${{ github.sha }}
          path: outputs/release-tests.xml
          if-no-files-found: error
          retention-days: 14
