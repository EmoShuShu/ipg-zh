name: Validate IPG

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipg-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build current release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[test]"

      - name: Resolve current release
        shell: bash
        run: |
          release="$(python -c 'from ipg_pipeline.release import current_release_dir; print(current_release_dir().name)')"
          echo "IPG_RELEASE_ID=$release" >> "$GITHUB_ENV"

      - name: Strictly validate source
        run: python scripts/validate.py --profile release

      - name: Run tests
        run: python -m pytest --junitxml=outputs/ci-tests.xml

      - name: Build release rehearsal
        run: >-
          python scripts/build.py --profile release --rehearsal
          --output outputs/ci-artifacts

      - name: Independently validate published JSON
        run: python scripts/validate_output.py --input outputs/ci-artifacts/rules.json

      - name: Rebuild for determinism check
        run: >-
          python scripts/build.py --profile release --rehearsal
          --output outputs/ci-repeat

      - name: Verify deterministic output
        shell: bash
        run: |
          cmp outputs/ci-artifacts/rules.json outputs/ci-repeat/rules.json
          cmp outputs/ci-artifacts/IPG.md outputs/ci-repeat/IPG.md

      - name: Verify checked-in artifacts are current
        shell: bash
        run: |
          cmp outputs/ci-artifacts/rules.json dist/rules.json || {
            echo "dist/rules.json is stale; rebuild locally and commit it." >&2
            exit 1
          }
          cmp outputs/ci-artifacts/IPG.md dist/IPG.md || {
            echo "dist/IPG.md is stale; rebuild locally and commit it." >&2
            exit 1
          }

      - name: Verify artifact checksums
        if: always() && hashFiles('outputs/ci-artifacts/**') != ''
        shell: bash
        run: |
          cd outputs/ci-artifacts
          sha256sum --check SHA256SUMS

      - name: Upload preview artifacts
        if: always() && hashFiles('outputs/ci-artifacts/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ipg-${{ env.IPG_RELEASE_ID }}-${{ github.sha }}
          path: outputs/ci-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always() && hashFiles('outputs/ci-tests.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ipg-tests-${{ github.sha }}
          path: outputs/ci-tests.xml
          if-no-files-found: error
          retention-days: 14
