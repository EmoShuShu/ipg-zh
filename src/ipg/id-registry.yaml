    atVersion: ipg-2024-09-23-pilot
    label: A player allows another player in the game to commit a Game Play Error and does not point it
      out immediately. If a judge believes a player is intentionally not pointing out other players’ illegal
      actions, either for their own advantage, or in the hope of bringing it up at a more strategically
      advantageous time, they should consider an Unsporting Conduct — Cheating infraction. Not reminding
      an opponent about their triggered abilities is never Failure to Maintain Game State nor Cheating.
