  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Players are expected to call attention to deck errors immediately, and not gain any potential
      advantage from having the cards in their deck.
- id: ipg-b000098
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-5:420cfeb1df48af477f3637bb609e62c3581378dc9197a7170f677b448883d2e9
  evidence:
    section: ipg-s3-5
    component: ipg-c000035
    englishHash: 420cfeb1df48af477f3637bb609e62c3581378dc9197a7170f677b448883d2e9
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: The most common forms of deck error are failure to desideboard and having a card in the wrong
      deck. Both of these are difficult to gain advantage from without obvious cheating. Allowing the
      opponent to choose which card they would otherwise be working with is sufficient to compensate for
      the easily discovered situations. Duplicates of cards that begin in the main deck are more problematic,
      as they are not as easy to realize and catch, and thus mandate an upgraded penalty.
- id: ipg-b000099
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-5:cc6d5f44ddc3fbe263490c0394431724187d969c844366d74f13864542f3ecb5
  evidence:
    section: ipg-s3-5
    component: ipg-c000035
    englishHash: cc6d5f44ddc3fbe263490c0394431724187d969c844366d74f13864542f3ecb5
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: A window in which the error is a Game Loss is necessary to discourage intentional abuse of
      the minimum number of cards in the deck. Once that point has passed, the opponent agrees that the
      deck is valid. Judges should always be mindful of the abuse possibilities when investigating these
      infractions.
