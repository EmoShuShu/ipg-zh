- id: ipg-s2-3-c-additional-remedy-g01-b006
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-3-c-additional-remedy-g01-b006
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: If a set affected by the error contains more cards than it is supposed to contain, the player
      reveals the set of cards that contains the excess and their opponent chooses a number of previously-
      unknown cards sufficient to reduce the set to the correct size. These excess cards are returned
      to the correct location. If that location is the library, they should be shuffled into the random
      portion unless the owner previously knew the identity of the card/cards illegally moved; that many
      cards, chosen by the opponent, are returned to the original location instead. For example, if a
      player playing with Sphinx of Jwar Isle illegally draws a card, that card should be returned to
      the top of the library.
  evidence:
    context: ipg-s2-3-c-additional-remedy
    englishHash: d71d66b09e6bf1c8241ceaf0d2238bf618aa632b39ca4c6443e4b794a9a8e0c7
- id: ipg-s2-3-c-additional-remedy-g01-b007
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-3-c-additional-remedy-g01-b007
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: 'Upgrade: If a face-down card cast using a morph or disguise ability is on the battlefield
      during the game and does not have the relevant ability printed on the card, the penalty is a Game
      Loss. If the player has one or more cards with the same ability in hand, has not added previously
      unknown cards to their hand since casting the card found in violation, and has self-reported the
      error before an effect that would reveal it is played, the upgrade does not apply and they may swap
      the card for a card with the appropriate ability in hand.'
  evidence:
    context: ipg-s2-3-c-additional-remedy
    englishHash: 5d8a538cce0380f03f8313a1ba063d2bdb822844bac0023b6248833372ea9752
