    label: If, before or during a match, a player requests and receives permission from a judge for a
      delay for a legitimate task, such as a bathroom break or finding replacements for missing cards,
      that player has up to 10 minutes to perform that task before they are considered tardy. If the player
      takes more than 10 minutes, a Match Loss will be applied. Otherwise, no penalty will be applied
      and a time extension given for the time taken.
