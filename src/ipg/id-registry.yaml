  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Being enrolled in the tournament is not a requirement to receive a penalty. Although these
      guidelines refer to players, other people in the venue, such as spectators, staff, or judges may
      be enrolled into (and dropped from) the tournament in order to receive a penalty. Penalties are
      still issued even if a player drops from the tournament before it would take effect.
- id: ipg-b000024
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-2:dadcd5df86626e906a1aa7cf5620a38efa30039b951b2b4551228a65dba6bdd5
  evidence:
