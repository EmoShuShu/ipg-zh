- id: ipg-b000082
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-4:ae782e9629e9b5b2fa4c38297dfae662ae42f39f4a2426f0f7d8f7b2148d8d65
  evidence:
    section: ipg-s3-4
    component: ipg-c000032
    englishHash: ae782e9629e9b5b2fa4c38297dfae662ae42f39f4a2426f0f7d8f7b2148d8d65
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: If the decklist contains illegal cards, remove them. If the decklist is being adjusted to allow
      for an intended companion, the player exchanges cards between the deck and sideboard until the restriction
      is met.
- id: ipg-b000083
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-4:00d680d8c04009918bdd6b3cb23b0c18602b881cfd8d316a7034d05cf8ad250c
  evidence:
    section: ipg-s3-4
    component: ipg-c000032
    englishHash: 00d680d8c04009918bdd6b3cb23b0c18602b881cfd8d316a7034d05cf8ad250c
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Alter the decklist to match the deck the player is actually playing. If the deck/sideboard
      and decklist both violate a maximum cards restriction (usually too many cards in a sideboard, more
      than four of a card, or the same card in two decks in a Unified Constructed format), remove cards
      as directed by the player to make the decklist legal.
- id: ipg-b000084
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-4:aa862181493a7e644362b219b66be5e19e9139927161d15f92ff5c450a1de81f
  evidence:
    section: ipg-s3-4
    component: ipg-c000032
    englishHash: aa862181493a7e644362b219b66be5e19e9139927161d15f92ff5c450a1de81f
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: If the deck contains too few cards, the player chooses to add any combination of cards named
      Plains, Island, Swamp, Mountain or Forest to reach the minimum number. Alter the decklist to reflect
      this. These changes may be reverted without penalty if the player is subsequently able to locate
      identical replacements to legal original cards.
