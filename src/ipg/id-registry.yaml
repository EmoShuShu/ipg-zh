  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Some infractions in this document permit the judge to consider the possibility of a backup.
      Due to the amount of information that may become available to players and might affect their play,
      backups are regarded as a solution of last resort, only applied in situations where leaving the
      game in the current state is a substantially worse solution. A good backup will result in a situation
      where the gained information makes no difference and the line of play remains the same (excepting
      the error, which has been fixed). This means limiting backups to situations with minimal decision
      trees.
- id: ipg-b000030
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-4:156eff014a6587a6606fb90fc8e94987b1b8b9a8facc06aaea4bcdba6051724a
  evidence:
    section: ipg-s1-4
    component: ipg-c000010
    englishHash: 156eff014a6587a6606fb90fc8e94987b1b8b9a8facc06aaea4bcdba6051724a
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Only the Head Judge may authorize a backup. At large tournaments, they may choose to delegate
      this responsibility to Team Leaders.
- id: ipg-b000031
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-4:69adb8856451b228ba8d1a24c22431f8af9bc707d7c5aa93e0484e419b9adc6b
  evidence:
    section: ipg-s1-4
    component: ipg-c000010
    englishHash: 69adb8856451b228ba8d1a24c22431f8af9bc707d7c5aa93e0484e419b9adc6b
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: To perform a backup, each individual action since the point of the error is reversed, starting
      with the most recent ones and working backwards. Every action must be reversed; no parts of the
      sequence should be omitted or reordered. If the identity of a card involved in reversing an action
      is unknown to one of the players (usually because it was drawn), a random card is chosen from the
      possible candidates. Actions that caused a player to learn the identity of cards at a specific location
      in the library are reversed by shuffling those cards into the random portion of the library unless
      they were subsequently drawn; cards being returned to the library as part of the backup should not
      be shuffled at that stage if their identity was known to only one player.
- id: ipg-b000032
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-4:3cae4f39818c14647f9b407e4b731c192abc59462d2303057df8e535419d4267
  evidence:
    section: ipg-s1-4
    component: ipg-c000010
    englishHash: 3cae4f39818c14647f9b407e4b731c192abc59462d2303057df8e535419d4267
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Backups involving random/unknown elements should be approached with extreme caution, especially
      if they cause or threaten to cause a situation in which a player will end up with different cards
      than they would once they have correctly drawn those cards. For example, returning cards to the
      library when a player has the ability to shuffle their library is not something that should be done
      except in extreme situations.
- id: ipg-b000033
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-4:ec42908e82e5e6b3ff73267ba6599f1f9f55c578a19c36df01a02ccf6f983b63
  evidence:
    section: ipg-s1-4
    component: ipg-c000010
    englishHash: ec42908e82e5e6b3ff73267ba6599f1f9f55c578a19c36df01a02ccf6f983b63
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Some remedies state a simple backup may be performed. A simple backup is backing up the last
      action completed (or one currently in progress) and is sometimes used to make another portion of
      the prescribed remedy smoother. A simple backup should not involve any random elements.
