  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Judges should inform the player how their conduct is disruptive. The player is expected to
      correct the situation and behavior immediately. However, while making sure that the player understands
      the severity of their actions is important, judges should focus first on calming a situation, and
      deal with infractions and penalties afterwards.
