    atVersion: ipg-2024-09-23-pilot
    label: ipg-ann-2-5-shared-grv-g01
- id: ipg-ann-2-5-shared-grv-g01-b01
  kind: publication-annotation-block
  status: active
  canonicalKey: pilot:ipg-ann-2-5-shared-grv-g01-b01
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: As always, both players are responsible for maintaining a clear game state. If my card tells
      you to take an action, and you do it incorrectly, whose fault is it? Yours for doing the action
      incorrectly, or mine for not making sure my spell resolved correctly? Turns out, in this case, it’s
      reasonable to say we are both equally at fault. Fundamentally if the judge thinks that both players
      share the responsibility for the error, because of continuous effects or both participating in the
      action, then both players receive this penalty. Another example of a situation that both players
      are responsible for, is the transition from day/night or night/day, provided there are permanents
      on the battlefield that care about night/day
- id: ipg-ann-2-5-shared-grv-g01-b02
  kind: publication-annotation-block
  status: active
  canonicalKey: pilot:ipg-ann-2-5-shared-grv-g01-b02
