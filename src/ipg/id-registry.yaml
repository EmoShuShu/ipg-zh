  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: A Game Loss ends the current game immediately and the player who committed the infraction is
      considered to have lost the game for the purpose of match reporting. The player receiving a Game
      Loss chooses whether to play or draw in the next game of that match, if applicable. If a Game Loss
      is issued before the match begins, neither player in that match may use sideboards (if the tournament
      uses them) for the first game they play.
- id: ipg-b000013
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-1:8eca47060a509d8cf3f48e1f24751f0339caa45197fe48213e709eaa28652729
  evidence:
    section: ipg-s1-1
    component: ipg-c000005
    englishHash: 8eca47060a509d8cf3f48e1f24751f0339caa45197fe48213e709eaa28652729
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Game Losses are applied immediately if the game is still ongoing, or to the player’s next game
      if it is not, unless otherwise specified. If a player would receive multiple Game Losses at the
      same time, they only receive one. If simultaneous Game Loss penalties are issued to each player,
      they are recorded, but do not affect the match score.
- id: ipg-c000006
  kind: component
