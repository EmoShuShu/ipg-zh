- id: ipg-s2-c-body-g01-b001
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-c-body-g01-b001
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Game Play Errors are caused by incorrect or inaccurate play of the game such that it results
      in violations of the Magic Comprehensive Rules. Many offenses fit into this category and it would
      be impossible to list them all. The guide below is designed to give judges a framework for assessing
      how to handle a Game Play Error.
  evidence:
    context: ipg-s2-c-body
    englishHash: cfac46638034e8043964bb9293ae7306880017fc0301f8160f0c17742122f422
- id: ipg-s2-c-body-g01-b002
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-c-body-g01-b002
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Most Game Play Error infractions are assumed to have been committed unintentionally. If the
      judge believes that the error was intentional, they should first consider whether an Unsporting
      Conduct — Cheating infraction has occurred.
  evidence:
    context: ipg-s2-c-body
    englishHash: a3a2ea915118f85f1fa7b77f8ba9084ce708b6e953850b1e8eee1566fafc01f4
- id: ipg-s2-c-body-g01-b003
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-c-body-g01-b003
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: With the exception of Failure to Maintain Game State, which is never upgraded, the third or
      subsequent Warning for a Game Play Error offense in the same category is upgraded to a Game Loss.
      For multi-day tournaments, the penalty count for these infractions resets between days.
  evidence:
    context: ipg-s2-c-body
    englishHash: fa833afee79249e3573a44be3e244556dba0463cbeacef19e15b41d570a00af0
