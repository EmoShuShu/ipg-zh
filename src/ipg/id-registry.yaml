- id: ipg-s2-2-c-philosophy-g01-b001
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-2-c-philosophy-g01-b001
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: A player can accidentally look at extra cards easily and this infraction handles situations
      where a dexterity or rules error has led to a player seeing cards that they shouldn’t have. Cards
      in a library are considered to be there until they touch cards in another hidden set. Once those
      cards have joined another hidden set, the infraction is Hidden Card Error or Game Rule Violation.
  evidence:
    context: ipg-s2-2-c-philosophy
    englishHash: 7d02abf6b49f20a18e84fdcd2b249c8d5ce095a3fcdb506add9efa67d2341a48
- id: ipg-s2-2-c-philosophy-g01-b002
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-2-c-philosophy-g01-b002
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Players should not use this penalty to get a “free shuffle” or to attempt to shuffle away cards
      they don’t want to draw; doing so may be Unsporting Conduct — Cheating. Players also are not allowed
      to use this penalty as a stalling mechanism. The library is already randomized, so shuffling in
      the revealed cards should not involve excessive effort.
  evidence:
    context: ipg-s2-2-c-philosophy
    englishHash: 2527d7178d20159952eda810532f934407175c834fc856d1d158f4d2d3c3e88c
