    atVersion: ipg-2024-09-23-p3
    label: A safe environment is a basic expectation of any tournament attendee. Harassment undermines
      the safety and integrity of a tournament. Players who purposefully create harmful or unwelcoming
      situations in a tournament are expected to immediately correct the behavior and demonstrate remorse
      or be removed.
- id: ipg-b000159
  kind: block
  status: active
  canonicalKey: official:block:ipg-s4-2:f82af4dd8dec45cda4e09c9e00eb78b647befa010ac5338fb5a81e0efaab16d7
