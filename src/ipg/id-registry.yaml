    label: Players are expected to shuffle their deck thoroughly when it is required and are expected
      to have the skill and understanding of randomization to do so. However, as the opponent has the
      opportunity to shuffle after the player does, the potential for advantage is lowered if tournament
      policy is followed.
- id: ipg-b000135
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-9:e34c4c1b35c31204cb2b5c00b341ad8efe13d61231a9ecea61cdd73b356de5c9
