  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Officials must investigate these matters as soon as they are brought to their attention. If
      they determine that the infraction does not meet the criteria for Unsporting Conduct – Major, it
      is still recommended that the players be talked to to avoid future misunderstandings.
