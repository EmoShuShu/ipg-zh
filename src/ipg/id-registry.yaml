  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Because of the confrontational nature of this infraction, judges need to end any match in progress
      and separate the players. Care should be taken not to escalate the situation if at all possible.
      The offender will be removed from the area to receive the penalty, and education about why the behavior
      is unacceptable regardless of excuse. They may need a few moments to cool down afterwards. Apologizing
      is encouraged, but the desire of the other individuals to not interact with their harasser must
      be respected.
- id: ipg-b000160
  kind: block
  status: active
  canonicalKey: official:block:ipg-s4-2:bc0ee46900cdfb4710ef8c8ea97069c2d7b975f118bfd094e840f1779cdc0d22
