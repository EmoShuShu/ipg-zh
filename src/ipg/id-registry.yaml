    label: 'This document is divided into two major parts: General Definitions and Philosophy (section
      1), and Infractions (sections 2-4). Infractions are broken down into general classes (Game Play
      Errors, Tournament Errors, and Unsporting Conduct), and further into subclasses for specific infractions.'
