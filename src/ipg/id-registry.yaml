- id: ipg-b000006
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1:5bd65cef357100d21682376e1d0e2209a7e77a31c571b97f16ea695006c6bc5d
  evidence:
    section: ipg-s1
    component: ipg-c000003
    englishHash: 5bd65cef357100d21682376e1d0e2209a7e77a31c571b97f16ea695006c6bc5d
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Judges are neutral arbiters and enforcers of policy and rules. A judge shouldn’t intervene
      in a game unless they believe a rules violation has occurred, a player with a concern or question
      requests assistance, or the judge wishes to prevent a situation from escalating. Judges don’t stop
      play errors from occurring, but instead deal with errors that have occurred, penalize those who
      violate rules or policy, and promote fair play and sporting conduct by example and diplomacy. Judges
      may intervene to prevent or preempt errors occurring outside of a game. Knowledge of a player’s
      history or skill does not alter an infraction, but it may be taken into account during an investigation.
- id: ipg-b000007
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1:c435f9f29aa599b4b0bbbaa394dc1e20bc9c249c6701234ef9b32d7e73fee65e
  evidence:
    section: ipg-s1
    component: ipg-c000003
    englishHash: c435f9f29aa599b4b0bbbaa394dc1e20bc9c249c6701234ef9b32d7e73fee65e
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: The purpose of a penalty is to educate the player not to make similar mistakes in the future.
      This is done through both an explanation of where the rules or policies were violated and a penalty
      to reinforce the education. Penalties are also for the deterrence and education of every other player
      in the event and are also used to track player behavior over time.
- id: ipg-b000008
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1:934b7bb2222e17834f0b786987ef65fa74258ea9acea4089811d9a6f130a2ee6
  evidence:
    section: ipg-s1
    component: ipg-c000003
    englishHash: 934b7bb2222e17834f0b786987ef65fa74258ea9acea4089811d9a6f130a2ee6
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: If a minor violation is quickly handled by the players to their mutual satisfaction, a judge
      does not need to intervene. If the players are playing in a way that is clear to both players, but
      might cause confusion to an external observer, judges are encouraged to request that the players
      make the situation clear, but not assess an infraction or issue any penalty. In both these situations,
      the judge should ensure that the game progresses normally. More significant violations are addressed
      by first identifying what infraction applies, then proceeding with the corresponding instructions.
- id: ipg-b000009
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1:fd4fd24e9ba6bff4863e2d6933d3375d24bf87d5b0224084bb8d0a33217abd84
  evidence:
    section: ipg-s1
    component: ipg-c000003
    englishHash: fd4fd24e9ba6bff4863e2d6933d3375d24bf87d5b0224084bb8d0a33217abd84
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Only the Head Judge is authorized to issue penalties that deviate from these guidelines. The
      Head Judge may not deviate from this guide’s procedures except in significant and exceptional circumstances
      or a situation that has no applicable philosophy for guidance. Significant and exceptional circumstances
      are rare—a table collapses, a booster contains cards from a different set, etc. The Rules Enforcement
      Level, round of the tournament, age or experience-level of the player, desire to educate the player,
      and certification level of the judge are NOT exceptional circumstances. If another judge feels deviation
      is appropriate, they must consult with the Head Judge.
- id: ipg-b000010
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1:4c9ab0436c8f01ac1cf86da62a88edf66b01bde7f59a8e30ba005701d0305eb1
  evidence:
    section: ipg-s1
    component: ipg-c000003
    englishHash: 4c9ab0436c8f01ac1cf86da62a88edf66b01bde7f59a8e30ba005701d0305eb1
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Judges are human and make mistakes. When a judge makes a mistake, they should acknowledge the
      mistake, apologize to the players, and fix it if it is not too late. If a member of the tournament
      staff gives a player erroneous information that causes them to commit a violation, the Head Judge
      is authorized to downgrade the penalty. For example, a player asks a judge whether a card is legal
      for a format and is told yes. When that player’s deck is found to be illegal because of these cards,
      the Head Judge applies the normal procedure for fixing the decklist, but may downgrade the penalty
      to a Warning because of the direct error of the judge. If a player clearly acts on erroneous information
      provided by a judge during the game, the Head Judge may consider a backup to the point of the action
      taken, even if that action did not lead to a violation.
