- id: ipg-s2-3-c-philosophy-g01
  kind: group
  status: active
  canonicalKey: pilot:ipg-s2-3-c-philosophy-g01
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: ipg-s2-3-c-philosophy-g01
- id: ipg-s2-3-c-philosophy-g01-b001
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-3-c-philosophy-g01-b001
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Though the game state cannot be reversed to the ‘correct’ state, this error can be mitigated
      by giving the opponent sufficient knowledge and ability to offset the error so that it is less likely
      to generate advantage.
  evidence:
    context: ipg-s2-3-c-philosophy
    englishHash: 08cd865cd6ec30eb100ea222bc704e7f34d7cf0458c62845a342027663cac58e
- id: ipg-s2-3-c-philosophy-g01-b002
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-3-c-philosophy-g01-b002
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: If cards are placed into a public zone, then their order is known and the infraction can be
      handled as a Game Rule Violation. Order cannot be determined from card faces only visible to one
      player unless the card is in a uniquely identifiable position (such as on top of the library, or
      as the only card in hand.)
  evidence:
    context: ipg-s2-3-c-philosophy
    englishHash: 04da4ca8473c73ea59c18de02ac81c5d239a1cc9fc6ae3e91c033f0d181cc935
- id: ipg-s2-3-c-philosophy-g01-b003
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-3-c-philosophy-g01-b003
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Be careful not to apply this infraction in situations where a publicly-correctable error subsequently
      leads to an uncorrectable situation such as a Brainstorm cast using green mana. In these situations,
      the infraction is based on that root cause.
  evidence:
    context: ipg-s2-3-c-philosophy
    englishHash: 09b51b0d07de3dde0d1e6f3fe303b81830493d2607e8269e4237c08aa1acdd69
- id: ipg-s2-3-c-philosophy-g01-b004
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-3-c-philosophy-g01-b004
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Information about cards previously known by the opponent, such as cards previously revealed
      while on the top of the library or by a previous look at the hand, may be taken into account while
      determining the set of cards to which the remedy applies.
  evidence:
    context: ipg-s2-3-c-philosophy
    englishHash: b1bd9daee25601e533b28b62f1f361c596248af3a51a96c3e75e89ae8b35be5e
- id: ipg-s2-3-c-philosophy-g01-b005
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-3-c-philosophy-g01-b005
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Always operate on the smallest set possible to remedy the error. This may mean applying the
      remedy to only part of a set defined by an instruction. For example, if a player resolves Collected
      Company, picks up three cards with one hand and then four cards with the other, the last drawn set
      of four cards should be used for the remedy, instead of the full set of seven cards..
