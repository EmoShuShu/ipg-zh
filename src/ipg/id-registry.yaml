- id: ipg-s2-1-c-definition-g01
  kind: group
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g01
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: ipg-s2-1-c-definition-g01
- id: ipg-s2-1-c-definition-g01-b001
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g01-b001
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: A triggered ability triggers, but the player controlling the ability doesn’t demonstrate awareness
      of the trigger’s existence by the first time that it would affect the game in a visible fashion.
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: cc1ddd4f8df887f0275b6036a3f4bad508b3204b27aa97fcc082781df4d22619
- id: ipg-s2-1-c-definition-g01-b002
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g01-b002
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: 'The point by which the player needs to demonstrate this awareness depends on the impact that
      the trigger would have on the game:'
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: 3b0631fcddad71a0b6a9081b469a4da937ff9f824ec0cb8f548cf148ccdee03d
- id: ipg-s2-1-c-definition-g02
  kind: group
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g02
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: ipg-s2-1-c-definition-g02
- id: ipg-s2-1-c-definition-g02-b001
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g02-b001
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: 'A triggered ability that requires its controller to choose targets (other than ''target opponent''),
      modes, or other choices made when the ability is put onto the stack: The controller must announce
      those choices before they next pass priority.'
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: 19a653ed942023432ac6e63a76143b4b32a77c7a2fdfdf00b5f747b5fe8ff632
- id: ipg-s2-1-c-definition-g02-b002
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g02-b002
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: 'A triggered ability that causes a change in the visible game state (including life totals)
      or requires a choice upon resolution: The controller must take the appropriate physical action or
      acknowledge the specific trigger before taking any game actions (such as casting a sorcery spell
      or explicitly taking an action in the next step or phase) that can be taken only after the triggered
      ability should have resolved. Note that passing priority, casting an instant spell or activating
      an ability doesn’t mean a triggered ability has been forgotten, as it could still be on the stack.'
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: 418fc79458959e18be1ee97b9bd45e5e023863b58d63a9d16421853fa987c5a3
- id: ipg-s2-1-c-definition-g02-b003
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g02-b003
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: 'A triggered ability that changes the rules of the game: The controller must acknowledge the
      trigger or stop an opponent who tries to take any resulting illegal action.'
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: 3d0f994721b947ce707d3fbe1dcabe69e1b98d41cd8e952ee73494d3030691f9
- id: ipg-s2-1-c-definition-g02-b004
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g02-b004
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: 'A triggered ability that affects the game state in non-visible ways: The controller must make
      the change known by the first time the change has an effect on the visible game state.'
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: 2c6480c0b42165b9cc739da799cf0113d0cc2837f1e0a58539b1be827d7aa620
- id: ipg-s2-1-c-definition-g03
  kind: group
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g03
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: ipg-s2-1-c-definition-g03
- id: ipg-s2-1-c-definition-g03-b001
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g03-b001
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Once any of the above obligations has been fulfilled, further problems are treated as a Game
      Play Error — Game Rule Violation.
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: f24e8d38ddc498479d38cbdd926ca54e93b8889924a8456f7219f91326138fab
- id: ipg-s2-1-c-definition-g03-b002
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g03-b002
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: If the turn-based action of putting a lore counter on a Saga is missed, it should be handled
      as though it was a missed trigger.
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: 076908937eba4deab1e11c1a7b9edab9ad6a4984768f1f4836839a8b49297311
- id: ipg-s2-1-c-definition-g03-b003
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g03-b003
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Triggered abilities that do nothing except create delayed triggered abilities automatically
      resolve without requiring acknowledgment. Awareness of the resulting delayed trigger must be demonstrated
      at the appropriate point. Triggered abilities that do nothing except create one or more copies of
      a spell or ability (such as storm or cipher) automatically resolve, but awareness of the resulting
      objects must be demonstrated using the same requirements as described above (even though the objects
      may not be triggered abilities).
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: cac2c8c37fb1104ed4240701bc423a4d0f81d23e0d535919e97be46638201fa2
- id: ipg-s2-1-c-definition-g03-b004
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g03-b004
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Abilities consisting of an action followed by “when you do” in the same ability are considered
      communicated by the announcement of the action. This is most commonly the case for exert and similar
      abilities.
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: d25847acac0415272641e4641b49abbcb9ecf5fafee1c2aa86c03a204a8deafc
- id: ipg-s2-1-c-definition-g03-b005
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g03-b005
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: If a triggered ability would have no impact on the game, it’s not an infraction to fail to
      demonstrate awareness of it. For example, if the effect of a triggered ability instructs its controller
      to sacrifice a creature, a player who controls no creatures isn’t required to demonstrate awareness
      of the ability. Similarly, a player demonstrating awareness of an optional trigger with no visible
      effect is assumed to have made the affirmative choice unless the opponent responds.
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: f77601ce9af330e532d56c8e0019457b0e317312b112e47977197399bd00d93c
- id: ipg-s2-1-c-definition-g03-b006
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g03-b006
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Judges do not intervene in a missed trigger situation unless they intend to issue a Warning
      or have reason to suspect that the controller is intentionally missing their triggered abilities.
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: 137f35ff1f24a41c1a5e8437e6a61228ab13e2db7909801b62491f967224055c
- id: ipg-s2-1-c-definition-g03-b007
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-definition-g03-b007
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: A player controlling another player is responsible for that player’s triggers in addition to
      their own.
  evidence:
    context: ipg-s2-1-c-definition
    englishHash: f7ef3d380ac1a3f285a0b752d4e72675e96784f39a190f2849603843fa06df22
