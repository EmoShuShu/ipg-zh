- id: ipg-s2-1-c-examples-g01-b002
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-examples-g01-b002
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: A player forgets to remove the final time counter from a suspended spell and then draws a card
      during their draw step.
  evidence:
    context: ipg-s2-1-c-examples
    englishHash: 07912fb2c6fb378ce4f7021ac95b162098c16900f1cb86269d752c93bd141fb6
- id: ipg-s2-1-c-examples-g01-b003
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-examples-g01-b003
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: A player casts Manic Vandal, then forgets its triggered ability by not choosing a target for
      it. They realize this only after casting another spell.
  evidence:
    context: ipg-s2-1-c-examples
    englishHash: 7e971f3674dd2dfecc2c141229738cb06cb05827d792410ce7a608b4b6e323be
- id: ipg-s2-1-c-examples-g01-b004
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-examples-g01-b004
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: A player forgets to exile the Angel token created by Geist of Saint Traft at end of combat.
      They realize the error when declaring blockers during the next turn.
  evidence:
    context: ipg-s2-1-c-examples
    englishHash: 730370099d51a58c5c21b81b85b863111444fdf0dcd5a8a1f6c5e2853e40a371
- id: ipg-s2-1-c-philosophy
  kind: component
  status: active
  canonicalKey: pilot:ipg-s2-1-c-philosophy
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: ipg-s2-1-c-philosophy
- id: ipg-s2-1-c-philosophy-g01
  kind: group
  status: active
  canonicalKey: pilot:ipg-s2-1-c-philosophy-g01
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: ipg-s2-1-c-philosophy-g01
- id: ipg-s2-1-c-philosophy-g01-b001
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-philosophy-g01-b001
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Triggered abilities are common and invisible, so players should not be harshly penalized when
      forgetting about one. Players are expected to remember their own triggered abilities; intentionally
      ignoring one may be Unsporting Conduct — Cheating (unless the ability would have no impact on the
      game as described above). Even if an opponent is involved in the announcement or resolution of the
      ability, the controller is still responsible for ensuring the opponents make the appropriate choices
      and take the appropriate actions. Opponents are not required to point out triggered abilities that
      they do not control, though they may do so if they wish.
  evidence:
    context: ipg-s2-1-c-philosophy
    englishHash: a83581218689e99ae7387aeca214fc775c68d9c4631cad30330f4f478c9c47c8
- id: ipg-s2-1-c-philosophy-g01-b002
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-philosophy-g01-b002
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Triggered abilities are assumed to be remembered until otherwise indicated, and the impact
      on the game state may not be immediately apparent. The opponent’s benefit is in not having to point
      out triggered abilities, although this does not mean that they can cause triggers to be missed.
      If an opponent requires information about the precise timing of a triggered ability or needs details
      about a game object that may be affected by a resolved triggered ability, that player may need to
  evidence:
    context: ipg-s2-1-c-philosophy
    englishHash: 0e14c7fd4e78fe1c92e1cf6cd196558b59e544ad78300b1b868816936e9c9ed6
- id: ipg-s2-1-c-philosophy-g01-b003
  kind: block
  status: retired
  canonicalKey: pilot:ipg-s2-1-c-philosophy-g01-b003
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: acknowledge that ability’s existence before its controller does. A player who makes a play
      that may or may not be legal depending on whether an opponent’s uncommunicated trigger has been
      remembered has not committed an infraction; their play either succeeds, confirming that the trigger
      has been missed, or is rewound.
  - event: retired
    atVersion: ipg-2024-09-23-pilot
    reason: pilot structure corrected; id permanently tombstoned
- id: ipg-s2-1-c-philosophy-g01-b004
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-philosophy-g01-b004
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Players may not cause triggered abilities controlled by an opponent to be missed by taking
      game actions or otherwise prematurely advancing the game. During an opponent’s turn, if a trigger’s
      controller demonstrates awareness of the trigger before they take an active role (such as taking
      an action or explicitly passing priority), the trigger is remembered. The Out-of-Order Sequencing
      rules (MTR section 4.3) may also be applicable, especially as they relate to batches of actions
      or resolving items on the stack in an improper order.
  evidence:
    context: ipg-s2-1-c-philosophy
    englishHash: 8a85af88b2f93526b41698dfaf680ef1888d99732bfb602ea14e7c367bb3aafc
- id: ipg-s2-1-c-philosophy-g01-b005
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-philosophy-g01-b005
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: A triggered ability is considered to have triggered even if it was subsequently missed. Effects
      that count or restrict the number of times a triggered ability can trigger will count the missed
      one.
  evidence:
    context: ipg-s2-1-c-philosophy
    englishHash: 67fa326336e98e5c4627555a3dfe1a6a0920e07d8dc9df382878cdaf73b2a3c8
- id: ipg-s2-1-c-additional-remedy
  kind: component
  status: active
  canonicalKey: pilot:ipg-s2-1-c-additional-remedy
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: ipg-s2-1-c-additional-remedy
- id: ipg-s2-1-c-additional-remedy-g01
  kind: group
  status: active
  canonicalKey: pilot:ipg-s2-1-c-additional-remedy-g01
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: ipg-s2-1-c-additional-remedy-g01
- id: ipg-s2-1-c-additional-remedy-g01-b001
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-additional-remedy-g01-b001
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: If the triggered ability is an enters-the-battlefield trigger of an Aura that affects only
      the enchanted permanent and causes a visible change to that permanent, resolve the ability immediately.
  evidence:
    context: ipg-s2-1-c-additional-remedy
    englishHash: a645b8f0c35fc306dd26d5b0cb3d9c8187e1d8d61c4df59aa93f46a38ee35124
- id: ipg-s2-1-c-additional-remedy-g01-b002
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-additional-remedy-g01-b002
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: If the triggered ability is a delayed triggered ability that undoes a zone change (including
      token creation) caused by the effect that created the delayed triggered ability, the opponent chooses
      whether to resolve the ability the next time a player would get priority or when a player would
      get priority at the start of the next phase. The new zone does not need to be the same as the one
      the card was originally moved from.
  evidence:
    context: ipg-s2-1-c-additional-remedy
    englishHash: 3ad8d4ab2751a92ae23850170190552f6ecf9382cc0a8f1962cb087318b8452b
- id: ipg-s2-1-c-additional-remedy-g01-b003
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-additional-remedy-g01-b003
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: For all other triggered abilities, if the ability was missed prior to the current phase in
      the previous turn, instruct the players to continue playing. If the triggered ability created an
      effect whose duration has already expired, instruct the players to continue playing.
  evidence:
    context: ipg-s2-1-c-additional-remedy
    englishHash: 8db550c3956d49bdfb2d63dea5bef32ce0ff2e6d3de377adb4afc7f442cee848
- id: ipg-s2-1-c-additional-remedy-g01-b004
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-additional-remedy-g01-b004
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: If the triggered ability isn’t covered by the previous paragraphs, the opponent chooses whether
      the triggered ability is added to the stack. If it is, it’s inserted at the appropriate place on
      the stack if possible or on the bottom of the stack. No player may make choices for the triggered
      ability involving objects that would not have been legal choices when the ability should have triggered.
      For example, if the ability instructs a player to sacrifice a creature, that player can't sacrifice
      a creature that wasn't on the battlefield when the ability should have triggered.
  evidence:
    context: ipg-s2-1-c-additional-remedy
    englishHash: 005227dffa5fdd4a9a2075deccf0f78234c6a36158e7962eda98f41dd0eca5b5
- id: ipg-s2-1-c-additional-remedy-g01-b005
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-additional-remedy-g01-b005
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: If the player is in the process of, or has just completed, an action that indicates the trigger
      has been missed, and completing that action would change the effect of the trigger, a simple backup
      may be performed on that action.
  evidence:
    context: ipg-s2-1-c-additional-remedy
    englishHash: 5c3a62c14d95c49b88e81fc93ae0c91011c0ccf918cb752a31dd1d061528a0da
- id: ipg-s2-1-c-additional-remedy-g01-b006
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-1-c-additional-remedy-g01-b006
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: 'Upgrade: If the triggered ability is usually considered detrimental for the controlling player
      and they own the card responsible for the existence of the trigger, the penalty is a Warning. The
      current game state is not a factor in determining this, though symmetrical abilities (such as Howling
      Mine) may be considered usually detrimental or not depending on who is being affected.'
  evidence:
    context: ipg-s2-1-c-additional-remedy
    englishHash: 1fb88ceb47f9cd61005c3a8de528f2db1466dd300ed874d6a3f9aef016dbb789
