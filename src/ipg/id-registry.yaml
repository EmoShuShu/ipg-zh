  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: If the error caused a violation of a companion restriction and it is a post-sideboard game
      (or a pre-sideboard game and the player has elected to continue with the deck they registered that
      does not match the revealed companion condition), locate all cards violating the restriction. Then,
      reveal all cards in the sideboard that meet the companion restriction. The opponent decides which
      of those cards replaces each illegal card. If making the deck match the companion condition is impossible,
      upgrade the penalty to a Game Loss.
