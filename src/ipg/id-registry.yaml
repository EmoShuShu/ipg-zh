    atVersion: ipg-2024-09-23-p3
    label: All players have the responsibility to play quickly enough so that their opponents are not
      at a significant disadvantage because of the time limit. A player may be playing slowly without
      realizing it. A comment of “I need you to play faster” is often appropriate and all that is needed.
      Further slow play should be penalized.
