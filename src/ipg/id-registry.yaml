  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Clear communication is essential when playing Magic. Though many offenses will be intentional,
      it is possible for a player to make a genuine mistake that causes confusion and these should not
      be penalized harshly.
- id: ipg-b000118
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-7:8535ad59ac3756f276c88a23f47f6aa34e144edf3d15a89f4021457ff086061b
