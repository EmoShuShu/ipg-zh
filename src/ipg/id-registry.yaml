  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Warnings are used in situations of incorrect play when a small amount of time is needed to
      implement the corrective procedure. The purpose of a Warning is to alert judges and players involved
      that a problem has occurred and to keep a permanent record of the infraction. A time extension should
      be issued if the ruling has taken more than a minute.
