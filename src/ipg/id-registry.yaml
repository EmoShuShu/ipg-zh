    label: Visual modifications to cards, including brief text, that provide minor strategic information
      or hints are acceptable and not considered notes. Detailed instructions or complex strategic advice
      may not be written on cards. The Head Judge is the final arbiter on what cards and notes are acceptable
      for a tournament. Spectators who commit this infraction may be asked to leave the venue if they
      are not enrolled in the tournament.
