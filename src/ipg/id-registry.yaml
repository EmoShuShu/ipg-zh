  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: A Match Loss is a severe penalty that is usually issued when the match itself has been compromised.
- id: ipg-b000015
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-1:54e58956983799eeeff264ef4fca8d6a156c4deff8812e544c4846eb49d9e9b5
  evidence:
    section: ipg-s1-1
    component: ipg-c000006
    englishHash: 54e58956983799eeeff264ef4fca8d6a156c4deff8812e544c4846eb49d9e9b5
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Match Losses are applied to the match during which the offense occurred unless the offender’s
      match has already ended, in which case the penalty will be applied to that player’s next match.
