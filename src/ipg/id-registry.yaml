  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Any time cards in a deck could be seen, including during shuffling, it is no longer shuffled,
      even if the player only knows the position of one or two cards. Players are expected to take care
      in shuffling not to reveal cards to themselves, their teammates, or their opponents.
- id: ipg-b000136
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-9:8582299fa398820c51f018c57b1802342699e05bdf1f3462b47e0574e9967300
