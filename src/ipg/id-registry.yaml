  canonicalKey: pilot:ipg-s2-3-c-definition-g01-b001
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: A player commits an error in the game that cannot be corrected by only publicly available information.
      It is not a Hidden Card Error if the opponent acknowledges the action or controls the continuous
      effect modifying the game rule that made the action illegal. This infraction only applies when a
      card whose identity is known to only one player is in a hidden set of cards both before and after
      the error.
  evidence:
