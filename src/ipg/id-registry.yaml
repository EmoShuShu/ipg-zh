    atVersion: ipg-2024-09-23-p3
    label: 'The Magic: The Gathering™ (“Magic”) Infraction Procedure Guide provides judges the appropriate
      penalties and procedures to handle rules violations that occur during a tournament held at Competitive
      or Professional Rules Enforcement Level (REL), as well as the underlying philosophy that guides
      their implementation. It exists to protect players from potential misconduct and to protect the
      integrity of the tournament itself. Rules violations usually require a penalty or they are unenforceable.
      Tournaments run at Regular REL use the Judging at Regular REL document.'
