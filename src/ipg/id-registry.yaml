  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Any time a penalty is issued, the judge must explain the infraction, the procedure for fixing
      the situation, and the penalty to all players involved. If the Head Judge chooses to deviate from
      the Infraction Procedure Guide, the Head Judge is expected to explain the standard penalty and the
      reason for deviation.
- id: ipg-b000025
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-2:30e935ceb15143e23f4ea522b81e12a4da5f0eefa805f491928e29c9a88d8699
  evidence:
    section: ipg-s1-2
    component: ipg-c000008
    englishHash: 30e935ceb15143e23f4ea522b81e12a4da5f0eefa805f491928e29c9a88d8699
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Some infractions include remedies to handle the offense beyond the base penalty. These procedures
      exist to protect officials from accusations of unfairness, bias, or favoritism. If a judge makes
      a ruling that is consistent with quoted text, then the complaints of a player shift from accusation
      of unfairness by the judge to accusations of unfair policy. Deviations from these procedures may
      raise accusations against the judge from the player(s) involved, or from those who hear about it.
      These procedures do not, and should not, take into account the game being played, the current situation
      that the game is in, or who will benefit strategically from the procedure associated with a penalty.
      While it is tempting to try to “fix” game situations, the danger of missing a subtle detail or showing
      favoritism to a player (even unintentionally) makes it a bad idea.
- id: ipg-b000026
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-2:d4c731b0271e9f5510f82a76c32bd6fe3e3fca1aebf0c00cabd23c7a2b6f8e10
