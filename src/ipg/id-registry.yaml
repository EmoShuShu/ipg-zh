- id: ipg-s2-5-c-additional-remedy-g03-b003
  kind: block
  status: active
  canonicalKey: pilot:ipg-s2-5-c-additional-remedy-g03-b003
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: If the game has proceeded past a point where an opponent could reasonably be expected to notice
      the error, the opponent has also committed an infraction. In most cases, the infraction is Game
      Play Error — Failure to Maintain Game State. However, if the judge believes that both players were
      responsible for the Game Rule Violation, such as due to the opponent controlling the continuous
      effect modifying the rules of the game that led to the Game Rule Violation or a player taking action
      based on another player’s instruction, they have instead committed a Game Play Error — Game Rule
      Violation. For example, if a player casts Path to Exile on an opponent’s creature and the opponent
      puts the creature into the graveyard, once the game has continued both players will have committed
      a Game Rule Violation.
  evidence:
    context: ipg-s2-5-c-additional-remedy
    englishHash: cc7eb5f527aab67de7b258e37bb3dfbff2ea7c4f6978d1f7f8e23a119394fe6e
