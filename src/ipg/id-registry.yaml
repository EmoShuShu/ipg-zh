  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: The remedy for some infractions in this document includes shuffling the randomized portion
      of the library. This requires first determining whether any portion of the library is non-random,
      such as cards that have been manipulated on the top or bottom of the library, and separating those.
      Check with both players to verify this, and check the graveyard, exile, and battlefield for library
      manipulation cards, such as Brainstorm and cards with the scry mechanic. Once the library has been
      shuffled, any manipulated cards are returned to their correct locations.
- id: ipg-b000028
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-3:db43b5c93c38160ae5fcf43ea4d33c9e090425aa774f7e1d40375efe23c17246
