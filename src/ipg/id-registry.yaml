  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: A player may commit this infraction in situations where they have not spoken. A physically
      ambiguous board state is not automatically a penalty, but judges are encouraged to tell players
      to fix ambiguous placements before they might become problematic.
- id: ipg-b000119
  kind: block
  status: active
