  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: This infraction applies only to cards in a player’s deck. Differently-marked sleeves in the
      sideboard are not illegal unless they are put into the deck without being changed. Unless investigating,
      judges are encouraged to alert players about concerns with marked sideboard cards.
