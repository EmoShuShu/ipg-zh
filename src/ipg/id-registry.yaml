  kind: publication-annotation-block
  status: active
  canonicalKey: pilot:ipg-ann-2-5-illegal-choice-g01-b01
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: This partial fix refers to cards such as True-Name Nemesis, Voice of All or a Siege from Fate
      Reforged, which require the choice of a player or color as they enter the battlefield. The reasoning
      for this is similar to why we apply state-based actions — it is impossible for these cards to exist
      on the battlefield without a choice being made for them, so we correct that immediately. While this
      could lead to the perception of advantage for one player, such errors always occur publicly, so
      it is in both player’s interest to be attentive.So, if Nick casts Doom Blade on Albert’s Voice of
      All, we can have Albert chose a color now. If Albert chooses Black, Doom Blade is now illegal. Then,
      we can do a simple backup to just before Doom Blade was cast.
