  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: A Disqualification is issued for activity that damages the integrity of a tournament as a whole
      or for severe unsporting conduct.
- id: ipg-b000017
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-1:72f99a3fa1ace14a6ba19e0ab2477ca3862ca04eeecfe67c1b5425ff3d6f2376
  evidence:
    section: ipg-s1-1
    component: ipg-c000007
    englishHash: 72f99a3fa1ace14a6ba19e0ab2477ca3862ca04eeecfe67c1b5425ff3d6f2376
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: The recipient of a Disqualification does not need to be a player in the tournament. They may
      be a spectator or other bystander.
- id: ipg-b000018
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-1:434b966a5ed39354423c2cf9c6c86376d074020ad0c771459f07f7945db354f1
  evidence:
    section: ipg-s1-1
    component: ipg-c000007
    englishHash: 434b966a5ed39354423c2cf9c6c86376d074020ad0c771459f07f7945db354f1
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Disqualification can occur without proof of action so long as the Head Judge determines sufficient
      information exists to believe the tournament’s integrity may have been compromised. It is recommended
      that the Head Judge’s report reflect this fact.
- id: ipg-b000019
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-1:2e2f974d10575f2a5177999c238538d19b87668b7e787760656c866537417d6c
  evidence:
    section: ipg-s1-1
    component: ipg-c000007
    englishHash: 2e2f974d10575f2a5177999c238538d19b87668b7e787760656c866537417d6c
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: When this penalty is applied, the player loses their current match and is dropped from the
      tournament. If a player has already received prizes at the time they are disqualified, that player
      may keep those prizes but does not receive any additional prizes or awards they may be due.
- id: ipg-b000020
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-1:feaea9e956009f330bab4ccb676c5887dc8afbf50ba92cf884df95cb9d578909
  evidence:
    section: ipg-s1-1
    component: ipg-c000007
    englishHash: feaea9e956009f330bab4ccb676c5887dc8afbf50ba92cf884df95cb9d578909
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: When a player is disqualified during a tournament, they are removed from the tournament and
      do not take up a place in the standings. This means that all players in the tournament will advance
      one spot in the standings and are entitled to any prizes the new standing would offer. If the Disqualification
      takes place after a cut is made, no additional players advance in place of the disqualified player
      although they do move up a spot in the standings. For example, if a player is disqualified during
      the quarterfinal round of a Magic Tabletop Mythic Qualifier, the former 9th place finisher does
      not advance into the single elimination top 8, but they do move into 8th place in the standings.
- id: ipg-b000021
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-1:f181d70717912c2e92348df69d5e9156099e4b6eaea95f7777016c5d0cbaab0c
