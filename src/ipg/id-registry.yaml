    label: Some infractions in this document refer to “sets” of cards. A set is a physically distinct
      group of cards defined by a game rule or effect. It may correspond to a specific zone, or may only
      represent a part of a zone. A set may consist of a single card.
- id: ipg-b000035
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-5:7dc0895fa53dbbfa873f3aa23e55cfbd8bc0d265d2609204840c02f07add640d
  evidence:
    section: ipg-s1-5
    component: ipg-c000011
    englishHash: 7dc0895fa53dbbfa873f3aa23e55cfbd8bc0d265d2609204840c02f07add640d
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Cards are considered to be part of a set until they join another set. There is no in-between
      state and any card that has not yet been seen is part of the previous set (unless the new set is
      hidden).
