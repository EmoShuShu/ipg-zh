    label: Any penalty of Game Loss or higher should be reported to the Head Judge, and it is recommended
      that only the Head Judge issue penalties of this nature (with the exception of Tardiness (3.1) and
      Decklist Problems (3.4)).
- id: ipg-b000023
  kind: block
  status: active
  canonicalKey: official:block:ipg-s1-2:7afffe1ad3af5c49686926e26cc0ed6d7b9f2bc09437d8e9b7562c110d5828b9
