  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-5:10e80a49fc81e45edc9d8dc449146aca18cdc7e0f88fb1307417c16b413eb6ec
  evidence:
    section: ipg-s3-5
    component: ipg-c000036
    englishHash: 10e80a49fc81e45edc9d8dc449146aca18cdc7e0f88fb1307417c16b413eb6ec
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Locate any cards missing from the deck and any incorrect cards in any game zone. Reveal those
      cards to the opponent. If the game has started, the opponent chooses whether to fix the problem
      now or when a player would next get priority. Then, at the appropriatre time, they specify which
      of the missing cards replaces each incorrect card; any extras are shuffled into the random portion
      of the library. If more cards are being removed than added, prioritize ones not in the library first.
      If there are still additional cards not in the library that need replacing, they are replaced by
      cards from the random portion of the library. If the missing card(s) are with the sideboard and
      it isn’t the first game, choose the ones to be returned to the deck at random from main deck cards
      in the sideboard.
- id: ipg-b000101
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-5:eddb654fb91697501842d3c95c109a2db9cfb883ee03cbac94e57ec8bb9505c6
