    atVersion: ipg-2024-09-23-p3
    label: Sleeves and cards often become worn over the course of a tournament, and, as long as the player
      is not attempting to take advantage of this, addressing the situation is sufficient in most cases.
      Note that almost all sleeves can be considered marked in some way; judges should keep this in mind
      when determining penalties. In cases of marked cards, educating players to shuffle their cards and
      sleeves before sleeving the cards is very important.
- id: ipg-b000126
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-8:873626b1cfdd8e4c4c052e28f6b6902a0c4c0a29f83503f1f07d0db8f08b0a33
