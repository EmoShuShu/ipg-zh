    label: Unsporting conduct is disruptive behavior that may affect the safety, competitiveness, enjoyment,
      or integrity of a tournament in a significantly negative fashion.
- id: ipg-b000139
  kind: block
  status: active
  canonicalKey: official:block:ipg-s4:a2e30c950c63eb988eb61909175c026a3fe1da999f2d8011fd0ae78bf42e0b46
  evidence:
    section: ipg-s4
    component: ipg-c000057
    englishHash: a2e30c950c63eb988eb61909175c026a3fe1da999f2d8011fd0ae78bf42e0b46
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Unsporting behavior is not the same as a lack of sporting behavior. There is a wide middle
      ground of “competitive” behavior that is certainly neither “nice” nor “sporting” but still doesn’t
      qualify as “unsporting.” The Head Judge is the final arbiter on what constitutes unsporting conduct.
- id: ipg-b000140
  kind: block
  status: active
  canonicalKey: official:block:ipg-s4:134f7ae5642a39b33c64750cc54200be2fd0e0a4839c2f0676e20f5b42514505
  evidence:
