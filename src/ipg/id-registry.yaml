    atVersion: ipg-2024-09-23-p3
    label: If a player violates the Magic Tournament Rules in a way that is not covered by one of the
      infractions listed below, the judge should explain the appropriate procedure to the player, but
      not issue a penalty. Continued or willful disregard of these rules may require further investigation.
- id: ipg-b000038
  kind: block
