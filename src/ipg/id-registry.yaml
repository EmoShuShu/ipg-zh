- id: ipg-ann-section-2-5-definition-context
  kind: publication-annotation
  status: active
  canonicalKey: pilot:ipg-ann-section-2-5-definition-context
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: “Game Rule Violation” does not refer to any particular type of error. Rather, Game Rule Violations
      are specifically defined as errors that aren’t another infraction. Newer judges will sometimes talk
      about how “mis-resolving a spell” is a Game Rule Violation. In actuality, resolving a spell improperly
      could result in one of several different infractions, such as Looking at Extra Cards (e.g. forgetting
      that Courser of Kruphix left the battlefield) to Hidden Card Error (e.g. mis-reading Divination
      and drawing three cards).
- id: ipg-ann-2-5-philosophy-consistency
  kind: publication-annotation
  status: active
  canonicalKey: pilot:ipg-ann-2-5-philosophy-consistency
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: Consistency is a core principle of the IPG. Even though there are thousands of judges adjudicating
      tournaments across the world, it is important for each of these tournaments to be run and judged
      to the same standard. For this reason, we strive to handle penalties neutrally. Fundamentally, both
      players are responsible for maintaining a proper game state. Our core role as judges is not to “correct”
      or “fix” the players’ mistakes, but to dispassionately interpret and apply the fixes prescribed
      by the IPG.
- id: ipg-ann-2-5-partial-fix-list
  kind: publication-annotation
  status: active
  canonicalKey: pilot:ipg-ann-2-5-partial-fix-list
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: So right here we are going to have a list of partial fixes. Try to do a simple backup (see
      Backing Up 1.4 for more information about back ups) then, if you can’t, you can try to do a partial
      fix. If you cannot apply a simple backup or a partial fix you evaluate if you need to do a back
      up or leave alone. If the error fits more than one of these categories, it’s ok to partial fix,
      but be careful that the error only fits into those categories. If there are multiple fixes within
      the same bullet point, you’re still fine to use that partial fix.
- id: ipg-ann-2-5-wrong-zone
  kind: publication-annotation
  status: active
  canonicalKey: pilot:ipg-ann-2-5-wrong-zone
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-pilot
    label: There is a fair amount to consider here. There are four tests to determine if this partial
      fix is relevant. 1) Is the object not in the correct zone. This covers when a creature died but
      shouldn’t have, or when a creatures shouldn’t have died but did. It also covers if a card was supposed
      to be bounced as wasn’t or a card was put in the GY when it should have been exiled. Basically,
      if the game was played correctly, that card should be somewhere else. 2) The identity of the object
      was known to all players. This means that all players know what the object is. This could be because
      the card was revealed or it could be because the card is in a location known by both players such
      as the top of a library. 3) The movement of the card (or lack of movement) is the error, not the
      result of some other error. For example, if a Path to Exile was case for {C}, and the card was put
      in exile; that is not eligible for this partial fix because the error was in casting Path for {C}.
