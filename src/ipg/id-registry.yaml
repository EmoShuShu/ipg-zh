- id: ipg-b000076
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-4:d4a1ce6c298d2638b6aad3340c7d3a23af2103dafaa2d7fdce6d8c42fac333d7
  evidence:
    section: ipg-s3-4
    component: ipg-c000031
    englishHash: d4a1ce6c298d2638b6aad3340c7d3a23af2103dafaa2d7fdce6d8c42fac333d7
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Decklists are used to ensure that decks are not altered in the course of a tournament. Judges
      and other tournament officials should be vigilant about reminding players before the tournament
      begins of the importance of submitting a legal decklist, and playing with a legal deck. A player
      normally receives a Game Loss if their decklist is altered after tournament play has begun.
- id: ipg-b000077
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-4:ec95a22c0e8199069ee67e1d306165ad3b57c6786e37f0e62f49f93a0f2cb4fd
  evidence:
    section: ipg-s3-4
    component: ipg-c000031
    englishHash: ec95a22c0e8199069ee67e1d306165ad3b57c6786e37f0e62f49f93a0f2cb4fd
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Penalties for decklist errors discovered outside the context of the match and its procedures
      (such as those discovered through decklist counting) are issued at the start of the next match unless
      the judge believes there is strong evidence the deck itself is illegal.
- id: ipg-b000078
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-4:9245e09d9fbe042fb9cd3e727d90766587c18d0fd9de21b7118ec607490673cd
  evidence:
    section: ipg-s3-4
    component: ipg-c000031
    englishHash: 9245e09d9fbe042fb9cd3e727d90766587c18d0fd9de21b7118ec607490673cd
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Ambiguous or unclear names on a decklist may allow a player to manipulate the contents of their
      deck up until the point at which they are discovered. Truncated names of storyline characters on
      decklists (planeswalkers and other legendary permanents) are acceptable as long as they are the
      only representation of that character in the format and are treated as referring to that card, even
      if other cards begin with the same name.
- id: ipg-b000079
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-4:9c691db84bcfa5984239e071c4d072eb6f5546b4d228036ee4a48731ce1eb1b0
  evidence:
    section: ipg-s3-4
    component: ipg-c000031
    englishHash: 9c691db84bcfa5984239e071c4d072eb6f5546b4d228036ee4a48731ce1eb1b0
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: The Head Judge may choose to not issue this penalty if they believe that what the player wrote
      on their decklist is obvious and unambiguous, even if not entirely accurate. In Limited tournaments,
      the Head Judge may choose not to issue this penalty for incorrectly marked basic land counts if
      they believe the correct land count is obvious. This should be determined solely by what is written
      on the decklist, and not based on intent or the actual contents of the deck; needing to check the
      deck for confirmation is a sign that the entry is not obvious.
- id: ipg-b000080
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-4:a9cb2c21860412370583a3160e90e625e105736f8f7a23028a4cf81027199ba9
  evidence:
    section: ipg-s3-4
    component: ipg-c000031
    englishHash: a9cb2c21860412370583a3160e90e625e105736f8f7a23028a4cf81027199ba9
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: Companions affect what the player intended to play, and may produce a situation in which the
      deck and decklist match, but violate the restriction on the intended companion. In these situations,
      it is acceptable to alter the deck and sideboard configuration to meet the restriction.
- id: ipg-b000081
  kind: block
  status: active
  canonicalKey: official:block:ipg-s3-4:2cf9ea627d6e6599af765da3c6a7ef97d2aa8e304d6b06dd6fe8a2e616779f61
  evidence:
    section: ipg-s3-4
    component: ipg-c000031
    englishHash: 2cf9ea627d6e6599af765da3c6a7ef97d2aa8e304d6b06dd6fe8a2e616779f61
  history:
  - event: allocated
    atVersion: ipg-2024-09-23-p3
    label: In tournaments with open decklists, if the wrong decklist is provided to an opponent and it
      is discovered during the game, the opponent may have made strategic decisions throughout the game
      based on the error, and that cannot be fully assessed or offset.
- id: ipg-c000032
  kind: component
  status: active
  canonicalKey: official:component:ipg-s3-4:additional-remedy:4
