- id: ipg-s3-9
  kind: infraction
  number: '3.9'
  title:
    en: Insufficient Shuffling
    zh: 未充分洗牌
  components:
  - id: ipg-c000053
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-g000057
      kind: paragraphs
      blocks:
      - id: ipg-b000130
        type: paragraph
        text:
          en: A player unintentionally fails to sufficiently shuffle their deck or a portion of their
            deck before presenting it to their opponent, or fails to present it to their opponent for
            further randomization. A deck is not shuffled if the judge believes a player could know the
            position or distribution of one or more cards in their deck.
          zh: 牌手在将自己的套牌交给对手之前，非蓄意地未将其套牌或套牌某部分充分洗牌；或是未能将自己的套牌交给对手进行进一步随机化。如果裁判相信牌手可以知道其套牌中某些牌的位置或是分布情况，便可认为牌手未将此套牌洗牌。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 23
          bbox:
          - 90.0
          - 106.4
          - 546.84
          - 159.8
          extractionUnit: extract-p23-l003..extract-p23-l006
        legacyRawUnits:
        - raw-L003002
        - raw-L003004
  - id: ipg-c000054
    role: examples
    labelCode: component.examples
    groups:
    - id: ipg-g000058
      kind: ordered-list
      blocks:
      - id: ipg-b000131
        type: list-item
        text:
          en: A player forgets to shuffle their library after searching for a card.
          zh: 牌手在搜寻一张牌之后忘了洗他的牌库。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 23
          bbox:
          - 108.0
          - 190.4
          - 438.45
          - 202.4
          extractionUnit: extract-p23-l008..extract-p23-l008
        marker: A
        legacyRawUnits:
        - raw-L003016
        - raw-L003018
      - id: ipg-b000132
        type: list-item
        text:
          en: A player searches for a card, then gives the library a single riffle-shuffle before presenting
            the library to their opponent.
          zh: 牌手搜寻一张牌，然后只作一次交错洗牌（riffle-shuffle）就将牌库交给对手。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 23
          bbox:
          - 108.0
          - 204.2
          - 505.73
          - 230.0
          extractionUnit: extract-p23-l009..extract-p23-l010
        marker: B
        legacyRawUnits:
        - raw-L003020
        - raw-L003022
      - id: ipg-b000133
        type: list-item
        text:
          en: A player fails to shuffle the portion of their library revealed during the resolution of
            a cascade ability.
          zh: 牌手没有将因结算倾曳而展示的部分牌库洗牌。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 23
          bbox:
          - 108.0
          - 231.8
          - 536.18
          - 257.6
          extractionUnit: extract-p23-l011..extract-p23-l012
        marker: C
        legacyRawUnits:
        - raw-L003024
        - raw-L003026
  - id: ipg-c000055
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-g000059
      kind: paragraphs
      blocks:
      - id: ipg-b000134
        type: paragraph
        text:
          en: Players are expected to shuffle their deck thoroughly when it is required and are expected
            to have the skill and understanding of randomization to do so. However, as the opponent has
            the opportunity to shuffle after the player does, the potential for advantage is lowered if
            tournament policy is followed.
          zh: '牌手在有必要和被要求时，必须要彻底地将其套牌洗牌；且应要有随机化的技术和对何谓“随机化”的认知。


            由于对手在该牌手洗牌之后也有机会洗牌，若是能够确实遵守此项比赛方针，则牌手得到利益的可能性会降低。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 23
          bbox:
          - 90.0
          - 288.2
          - 557.81
          - 341.6
          extractionUnit: extract-p23-l014..extract-p23-l017
        legacyRawUnits:
        - raw-L003034
        - raw-L003036
        - raw-L003042
        - raw-L003044
        readingSegments:
        - id: ipg-b000134-rs-893caf8dfac5
          sourceRange:
          - 0
          - 154
          text:
            en: Players are expected to shuffle their deck thoroughly when it is required and are expected to
              have the skill and understanding of randomization to do so.
            zh: 牌手在有必要和被要求时，必须要彻底地将其套牌洗牌；且应要有随机化的技术和对何谓“随机化”的认知。
          legacyRawUnits:
          - raw-L003034
          - raw-L003036
        - id: ipg-b000134-rs-32ea4ccaacc4
          sourceRange:
          - 154
          - 305
          text:
            en: However, as the opponent has the opportunity to shuffle after the player does, the potential for
              advantage is lowered if tournament policy is followed.
            zh: 由于对手在该牌手洗牌之后也有机会洗牌，若是能够确实遵守此项比赛方针，则牌手得到利益的可能性会降低。
          legacyRawUnits:
          - raw-L003042
          - raw-L003044
      - id: ipg-b000135
        type: paragraph
        text:
          en: Any time cards in a deck could be seen, including during shuffling, it is no longer shuffled,
            even if the player only knows the position of one or two cards. Players are expected to take
            care in shuffling not to reveal cards to themselves, their teammates, or their opponents.
          zh: 只要可能看见套牌内容，包括洗牌之间，即使牌手只知道一两张牌的位置，该套牌都会不再是随机化。牌手在洗牌时必须注意不要将牌展示给自己、队友或是对手看。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 23
          bbox:
          - 90.0
          - 357.2
          - 553.08
          - 396.8
          extractionUnit: extract-p23-l018..extract-p23-l020
        legacyRawUnits:
        - raw-L003050
        - raw-L003052
      - id: ipg-b000136
        type: paragraph
        text:
          en: A player should shuffle their deck using multiple methods. Patterned pile-shuffling is only
            allowed at the start of a game. Any manipulation, weaving, or stacking prior to randomization
            is acceptable, as long as the deck is thoroughly shuffled afterwards.
          zh: '牌手应使用多种方式洗牌；有规律的分堆洗牌只能在一盘游戏一开始时使用。


            如果之后有充分洗过套牌，任何先行的操作、编排或是叠放都是可接受的。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 23
          bbox:
          - 90.0
          - 412.4
          - 551.87
          - 452.0
          extractionUnit: extract-p23-l021..extract-p23-l023
        legacyRawUnits:
        - raw-L003058
        - raw-L003060
        - raw-L003066
        - raw-L003068
        readingSegments:
        - id: ipg-b000136-rs-c0470cfc7b3a
          sourceRange:
          - 0
          - 124
          text:
            en: A player should shuffle their deck using multiple methods. Patterned pile-shuffling is only allowed
              at the start of a game.
            zh: 牌手应使用多种方式洗牌；有规律的分堆洗牌只能在一盘游戏一开始时使用。
          legacyRawUnits:
          - raw-L003058
