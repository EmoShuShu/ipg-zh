        - raw-L002490
      - id: ipg-b000086
        type: paragraph
        text:
          en: 'If there are extra cards stored with the sideboard that could conceivably be played in
            the player’s deck, they will be considered a part of the sideboard unless they are:'
          zh: 如果有额外的牌和备牌摆放在一起，且明显的可以使用于该牌手的套牌中，则那些牌也会视为是备牌的一部份，但下列这些牌除外：
        officialPdfUnits:
