        - raw-L002884
  - id: ipg-c000048
    role: examples
    labelCode: component.examples
    groups:
    - id: ipg-g000052
      kind: ordered-list
      blocks:
      - id: ipg-b000122
        type: list-item
        text:
          en: A player has small marks on a few of their sleeves. The markings are on a Mountain, a Loxodon
            Hierarch, and a Lightning Helix.
          zh: 牌手的几张牌套上有小记号。有记号的牌是一张山脉、一张象族大主教/Loxodon Hierarch和一张闪电螺旋/Lightning Helix。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 22
