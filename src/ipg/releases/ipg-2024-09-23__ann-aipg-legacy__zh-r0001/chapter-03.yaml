- id: ipg-s3-8
  kind: infraction
  number: '3.8'
  title:
    en: Marked Cards
    zh: 有记号的牌
  components:
  - id: ipg-c000047
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-g000051
      kind: paragraphs
      blocks:
      - id: ipg-b000121
        type: paragraph
        text:
          en: Cards or sleeves in a player’s deck have inconsistencies on them that might allow them to
            be differentiated from each other while in the library. This includes scuff marks, nail marks,
            discoloration, bent corners, and curving from foils.
          zh: 牌手套牌中的牌张或牌套有所差异，使得牌手有机会在牌库中即将之辨别出来。这包括划伤、指甲印、色差、牌角弯折及闪卡弯曲。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 22
          bbox:
          - 90.0
          - 156.8
          - 535.25
          - 196.4
          extractionUnit: extract-p22-l005..extract-p22-l007
        legacyRawUnits:
