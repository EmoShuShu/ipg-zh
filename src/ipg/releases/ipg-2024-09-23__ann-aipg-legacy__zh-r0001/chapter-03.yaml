  - id: ipg-c000035
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-g000039
      kind: paragraphs
      blocks:
      - id: ipg-b000097
        type: paragraph
        text:
          en: Players are expected to call attention to deck errors immediately, and not gain any potential
            advantage from having the cards in their deck.
          zh: 牌手在发现套牌错误时必须马上叫裁判，不得因套牌中有此类牌张而获得任何优势。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 19
          bbox:
          - 90.0
          - 541.28
          - 528.82
          - 567.08
          extractionUnit: extract-p19-l025..extract-p19-l026
        legacyRawUnits:
        - raw-L002584
        - raw-L002586
      - id: ipg-b000098
        type: paragraph
        text:
          en: The most common forms of deck error are failure to desideboard and having a card in the
            wrong deck. Both of these are difficult to gain advantage from without obvious cheating. Allowing
            the opponent to choose which card they would otherwise be working with is sufficient to compensate
            for the easily discovered situations. Duplicates of cards that begin in the main deck are
            more problematic, as they are not as easy to realize and catch, and thus mandate an upgraded
            penalty.
          zh: '最常见的套牌问题包括未能还原备牌，以及套牌中出现不属于该套牌的牌张。除非刻意作弊，否则牌手很难从这两种情况当中获利。由对手来选择他们本应对局的牌张，就足以修正这种较易注意到的情况。


            但对于本来就在主牌中放入数张的牌而言，如果这类牌发生前述失误，会较难发现并指出该牌在套牌中的数量是否增多，因此在此情况下便须升级处罚。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 19
          bbox:
          - 90.0
          - 585.68
          - 553.44
          - 666.68
          extractionUnit: extract-p19-l027..extract-p19-l032
        legacyRawUnits:
        - raw-L002592
        - raw-L002594
        - raw-L002600
        - raw-L002602
        readingSegments:
        - id: ipg-b000098-rs-d373f0154c02
          sourceRange:
          - 0
          - 323
          text:
            en: The most common forms of deck error are failure to desideboard and having a card in the wrong
              deck. Both of these are difficult to gain advantage from without obvious cheating. Allowing the
              opponent to choose which card they would otherwise be working with is sufficient to compensate for
              the easily discovered situations.
            zh: 最常见的套牌问题包括未能还原备牌，以及套牌中出现不属于该套牌的牌张。除非刻意作弊，否则牌手很难从这两种情况当中获利。由对手来选择他们本应对局的牌张，就足以修正这种较易注意到的情况。
          legacyRawUnits:
          - raw-L002592
          - raw-L002594
        - id: ipg-b000098-rs-3c7d1ce2f881
          sourceRange:
          - 323
          - 476
          text:
            en: Duplicates of cards that begin in the main deck are more problematic, as they are not as easy
              to realize and catch, and thus mandate an upgraded penalty.
            zh: 但对于本来就在主牌中放入数张的牌而言，如果这类牌发生前述失误，会较难发现并指出该牌在套牌中的数量是否增多，因此在此情况下便须升级处罚。
          legacyRawUnits:
          - raw-L002600
          - raw-L002602
      - id: ipg-b000099
        type: paragraph
        text:
          en: A window in which the error is a Game Loss is necessary to discourage intentional abuse
            of the minimum number of cards in the deck. Once that point has passed, the opponent agrees
            that the deck is valid. Judges should always be mindful of the abuse possibilities when investigating
            these infractions.
          zh: 此类失误在一定的时间范围内判罚为一盘负。设立这段特殊的时间范围，意在防止牌手滥用此失误的罚则规定，通过使用少于最小张数限制的套牌来获利。一旦超出这一时点，便视为对手亦认同此套牌合法。裁判在调查这一违规时，应时刻留意牌手是否有可能滥用这一规定。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 19
          bbox:
