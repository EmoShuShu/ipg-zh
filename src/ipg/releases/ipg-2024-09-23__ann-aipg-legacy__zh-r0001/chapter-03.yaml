- id: ipg-s3-3
  kind: infraction
  number: '3.3'
  title:
    en: Slow Play
    zh: 游戏进行过慢
  components:
  - id: ipg-c000025
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-g000027
      kind: paragraphs
      blocks:
      - id: ipg-b000060
        type: paragraph
        text:
          en: A player takes longer than is reasonably required to complete game actions. If a judge believes
            a player is intentionally playing slowly to take advantage of a time limit, the infraction
            is Unsporting Conduct — Stalling.
          zh: '牌手在完成游戏中动作所需时间超过了合理的时长。


            如果裁判相信牌手是蓄意进行过慢，来取得时间限制上的优势，则此违规应为“举止违背运动道德～拖延”。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 16
          bbox:
          - 90.0
