  - id: ipg-c000023
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-g000025
      kind: paragraphs
      blocks:
      - id: ipg-b000057
        type: paragraph
        text:
          en: Tournaments test the skill of a player, not their ability to follow external advice or directions.
            Any strategy advice, play advice, or construction advice from an external source is considered
            outside assistance.
          zh: 比赛测试的是牌手的技术，而非接收外来建议或指导的能力。任何来自外部来源的策略建议、行动建议或是构组建议都视为是外来协助。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 16
          bbox:
          - 90.0
          - 448.64
          - 542.04
          - 488.24
          extractionUnit: extract-p16-l020..extract-p16-l022
        legacyRawUnits:
        - raw-L002138
        - raw-L002140
      - id: ipg-b000058
        type: paragraph
        text:
          en: Visual modifications to cards, including brief text, that provide minor strategic information
            or hints are acceptable and not considered notes. Detailed instructions or complex strategic
            advice may not be written on cards. The Head Judge is the final arbiter on what cards and
            notes are acceptable for a tournament. Spectators who commit this infraction may be asked
            to leave the venue if they are not enrolled in the tournament.
          zh: '牌上面的图样加工，包括间接地提供轻微策略信息的简短文字，均可以接受且不会认定为笔记。详细指示或复杂的策略建议不能写在牌上。在比赛中，主审是判定哪些牌与笔记可以接受的最终仲裁者。


            没有参与比赛的旁观者若是犯下此违规，可以要求他离开会场。'
        officialPdfUnits:
