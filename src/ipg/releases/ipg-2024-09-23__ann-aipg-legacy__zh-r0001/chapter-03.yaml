- id: ipg-s3
  kind: chapter
  number: '3'
  title:
    en: Tournament Errors
    zh: 比赛失误
  components:
  - id: ipg-c000014
    role: body
    labelCode: component.body
    groups:
    - id: ipg-g000014
      kind: paragraphs
      blocks:
      - id: ipg-b000036
        type: paragraph
        text:
          en: Tournament errors are violations of the Magic Tournament Rules. If the judge believes that
            the error was intentional, they should consider Unsporting Conduct — Cheating.
          zh: '比赛失误指的是违反《万智牌比赛规则》之违规行为。


            假如裁判认为牌手系蓄意造成该失误，则应该首先考虑适用“举止违背运动道德～作弊”此违规。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 15
          bbox:
          - 90.0
          - 73.64
          - 547.49
          - 99.44
          extractionUnit: extract-p15-l002..extract-p15-l003
        legacyRawUnits:
        - raw-L001907
        - raw-L001909
        - raw-L001915
        - raw-L001917
        readingSegments:
        - id: ipg-b000036-rs-a46209f1efca
          sourceRange:
          - 0
          - 64
          text:
            en: Tournament errors are violations of the Magic Tournament Rules.
            zh: 比赛失误指的是违反《万智牌比赛规则》之违规行为。
          legacyRawUnits:
          - raw-L001907
          - raw-L001909
        - id: ipg-b000036-rs-9068c48f6eef
          sourceRange:
          - 64
          - 169
          text:
            en: If the judge believes that the error was intentional, they should consider Unsporting Conduct
              — Cheating.
            zh: 假如裁判认为牌手系蓄意造成该失误，则应该首先考虑适用“举止违背运动道德～作弊”此违规。
          legacyRawUnits:
          - raw-L001915
          - raw-L001917
      - id: ipg-b000037
        type: paragraph
        text:
          en: If a player violates the Magic Tournament Rules in a way that is not covered by one of the
            infractions listed below, the judge should explain the appropriate procedure to the player,
            but not issue a penalty. Continued or willful disregard of these rules may require further
            investigation.
          zh: '如果牌手违反了《万智牌比赛规则》，但又不符合下列各项违规之定义，则裁判应向该牌手说明正确的规程，但不需给予处罚。


            如果牌手继续违反相关规则，或有意无视之，则可能需要进一步的调查。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 15
          bbox:
          - 90.0
          - 115.04
          - 555.22
          - 154.64
          extractionUnit: extract-p15-l004..extract-p15-l006
        legacyRawUnits:
        - raw-L001923
        - raw-L001925
        - raw-L001931
        - raw-L001933
        readingSegments:
        - id: ipg-b000037-rs-4dd03ebdd495
          sourceRange:
          - 0
          - 208
          text:
            en: If a player violates the Magic Tournament Rules in a way that is not covered by one of the infractions
              listed below, the judge should explain the appropriate procedure to the player, but not issue a
              penalty.
            zh: 如果牌手违反了《万智牌比赛规则》，但又不符合下列各项违规之定义，则裁判应向该牌手说明正确的规程，但不需给予处罚。
          legacyRawUnits:
          - raw-L001923
          - raw-L001925
        - id: ipg-b000037-rs-164d091b577f
          sourceRange:
          - 208
          - 288
          text:
            en: Continued or willful disregard of these rules may require further investigation.
            zh: 如果牌手继续违反相关规则，或有意无视之，则可能需要进一步的调查。
          legacyRawUnits:
          - raw-L001931
          - raw-L001933
      - id: ipg-b000038
        type: paragraph
        text:
          en: A Warning for a Tournament Error offense is upgraded to a Game Loss if the player has already
            received a Warning for an offense in the same category. For multi-day tournaments, the penalty
            count for these infractions resets between days.
          zh: '如果是第二次或更多次犯下同类型的比赛失误而受到警告，则升级为一盘负。


            对于历时多日的比赛而言，牌手当天的此类违规处罚累犯计数会在次日清零。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 15
