  - id: ipg-c000027
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-g000029
      kind: paragraphs
      blocks:
      - id: ipg-b000066
        type: paragraph
        text:
          en: All players have the responsibility to play quickly enough so that their opponents are not
            at a significant disadvantage because of the time limit. A player may be playing slowly without
            realizing it. A comment of “I need you to play faster” is often appropriate and all that is
            needed. Further slow play should be penalized.
          zh: '所有牌手都有迅速进行游戏的责任，以让对手不会因为时间限制而有明显的不利。


            牌手可能会无意间进行游戏过慢。对牌手说 “我希望你能进行的快速一点”通常就够了，而也只需要如此处理。再进一步的进行过慢就必须给予处罚。


            再进一步的进行过慢就必须给予处罚。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 17
