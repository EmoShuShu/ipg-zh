      kind: paragraphs
      blocks:
      - id: ipg-b000105
        type: paragraph
        text:
          en: If an opponent may have made strategic decisions based on the presence of a sideboard card
            (such as having seen it in the hand or library during a search effect), the penalty is a Game
            Loss.
          zh: 升级：如果对手可能因备牌的存在而作出相应的游戏决策（比如从手牌中看到，或通过搜寻效应在牌库中看到），则处罚为一盘负。
        officialPdfUnits:
