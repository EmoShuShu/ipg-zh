              cards in a sideboard, more than four of a card, or the same card in two decks in a Unified Constructed
              format), remove cards as directed by the player to make the decklist legal.
            zh: 如果套牌／备牌和套牌登记表同时违反最大张数限制（一般为备牌数量过多，同一张牌超过四张，或在使用“套牌联合构组规则”的赛制中于多于一副套牌内使用了同一张牌），则根据牌手的指示移除牌张，确保套牌登记表合法。
          legacyRawUnits:
          - raw-L002458
          - raw-L002460
      - id: ipg-b000084
        type: paragraph
        text:
          en: If the deck contains too few cards, the player chooses to add any combination of cards named
            Plains, Island, Swamp, Mountain or Forest to reach the minimum number. Alter the decklist
            to reflect this. These changes may be reverted without penalty if the player is subsequently
            able to locate identical replacements to legal original cards.
          zh: 如果套牌张数过少，该牌手选择加入任意组成且牌名为平原、海岛、沼泽、山脉、或树林的牌，直到满足张数下限为止。然后照此更改套牌登记表。
        officialPdfUnits:
