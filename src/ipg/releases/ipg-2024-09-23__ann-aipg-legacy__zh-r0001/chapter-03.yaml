  - id: ipg-c000036
    role: additional-remedy
    labelCode: component.additional-remedy
    groups:
    - id: ipg-g000040
      kind: paragraphs
      blocks:
      - id: ipg-b000100
        type: paragraph
        text:
          en: Locate any cards missing from the deck and any incorrect cards in any game zone. Reveal
            those cards to the opponent. If the game has started, the opponent chooses whether to fix
            the problem now or when a player would next get priority. Then, at the appropriatre time,
            they specify which of the missing cards replaces each incorrect card; any extras are shuffled
            into the random portion of the library. If more cards are being removed than added, prioritize
            ones not in the library first. If there are still additional cards not in the library that
            need replacing, they are replaced by cards from the random portion of the library. If the
            missing card(s) are with the sideboard and it isn’t the first game, choose the ones to be
            returned to the deck at random from main deck cards in the sideboard.
          zh: '找到套牌中缺失的相应牌张，以及在各个游戏区域中的所有错误牌张。向对手展示这些牌。


            如果当前游戏已经开始，由对手选择当前立刻修复该问题，或是等到下一次有牌手将获得优先权时再进行修复。接下来，在其所选择的时点，由对手选择用缺失的牌张与错误牌张一一对应进行替换；多余的牌张将被洗入牌库中的随机部分。


            若需被移除的牌张多于需被加回的牌张，则优先替换不在牌库中的牌张。如果在此之后，仍有不在牌库中的牌张需被替换，则用牌库的随机部分中的牌张进行替换。


            若缺失的牌与备牌放在一起，且当前并非第一盘游戏，则从备牌中原本属于主牌的牌张中随机选择相应数量的牌张加回套牌。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 20
          bbox:
          - 90.0
          - 113.24
          - 554.76
          - 235.64
          extractionUnit: extract-p20-l004..extract-p20-l012
        legacyRawUnits:
        - raw-L002618
        - raw-L002620
        - raw-L002630
        - raw-L002632
        - raw-L002650
        - raw-L002652
        - raw-L002658
        - raw-L002660
        readingSegments:
        - id: ipg-b000100-rs-c6a303d9aa66
          sourceRange:
