        - raw-L001949
        readingSegments:
        - id: ipg-b000038-rs-e146de97a35b
          sourceRange:
          - 0
          - 150
          text:
            en: A Warning for a Tournament Error offense is upgraded to a Game Loss if the player has already
              received a Warning for an offense in the same category.
            zh: 如果是第二次或更多次犯下同类型的比赛失误而受到警告，则升级为一盘负。
          legacyRawUnits:
          - raw-L001939
          - raw-L001941
        - id: ipg-b000038-rs-27ff81ab2dd7
          sourceRange:
          - 150
          - 237
          text:
            en: For multi-day tournaments, the penalty count for these infractions resets between days.
            zh: 对于历时多日的比赛而言，牌手当天的此类违规处罚累犯计数会在次日清零。
          legacyRawUnits:
          - raw-L001947
          - raw-L001949
- id: ipg-s3-1
  kind: infraction
  number: '3.1'
  title:
    en: Tardiness
    zh: 迟到
  components:
  - id: ipg-c000015
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-g000015
      kind: paragraphs
      blocks:
      - id: ipg-b000039
        type: paragraph
        text:
          en: A player is not in their seat at the beginning of a round, or has not completed tasks assigned
            within the time allocated. If a round begins before the previous round would have ended (due
            to all players finishing early), tardiness does not apply until the scheduled end of the previous
            round.
          zh: '牌手并未在一局比赛开始时坐在自己的座位上，或未能在规定的时间内完成指定的任务。


            如果某局的开始时间早于前一局比赛原本预计结束的时间（由于所有牌手都提前完成对局），则要等到前一局比赛预计结束的时间之后，才会开始适用“迟到”违规。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 15
          bbox:
          - 90.0
          - 281.0
          - 550.06
          - 334.4
          extractionUnit: extract-p15-l012..extract-p15-l015
        legacyRawUnits:
        - raw-L001961
        - raw-L001963
        - raw-L001969
        - raw-L001971
        readingSegments:
        - id: ipg-b000039-rs-d3f05e95c87b
          sourceRange:
          - 0
          - 122
          text:
            en: A player is not in their seat at the beginning of a round, or has not completed tasks assigned
              within the time allocated.
            zh: 牌手并未在一局比赛开始时坐在自己的座位上，或未能在规定的时间内完成指定的任务。
          legacyRawUnits:
          - raw-L001961
          - raw-L001963
        - id: ipg-b000039-rs-8c076574e3e7
          sourceRange:
          - 122
          - 292
          text:
            en: If a round begins before the previous round would have ended (due to all players finishing early),
              tardiness does not apply until the scheduled end of the previous round.
            zh: 如果某局的开始时间早于前一局比赛原本预计结束的时间（由于所有牌手都提前完成对局），则要等到前一局比赛预计结束的时间之后，才会开始适用“迟到”违规。
          legacyRawUnits:
          - raw-L001969
          - raw-L001971
      - id: ipg-b000040
        type: paragraph
        text:
          en: If, before or during a match, a player requests and receives permission from a judge for
            a delay for a legitimate task, such as a bathroom break or finding replacements for missing
            cards, that player has up to 10 minutes to perform that task before they are considered tardy.
            If the player takes more than 10 minutes, a Match Loss will be applied. Otherwise, no penalty
            will be applied and a time extension given for the time taken.
          zh: 如果，在对局开始或进行过程当中，牌手请求并得到裁判准许延时且行为合理（例如上洗手间、寻找遗失牌张的代用品），则该牌手有至多10分钟时间来执行相关请求，倘若超时便会视作迟到。如果该牌手花费超过10分钟的时间，则其会受到一局负。如果少于10分钟，则没有处罚，且会依照所用的时间给予相应补时。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 15
          bbox:
          - 90.0
          - 350.0
          - 552.84
          - 417.2
          extractionUnit: extract-p15-l016..extract-p15-l020
        legacyRawUnits:
        - raw-L001977
        - raw-L001979
