    - id: ipg-g000037
      kind: paragraphs
      blocks:
      - id: ipg-b000091
        type: paragraph
        text:
          en: Cards in different sleeves, tokens, and double-faced cards for which substitute cards are
            being used are ignored when determining deck (not sideboard) legality.
          zh: 在确定套牌（不含备牌）的合法性时，忽略装在不同牌套中的牌张、衍生物以及使用辅助牌所代表的双面牌。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 19
          bbox:
          - 90.0
          - 295.28
          - 540.72
          - 321.08
          extractionUnit: extract-p19-l012..extract-p19-l013
        legacyRawUnits:
        - raw-L002528
        - raw-L002530
      - id: ipg-b000092
        type: paragraph
        text:
          en: If a player is unable to locate cards (or identical equivalents) from their main deck, treat
            it as a Decklist Problem instead. If sideboard cards are missing, make a note of this, but
            issue no penalty.
          zh: 如果牌手无法找到其主牌当中的某些牌（或可用于替代的其他版次牌张），则应视作“套牌登记表问题”进行处理。如果备牌中出现牌张短少，则记录此事，但不予处罚。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 19
          bbox:
          - 90.0
          - 336.68
          - 542.81
          - 376.28
          extractionUnit: extract-p19-l014..extract-p19-l016
        legacyRawUnits:
        - raw-L002536
        - raw-L002538
      - id: ipg-b000093
        type: paragraph
        text:
          en: The discovery of a card that violates a companion restriction is a Deck Problem if the player
