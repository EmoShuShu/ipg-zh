            en: If the cards themselves have become marked through play in the tournament, the Head Judge may
              decide to issue a proxy.
            zh: 如果牌是在比赛中因游戏过程地磨损而有了记号，则主审可以决定给予代牌来使用。
          legacyRawUnits:
          - raw-L002968
          - raw-L002970
  - id: ipg-c000051
    role: upgrade
    labelCode: component.upgrade
    groups:
    - id: ipg-g000055
      kind: paragraphs
      blocks:
      - id: ipg-b000128
        type: paragraph
        text:
          en: If the player is unable to find replacement cards, they may replace those cards with any
            combination of cards named Plains, Island, Swamp, Mountain or Forest. As the decklist is being
            changed to match the new contents of the deck, the penalty is a Game Loss. This change may
            be reverted at a later point without further penalty if replacements for marked cards are
            found.
          zh: 升级：假如牌手无法得到符合规定的牌，他可用任意组合且名称为平原、海岛、沼泽、山脉、或树林的牌来取代这些牌。由于套牌登记表将根据套牌新的内容进行修改，处罚为一盘负。如果牌手在稍后时段找到了符合规定的牌，可将此更改恢复原状且不会再有更多的处罚。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 22
          bbox:
          - 90.0
          - 533.0
          - 544.13
          - 600.2
          extractionUnit: extract-p22-l027..extract-p22-l031
        legacyRawUnits:
        - raw-L002976
        - raw-L002978
  - id: ipg-c000052
    role: upgrade
    labelCode: component.upgrade
    groups:
    - id: ipg-g000056
      kind: paragraphs
      blocks:
      - id: ipg-b000129
        type: paragraph
        text:
          en: If the Head Judge believes that a deck’s owner noticing the pattern of markings would be
            able to gain substantial advantage from this knowledge, the penalty is a Game Loss.
          zh: 升级：如果主审相信套牌的拥有者已经注意到记号的模式，且有可能利用此信息得到实质性优势，则处罚为一盘负。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 22
          bbox:
          - 90.0
          - 615.8
          - 554.88
          - 641.6
          extractionUnit: extract-p22-l032..extract-p22-l033
        legacyRawUnits:
        - raw-L002984
        - raw-L002986
