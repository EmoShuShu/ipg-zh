    labelCode: component.additional-remedy
    groups:
    - id: ipg-g000030
      kind: paragraphs
      blocks:
      - id: ipg-b000067
        type: paragraph
        text:
          en: In the event that the match exceeds the time limit, two additional turns are added to the
            number of additional turns played. This turn extension occurs before any end-of-match procedure
            can begin and after any time extensions that may have been issued.
          zh: '若对局超出时间限制，则游戏将进行的延长回合数增加两个。


            此延长回合会先于对局结束流程发生，且会在已有的任何补时结束之后才开始计算。'
        officialPdfUnits:
