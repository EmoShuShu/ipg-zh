  - id: ipg-c000031
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-g000033
      kind: paragraphs
      blocks:
      - id: ipg-b000076
        type: paragraph
        text:
          en: Decklists are used to ensure that decks are not altered in the course of a tournament. Judges
            and other tournament officials should be vigilant about reminding players before the tournament
            begins of the importance of submitting a legal decklist, and playing with a legal deck. A
            player normally receives a Game Loss if their decklist is altered after tournament play has
            begun.
          zh: '套牌登记表是用以确定套牌内容没有在比赛过程中变动。


            裁判和工作人员在比赛开始前，应该主动提醒牌手须登记合法的套牌登记表，也要以合法的套牌来进行比赛。


            如果牌手在比赛开始之后因故须更新牌表，他通常会受到一盘负之处罚。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 18
          bbox:
          - 90.0
          - 73.64
          - 549.12
          - 127.04
          extractionUnit: extract-p18-l002..extract-p18-l005
        legacyRawUnits:
        - raw-L002348
        - raw-L002350
        - raw-L002356
        - raw-L002358
        - raw-L002364
        - raw-L002366
        readingSegments:
        - id: ipg-b000076-rs-5227a7e8342c
          sourceRange:
          - 0
          - 87
          text:
            en: Decklists are used to ensure that decks are not altered in the course of a tournament.
            zh: 套牌登记表是用以确定套牌内容没有在比赛过程中变动。
          legacyRawUnits:
          - raw-L002348
          - raw-L002350
        - id: ipg-b000076-rs-87aeff2d65e3
          sourceRange:
          - 87
          - 278
          text:
            en: Judges and other tournament officials should be vigilant about reminding players before the tournament
              begins of the importance of submitting a legal decklist, and playing with a legal deck.
            zh: 裁判和工作人员在比赛开始前，应该主动提醒牌手须登记合法的套牌登记表，也要以合法的套牌来进行比赛。
          legacyRawUnits:
          - raw-L002356
          - raw-L002358
        - id: ipg-b000076-rs-101f14e11562
          sourceRange:
          - 278
          - 378
          text:
            en: A player normally receives a Game Loss if their decklist is altered after tournament play has
              begun.
            zh: 如果牌手在比赛开始之后因故须更新牌表，他通常会受到一盘负之处罚。
          legacyRawUnits:
          - raw-L002364
          - raw-L002366
      - id: ipg-b000077
        type: paragraph
        text:
          en: Penalties for decklist errors discovered outside the context of the match and its procedures
            (such as those discovered through decklist counting) are issued at the start of the next match
            unless the judge believes there is strong evidence the deck itself is illegal.
          zh: 在对局及其过程之外发现的套牌登记表错误（例如在清点套牌登记表时发现的），应等到下一局开始才执行，除非裁判相信有强烈的证据证明该套牌当前非法。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 18
          bbox:
          - 90.0
          - 142.64
          - 553.85
          - 182.24
          extractionUnit: extract-p18-l006..extract-p18-l008
        legacyRawUnits:
        - raw-L002372
        - raw-L002374
      - id: ipg-b000078
        type: paragraph
        text:
          en: Ambiguous or unclear names on a decklist may allow a player to manipulate the contents of
            their deck up until the point at which they are discovered. Truncated names of storyline characters
            on decklists (planeswalkers and other legendary permanents) are acceptable as long as they
            are the only representation of that character in the format and are treated as referring to
            that card, even if other cards begin with the same name.
          zh: '登记表上模棱两可或是不明确的名称，会让牌手有机会在被发现之前操作他们的实际套牌内容。


            对于套牌登记表上故事角色的名字（鹏洛客及其他传奇永久物），只要在此赛制中含有该名称的合法卡片只有一张，便可允许使用该角色名字之缩写。这类简写被视为指代前述之合法卡片，而非其他具有相同开头名称的牌张。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 18
          bbox:
          - 90.0
          - 197.84
          - 556.48
          - 265.04
          extractionUnit: extract-p18-l009..extract-p18-l013
        legacyRawUnits:
        - raw-L002384
        - raw-L002386
        - raw-L002392
        - raw-L002394
        readingSegments:
        - id: ipg-b000078-rs-1fd4e1c068ba
          sourceRange:
          - 0
          - 150
          text:
            en: Ambiguous or unclear names on a decklist may allow a player to manipulate the contents of their
              deck up until the point at which they are discovered.
            zh: 登记表上模棱两可或是不明确的名称，会让牌手有机会在被发现之前操作他们的实际套牌内容。
          legacyRawUnits:
