  - id: ipg-c000017
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-g000017
      kind: paragraphs
      blocks:
      - id: ipg-b000045
        type: paragraph
        text:
          en: Players are responsible for being on time and in the correct seat for their matches, and
            for completing registrations in a timely manner. The Tournament Organizer may announce that
            they are giving the players some additional time before a penalty is issued. Otherwise, the
            penalty is issued as soon as the round begins.
          zh: '牌手有责任准时抵达正确的对局桌，以及在规定的时间内完成登记。


            比赛主办人可以自行决定判处“迟到”此违规的额外等待时限，并向参赛牌手宣布。否则，在此局开始的同时就要给予一盘负的处罚。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 15
          bbox:
          - 90.0
