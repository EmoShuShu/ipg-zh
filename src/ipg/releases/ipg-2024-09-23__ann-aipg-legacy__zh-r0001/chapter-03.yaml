        - raw-L002104
    - id: ipg-g000023
      kind: paragraphs
      blocks:
      - id: ipg-b000053
        type: paragraph
        text:
          en: These criteria also apply to any deck construction and draft portions of a limited tournament.
            Additionally, no notes of any kind may be made during a draft. Some team formats have additional
            communication rules that may modify the definition of this infraction.
          zh: 这些准则也适用于限制赛中构组套牌及轮抽的部份。此外，轮抽当中不能做任何种类的笔记。某些团队赛制的比赛中包含了额外的交流规则；这可能会修改此违规的定义。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 16
          bbox:
          - 90.0
          - 280.64
          - 535.44
          - 320.24
          extractionUnit: extract-p16-l011..extract-p16-l013
        legacyRawUnits:
        - raw-L002110
        - raw-L002112
      - id: ipg-b000054
        type: paragraph
        text:
          en: Notes made outside the current match may only be referenced between games, and must have
            been in the player’s possession since the beginning of the match.
          zh: 在当前对局以外时间记录的笔记，只能在两盘游戏之间参阅，并且此牌手开始对局时便应该已持有该笔记。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 16
