  - id: ipg-c000037
    role: upgrade
    labelCode: component.upgrade
    groups:
    - id: ipg-g000041
      kind: paragraphs
      blocks:
      - id: ipg-b000103
        type: paragraph
        text:
          en: In games before sideboarding, while the deck is presented to the opponent for pre-game shuffling
            or during a deckcheck, if the deck contains fewer cards than registered (and any missing cards
            are not in the opponent’s deck) or the sideboard contains more cards than registered, the
            penalty is a Game Loss.
          zh: 升级：在换备前的对局中，如果是在将套牌呈视给对手做游戏开始前洗牌时，或是在进行套牌检查的过程中，发现组成套牌的牌张总数少于登记的数量（且缺失的牌张不在当前对手的套牌中），或备牌的牌张总数多于登记的数量，则处罚为一盘负。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 20
          bbox:
          - 90.0
          - 389.24
          - 548.28
          - 442.64
          extractionUnit: extract-p20-l021..extract-p20-l024
        legacyRawUnits:
        - raw-L002698
        - raw-L002700
      - id: ipg-b000104
        type: paragraph
        text:
          en: In games after sideboarding, while the deck is presented to the opponent for pre-game shuffling
            or during a deckcheck, if the deck contains fewer cards than the format minimum (and any missing
            cards are not in the opponent’s deck) or the sideboard contains more cards than the format
            maximum, the penalty is a Game Loss.
          zh: 在换备后的对局中，如果是在将套牌呈视给对手做游戏开始前洗牌时，或是在进行套牌检查的过程中，发现组成套牌的牌张总数少于当前赛制限定的数量（且缺失的牌张不在当前对手的套牌中），或备牌的牌张总数多于当前赛制限定的数量，则处罚为一盘负。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 20
