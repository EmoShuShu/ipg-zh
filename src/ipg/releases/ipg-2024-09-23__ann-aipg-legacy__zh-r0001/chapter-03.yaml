        type: list-item
        text:
          en: Double-faced cards being used to represent the back side of cards in the deck. These cards
            must not be sleeved in the same way as cards in the main deck and/or sideboard.
          zh: 用于表示套牌中某些牌之背面的双面牌。这些牌张不可与属于主牌和／或备牌的牌使用相同的牌套。
