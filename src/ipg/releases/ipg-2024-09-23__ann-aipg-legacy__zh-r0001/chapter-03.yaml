  - id: ipg-c000039
    role: upgrade
    labelCode: component.upgrade
    groups:
    - id: ipg-g000043
      kind: paragraphs
      blocks:
      - id: ipg-b000106
        type: paragraph
        text:
          en: If an error resulted in more copies of a main deck card being played than were registered
            or allowed by companion restriction, the penalty is a Game Loss unless all copies of the card
            are still in the random portion of the library. For example if the decklist has two copies
            of Shock in the main deck and two in the sideboard, but a search finds two copies of Shock
            in the library with another already in the graveyard, the penalty is upgraded.
          zh: 升级：如果失误导致原本即在主牌中使用之某牌数量，较原有登记或行侣牌的使用限制为多，且是在游戏开始之后才发现此失误，则除非所有这些牌依然处于牌库中的随机部分，否则处罚为一盘负。举例来说，如果套牌登记表上登记的是电震/Shock，此牌在主牌和备牌中各有两张，但搜寻牌库时发现牌库里有两张电震，且坟墓场中还有另一张，则需升级处罚。
        officialPdfUnits:
