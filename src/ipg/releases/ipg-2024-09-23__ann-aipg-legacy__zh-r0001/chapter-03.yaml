          text:
            en: If the game has started, the opponent chooses whether to fix the problem now or when a player
              would next get priority. Then, at the appropriatre time, they specify which of the missing cards
              replaces each incorrect card; any extras are shuffled into the random portion of the library.
            zh: 如果当前游戏已经开始，由对手选择当前立刻修复该问题，或是等到下一次有牌手将获得优先权时再进行修复。接下来，在其所选择的时点，由对手选择用缺失的牌张与错误牌张一一对应进行替换；多余的牌张将被洗入牌库中的随机部分。
          legacyRawUnits:
