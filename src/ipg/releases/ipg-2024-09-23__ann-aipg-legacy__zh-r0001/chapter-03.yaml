              is thoroughly shuffled afterwards.
            zh: 如果之后有充分洗过套牌，任何先行的操作、编排或是叠放都是可接受的。
          legacyRawUnits:
          - raw-L003066
          - raw-L003068
  - id: ipg-c000056
    role: additional-remedy
    labelCode: component.additional-remedy
    groups:
    - id: ipg-g000060
      kind: paragraphs
      blocks:
      - id: ipg-b000137
        type: paragraph
        text:
          en: Shuffle the appropriate portion of the deck thoroughly.
          zh: 对套牌的对应部分充分洗牌。
