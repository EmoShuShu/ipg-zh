publicationAnnotations:
- id: ipg-ann-3-d2c56bfcc6ff
  anchor:
    type: block
    id: ipg-b000036
    segmentId: ipg-b000036-rs-a46209f1efca
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-d2c56bfcc6ff-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-d2c56bfcc6ff-g01-b01
      type: paragraph
      text:
        en: Just as Game Play Errors are violations of the Comprehensive Rules, Tournament errors are
          a violation of the Magic Tournament Rules. However, not every violation of the tournament rules
          results in an infraction.
        zh: 正如游戏行动失误是对《万智牌完整规则》的违反，比赛失误违反的是《万智牌比赛规则》。然而并不是所有违反比赛规则的行为都是违规。
      sourceRawUnits:
      - raw-L001911
      - raw-L001913
- id: ipg-ann-3-30d05cbb977e
  anchor:
    type: block
    id: ipg-b000036
    segmentId: ipg-b000036-rs-9068c48f6eef
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-30d05cbb977e-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-30d05cbb977e-g01-b01
      type: paragraph
      text:
        en: This note covers cases where the player is breaking a tournament rule intentionally. The player
          might be cheating, but it might not meet the definition of cheating in the IPG. Be sure to review
          IPG 4.8 Cheating before taking action.
        zh: '这一条说的是牌手蓄意违反万智牌比赛规则的情况。那位牌手有可能是作弊，但是可能并不满足IPG中“举止违背运动道德～作弊”的定义。请在做出决定之前回想一下IPG 4.8: “举止违背运动道德～作弊”的内容。'
      sourceRawUnits:
      - raw-L001919
      - raw-L001921
- id: ipg-ann-3-b4af0936cff6
  anchor:
    type: block
    id: ipg-b000037
    segmentId: ipg-b000037-rs-4dd03ebdd495
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-b4af0936cff6-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-b4af0936cff6-g01-b01
      type: paragraph
      text:
        en: Only the more serious Magic Tournament Rules warrant a penalty. These violations can be quite
          disruptive to the overall flow of the tournament, causing the event to go longer than needed
          and/or can give a player a significant advantage. If a violation to the Magic Tournament Rules
          is not considered detrimental to the overall flow of the event, then a penalty is not needed
          and the judge will simply educate the player on a corrective action.
        zh: 只有较为严重的违反《万智牌比赛规则》的情形应当给予判罚。这类违规会扰乱比赛的整体流程，使得比赛所花费的时间增加，或会使牌手获得显著的优势。如果某种违反《万智牌比赛规则》的行为不会对比赛的整体流程产生负面影响，那么便无须给予判罚，裁判只需对牌手进行教育，并指导牌手如何做是正确的。
      sourceRawUnits:
      - raw-L001927
      - raw-L001929
- id: ipg-ann-3-1da01f99d804
  anchor:
    type: block
    id: ipg-b000037
    segmentId: ipg-b000037-rs-164d091b577f
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-1da01f99d804-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1da01f99d804-g01-b01
      type: paragraph
      text:
        en: Although not all violations of the Magic Tournament Rules are penalized, even the slightest
          disruption repeated over and over again can still slow down an event. If this happens, an investigation
          may be required to see if the disruption is being done to intentionally disrupt the event or
          maybe a player simply needs further coaching.
        zh: 尽管不是所有违反《万智牌比赛规则》的行为都会受到处罚，再轻微的干扰重复了一遍又一遍的话仍然会拖慢比赛进程。如果这种情况发生，裁判可能需要调查这是因为有人有意破坏比赛进程，亦或只是有某个牌手需要进一步教育。
      sourceRawUnits:
      - raw-L001935
      - raw-L001937
- id: ipg-ann-3-917c2afc6035
  anchor:
    type: block
    id: ipg-b000038
    segmentId: ipg-b000038-rs-e146de97a35b
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-917c2afc6035-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-917c2afc6035-g01-b01
      type: paragraph
      text:
        en: Tournament errors are typically more disruptive and less “easy to make” than Game Play Errors.
          As a result, the second instance of a warning for a Tournament Error in the same category is
          upgraded to a Game Loss. All subsequent instances in the same category are also game losses.
          We do not keep upgrading until we get to a Disqualification. Also, there are a few Tournament
          Errors where the first time a player receives it, it can be a warning OR a Game loss (Tardiness
          and Deck Problem are examples).  If the second instance of one of those penalties is supposed
          to be a Warning, it’s still a warning, despite receiving an earlier Game Loss.
        zh: 比赛失误对比赛产生的破坏性，以及犯下此失误的难度都要高于游戏行动失误。因此第二次或更多次犯下同类型的比赛失误而受到警告，将被升级为一盘负。而后续犯下的同类型的比赛失误将继续是一盘负。我们将不会继续升级处罚直至取消资格。此外，有少数比赛失误在牌手初犯时，可能被判为警告，也可能被判为一盘负（例如迟到和套牌问题）。如果这类违规的第二次按规定本应是警告，那么即便该牌手在第一次被判过一盘负，这次判罚依然是警告。
      sourceRawUnits:
      - raw-L001943
      - raw-L001945
- id: ipg-ann-3-d3d8ee146149
  anchor:
    type: block
    id: ipg-b000038
    segmentId: ipg-b000038-rs-27ff81ab2dd7
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-d3d8ee146149-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-d3d8ee146149-g01-b01
      type: paragraph
      text:
        en: As with Game Play Errors, there is more of a chance that someone might repeat a Tournament
          Error over a 15 round Grand Prix than a 5 round PPTQ, resetting the penalty count reflects this.
        zh: 与游戏行动失误相同，在15轮的大奖赛上牌手重复比赛错误的概率比在5轮的PPTQ上更高。清零处罚计数会更加公平。
      sourceRawUnits:
      - raw-L001951
      - raw-L001953
- id: ipg-ann-3-1-be265e31a02f
  anchor:
    type: block
    id: ipg-b000039
    segmentId: ipg-b000039-rs-d3f05e95c87b
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-1-be265e31a02f-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-be265e31a02f-g01-b01
      type: paragraph
      text:
        en: There are many parts of a Magic Tournament that revolve around time — 20 minutes for this,
          10 minutes for that. Players are given sufficient time to accomplish tasks, and failure to complete
          these tasks within the time limits slows the event down.
        zh: 万智牌比赛中有很多时间相关的规定——20分钟用来干这个，10分钟用来干那个。这些规定给了牌手充足的时间来完成对应的工作，而不能按时完成将会拖慢整个比赛的进程。
      sourceRawUnits:
      - raw-L001965
      - raw-L001967
- id: ipg-ann-3-1-63c1d9ce45e5
  anchor:
    type: block
    id: ipg-b000039
    segmentId: ipg-b000039-rs-8c076574e3e7
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-1-63c1d9ce45e5-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-63c1d9ce45e5-g01-b01
      type: paragraph
      text:
        en: This happens rarely at competitive events, but occasionally all the match results are in with
          10 minutes remaining on the clock. Round started at 1:00, and at 1:40, everything is done. Let’s
          go ahead and start the next round! The problem here is that the announced end time was 1:50.
          It’s unrealistic to expect a player who finished early and ran to get some food to know that
          the round is starting early. Therefore, even if you start the next round at 1:43, people aren’t
          actually late until 1:50. When they show up, give the appropriate time extension based on the
          1:43 start time, but the penalty based on the 1:50 start time. This means that it’s possible
          that starting a round early won’t result in any actual saved time, but it’s still more likely
          to do so than not.
        zh: 这种情况在竞争级的比赛中不太常见，但偶尔也会出现：在这轮结束前10分钟前所有桌都完成了比赛。比赛一点钟开始，在一点四十分的时候，所有桌都打完了。那么我们赶快开下一轮吧！但是问题是之前通知的结束时间是一点五十分，期望所有这轮打完跑去吃饭的牌手知道下轮提前开始是不切实际的。因此，即使你在一点四十三分开始下一轮，牌手在一点五十之前回来都不能算作迟到。他们回来之后，基于这轮的实际开始时间给他们适当的延长时间，同时，迟到的判定将从一点五十分开始。这意味着，提前开始下一轮可能并不能实际节省时间，但是这样做总比不做更有可能节省时间。
      sourceRawUnits:
      - raw-L001973
      - raw-L001975
- id: ipg-ann-3-1-5dc5f625525c
  anchor:
    type: block
    id: ipg-b000040
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-1-5dc5f625525c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-5dc5f625525c-g01-b01
      type: paragraph
      text:
        en: This part here should be pretty self explanatory. If the player needs to perform a legitimate
          task, let them. Smoking, or buying snacks, or finishing a trade aren’t legitimate reasons. This
          also doesn’t mean that they have unlimited time.  In fact, they should perform the task without
          delay.  Impress upon them that they need to hurry back.  They have up to 10 minutes to accomplish
          the task, at which point, if they haven’t completed it, they receive a Match Loss and are dropped
          from the event, the same as the standard Tardiness upgrade.  This is to mitigate the impact
          to the event as long extensions impact everyone else.  It is also to establish an absolute upper
          bound on how much time a player to perform the task.  Now, that doesn’t mean the player can
          wander off and do other things as well.  If they were given time to go to the bathroom, that
          doesn’t include stopping at the counter to buy a snack.
        zh: 这一段自身就解释的相当清楚了。如果牌手有合理的理由去做一些事，请让他们去做。去抽烟、买零食、或完成交易并不算合理的理由。这也并不意味着他们有无限制的时间去做。事实上，他们需要毫无迟延地去做这些事。请让他们留意他们必须赶紧回来。他们有至多10分钟时间来完成这些事，如果超出这个时间，他们将会得到一局负并从比赛中退赛，这与标注的迟到升级判罚一致。这是为了减少对整场比赛的影响，因为过长的加时会影响比赛中的每一个人。这一条也制定了一个绝对的上限，限制牌手要在多少时间之内做完这些事。即使如此，这也不意味着牌手可以到处闲逛去做其他事情。如果给了牌手时间去洗手间，这并不包括允许他们在小卖部停下来买个零食吃。
      sourceRawUnits:
      - raw-L001981
      - raw-L001985
    - id: ipg-ann-3-1-5dc5f625525c-g01-b02
      type: paragraph
      text:
        en: When the player returns, give the match the appropriate extension.
        zh: 当牌手回来时，给予该对局适当的加时。
      sourceRawUnits:
      - raw-L001983
      - raw-L001987
- id: ipg-ann-3-1-09b935778748
  anchor:
    type: block
    id: ipg-b000041
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-1-09b935778748-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-09b935778748-g01-b01
      type: paragraph
      text:
        en: If a player isn’t in their seat when the round starts, they are tardy. As we will see below,
          the Tournament Organizer/Head Judge may allow some additional time before this penalty is assessed,
          but 5 minutes is outside what is reasonable to allow.
        zh: 如果一位牌手在一轮开始的时候并未出现在他的座位上，那么他迟到了。正如后面即将提到的，比赛主办人或者主审可能会多等几分钟，给这位牌手一些机会，但是5分钟已经超出了容许的范畴。
      sourceRawUnits:
      - raw-L001995
      - raw-L001997
- id: ipg-ann-3-1-d5a7c7fbe8da
  anchor:
    type: block
    id: ipg-b000042
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-1-d5a7c7fbe8da-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-d5a7c7fbe8da-g01-b01
      type: paragraph
      text:
        en: Again, time limits are in place for a reason. Players are expected to turn in lists at the
          appropriate time. Allowing them additional time to tweak their deck gives them an advantage.
        zh: 再次重申，时间限制的存在是有原因的。牌手应该在适当的时间内提交牌表。给予牌手额外的时间，从而让其有可能修改套牌，将会使他们有额外的优势。
      sourceRawUnits:
      - raw-L002003
      - raw-L002005
- id: ipg-ann-3-1-b595d397a956
  anchor:
    type: block
    id: ipg-b000043
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-1-b595d397a956-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-b595d397a956-g01-b01
      type: paragraph
      text:
        en: In addition to being on-time for a match, a player is expected to be on-time with their stuff.
          However, if they arrive on time and discover that they have lost their deck or some cards, we
          do allow them time to go find replacements.  This is not a Game Loss at this time.  However,
          the player has a maximum of 10 minutes into the round to find replacements. If they exceed this
          time limit, give the player Tardiness with the upgraded penalty.
        zh: 牌手除了应该准时进行对局以外，还应该保管好自己的物品。但是，如果牌手准时到场，却发现丢了套牌或者其中的某些牌，我们应当给他一些时间让他找到替代品。在此时还不是一盘负。但是，牌手最多有10分钟的时间（从本轮开始起计算）来找到替代品。若超过此时限，他将受到升级的迟到判罚（一局负）。
      sourceRawUnits:
      - raw-L002011
      - raw-L002013
- id: ipg-ann-3-1-ee912b98c2a1
  anchor:
    type: block
    id: ipg-b000044
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-1-ee912b98c2a1-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-ee912b98c2a1-g01-b01
      type: paragraph
      text:
        en: While you can try to make an argument that the player was on time, they still weren’t in the
          right place. I can be on time too, if I can be at the concession stand when time is called.
        zh: 虽然牌手可以争论说自己“准时到达”，他还是没有准时到达正确的地方。你可以尝试跟他这么说：反正我是到了，那如果在比赛开始的时候我在摊位那里也算是没迟到咯？
      sourceRawUnits:
      - raw-L002019
      - raw-L002021
- id: ipg-ann-3-1-7949de8eb219
  anchor:
    type: block
    id: ipg-b000045
    segmentId: ipg-b000045-rs-8c5e3d8617f5
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-1-7949de8eb219-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-7949de8eb219-g01-b01
      type: paragraph
      text:
        en: We want players to be on time. Players should not be sitting around waiting for their opponents
          to show up. It’s unfair to the people who follow the rules. Also, because matches are 50 minutes,
          if a player is late, we give a time extension so that they have 50 minutes. This means the tournament
          as a whole can be delayed. Judges like the trains to run on time, so we treat Tardiness very
          seriously. We give it a Game Loss, so that players treat it seriously as well. If Tardiness
          was always just a warning, there wouldn’t be much incentive to be in your seat at the start
          of the round after you decided to go and get food.
        zh: 我们希望牌手可以守时。牌手不应该坐在桌前等待他的迟到对手出现。这对于遵守规则的牌手是不公平的。同时，因为对局时限是50分钟，如果一位牌手迟到了，我们要补时以保证他们有50分钟进行对局。这意味着整个比赛都可能会被拖慢。裁判更希望比赛这趟列车能够准点到达，因此会非常严肃地对待迟到。迟到将得到一盘负，这样牌手们也会更加严肃对待迟到。如果迟到总是仅仅警告的话，离开赛场跑去吃饭的牌手可能会产生“晚回去一点也没事儿”的想法。
      sourceRawUnits:
      - raw-L002029
      - raw-L002033
    - id: ipg-ann-3-1-7949de8eb219-g01-b02
      type: paragraph
      text:
        en: The same logic applies to turning in decklists. Players respond to incentives. And a Game
          Loss for not completing decklist registration is an incentive to be on time.
        zh: 上面所说的同样适用于上交牌表。不吃到一盘负会成为牌手的动力，让他们准时的上交牌表。
      sourceRawUnits:
      - raw-L002031
      - raw-L002035
- id: ipg-ann-3-1-29711e870f59
  anchor:
    type: block
    id: ipg-b000045
    segmentId: ipg-b000045-rs-ab48a2ae009e
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-1-29711e870f59-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-29711e870f59-g01-b01
      type: paragraph
      text:
        en: Occasionally a Tournament Organizer (or Head Judge) will allow players a bit more time to
          get to their seats. This is generally used when there is something odd with the venue that hinders
          players moving around (too many people for the store, pairings in choke points, having to use
          a second room, etc.) If this is the case, it is announced at the beginning of the event, and
          doesn’t change. The length of the additional time is also variable. It used to be set to 3 minutes,
          but now Tournament Organizers have options. However, it is not recommended you go over 3 minutes.
          If there was no “grace period”, the penalty is earned at the beginning of the round.
        zh: 比赛主办人（或者主审）偶尔会给牌手更多的时间来找到自己的座位。这通常会出现在比赛环境有些问题，导致牌手难以在场地中走动的时候。（比如：店里人太多场地过于拥挤；张贴配对的位置无法容纳太多人；比赛场地由多个房间组成等等）。在这种情况下，你需要在比赛开始的主审宣告时声明，同时比赛过程中不能更改。额外时间的长度可以自行决定。以前这个选项固定是3分钟，不过现在比赛主办人可以自行选择。然而，最好不要超过3分钟。如果在比赛开始时没有这种特殊说明，那么每轮开始没有到达座位的牌手都算是迟到。
      sourceRawUnits:
      - raw-L002041
      - raw-L002043
- id: ipg-ann-3-1-7601fd462350
  anchor:
    type: block
    id: ipg-b000046
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-1-7601fd462350-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-7601fd462350-g01-b01
      type: paragraph
      text:
        en: If the tardy player does show up, give the match an extension, even if there is a Game Loss.
          The players still get the 50 minute match that they paid for. They probably won’t need it, but
          they still get it.
        zh: 如果一位迟到的牌手后来赶到了，即使已经给出了一盘负，也需要给他那桌进行补时。这一桌仍然应有50分钟来完成比赛。虽然一般不需要，但是还是得给。
      sourceRawUnits:
      - raw-L002051
      - raw-L002053
- id: ipg-ann-3-1-d8ec86aff95c
  anchor:
    type: block
    id: ipg-b000047
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-1-d8ec86aff95c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-d8ec86aff95c-g01-b01
      type: paragraph
      text:
        en: At the 10 minutes into the round, the player gets another Tardiness penalty, with a penalty
          of a Match Loss. It’s assumed that the player isn’t coming back, so please mark that the player
          is dropping on the match slip. It is best practice to let the player who got the win fill out
          the slip, with the judge marking “No Show” for the player who didn’t show up in the drop column,
          and putting the judge’s name on the line for the player’s signature who didn’t show up.
        zh: 在一轮开始的10分钟后，迟到的牌手将得到另一个迟到判罚，这次的处罚是一局负。同时我们可以认为这为牌手不会回来了，所以在成绩条上的退赛一栏做上标记。最佳做法是：让赢得此局的牌手在成绩条上签字，然后裁判在迟到的牌手右面的“退赛”那栏写上“No
          Show”，再在该牌手签名处签裁判自己的名字。
      sourceRawUnits:
      - raw-L002059
      - raw-L002063
    - id: ipg-ann-3-1-d8ec86aff95c-g01-b02
      type: paragraph
      text:
        en: 'For more information:  http://blogs.magicjudges.org/articles/2012/06/11/tardiness-kevin-desprez/'
        zh: 更多信息请参见：http://blogs.magicjudges.org/articles/2012/06/11/tardiness-kevin-desprez/
      sourceRawUnits:
      - raw-L002061
      - raw-L002065
- id: ipg-ann-3-1-101774bf8e9e
  anchor:
    type: block
    id: ipg-b000048
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-1-101774bf8e9e-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-1-101774bf8e9e-g01-b01
      type: paragraph
      text:
        en: Players have a one minute period of time from the start of round to get to their seats. Before
          we get into the philosophy of this downgrade, we want to explicitly call out that if you get
          two warnings for the same Tournament Error, that Warning is Upgraded. It is not explicitly called
          out here because it is in the Tournament Errors section. But in essence this downgrade allows
          a one time “oopsie” by the player. Philosophically Judges had been executing a policy of “0
          with a heart”. What that meant was, if the player was genuinely trying to get to their seat,
          we allowed a little bit of leniency if a player was ~20 seconds late, as this penalty is meant
          to punish those not paying attention, as opposed to those really trying. However, this had two
          problems. The first is that it introduced some subjectivity into a ruling. The judge basically
          had to determine if the player had a genuine reason for being late. The second is that players
          caught on to this, and would argue for the subjective leniency, and try to make the judge out
          as being a jerk for not granting it. This downgrade removes both problems. Be sure to ask if
          a player has received this penalty prior in the day before assessing the penalty.
        zh: 从一轮开始算起，牌手有一分钟的时间就座。在深入探讨此项降级的法理之前，我们要明确指出：如果你因同类别的比赛失误收到了两次警告，该警告将会升级。这一点并未在此处明确列出，因为它属于“比赛失误”通则章节的内容。但本质上，这项降级允许牌手犯一次“无心之过”。在法理上，裁判过去一直执行着一种“带有人情味的0分钟”方针。这意味着，如果牌手确实是在努力赶往座位，即便迟到了约20秒，我们也会给予一点宽容；因为设立此项判罚的初衷是惩罚那些不注意时间的牌手，而非那些真正尽力了的牌手。然而，这带来了两个问题。首先，它在判罚中引入了一些主观性。裁判基本上不得不去判断牌手迟到是否有正当理由。其次，牌手们察觉到了这一点，便会争取这种主观上的宽大处理；如果裁判不予批准，他们就会试图把裁判描述成一个不近人情的混蛋。此项降级解决了这两个问题。在进行判罚之前，务必询问该牌手当天此前是否已经收到过此项判罚。
      sourceRawUnits:
      - raw-L002071
      - raw-L002072
      - raw-L002074
- id: ipg-ann-3-2-67253bbe1d49
  anchor:
    type: block
    id: ipg-b000050
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-2-67253bbe1d49-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-2-67253bbe1d49-g01-b01
      type: paragraph
      text:
        en: As soon as a player has sat for a match, they are not allowed to get instructions or information
          about the match from other people. Casual chat is not forbidden, unless such chats include information
          which may benefit the player’s match. This does not include asking for advice at the pairings
          board or dealer booth, or outside while smoking. Players are going to chat about decks they
          played against or think they have to play against. We cannot control what they talk about in
          the restroom.
        zh: 当一位牌手在对局中就座之后，从其他人那里获取有关对局的额外信息或指导便是不允许的。并不禁止闲聊，除非闲聊中包括有可能让这位牌手在对局中获益的信息。外来协助这一条并不包括在配对表前，摊位前以及走廊里抽烟时向其他人寻求建议。牌手们总是会讨论他的套牌以及他们可能即将对抗的套牌。我们控制不了牌手在厕所里聊什么。
      sourceRawUnits:
      - raw-L002090
      - raw-L002092
- id: ipg-ann-3-2-f3e037433dc9
  anchor:
    type: block
    id: ipg-b000051
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-2-f3e037433dc9-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-2-f3e037433dc9-g01-b01
      type: paragraph
      text:
        en: This scenario often happens to a spectator or a player who is watching a friend playing after
          just finishing their own match. Especially for players who are still in the tournament, such
          behavior should be punished and the Match Loss should be issued. Keep in mind we are talking
          about “play advice.” “Don’t forget to attack” is play advice; “Quit, so we can go get food”
          is not play advice — although both may result in the game ending.
        zh: 这种情况多出现在一位牌手打完之后来围观朋友的时候。特别是这两位牌手都还在比赛中的时候，这种行为属于外来协助而且将获得一盘负的处罚。注意我们在讨论的是“游戏建议”，“别忘了踹”——这个是游戏建议；“你赶快投了，咱们吃饭去吧！”——这个不是，虽然这两句话可能都会导致游戏结束。
      sourceRawUnits:
      - raw-L002098
      - raw-L002100
- id: ipg-ann-3-2-e25480b08103
  anchor:
    type: block
    id: ipg-b000052
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-2-e25480b08103-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-2-e25480b08103-g01-b01
      type: paragraph
      text:
        en: The form notes take can be varied, but are typically on paper. While looking at these notes
          between games is OK, during a game it is not permitted. As an exception, official Oracle text
          is allowed to be checked at any time during the match. Typically players will just call a judge,
          but if someone has a printout of all the oracle text of all the cards in the set, they can use
          it as long as they are quick.
        zh: 笔记有很多种形式，不过一般都是记在纸上的。在两盘之间看这些笔记是被允许的，然而在一盘之中不行。但是有个例外，牌手可以在盘中查看官方的牌张Oracle。一般来说牌手会叫裁判来问Oracle，但是如果真的有人把环境内的所有牌的Oracle打印出来带着，也是可以使用的，只要他能保证查阅速度够快。
      sourceRawUnits:
      - raw-L002106
      - raw-L002108
- id: ipg-ann-3-2-828681ffe1f2
  anchor:
    type: block
    id: ipg-b000053
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-2-828681ffe1f2-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-2-828681ffe1f2-g01-b01
      type: paragraph
      text:
        en: During a Limited format event, either sealed events or drafts, players in the deck construction
          or draft portions shall be treated as though they were “in a match”, and any behavior which
          fits the definition above is regarded as “Outside Assistance.” Asking what to draft, or how
          many Forests should be played, or “Did you force White?” are examples. For some formats, such
          as Two-Headed Giant and Team Tournaments, team members can discuss decks and strategies between
          themselves, and Outside Assistance does not apply.
        zh: 在限制赛事中，包括轮抽和现开，牌手在组牌或者轮抽过程中都将被视为在“对局中”，所有符合上面所述的违规的行为都将被视为“外来协助”。比如：询问抓什么，应该加多少树林，或者“你要强行抓白么？”。在某些赛制中，比如双头巨人或者团队现开，队伍成员之间可以讨论组牌和战术，这时“外来协助”就不再适用。
      sourceRawUnits:
      - raw-L002114
      - raw-L002116
- id: ipg-ann-3-2-abd59db2f8ba
  anchor:
    type: block
    id: ipg-b000054
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-2-abd59db2f8ba-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-2-abd59db2f8ba-g01-b01
      type: paragraph
      text:
        en: These notes may be things like strategies for sideboarding for different matchups. A note
          taken in game one can be checked during game two. The “beginning of the match” is the line because
          there has to be one, and there makes the most sense. Players can’t go online between games and
          look up sideboard strategy.
        zh: 这些笔记可能是换备指导等战术信息。在第一盘记录的笔记在第二盘进行中可以查阅。因为必须要有一条分割线，我们把这条线划在“开始对局时”，因为这个时间点最为合适。牌手不能在两盘游戏之间上网查阅换备指导。
      sourceRawUnits:
      - raw-L002122
      - raw-L002124
- id: ipg-ann-3-2-aa497f48a617
  anchor:
    type: block
    id: ipg-b000057
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-2-aa497f48a617-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-2-aa497f48a617-g01-b01
      type: paragraph
      text:
        en: A game is between two players. Not a player vs. another player and their friend, or Google,
          or the Twitterverse. Outside Assistance can be a word, a piece of paper or a gesture; it can
          be a request for information. If it can be seen to have offered the player strategic, play or
          construction advice then it should be regarded as outside assistance.
        zh: 对局是两个牌手之间的，而不是牌手A vs 牌手B和他愉快的小伙伴们，或百度/营地。外来协助可以是一个词，一张纸，甚至一个手势；也可以是对信息的请求。任何向牌手提供战术、游戏动作及套牌构组方面建议的行为都应被视为外来协助。
      sourceRawUnits:
      - raw-L002142
      - raw-L002146
    - id: ipg-ann-3-2-aa497f48a617-g01-b02
      type: paragraph
      text:
        en: Keep in mind though that asking or telling a player the results of another match is not Outside
          Assistance, even if that information is used to end the game.
        zh: 需要注意，询问或告诉对局中的牌手比赛中其他对局的结果并不属于外来协助，即使这个信息会使得这盘游戏直接结束。
      sourceRawUnits:
      - raw-L002144
      - raw-L002148
- id: ipg-ann-3-2-b988d07dafee
  anchor:
    type: block
    id: ipg-b000058
    segmentId: ipg-b000058-rs-9f406bb38508
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-2-b988d07dafee-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-2-b988d07dafee-g01-b01
      type: paragraph
      text:
        en: Some players write notes on cards, which may contain some strategic information. Several words,
          a mark, or a picture are tolerable, but sentences may be beyond the line. Examples include dots
          on the face of sideboard cards, or “attack with me” on a Ball Lightning, or a Trinket Mage altered
          to be examining a specific artifact (the intended target). If you are not sure whether such
          visual modification is acceptable, ask the Head Judge.
        zh: 一些牌手会在牌上写一些字，这有可能包括战术信息。牌面上的几个词，标记或者画是可以接受的，但是在牌上写上句话可能就不行了。例如在备牌的牌面上画几个点、写着“用我踹”的暴雷链球、或者写着某个神器名字的琐物法师。如果你不确定一张牌上的图样加工是否可以接受，请去问主审。
      sourceRawUnits:
      - raw-L002154
      - raw-L002156
- id: ipg-ann-3-2-0a1f7ff967c9
  anchor:
    type: block
    id: ipg-b000058
    segmentId: ipg-b000058-rs-0bc41ef27c54
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-2-0a1f7ff967c9-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-2-0a1f7ff967c9-g01-b01
      type: paragraph
      text:
        en: For the players who are still in the tournament, Outside Assistance may be the Sword of Damocles
          which prevents them offering advice or seeking suggestions from others. However, spectators
          do not need to worry about the potential punishment because they do not have a “next match”
          for a Match Loss to apply to. In these case, judges should ask the spectators to leave the venue
          politely; this provides a warning to other spectators who can’t help talking about the current
          match when they are watching others.
        zh: 对于比赛中的牌手来说，“外来协助”这项就像悬在头顶的达摩克利斯之剑一样提醒着他们不要寻求其他人的建议。然而，旁观者显然没有这种顾虑，因为对于他们来说并没有比赛可以“一局负”。这种情况下，裁判应该礼貌的请他离开会场。这对于其他旁观者来说是一种警示，让他们不会犯下同样的错误。
      sourceRawUnits:
      - raw-L002162
      - raw-L002166
    - id: ipg-ann-3-2-0a1f7ff967c9-g01-b02
      type: paragraph
      text:
        en: Not being enrolled in the tournament doesn’t protect you from this infraction. If a spectator
          commits this infraction and is not enrolled in the tournament, enroll them, assign the infraction,
          then drop them from the event.
        zh: 没有参加比赛并不能防止自己受到此判罚。如果一位旁观者犯下了外来协助，将他加入比赛，录入判罚，再将他退赛。
      sourceRawUnits:
      - raw-L002164
      - raw-L002168
- id: ipg-ann-3-2-34b6c26caf11
  anchor:
    type: block
    id: ipg-b000059
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-2-34b6c26caf11-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-2-34b6c26caf11-g01-b01
      type: paragraph
      text:
        en: This downgrade reflects that the advantage that you might gain for accessing information that
          you are allowed to access between games is likely to be less than if you access information
          that you wouldn’t normally have access to between games. Looking at your notes on sideboarding
          is still likely to give you an advantage but not as much as asking a friend what your opponent
          sideboarded in and out this game.
        zh: 这个降级反映了取得原本可在两盘之间合法取得之信息可能产生的获利，相较于取得原本不能在两盘之间合法取得之信息可能产生的获利是比较低的。查看换备笔记仍然很可能给你带来一定的获利，但比起问你的朋友对手这盘换出去什么牌、换进来什么牌比起来，程度要轻微许多。
      sourceRawUnits:
      - raw-L002174
      - raw-L002176
- id: ipg-ann-3-3-e3c1717cc87c
  anchor:
    type: block
    id: ipg-b000060
    segmentId: ipg-b000060-rs-c66bb2ae4f8b
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-3-e3c1717cc87c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-3-e3c1717cc87c-g01-b01
      type: paragraph
      text:
        en: 'Players are required to play at a reasonable pace, but what is a reasonable pace? It’s not
          really defined anywhere. There is no explicit number of seconds to make a decision. If we say
          “taking longer than 30 seconds to make a decision is slow play,” then players can legally take
          29 seconds to make every decision, and we have just legalized Stalling. Making a slow play call
          as a judge is subjective, therefore judges have to use their best judgment when making them.
          Two methods judges have reported using are:'
        zh: 牌手应该在合理的时间内进行游戏动作，但是什么样才是合理？在这里并没有一个明确的数值，没有规定说必须多少秒之内做出决定。如果我们说“思考30秒及以上没做决定将得到游戏进行过慢”，那么每位牌手将有合法的29秒时间去做决定，同时使得“拖延”合法化。游戏进行过慢依靠裁判的主观判断，因此裁判必须尽其所能的来判断这是否是游戏进行过慢。有两种裁判们在用的方法：
      sourceRawUnits:
      - raw-L002188
      - raw-L002194
  - id: ipg-ann-3-3-e3c1717cc87c-g02
    kind: unordered-list
    blocks:
    - id: ipg-ann-3-3-e3c1717cc87c-g02-b01
      type: list-item
      text:
        en: If you have had time to assess the board, figure out what to do, and then get bored, it’s
          slow play
        zh: 如果你有时间观察场面信息，并想出这个局面如果是你会怎么打，接着你感到无聊了，那么这个时候就属于游戏进行过慢；
      sourceRawUnits:
      - raw-L002190
      - raw-L002196
      marker: bullet
    - id: ipg-ann-3-3-e3c1717cc87c-g02-b02
      type: list-item
      text:
        en: If you start wondering if you should give Slow Play, you should have already given it.
        zh: 当你开始考虑是不是该给游戏进行过慢的判罚时候，那你就应该给了。
      sourceRawUnits:
      - raw-L002192
      - raw-L002198
      marker: bullet
- id: ipg-ann-3-3-fdbccde42a95
  anchor:
    type: block
    id: ipg-b000060
    segmentId: ipg-b000060-rs-93dad88c46e3
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-3-fdbccde42a95-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-3-fdbccde42a95-g01-b01
      type: paragraph
      text:
        en: Players can be playing slowly unintentionally without realizing it. If they are playing slowly
          with the specific purpose of eating up time on the clock (either to cement the win, or force
          a draw, or for other reasons) then it’s not Slow Play, it’s Stalling (i.e. cheating). Keep in
          mind they are very difficult to tell apart, and typically revolves around how much the player
          was aware of the remaining time on the clock.
        zh: 牌手有时确实会在无意识、并非故意的情况下玩的过慢。如果牌手故意减缓自己的行动速度来蚕食剩下的游戏时间（包括巩固自己的优势、拖平、或者任何其他原因）那么就不是游戏行进过慢，那是“举止违背运动道德～拖延”，是作弊行为。但是请记住它们与游戏进行过慢之间很难分辨，其判断通常取决于该牌手对比赛剩余时间的关注程度。
      sourceRawUnits:
      - raw-L002204
      - raw-L002206
- id: ipg-ann-3-3-372892efcf9b
  anchor:
    type: block
    id: ipg-b000061
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-3-372892efcf9b-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-3-372892efcf9b-g01-b01
      type: paragraph
      text:
        en: This is one of those sentences that whole articles can be written about. Most loops have a
          finite ending — I do X 10 times, but stop early if Y happens. Using the rules for shortcuts
          as found in the MTR, you must also be able to explain the specific end state. There are many
          loops out there where they will reach a certain condition “eventually.” Eventually is not a
          specific number. These loop end states are also not specific enough. You cannot perform the
          loop “Mill myself until the last 2 cards in my library are Emrakul” because you can’t specify
          how many times you will need to loop to get to that state. You could loop “A million times!”
          but there is still a chance it won’t happen until the million and first. Fine, I loop 2 Million
          times! There is still the chance it won’t happen. It doesn’t matter how small the chance of
          failure is; if it’s there, you can’t loop.  Also, if the opponent wants to respond when you
          have milled both Emrakuls and both shuffle triggers are on the stack, how do you determine which
          state happens first?
        zh: 这句话展开了写可以写出一大篇文章。大部分的循环都有一个有限的次数——我进行X动作十次，但是如果发生了Y事件的话就提前停止。但是MTR中的关于简化的规则表示，你必须同时能够说出明确的结束状态。也有很多循环有可以“最终”达成明确的结束状态。但是“最终”并不是一个准确数字。你不能进行这样的循环：“磨我自己的牌库，直到我牌库里只剩两张伊莫库”，因为你不能准确说出需要达成这个结果所需的次数。你可以说“来一百万次！”，但是这样仍有几率无法达成所说的状态。“好吧，再来1百万次！”但是状态未出现的可能性仍存在。不管无法达成状态的可能性有多小，只要有，你就不能进行这样的循环。而且，如果对手想要在你将两个伊莫库都磨进坟墓场、两个洗牌触发都在堆叠上时进行响应，你要怎么确定哪个游戏状态会先发生？
      sourceRawUnits:
      - raw-L002212
      - raw-L002214
- id: ipg-ann-3-3-b3abe29de704
  anchor:
    type: block
    id: ipg-b000065
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-3-b3abe29de704-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-3-b3abe29de704-g01-b01
      type: paragraph
      text:
        en: Examples A,B,C, and D all are all cases of unnecessary and excessive actions that do not progress
          the game. For Example D, if a player has to leave the game for a restroom break, they should
          seek permission from a judge. Upon return, a time extension will be issued. Keep in mind that
          you should always let the player go to the bathroom. The penalty is not because you went to
          the bathroom, it’s because you left your opponent and didn’t tell a judge.
        zh: 例子A、B、C、D都是牌手进行了过多的、不必要的且不推动游戏进行的动作。在例子D中，如果牌手需要离开对局去厕所或者休息一下，那么他应该向裁判申请。等他回来的时候，为那桌补时。记住，裁判应该允许牌手去洗手间。判罚不是因为牌手去了洗手间，而是因为你离开座位而没有通知裁判。
      sourceRawUnits:
      - raw-L002234
      - raw-L002236
- id: ipg-ann-3-3-0d347345bcf5
  anchor:
    type: block
    id: ipg-b000066
    segmentId: ipg-b000066-rs-9d90ca52abf5
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-3-0d347345bcf5-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-3-0d347345bcf5-g01-b01
      type: paragraph
      text:
        en: In some professional sports taking advantage of the clock is a legal strategy. In Magic, we
          want matches to be determined by actually playing the game, not the clock. Time is a shared
          resource between players, and we do not want one player to consume more time than is reasonable
          to complete their actions. Complex combos may require more time to perform actions because there
          are more actions to perform, however wasted time is taking time from the opponent. Both players
          are expected to play at a pace that allows the match to conclude in the allowed time.
        zh: 在某些专业体育项目的规则中，利用时间来取得优势是符合规则的战术。但是在万智牌中，我们希望比赛的结果取决于万智牌的对战，而不是时间。时间是双方牌手共享的资源，我们不希望其中一位牌手占据超过合理范围的时间来进行游戏动作。复杂的组合技有很多动作需要完成，因而可能需要更多的时间，但在双方共享对局时间的游戏中，浪费时间就是从对手那里夺取时间。双方牌手都应该按照合理的步调进行游戏，让比赛在合理的时间内结束。
      sourceRawUnits:
      - raw-L002244
      - raw-L002246
- id: ipg-ann-3-3-597193eb0d5d
  anchor:
    type: block
    id: ipg-b000066
    segmentId: ipg-b000066-rs-c95b2b502999
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-3-597193eb0d5d-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-3-597193eb0d5d-g01-b01
      type: paragraph
      text:
        en: A player who is deep in thought may not be aware that they have used a lot of time. People
          are bad at estimating time and might think it’s only been ten seconds when it’s been fifty.
          In these cases it’s OK to step in a give a little nudge to play faster. This nudge is not a
          formal penalty or a Warning, it’s a ‘caution.’ If the player makes their play quickly and continues
          at a reasonable pace, everything is fine. It’s also worth noting that some judges don’t start
          with a Caution. This is also OK.
        zh: 一位陷入沉思的牌手可能意识不到自己用了太多的时间。人们并不擅长计算时间，可能你以为过了10秒，其实已经是50秒了。在这个例子中你可以上前给他一点提醒让他进行的快一些。这个提醒并不是一个正式的处罚或者一个“警告”，而是一个“注意”。如果那位牌手采取了行动，后面动作的进行也恢复到了正常步调，那么就行了。值得一提的是有些裁判并不从“注意”开始，这也是可以的。
      sourceRawUnits:
      - raw-L002252
      - raw-L002254
- id: ipg-ann-3-3-971542f52993
  anchor:
    type: block
    id: ipg-b000066
    segmentId: ipg-b000066-rs-cb69b31867a9
  position: after
  order: 30
  groups:
  - id: ipg-ann-3-3-971542f52993-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-3-971542f52993-g01-b01
      type: paragraph
      text:
        en: If a player has already been cautioned to make decisions, and doesn’t make a decision in a
          timely manner, or the next decision is also slow, then the next step will be to issue a Warning.
          If a Warning has already been issued, then a second resulting Warning will be upgraded to a
          Game Loss (with the Head Judge’s concurrence). When giving a Warning, double check with the
          player whether this is the first time a slow play warning has been issued for today’s tournament.
        zh: 如果一位牌手已经被要求“注意”该作出决定了，但是之后还是没有及时作出决定，或者下个决定做的依然很慢，那么就需要给出“警告”。如果他已经因此获得过“警告”，那么第二个警告将会被升级为“一盘负”（在主审的同意下）。在给出游戏行进过慢的警告判罚之前，请确认这位牌手是否在今天的比赛中获得过同样的警告。
      sourceRawUnits:
      - raw-L002260
      - raw-L002262
- id: ipg-ann-3-3-8340b7e58533
  anchor:
    type: block
    id: ipg-b000067
    segmentId: ipg-b000067-rs-52694ae9c274
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-3-8340b7e58533-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-3-8340b7e58533-g01-b01
      type: paragraph
      text:
        en: There is no way to quantify how much time has been lost in the match because of a player playing
          slowly. Instead of giving a time extension, the remedy is to add two additional turns if the
          match goes to time. These turns may be taken by the same player if ‘take an extra turn after
          this one’ effects are used.
        zh: 没有办法来度量一位牌手缓慢的动作消耗了对局中的多长时间。作为补时的替代，补救措施是在比赛时限已到后额外延长两个回合。如果有牌手使用了“进行额外回合”效应的话，这些回合可能会由同一位牌手进行。
      sourceRawUnits:
      - raw-L002270
      - raw-L002272
- id: ipg-ann-3-3-86655b258ef6
  anchor:
    type: block
    id: ipg-b000067
    segmentId: ipg-b000067-rs-014218a6d459
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-3-86655b258ef6-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-3-86655b258ef6-g01-b01
      type: paragraph
      text:
        en: Those turns have to be put somewhere.
        zh: 这个补的回合总得找个地儿放。
      sourceRawUnits:
      - raw-L002278
      - raw-L002280
- id: ipg-ann-3-3-5f7b5e92ba75
  anchor:
    type: block
    id: ipg-b000068
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-3-5f7b5e92ba75-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-3-5f7b5e92ba75-g01-b01
      type: paragraph
      text:
        en: If a game has gone to time after a time extension, and players are in the five extra turns
          for end of match procedures, then no extra turns will be given for slow play because you aren’t
          “on the clock” anymore.
        zh: 如果一桌已经在数回合了，那么给出游戏行进过慢判罚就不需要再补额外的回合，因为他们已经不计时了。
      sourceRawUnits:
      - raw-L002286
      - raw-L002290
    - id: ipg-ann-3-3-5f7b5e92ba75-g01-b02
      type: paragraph
      text:
        en: For further reference on Slow Play, see this article.
        zh: 更多关于游戏进行过慢的信息，参见这篇[文章](http://blogs.magicjudges.org/articles/2012/12/25/slow-play/)。
      sourceRawUnits:
      - raw-L002288
      - raw-L002292
- id: ipg-ann-3-4-daa7d870accd
  anchor:
    type: block
    id: ipg-b000069
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-daa7d870accd-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-daa7d870accd-g01-b01
      type: paragraph
      text:
        en: These are the major cases where the decklist has to be modified. An illegal deck, is a deck
          with not enough cards; too many cards in the sideboard, ambiguous cards names, or cards that
          are illegal for the format.
        zh: 这是套牌登记表必须被修正的几个主要原因。套牌张数不足、备牌张数过多、牌名模棱两可、包含非法牌张都会导致套牌非法。
      sourceRawUnits:
      - raw-L002304
      - raw-L002310
    - id: ipg-ann-3-4-daa7d870accd-g01-b02
      type: paragraph
      text:
        en: While we use decklists to confirm that players do not change their decks over the course of
          the tournament, we do consider the physical deck to be the true representation of what the player
          intended to play, and we expect the decklist to represent the physical deck.
        zh: 虽然套牌登记表的用途是用来确认牌手在比赛过程当中不改变套牌的内容，我们仍应将实际的套牌内容视为牌手想要使用的套牌，并且期望套牌登记表的内容能够反映实际的套牌内容。
      sourceRawUnits:
      - raw-L002306
      - raw-L002312
    - id: ipg-ann-3-4-daa7d870accd-g01-b03
      type: paragraph
      text:
        en: While a penalty for lost cards may seem harsh, players have the option to replace those lost
          cards with another copy; if they can find it. Additionally this discourages a potential cheating
          angle, where the player determines their land count is incorrect and would like to “lose” a
          card and replace with a land.
        zh: 虽然丢了牌还要吃判罚听起来过于严厉，但如果牌手能够找到其他同名牌的话，仍然能用其替代丢失的牌张。此外这也能阻止牌手利用这一条，在认为自己套牌地的数量不够时故意“丢”一张牌来换进一张地的作弊方法。
      sourceRawUnits:
      - raw-L002308
      - raw-L002314
- id: ipg-ann-3-4-1c2f79f05b34
  anchor:
    type: block
    id: ipg-b000070
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-1c2f79f05b34-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-1c2f79f05b34-g01-b01
      type: paragraph
      text:
        en: In the case of a sealed pool, the registration was done by another player, and those errors
          were not made by the player playing the deck. We don’t want to penalize a player for a mistake
          made by another participant. Use your judgement to determine if they error can be corrected
          and do so.
        zh: 对于现开牌池而言，登记是由另一位牌手作的，所以登记错误并不是使用套牌的牌手的责任。我们不应因为他人犯下的失误惩罚牌手。使用你的判断力来决定错误能否修正，如能修正则如此做。
      sourceRawUnits:
      - raw-L002320
      - raw-L002322
- id: ipg-ann-3-4-2d0bc58277ec
  anchor:
    type: block
    id: ipg-b000076
    segmentId: ipg-b000076-rs-5227a7e8342c
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-2d0bc58277ec-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-2d0bc58277ec-g01-b01
      type: paragraph
      text:
        en: As explained above, the decklist is a written record of what the player intends to play throughout
          the day. It’s important that judges have access to a reliable record of a player’s deck for
          investigations.
        zh: 正如上面所说的，牌表是为了记录牌手今天用的套牌是什么而登记的书面记录。在裁判调查套牌时，有一份可靠的记录是非常重要的。
      sourceRawUnits:
      - raw-L002352
      - raw-L002354
- id: ipg-ann-3-4-aed2431a2c67
  anchor:
    type: block
    id: ipg-b000076
    segmentId: ipg-b000076-rs-87aeff2d65e3
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-4-aed2431a2c67-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-aed2431a2c67-g01-b01
      type: paragraph
      text:
        en: Making announcements at the start of a tournament can prevent a lot of the errors that could
          occur in a tournament; for example, “check your decklists to ensure that you have at least 60
          cards in your main deck and up to 15 cards in your sideboard”. Decklists are often a rushed
          last-minute job, so by providing an extra minute or two during a players meeting to check for
          last-minute issues many of these errors can be prevented.
        zh: 在比赛开始时进行诸如“请检查你的牌表确保有60张以上的主牌，和最多15张的备牌”的公告，能够避免比赛中可能出现的很多错误。交牌表总是一项匆匆进行、赶在最后才完成的任务，因此在牌手会议中留出一两分钟时间来提醒牌手检查一下牌表能够避免出现很多牌表问题。
      sourceRawUnits:
      - raw-L002360
      - raw-L002362
- id: ipg-ann-3-4-243e986ac95a
  anchor:
    type: block
    id: ipg-b000076
    segmentId: ipg-b000076-rs-101f14e11562
  position: after
  order: 30
  groups:
  - id: ipg-ann-3-4-243e986ac95a-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-243e986ac95a-g01-b01
      type: paragraph
      text:
        en: This sentence is to reinforce that when parts of this infraction require that the decklist
          be changed to match the deck that is being played the Game Loss penalty should also be issued.
          The sentence says “normally” because there is a corner case where the player is unable to replace
          a lost card, receives the penalty, yet later is able to replace it. In that case, we can change
          the list back to its original configuration without issuing a penalty.
        zh: 这句话是用来强调，这项违规需要修改牌表来符合套牌内容时，应当同时给予一盘负处罚。说“通常”的原因是在一种极端情况下牌手无法找到替代用的牌，得到了判罚，稍后又找到了替换用的牌。在这种情况下，我们可以将登记表改回其原本的状态，并不再给予判罚。
      sourceRawUnits:
      - raw-L002368
      - raw-L002370
- id: ipg-ann-3-4-dc6559ea7640
  anchor:
    type: block
    id: ipg-b000077
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-dc6559ea7640-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-dc6559ea7640-g01-b01
      type: paragraph
      text:
        en: If an error is discovered during a deck check, the penalty is issued immediately. The players
          aren’t playing. Issue the penalty. Apply the fix, and if the match isn’t over, get the players
          playing as quickly as possible.
        zh: 如果在套牌检查时发现了错误，判罚应立即给出。牌手并没有正在进行对局。给出判罚，然后应用修正，如果对局还没有结束，请牌手尽快继续比赛。
      sourceRawUnits:
      - raw-L002376
      - raw-L002380
    - id: ipg-ann-3-4-dc6559ea7640-g01-b02
      type: paragraph
      text:
        en: At events, judges will occasionally also check lists for legality outside of deck checks.
          If a problem is found with a list outside of a deck check, then the penalty should be assessed
          at the start of the next match. This is mostly for consistency. If we check a list and find
          a problem with 10 min remaining the the round, the current match may still be in progress, or
          may have finished. If it’s still going, that game loss will likely end the match. This means
          the penalty can effectively be harsher based on where in the stack of decklists the player’s
          list was. To balance this, we assess the penalties at the beginning of the next round. Now,
          this doesn’t apply if you feel the deck is illegal; for example, a Modern decklist containing
          Mental Misstep. You can inspect the library of the player. If the deck is in fact illegal, go
          ahead and issue the infraction. Otherwise, issue the penalty and resolve the fix between rounds,
          with the infraction taking effect at the beginning of the next match.
        zh: 在比赛中，裁判在套牌检查之外也会偶尔检查牌表。如果在套牌检查之外的牌表中发现了问题，那么判罚将在下一局开始时给出。这主要是为了保持判罚的一致性。如果你在一轮开始之后10分钟发现一个牌表有问题，那么现在这一桌对局可能在进行，也可能已经结束。如果对局还在进行，那么你给出的一盘负的判罚将有可能直接结束这一局游戏。这意味着，牌手吃到这个判罚的严重程度取决于他牌表在一摞牌表中的位置。为了平衡这点，我们将这个判罚延后至下一轮开始的时候再给出。但是，如果你觉得牌手的套牌是不合法的，那么可以立刻给出判罚；比如说，一张近代赛的牌表中出现了心灵失足。你可以检查该牌手的牌库。如果套牌确实是非法的，接下来请给出判罚。反之，如果套牌是合法的，在两轮之间给出判罚并执行修正，此判罚将在下一局开始时生效。
      sourceRawUnits:
      - raw-L002378
      - raw-L002382
- id: ipg-ann-3-4-7e69347d9ec1
  anchor:
    type: block
    id: ipg-b000078
    segmentId: ipg-b000078-rs-1fd4e1c068ba
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-7e69347d9ec1-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-7e69347d9ec1-g01-b01
      type: paragraph
      text:
        en: Writing down ambiguous or incorrect card names can be a player attempting to cheat. They could
          be attempting to give themselves some flexibility to modify their deck to match the field, while
          claiming they just took a shortcut writing down the name.
        zh: 写了模糊的或错的牌名的牌手可能说明牌手在试图作弊。他们可能是在尝试给自己的套牌留出一定的调整空间以应对环境，同时声称自己只是图方便写的简称。
      sourceRawUnits:
      - raw-L002388
      - raw-L002390
- id: ipg-ann-3-4-eb122429340c
  anchor:
    type: block
    id: ipg-b000078
    segmentId: ipg-b000078-rs-c0e8e9db2157
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-4-eb122429340c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-eb122429340c-g01-b01
      type: paragraph
      text:
        en: In the case of storyline figures, it is often easy to see which card a player means. If a
          player lists “4 Ulrich”, that player is unlikely to be talking about Ulrich’s Kindred, despite
          it beginning with the same series of letters. In this case of Legendary Permanents and Planeswalkers,
          there is an exception to the requirement that cards be listed by their full name, but the card
          names still need to be uniquely identifiable. Listing “4 Jace” on a Legacy decklist, however,
          is not good enough, since there are multiple representations of “Jace” that are legal in the
          format. If judges allowed a player to list “4 Jace” without it being considered an infraction,
          a player could take advantage of the ambiguity by swapping between Jace, Memory Adept and Jace,
          the Mind Sculptor as necessary to gain an advantage without fear of ever receiving a Game Loss.
        zh: 对于故事角色的情况，通常我们很容易能明白牌手指的是哪张牌。如果一个牌手在牌表上写着“4 乌力奇”，那么他基本不可能指的是乌力奇同族，虽然其英文名称中开头的一个词是一样的。在传奇永久物和鹏洛客的例子中，你可以写他们的简写（而无需像其他牌一样必须写全名），但是写的名字仍然需要能够唯一地辨识出来。再比如，在薪传比赛的套牌登记表上写“4
          杰斯”就并不满足要求，因为在薪传赛制中有许多个“杰斯”。如果因为裁判允许牌手写“4 杰斯”而不算违规的话，那位牌手便可以利用这个模糊的漏洞来任意替换自己套牌中的“心灵塑师杰斯”和“记忆专家杰斯”
          而不用担心会得到一盘负。
      sourceRawUnits:
      - raw-L002396
      - raw-L002398
- id: ipg-ann-3-4-7bee0468065a
  anchor:
    type: block
    id: ipg-b000079
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-7bee0468065a-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-7bee0468065a-g01-b01
      type: paragraph
      text:
        en: 'Checking and confirming the cards in the deck against the decklist in this situation causes
          unnecessary work for the deck check team. If the error is extremely obvious and the correct
          card name can only be one thing, then there is no ambiguity. If the error is obvious, there
          is truly no question of what the card is. There is not even a reason to check. In those cases,
          the HJ is allowed to choose not to issue a penalty. It’s not even a warning. However, not all
          judges see ‘obvious’ the same way. Some tend to be a little too loose and free with what obvious
          means. To determine if obvious is obvious enough, use these guidelines: If you have to spend
          time debating if it’s obvious, it’s not obvious. If you have to actually check the deck to see
          what they are really playing, it’s not obvious enough. For example, “U/B Shockland” is an obvious
          card, so is Temple of B/G. I do not need to look at the actual deck to know what either of those
          are. Same with ‘Bob’ for Dark Confidant.'
        zh: 检查并确认这些套牌中的牌是否符合牌表会给套牌检查组带来不必要的工作。如果错误非常明显、且正确的牌名只有一种可能，那么就没有歧义。如果错误太明显，那么它所指的牌应该不存在疑问，甚至连套牌都不用去检查。在遇到这种情况时，主审可以选择不给判罚，甚至警告都不用。但是，并不是所有裁判所认为的“明显”都是一样的。一部分人可能对于“明显”的标准太宽松了。去判断牌名是否足够“明显”，你可以使用下面这些标准：如果你需要讨论一下这个牌名是否明显，那么不够明显。如果你需要检查他的套牌来确认是哪张牌，那么不够明显。举例来说“蓝黑新圈”或者“黑绿占卜地”是一个可以接受的写法，我不需要去查他的套牌就能知道这张牌是什么。用“Bob”（黑暗亲信的昵称）表示黑暗亲信也是一样。
      sourceRawUnits:
      - raw-L002404
      - raw-L002410
    - id: ipg-ann-3-4-7bee0468065a-g01-b02
      type: paragraph
      text:
        en: Now what about a situation where the player writes down the wrong card name, such as Temple
          of Malady in the B/R deck that physically runs Temple of Malice, and it is caught during a deck
          check. Is it a clerical error? Probably. Is it obvious that they meant Temple of Malice? Not
          by looking solely at the decklist. So this scenario would not be eligible for a downgrade.
        zh: 写错牌名的情况也是会有的，比如在一套黑绿套牌里把疫病殿堂写成了恶意殿堂，然后在套牌检查的时候被发现了。这是笔误么？有可能。但是能够明显看出应该是疫病殿堂么？只看牌表的话无法断定。因此这个情况下不能降级处罚。
      sourceRawUnits:
      - raw-L002406
      - raw-L002412
    - id: ipg-ann-3-4-7bee0468065a-g01-b03
      type: paragraph
      text:
        en: Toby Elliott wrote a wonderful blog entry detailing what is and is not to be considered ‘obvious’.
        zh: Toby Elliot就“哪种算明显，哪种算不明显”写了一篇非常好的[博文](http://blogs.magicjudges.org/telliott/2014/05/27/of-course-they-do-it-must-be-obvious/)。
      sourceRawUnits:
      - raw-L002408
      - raw-L002414
- id: ipg-ann-3-4-97cf0fc4bb00
  anchor:
    type: block
    id: ipg-b000080
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-97cf0fc4bb00-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-97cf0fc4bb00-g01-b01
      type: paragraph
      text:
        en: Players can make mistakes and when the situation arises where a player has a correct deck
          and matching decklist, but the companion is not legal due to a unsatisfied restriction  in the
          deck, we will allow the player to be able to continue with the companion as planned. However,
          the only way to legally do this is to modify the deck and the sideboard in order to no longer
          violate the restriction. In this case we exchange cards between the main deck and the sideboard
          until the companion restriction is satisfied for game 1. The Game Loss Penalty is still utilized
          as we are still modifying the decklist.
        zh: 牌手难免会犯错。当出现以下情况时：牌手的套牌与牌表是相符的，但由于套牌内未满足构筑限制条件导致行侣不合法，我们将允许牌手按原计划继续使用该行侣。然而，要合法地做到这一点，唯一的办法是修改主牌和备牌，使其不再违反该限制条件。在这种情况下，我们在主牌和备牌之间交换牌张，直到满足第一局游戏的行侣限制条件。由于我们实际上是在修改牌表，因此仍然适用一盘负的判罚。
      sourceRawUnits:
      - raw-L002420
      - raw-L002422
- id: ipg-ann-3-4-d26854b84f2c
  anchor:
    type: block
    id: ipg-b000081
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-d26854b84f2c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-d26854b84f2c-g01-b01
      type: paragraph
      text:
        en: It is possible for the opponent to have made decisions during the mulligan procedure based
          on an incorrect decklist. Since it’s nearly impossible to determine how much impact the erroneous
          information may have had on the game, we err on the side of a game loss.
        zh: 对手有可能基于错误的牌表在再调度程序中做出了决定。由于几乎无法确定该错误信息对游戏造成了多大程度的影响，我们倾向于从严判罚一盘负。
      sourceRawUnits:
      - raw-L002428
      - raw-L002430
- id: ipg-ann-3-4-865b6488c1de
  anchor:
    type: block
    id: ipg-b000082
    segmentId: ipg-b000082-rs-2e1c05fcf495
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-865b6488c1de-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-865b6488c1de-g01-b01
      type: paragraph
      text:
        en: The steps for the remedy are performed in order. The first thing you want to do is remove
          any illegal cards from the list. If the illegal cards are also in the deck, remove them too.
        zh: 修正的步骤应当按顺序进行。你应当作的第一件事就是移除牌表上所有非法的牌张。如果套牌中也有非法的牌，将其一并移除。
      sourceRawUnits:
      - raw-L002438
      - raw-L002440
- id: ipg-ann-3-4-4c8c952eef2a
  anchor:
    type: block
    id: ipg-b000082
    segmentId: ipg-b000082-rs-7abfa0e37ebc
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-4-4c8c952eef2a-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-4c8c952eef2a-g01-b01
      type: paragraph
      text:
        en: This is simply being done to allow the companion to still be used in a legal configuration.
          The cards that violate the restriction have to be removed, and we need to replace them from
          somewhere, so the sideboard is that somewhere.
        zh: 这样做仅仅是为了让行侣依然能在合法的构筑下被使用。那些违反限制条件的牌必须被移出，而我们需要从某处找牌来替换它们，那个地方就是备牌。
      sourceRawUnits:
      - raw-L002446
      - raw-L002448
- id: ipg-ann-3-4-277159b6d694
  anchor:
    type: block
    id: ipg-b000083
    segmentId: ipg-b000083-rs-07839f2e2d11
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-277159b6d694-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-277159b6d694-g01-b01
      type: paragraph
      text:
        en: To fix the error, we want to ensure that the player is playing what they intended to play
          – we do not force the deck to match the decklist; instead we alter the decklist to reflect the
          deck. The deck that a player has presented is more frequently what they intended to play.
        zh: 为了修正这个问题，我们需要去确认牌手正在用的套牌是什么样的——我们不会把套牌改成牌表那样，而是将牌表改成套牌那样。牌手所呈现的套牌更可能是他所期望的套牌形态。
      sourceRawUnits:
      - raw-L002454
      - raw-L002456
- id: ipg-ann-3-4-7f36807c31d9
  anchor:
    type: block
    id: ipg-b000083
    segmentId: ipg-b000083-rs-2131e703d658
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-4-7f36807c31d9-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-7f36807c31d9-g01-b01
      type: paragraph
      text:
        en: In this case you need to remove cards from the players deck.  The player decides what they
          remove in order to make the quantity of cards legal.  In the case of Unified Constructed Team
          formats, the team can decide who is the player that needs to change their list.  The result
          is, the player whose decklist changes gets the Game Loss. The players may discuss this, but
          they may not take too long.  This may result in a “strategic decision”, but that’s an acceptable
          consequence.
        zh: 在这种情形下，你需要从牌手的套牌中移除牌张。牌手可以决定移除哪些牌，使得套牌的张数合法。在联合构组团队赛制中，团队可以决定哪位牌手需要修改其牌表，结果就是修改牌表的那位牌手获得一盘负。牌手可以进行讨论，但不能花费过多的时间。虽然这会导致「战术讨论」，但也算是可接受的结果。
      sourceRawUnits:
      - raw-L002462
      - raw-L002464
- id: ipg-ann-3-4-df0fc643fe08
  anchor:
    type: block
    id: ipg-b000084
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-4-df0fc643fe08-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-df0fc643fe08-g01-b01
      type: paragraph
      text:
        en: While some decks might start out with too few cards, some decks will drop below a legal amount
          after illegal cards have been removed. In addition, cards may be lost and the player unable
          to find replacements. To fix these problems, judges can add Plains, Islands, Swamps, Mountains,
          or Forests of the player’s choice to their deck, so that it becomes playable. Because some formats
          have special restrictions on Snow-Covered basics or Wastes, and their availability is not guaranteed,
          they are not allowed.
        zh: 除了有些套牌本就缺少牌张以外，在移除非法牌张之后一些套牌也会减少至不足合法张数下限。此外，牌手一旦丢牌，也可能会找不到替代品。要修正这类问题，裁判让该牌手选择平原、海岛、沼泽、山脉或树林加入他的套牌中，使套牌合法。因为一些赛制对雪境基本地和荒野有特殊限制，并且也无法保证能提供这些地牌，因此不允许在此使用它们。
      sourceRawUnits:
      - raw-L002470
      - raw-L002472
- id: ipg-ann-3-4-d3d4266421a5
  anchor:
    type: block
    id: ipg-b000084
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-4-d3d4266421a5-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-4-d3d4266421a5-g01-b01
      type: paragraph
      text:
        en: If lost cards are found, it’s ok to remove the additional basic land cards and allow the player
          to play with the cards that are supposed to be in their deck.
        zh: 如果稍后找到了丢失的牌，可以接受让牌手移除替代用的基本地牌，并用本应在其套牌中的那些牌继续比赛。
      sourceRawUnits:
      - raw-L002478
      - raw-L002480
- id: ipg-ann-3-5-0455973fdf0e
  anchor:
    type: block
    id: ipg-b000085
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-0455973fdf0e-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-0455973fdf0e-g01-b01
      type: paragraph
      text:
        en: If the deck and decklist are not the same, the player could potentially modify their deck
          on the fly. This can normally be caught through the process of deck checks, and decklists are
          there so that players can have a written record of what they intend to play. If it is inaccurate,
          there is little point in the decklist existing at all. A common way this error can occur is
          when a player fails to desideboard after a match, then presents a deck in a sideboarded configuration
          for game 1 of their next match. Also possible here is the case of a player scooping up cards
          at the end of a game and now having one or more of an opponents cards in their deck when presenting
          (or, alternatively, missing one or more cards from their deck).
        zh: 如果套牌与套牌登记表不符，牌手便有可能随时修改其套牌的内容。这通常会在套牌检查过程中被发现，这也就是我们要求牌手登记牌表的意义：记录下牌手用来参加比赛的套牌之书面记录。如果我们允许牌表上登记的内容不准确，那么牌表也就失去了其存在的意义。出现这类失误的通常情形之一是牌手在一局比赛后没有还原备牌，然后在下一局的第一盘游戏中呈视了含有备牌的套牌。另一种情形是牌手在游戏结束后收牌时夹带了对手的牌，然后呈视了含有对手牌张的套牌（或缺少牌张的套牌）。
      sourceRawUnits:
      - raw-L002492
      - raw-L002494
- id: ipg-ann-3-5-da4268cedfe0
  anchor:
    type: block
    id: ipg-b000090
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-da4268cedfe0-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-da4268cedfe0-g01-b01
      type: paragraph
      text:
        en: It is important that the sideboard is kept physically far enough away that it doesn’t become
          mixed with the player’s library. Cards in a deckbox that could conceivably be used in the deck
          can be suspicious, and provide an opportunity for the player to cheat by being added to the
          deck in between games. We want to remove this opportunity and so cards in the deckbox are considered
          to be part of the sideboard unless explicitly called out as an exception. It can be a good idea
          for a supplementary announcement involving cards in deckboxes to be issued so that we can curb
          this behavior.
        zh: 将备牌与主牌显著区分开是非常重要的。同时，在牌盒里面的可用牌是很可疑的，这给了牌手作弊的机会，他们可以在两盘中间方便的把这些牌换进套牌里。我们想要杜绝这种可能性，所以除非明确声明为例外情况，这些牌也会视为是备牌的一部份。做主审宣告的时候可以强调一下盒内不要放无关的牌，可以减少这种事情的发生。
      sourceRawUnits:
      - raw-L002516
      - raw-L002522
    - id: ipg-ann-3-5-da4268cedfe0-g01-b02
      type: paragraph
      text:
        en: Players that present their sideboard by removing it from their deck box and identifying it
          to the opponent at the start of the match should not receive this penalty, even if there are
          other cards remaining in the deck box that don’t fit one of the above exceptions. Players should
          be encouraged to get into this habit.
        zh: 如果牌手在游戏开始时将自己的备牌拿出牌盒，并告知对手这是备牌，那么即使他牌盒里还有其他不符合以上例外的牌也不应受到判罚。应该鼓励牌手养成这样的习惯。
      sourceRawUnits:
      - raw-L002518
      - raw-L002524
    - id: ipg-ann-3-5-da4268cedfe0-g01-b03
      type: paragraph
      text:
        en: Promotional cards that were given out at an event have an exception because otherwise, we
          would be giving players a Game Loss during every deck check at a Regional Championship.  This
          exception also applies to other tournaments at that same Regional Championship such as if the
          RC promo is in the deckbox during a RC $10K.  Double Faced cards have an exception because…where
          else are you supposed to keep them if you are using substitute cards? Those DFCs need to be
          in different sleeves to lower the risk that they be accidentally or intentionally shuffled into
          the deck itself, causing more than 4 of the card to be present.
        zh: 比赛中发放的纪念牌属于例外之一，否则我们将会在区域冠军赛中每一次查套牌都判罚一个一盘负。这一例外同样适用于同一区域冠军赛期间的其他比赛，例如在参加RC 10K赛时，牌盒中放有RC的赠卡。双面牌属于例外之一是因为......如果你用了辅助牌的话，那么双面牌本身还能放在什么地方呢？这些双面牌应当套上不同的牌套，这样可以降低将其不小心或故意洗进套牌的风险，导致套牌中有某张牌超过4张。
      sourceRawUnits:
      - raw-L002520
      - raw-L002526
- id: ipg-ann-3-5-cb5004f8809d
  anchor:
    type: block
    id: ipg-b000091
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-cb5004f8809d-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-cb5004f8809d-g01-b01
      type: paragraph
      text:
        en: If your card is in my deck, and it’s obvious from the back of the sleeve that it doesn’t belong
          in the deck, then I don’t get a penalty. Also, tokens aren’t cards, so they don’t count anyway.
          Don’t forget to make sure they still have a 60 card deck after you remove the offenders; that
          part is still illegal. Additionally meld cards count as double-faced cards here.
        zh: 如果你的牌混进了我的套牌，并且从牌套的背面就能明显看出这不是我套牌里的牌，那么我不会获得判罚。此外，衍生物不是牌，所以它们也不算数。请不要忘记在移除这些导致问题的牌之后，确认牌手仍有60张的套牌；如果这部分不符合规则，仍然是非法的套牌。此外，融合牌在此处也算作双面牌。
      sourceRawUnits:
      - raw-L002532
      - raw-L002534
- id: ipg-ann-3-5-1e9330481a49
  anchor:
    type: block
    id: ipg-b000092
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-1e9330481a49-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-1e9330481a49-g01-b01
      type: paragraph
      text:
        en: If a player has lost one or more cards in their deck, and has no quick way to replace them
          (if it’s a mythic that the venue is sold out of, for instance, or they don’t wish to buy replacements),
          then the infraction is Decklist Problem, rather than Deck Problem since they can no longer play
          a deck that matches the list as intended. In fact, this particular case is example D. in Decklist
          problem – “A player loses some cards and is unable to find replacement copies, making her unable
          to play a deck that matches her decklist.”
        zh: 如果牌手丢失了套牌中的一张或几张牌，并且没有迅速的方法来替代这些牌（例如这是赛场中脱销的一张秘稀牌，或者牌手不愿意购买替代品），那么违规就是套牌登记表问题而不是套牌问题，因为牌手无法使用符合其原本登记表的套牌进行比赛。事实上这就是套牌登记表问题中所述的范例D：“牌手丢失了一些牌并无法找到替代品，导致其无法用符合套牌登记表的套牌继续比赛。”
      sourceRawUnits:
      - raw-L002540
      - raw-L002546
    - id: ipg-ann-3-5-1e9330481a49-g01-b02
      type: paragraph
      text:
        en: If sideboard cards are wrong or inaccurate, a penalty may be merited due to the potential
          for advantage. Conversely, losing sideboard cards cannot provide an advantage – in fact, it
          is a disadvantage – so we do not need to add insult to injury by applying a penalty as well.
          Players can’t spend unreasonable amounts of time searching for replacement sideboard cards,
          but “found” sideboard cards after this measure has been implemented may be added back into the
          deck.
        zh: 如果备牌与牌表上填写的不符，那么因为这会带来潜在的获利可能性，所以我们应该给予判罚。相反的，备牌丢失并不能带来优势，事实上带来的是劣势。所以我们不必给他们雪上加霜的处罚。牌手不能花费不合理的时间去搜寻自己备牌的替代品，但是在如上处理之后找回自己的备牌时是可以考虑让他把这些牌加回去的。
      sourceRawUnits:
      - raw-L002542
      - raw-L002548
    - id: ipg-ann-3-5-1e9330481a49-g01-b03
      type: paragraph
      text:
        en: Note that often times in limited events, players trade, throw away, or file in with the rest
          of their collections all cards from their pool that are not in their main deck. This behavior
          should not be penalized but rather handled by the above instructions.
        zh: 需要注意的是，在限制赛中，牌手经常把自己牌池中不在主牌的牌拿去跟人交易、扔掉或者塞到自己的牌本牌盒里。这种行为并不需要被处罚，而应该用上面所述的方式来处理。
      sourceRawUnits:
      - raw-L002544
      - raw-L002550
- id: ipg-ann-3-5-f782f5c45f6f
  anchor:
    type: block
    id: ipg-b000093
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-f782f5c45f6f-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-f782f5c45f6f-g01-b01
      type: paragraph
      text:
        en: This is really simply just defining what infraction the action of finding a card that violates
          your companion’s restriction belongs in.
        zh: 这其实很简单，只是在界定“发现一张违反行侣限制条件的牌”这一行为应归为哪类违规。
      sourceRawUnits:
      - raw-L002556
      - raw-L002558
- id: ipg-ann-3-5-a53dd9368ee0
  anchor:
    type: block
    id: ipg-b000096
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-a53dd9368ee0-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-a53dd9368ee0-g01-b01
      type: paragraph
      text:
        en: For the first example, we have a deck that is not legal, though the decklist itself IS legal.
          Therefore, the error is with the deck, not the decklist, and we deal with it here. Example B
          is a case where the card just got scooped up during the previous round, but still has resulted
          in the deck being different than that which is intended. Example C is a failure to de-sideboard
          error, which results in the deck not matching that configuration which is intended for game
          1.
        zh: 第一个例子中，虽然套牌登记表是合法的，但套牌不合法。因此，问题来自于套牌，应该在此违规下进行处理。例子B中，牌手上一轮收牌时拿走了不属于他的牌，这导致了他的套牌与其应有的内容不符。例子C则是没有还原备牌的错误，导致套牌不符合它在第一盘游戏中应有的内容。
      sourceRawUnits:
      - raw-L002574
      - raw-L002578
    - id: ipg-ann-3-5-a53dd9368ee0-g01-b02
      type: paragraph
      text:
        en: One thing to call out in the first example.  While counterfeit cards are not cards for the
          purpose of allowing them in the tournament, they are considered cards for the purpose of a Deck
          Problem infraction. If counterfeit cards are discovered during play or a deck check, perform
          the necessary investigation for cheating. If it determined to be unintentional, the player needs
          to replace the cards with real copies or replace them with basic lands. Replacing with basic
          lands will result in changing the decklist – which would earn the player a Decklist Error penalty.
          Philosophically the Deck Problem error is about mathematical or strategic advantages in differences
          from card composition.
        zh: 关于第一个例子，有一点值得特别指出。虽然在“允许在比赛中使用”这一层面上，伪造牌并不被认可为牌，但在判定套牌问题违规时，它们被视为牌张。如果在对局或套牌检查中发现了伪造牌，必须进行必要的作弊调查。如果判定为非故意，牌手需要用真牌替换这些牌，或者将它们替换为基本地。如果替换为基本地，将导致牌表发生变更——这会让牌手受到套牌登记表问题的判罚。从法理上讲，套牌问题这一错误的核心在于卡牌构成的差异所带来的数学或策略上的优势。
      sourceRawUnits:
      - raw-L002576
      - raw-L002580
- id: ipg-ann-3-5-9c4d390740bb
  anchor:
    type: block
    id: ipg-b000097
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-9c4d390740bb-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-9c4d390740bb-g01-b01
      type: paragraph
      text:
        en: If a player does not call attention to a deck error they notice right away, they may reasonably
          be considered to be trying to gain an advantage from it. A player that waits to call a judge
          until the point that the error would become public (from a “reveal your hand” type of effect
          or something similar) has not called attention to it when they first noticed the issue.
        zh: 如果牌手在发现套牌错误时不马上叫裁判，我们可以有理由认为他试图从中获得优势。如果牌手等到错误即将被公开（因某些“展示你的手牌”或类似的效应）时再叫裁判来，说明牌手没有在意识到问题时第一时间呼叫裁判。
      sourceRawUnits:
      - raw-L002588
      - raw-L002590
- id: ipg-ann-3-5-12426d108459
  anchor:
    type: block
    id: ipg-b000098
    segmentId: ipg-b000098-rs-d373f0154c02
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-12426d108459-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-12426d108459-g01-b01
      type: paragraph
      text:
        en: Since these two errors are both common (ish) and, as stated, difficult to take advantage of
          without being very obviously cheating, the penalty of a warning should be enough to educate
          the players to not repeat the infraction. Alongside the fix of removing the errant cards, this
          should combine to be enough of a deterrent.
        zh: 正因为这两类失误非常常见，并且如上所述，难以从中获利，除非牌手在刻意作弊。警告对于牌手应当足够起到教育作用，使其不要再犯。此外再加之以移除错误牌张的修正手段，应该对牌手构成足够的威慑。
      sourceRawUnits:
      - raw-L002596
      - raw-L002598
- id: ipg-ann-3-5-6628f524668d
  anchor:
    type: block
    id: ipg-b000098
    segmentId: ipg-b000098-rs-3c7d1ce2f881
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-5-6628f524668d-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-6628f524668d-g01-b01
      type: paragraph
      text:
        en: It’s much simpler to abuse a case where the library has additional copies of a card from the
          sideboard in game 1 of a match. It’s also much harder to catch, and, as a result, needs to have
          a harsher penalty associated with it to dissuade the potential for abuse.
        zh: 如果这张牌在备牌和主牌中都有，那么在对局的第一盘中滥用这种违规就会更加简单。这种情况也更加难以发现，为了对这种滥用的可能起到威慑作用，应当对其适用更严厉的判罚。
      sourceRawUnits:
      - raw-L002604
      - raw-L002606
- id: ipg-ann-3-5-9526d45af10a
  anchor:
    type: block
    id: ipg-b000099
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-9526d45af10a-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-9526d45af10a-g01-b01
      type: paragraph
      text:
        en: This section refers to the window in the first upgrade path discussed below. The window for
          the upgrade needs to exist as a harsher discouragement against cheating. If the error is discovered
          by your opponent, during the presentation of your deck, you’re still getting that Game Loss
          penalty.
        zh: 这一段提及的是下面说到的第一种升级情形中的时间范围。为了更有效地吓阻作弊，必须存在升级的时间范围。如果是对手在你呈现套牌时发现了套牌错误，你仍然会得到一盘负判罚。
      sourceRawUnits:
      - raw-L002612
      - raw-L002614
- id: ipg-ann-3-5-d5b939c63fd7
  anchor:
    type: block
    id: ipg-b000100
    segmentId: ipg-b000100-rs-c6a303d9aa66
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-d5b939c63fd7-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-d5b939c63fd7-g01-b01
      type: paragraph
      text:
        en: Once the deck has been determined to be in an incorrect configuration, we want to return it
          to the intended configuration as simply as possible. To start fixing things, find all the cards
          that are present in the game that shouldn’t be there, and all the cards that are missing from
          the game, and reveal these to the opponent.
        zh: 一旦确定套牌的状态有误，我们要尽可能简单地将其恢复到预期的状态（译注：即牌表所登记的合法状态）。作为修正的开始，找出所有处于游戏中但不该存在的牌，以及所有本该在游戏中却缺失的牌，并将这些牌向对手展示。
      sourceRawUnits:
      - raw-L002622
      - raw-L002626
    - id: ipg-ann-3-5-d5b939c63fd7-g01-b02
      type: paragraph
      text:
        en: For example, assume that a player registered a deck with two Snapcaster Mage, one Crucible
          of Worlds, and with four Rest in Peace in the sideboard. In their last match, they took out
          the two Snapcaster Mages and the Crucible, while bringing in the four Rest in Peace. They played
          61/14 for that game, which was legal. Now, however, they forgot to desideboard before their
          next match started. They Scryed a Rest in Peace to the bottom at one point, later drew a Rest
          in Peace. Then, they realized the error. The judge should determine that there is one Rest in
          Peace erroneously in the hand, three erroneously in the library, two missing Snapcaster Mages,
          and one missing Crucible.
        zh: 例如，假设某牌手登记的套牌包含两张迅咒法师和一张世间锤炼，备牌中有四张得享安息。在上一场对局中，他换出了两张迅咒法师和那张世间锤炼，同时换入了四张得享安息。他在那局游戏中主牌为61张，备牌为14张，这是合法的。然而现在，在下一场对局开始前，他忘记将套牌还原。在游戏过程中，他曾占卜将一张得享安息放到了牌库底，随后又抓到了另一张得享安息。这时，他意识到了错误。裁判应当判定：有一张得享安息错误地位于手牌中，三张错误地位于牌库中；同时缺失了两张迅咒法师和一张世间锤炼。
      sourceRawUnits:
      - raw-L002624
      - raw-L002628
- id: ipg-ann-3-5-5687077a9e7e
  anchor:
    type: block
    id: ipg-b000100
    segmentId: ipg-b000100-rs-294d65776da4
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-5-5687077a9e7e-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-5687077a9e7e-g01-b01
      type: paragraph
      text:
        en: This rule is to minimize the potential advantage of discovering a problem during the resolution
          of a spell or ability where fixing it at the point of discovery could severely impact the result.  For
          example, if resolving a Indomitable Creativity a player gets down to the last two cards of their
          deck before realizing their three combo pieces are missing, the opponent might be upset if we
          add those 3 cards mid resolution.  However, they do get the choice.  This also means that if
          a player cracks a fetch, and while searching their library they realize their only basic swamp
          is missing, the opponent will get to choose to fix the deck problem mid search, or after the
          search has completed.
        zh: 这条规则旨在最大限度地减少在咒语或异能结算过程中发现问题所可能带来的潜在优势，因为在发现问题的时间点立即进行修正可能会严重影响结果。例如，如果在结算无畏创新时，牌手翻到了牌库最后两张牌才意识到他们的三个组合技组件缺失了，如果我们在这时候半路把那3张牌加进去，对手可能会感到不满。然而，对手拥有选择权。这也意味着，如果一名牌手起动找地地，并在搜寻牌库时意识到他唯一的基本地沼泽不见了，对手可以选择是在搜寻中途修正这个套牌问题，还是在搜寻完成之后再修正。
      sourceRawUnits:
      - raw-L002634
      - raw-L002642
    - id: ipg-ann-3-5-5687077a9e7e-g01-b02
      type: paragraph
      text:
        en: The opponent chooses whether to fix the problem now or when the player would get next priority.
          Once they have made that determination, we apply the fix at the chosen time. This means the
          opponent does not get to know what the fix will be and what the cards involved are before making
          the decision on when the fix is applied.  As with all choices by the opponent, this decision
          needs to be made quickly as with Deck Problems, we are already giving a non-trivial time extension.
        zh: 对手选择是现在修正问题，还是在下一次有牌手即将获得优先权时修正。一旦他们做出了决定，我们就在选定的时间点执行修正。这意味着对手在决定何时修正之前，无法知晓具体的修正方案以及具体涉及哪些牌。与所有由对手做出的选择一样，这个决定需要迅速做出，因为对于套牌问题，我们已经给予了非同小可的时间延长。
      sourceRawUnits:
      - raw-L002636
      - raw-L002644
    - id: ipg-ann-3-5-5687077a9e7e-g01-b03
      type: paragraph
      text:
        en: Now, reveal all of these incorrect cards to the opponent. For each card that is there incorrectly,
          the opponent chooses which missing card will replace it, starting with cards not in the library.
          Make sure any parts of the library that are in a known order stay that way.
        zh: 现在，向对手展示所有这些不正确的牌。从不在牌库中的牌开始，对于每一张错误存在的牌，由对手选择用哪张缺失的牌来替换它。确保牌库中已知顺序的部分保持原样。
      sourceRawUnits:
      - raw-L002638
      - raw-L002646
    - id: ipg-ann-3-5-5687077a9e7e-g01-b04
      type: paragraph
      text:
        en: For instance, continuing the example from above, reveal the 7 incorrect cards to the opponent.
          First, replace the Rest in Peace in hand with either a Snapcaster Mage or a Crucible- whichever
          the opponent decides. Then, replace the three Rest in Peace copies in the library with the remaining
          two cards. Note that they can choose to replace either the copies in the random portion of the
          library, or the known card on the bottom of the library.
        zh: 例如，延续上文的例子，向对手展示那7张不正确的牌。首先，将手中的那张得享安息替换为迅咒法师或世间锤炼——具体换成哪个由对手决定。然后，将牌库中的三张得享安息替换为剩余的两张缺失牌。注意，对手可以选择是替换牌库随机部分中的牌，还是替换牌库底已知的那张牌。
      sourceRawUnits:
      - raw-L002640
      - raw-L002648
- id: ipg-ann-3-5-ac845950a482
  anchor:
    type: block
    id: ipg-b000100
    segmentId: ipg-b000100-rs-92411ff38f03
  position: after
  order: 30
  groups:
  - id: ipg-ann-3-5-ac845950a482-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-ac845950a482-g01-b01
      type: paragraph
      text:
        en: If the player was playing a 61st card from the sideboard but hadn’t taken anything out, that
          will be replaced by a random card from the library. Most commonly, this will be accomplished
          by simply drawing a card now.
        zh: 如果牌手在未换备出任何牌的情况下使用了来自备牌的第61张牌，该牌将被替换为牌库中的一张随机牌。通常，这可以通过现在直接抓一张牌来完成。
      sourceRawUnits:
      - raw-L002654
      - raw-L002656
- id: ipg-ann-3-5-71656a0267ef
  anchor:
    type: block
    id: ipg-b000100
    segmentId: ipg-b000100-rs-14fa29490781
  position: after
  order: 40
  groups:
  - id: ipg-ann-3-5-71656a0267ef-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-71656a0267ef-g01-b01
      type: paragraph
      text:
        en: This case can occur when a player is looking through their deckbox (say to grab a token or
          something) and notices a card present with the sideboard that should be in the deck. If the
          deck is determined to be incorrect (specifically if there is 59 or fewer cards, or the deck
          is otherwise somehow illegal, not that a player intended to sideboard a card in and missed their
          opportunity to do so), we can restore the deck to a legal configuration by randomly adding a
          card back in from the sideboard. Note- this fix should only return main deck cards into the
          deck.
        zh: 这种情况可能发生在牌手翻看牌盒（比如为了拿衍生物之类的东西）时，发现一张本该在套牌中的牌混在了备牌里。如果套牌被判定为不正确（具体是指只有59张或更少，或者套牌在其他方面不合法；注意，这不包括牌手原本打算换入备牌却错过了时机的情况），我们可以从备牌中随机加入一张牌，将套牌恢复至合法的构筑状态。注意——此修正只应将原本属于主牌的牌张放回套牌中。
      sourceRawUnits:
      - raw-L002662
      - raw-L002664
- id: ipg-ann-3-5-b6d0af1464c6
  anchor:
    type: block
    id: ipg-b000101
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-b6d0af1464c6-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-b6d0af1464c6-g01-b01
      type: paragraph
      text:
        en: 'Note: the process for this as originally described in Toby’s blog post is no longer current
          and the text below has been changed below to reflect current policy. (https://blogs.magicjudges.org/telliott/2020/04/20/policy-update-for-ikoria-lair-of-behemoths/).'
        zh: 注意：Toby的[博客文章](https://blogs.magicjudges.org/telliott/2020/04/20/policy-update-for-ikoria-lair-of-behemoths/)中最初描述的此流程已不再适用，下文内容已根据现行方针进行了修改。
      sourceRawUnits:
      - raw-L002670
      - raw-L002680
    - id: ipg-ann-3-5-b6d0af1464c6-g01-b02
      type: paragraph
      text:
        en: '“Here’s what happens when someone discovers that they’ve violated the restriction announced
          by their companion at the start of the game:'
        zh: “当发现某人违反了其在游戏开始时宣布的行侣限制条件时，处理流程如下：
      sourceRawUnits:
      - raw-L002672
      - raw-L002682
  - id: ipg-ann-3-5-b6d0af1464c6-g02
    kind: ordered-list
    blocks:
    - id: ipg-ann-3-5-b6d0af1464c6-g02-b01
      type: list-item
      text:
        en: The judge goes through the rest of the cards you’re currently playing and finds any that violate
          the restriction.
        zh: 裁判检查你当前对局正在使用的其余牌张，找出所有违反该限制条件的牌。
      sourceRawUnits:
      - raw-L002674
      - raw-L002684
      marker: '1'
    - id: ipg-ann-3-5-b6d0af1464c6-g02-b02
      type: list-item
      text:
        en: The judge goes through the sideboard and finds the cards that do not violate the restriction.
          All cards that could fix the deck problems are set aside. If the judge can’t find sufficient
          cards in the sideboard to fix the problem, it upgrades to a Game Loss.
        zh: 裁判检查备牌，找出所有不违反该限制条件的牌。将所有能够修正此套牌问题的牌挑出来放在一旁。如果裁判无法在备牌中找到足量的牌来修正此问题，则判罚升级为一盘负。
      sourceRawUnits:
      - raw-L002676
      - raw-L002686
      marker: '2'
    - id: ipg-ann-3-5-b6d0af1464c6-g02-b03
      type: list-item
      text:
        en: The opponent looks at the set aside cards and decides which replaces each illegal card. Swaps
          are made, the library is shuffled, unchosen cards are returned to the sideboard and the game
          carries on.”
        zh: 对手检视这些被挑出来的牌，并决定用哪一张去替换每一张不合法的牌。执行替换，洗牌库，未被选中的牌放回备牌，然后游戏继续进行。”
      sourceRawUnits:
      - raw-L002678
      - raw-L002688
      marker: '3'
- id: ipg-ann-3-5-5ccf87693e12
  anchor:
    type: block
    id: ipg-b000102
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-5ccf87693e12-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-5ccf87693e12-g01-b01
      type: paragraph
      text:
        en: If the missing or extra card was from another player’s deck, both of the players have decks
          that don’t match what they intended to play, and so both of them get a warning.
        zh: 如果遗失的或额外的牌是来自于另一位牌手的套牌，这两位牌手的套牌便不符合他们应当使用的套牌内容，因此他们都应获得一个警告。
      sourceRawUnits:
      - raw-L002694
      - raw-L002696
- id: ipg-ann-3-5-623655772feb
  anchor:
    type: block
    id: ipg-b000103
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-623655772feb-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-623655772feb-g01-b01
      type: paragraph
      text:
        en: This upgrade path exists to discourage cheating. The process of presenting your deck to an
          opponent is a statement that “this deck is legal and ready for you to shuffle.” If the opponent
          discovers the deck has less cards than is registered on the deck list,  while shuffling or counting,
          the penalty is upgraded to a Game Loss. Similarly, if this is discovered by a judge during a
          deck check, the penalty is upgraded.  This does not apply if there are the correct number of
          cards.  That’s why the wording here is “fewer cards than registered”, the judge will have the
          decklist, however the opponent will probably only be able to count the cards and see that its
          less than 60 (or 40, or 100).
        zh: 设立此项判罚升级是为了遏制作弊。向对手呈现套牌的这一过程，相当于声明“本套牌合法且已准备好供你洗牌”。如果对手在洗牌或数牌时发现套牌张数少于牌表上登记的数量，判罚将升级为一盘负。同样地，如果是裁判在套牌检查中发现了这一点，判罚也会升级。如果牌张数量是正确的，则不适用此升级。这就是为什么这里的措辞是“少于登记数量”；裁判手头会有牌表，而对手通常只能通过数牌发现套牌少于60张（或40张、100张）。
      sourceRawUnits:
      - raw-L002702
      - raw-L002704
- id: ipg-ann-3-5-0710c4ae0246
  anchor:
    type: block
    id: ipg-b000104
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-0710c4ae0246-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-0710c4ae0246-g01-b01
      type: paragraph
      text:
        en: This sentence is previous to the other, only this is for post sideboard games. It requires
          slightly different wording as players do not have to sideboard in cards one for one.
        zh: 这句话排在另一句之前，但这是针对备牌局的游戏的。它需要稍微不同的措辞，因为牌手在换备时并不强制要求一换一。
      sourceRawUnits:
      - raw-L002710
      - raw-L002712
- id: ipg-ann-3-5-0cd2ab2cc008
  anchor:
    type: block
    id: ipg-b000105
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-0cd2ab2cc008-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-0cd2ab2cc008-g01-b01
      type: paragraph
      text:
        en: This upgrade path, again, is to discourage cheating. Calling attention to the error only after
          an opponent has made decisions based on the incorrect card is very suspicious and abusable,
          so the penalty is a Game Loss to ensure the practice is heavily disincentivized. Of course,
          investigation needs to occur in these cases to ensure there isn’t actually cheating, but the
          route for abuse here still warrants a Game Loss penalty.
        zh: 同样地，设立此项判罚升级是为了遏制作弊。只有在对手基于那张错误的牌做出了决定之后才指出错误，这种行为非常可疑且容易被滥用，因此判罚被定为一盘负，以确保能严厉遏制这种做法。当然，在这些案例中需要进行调查，以确保实际上没有作弊，但鉴于此处存在被滥用的途径，判处一盘负依然是正当的。
      sourceRawUnits:
      - raw-L002718
      - raw-L002720
- id: ipg-ann-3-5-8e5d1c7d0b6a
  anchor:
    type: block
    id: ipg-b000106
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-5-8e5d1c7d0b6a-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-5-8e5d1c7d0b6a-g01-b01
      type: paragraph
      text:
        en: The upgrade applies here because there is no way to know if an advantage has already been
          gained. Typically, you aren’t going to realize you have three copies of Shock until you have
          already seen/drawn/cast the previous two. This policy is currently lacking wording that prevents
          situations where all copies (between main and sideboard) are in the player’s opening hand.  It
          is the opinion of the AIPG authors that this is an oversight, as ‘all copies in the opening
          hand’ is just as fixable as ‘all copies still in the random portion of the library.’
        zh: 这种情况需要升级，是因为无法得知牌手是否已经获利。通常来说，你不会意识到你牌库中有三张电震，除非你已经看见（或抓到、施放过）之前的两张。目前的方针缺乏相关措辞来豁免所有那种牌（包含主牌和备牌中的）都出现在牌手起手中的情况。AIPG的作者们认为这是一个疏忽，因为“所有同种牌都在起手中”的情况，与“所有同种牌仍位于牌库随机部分中”的情况一样，都是可以修正的。
      sourceRawUnits:
      - raw-L002726
      - raw-L002728
- id: ipg-ann-3-6-1b5139829449
  anchor:
    type: block
    id: ipg-b000107
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-6-1b5139829449-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-6-1b5139829449-g01-b01
      type: paragraph
      text:
        en: A technical error in this situation means any error that is involved with the drafting process.
          When this infraction is given out, the scenario is normally, but not always, a timed draft.
          This means that we have some serious time constraints to complete the draft within. Technical
          errors like this cause delays, and at something like a Pro Tour draft, will cause the entire
          room to be held up.
        zh: 技术性的失误指的是任何在轮抽过程中出现的错误。这个违规通常是（但并不是所有都）在计时的轮抽比赛中，这意味着我们对于完成那场轮抽有着严格的时间限制。这样的技术性失误会造成整个轮抽进程被拖慢，或者类似的情形在专业赛的第二天，这将让整个比赛中的所有人的时间被耽误。
      sourceRawUnits:
      - raw-L002740
      - raw-L002742
- id: ipg-ann-3-6-1b66d53ef231
  anchor:
    type: block
    id: ipg-b000108
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-6-1b66d53ef231-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-6-1b66d53ef231-g01-b01
      type: paragraph
      text:
        en: If a player does this, it can have a cascade effect on the rest of the draft — either it is
          caught immediately by a player either side of the offending player, or the booster is picked
          up and used to make picks, further complicating the problem.
        zh: 如果有牌手这么做了，这将会像连锁反应一样影响整个轮抽：有可能这个错误立刻被其他牌手发现，或者被另一位牌手拿起来看到正面甚至从中抽选一张，使问题更加复杂化。
      sourceRawUnits:
      - raw-L002750
      - raw-L002752
- id: ipg-ann-3-6-8aa7cd5dba33
  anchor:
    type: block
    id: ipg-b000109
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-6-8aa7cd5dba33-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-6-8aa7cd5dba33-g01-b01
      type: paragraph
      text:
        en: A timed draft is timed so that the draft can be carried out in an efficient and timely manner,
          in addition to the added benefits of coordinating multiple drafts at once. If a player exceeds
          the time limit, that player is again causing a delay to the draft, which is not a thing that
          should go unnoticed.
        zh: 计时的轮抽的目的在于缩短时长，使轮抽变得高效，还可以同时协调多个轮抽。如果牌手超过了限时，那么他就拖慢了轮抽的进程，这不是一个可以忽略不计的事情。
      sourceRawUnits:
      - raw-L002758
      - raw-L002760
- id: ipg-ann-3-6-1e2a55e67741
  anchor:
    type: block
    id: ipg-b000110
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-6-1e2a55e67741-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-6-1e2a55e67741-g01-b01
      type: paragraph
      text:
        en: This is a large concern, as when a player does this, it can look to other players, spectators,
          and judges as though the player has taken more than one card from the booster pack. This has
          one of two resolutions — the player is “allowed” to take these two cards, or the time of Tournament
          Officials is taken up by a “non-issue”. Either of these are bad for the tournament integrity
          — they can increase the chance of mixing cards from the pack with cards that are already selected.
          Players are instructed in timed drafts to select a card at a specific point — not doing this
          at that point can fall under issue b) above.
        zh: 这是一个大问题。如果有牌手这么干了，在其他牌手、旁观者和裁判看来，这位牌手可能从这一包中拿了一张以上的牌。这种情况有两种处理方式：“允许”那位牌手保留那两张牌，或者裁判们的时间被“不是问题的问题”占用。这两种方式都会危害比赛的公正性，因为这会增加把补充包里的牌和抽选过的牌混到一起的几率。在计时的轮抽赛中，牌手应该在指定的时间点之前选择牌，没有照做的牌手将归于上面所述的例子B。
      sourceRawUnits:
      - raw-L002766
      - raw-L002768
- id: ipg-ann-3-6-e4c8474decc0
  anchor:
    type: block
    id: ipg-b000111
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-6-e4c8474decc0-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-6-e4c8474decc0-g01-b01
      type: paragraph
      text:
        en: This example gives judges some leeway to use LPV when they see a player making movements with
          their head. Use common sense here and be sure to consider Cheating if you believe the player
          is doing this to obtain hidden information.
        zh: 这个例子给了裁判一些余地，使得裁判可以在看到牌手的脑袋有所动作时适用这条违规。使用常识进行判断，如果你相信牌手如此做是为了获取隐藏信息，请务必考虑是否属于作弊。
      sourceRawUnits:
      - raw-L002774
      - raw-L002776
- id: ipg-ann-3-6-37b32868b852
  anchor:
    type: block
    id: ipg-b000112
    segmentId: ipg-b000112-rs-f5de9d70b98f
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-6-37b32868b852-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-6-37b32868b852-g01-b01
      type: paragraph
      text:
        en: During a draft there are many parts that need to be kept moving in order to have a smooth
          transition into swiss rounds. Problems can have a ripple effect and get larger if not detected
          and corrected right away. Such errors can add up among dozens sometimes even thousands of players
          in a short time. It is vital that players pay attention to, and follow instructions during these
          critical parts of the event.
        zh: 在轮抽中，有许多步骤需要在瑞士轮开始之前完成，只有保证这些步骤有序进行才能保证后续比赛的顺利展开。这期间出现的问题如果得不到及时妥当的处理将会对后面的比赛产生连锁性的影响。在几十人甚至几千人的比赛中，这种问题可能同时出现很多。在比赛的这些关键部分中，牌手能够注意并遵循指令是非常重要的。
      sourceRawUnits:
      - raw-L002784
      - raw-L002786
- id: ipg-ann-3-6-15e6d34f75fd
  anchor:
    type: block
    id: ipg-b000112
    segmentId: ipg-b000112-rs-3d2b9759a113
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-6-15e6d34f75fd-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-6-15e6d34f75fd-g01-b01
      type: paragraph
      text:
        en: Format-specific notices may change the way that this penalty is applied – for example, there
          may be supplementary announcements and reminders about removing tokens and basic land cards.
          For draft formats involving Innistrad and Dark Ascension drafts, the Head Judge may wish to
          announce a specific way to handle double-faced cards with regards to this infraction. It allows
          some additional instruction or leeway – based on the decision of the Head Judge – to be given.
          This sentence basically gives the judge the power required to make a draft occur in a specific
          way if needed.
        zh: 与赛制有关的通知可能会影响这个判罚的适用范围。比如一个补充公告提醒牌手们在轮抽的时候把衍生物与基本地从包里拿出来。对于包含依尼翠或者黑影笼罩系列的轮抽赛中，主审可能决定宣布用一个特殊的方式来处理双面牌。根据主审的决定，可能会产生一些额外的指令或者可以宽松处理的空间。IPG中的这句话实际上赋予了裁判在必要的情况下更改比赛中轮抽规则的权利。
      sourceRawUnits:
      - raw-L002792
      - raw-L002794
- id: ipg-ann-3-7-8d616248d80d
  anchor:
    type: block
    id: ipg-b000113
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-7-8d616248d80d-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-7-8d616248d80d-g01-b01
      type: paragraph
      text:
        en: It is important to remember that this infraction only covers violations of the Communication
          Policy in the Magic Tournament Rules (section 4) and only if the judge believes that the opponent
          has made decisions based upon the incorrect information.
        zh: 很重要的是，记住这个违规只涵盖对于《万智牌比赛规则》中的交流方针（MTR第四章）的违反，且仅当裁判认为对手基于错误信息做出了决定的情况下才能适用。
      sourceRawUnits:
      - raw-L002806
      - raw-L002808
- id: ipg-ann-3-7-20317a744b66
  anchor:
    type: block
    id: ipg-b000116
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-7-20317a744b66-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-7-20317a744b66-g01-b01
      type: paragraph
      text:
        en: In each of these examples, a player takes an action or fails to take an action in a way that
          is impacted by illegal communication. In the first example, the opponent makes a choice regarding
          the discard spell assuming that the player has three cards in their hand, while they actually
          have four. In the second, the player has violated section 4.7 of the MTR by keeping a creature
          with their lands, and the opponent assumes that the player has no blockers. In the third case,
          the player violates MTR 4.2 by assuming that the opponent chose not to search. In each case,
          it isn’t the illegal information that causes the infraction, but rather the opponent acting
          on the illegal information. If a player keeps their Llanowar Elf with their lands, but the opponent
          doesn’t make an attack assuming that the player has no blockers, then no infraction has occurred.
          However, judges should step in to clarify the board state before an infraction occurs.
        zh: 在这些例子中，由于不合法的交流产生的影响，牌手因此要么做出了一些游戏动作，要么是未能做出一些游戏动作。在第一个例子中，对手认为牌手手中有三张牌而做出了施放弃牌咒语的动作，但他手中实际有四张牌，在第二个例子中，牌手违反了MTR4.7节，将生物与地牌放在一起，使得对手以为他没有生物可用来阻挡。在第三个例子中，牌手默认对手选择不找地，这违反了MTR4.2节。在每个每个例子中，并非是不合法的信息导致了违规，而是因为对手根据不合法的信息而做出了动作。如果牌手将罗堰妖精和地放在一起，但对手并没有因为他没有阻挡者而攻击，那么就没有违规发生。但是，裁判应当介入，在违规发生之前就厘清场面状态。
      sourceRawUnits:
      - raw-L002824
      - raw-L002826
- id: ipg-ann-3-7-d9c62c5e90ed
  anchor:
    type: block
    id: ipg-b000117
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-7-d9c62c5e90ed-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-7-d9c62c5e90ed-g01-b01
      type: paragraph
      text:
        en: We all agree that playing magic face to face is quite different from playing Magic Online
          on a computer. Clear communication should help players express their thoughts and ensure that
          the game can be played. We want players to talk to each other. We want them to communicate.
          But players are human, and they will make mistakes. For these violations, the player should
          be given a Warning. We don’t want a more severe penalty, because we don’t want players scared
          to communicate with each other for fear of getting a penalty.
        zh: 我们都知道面对面的玩万智牌跟你在电脑上玩Magic Online是有很大不同的。清楚明白的交流可以帮助牌手们准确表达他们想要做的游戏动作，让游戏顺利进行。我们希望牌手间能够用语言进行交流。但是大家都是人，都会犯错误。对于此类违反，应该给予警告的处罚。我们不想给出更严厉的处罚，因为我们不想牌手因为怕吃到判罚而惧于跟对手交流。
      sourceRawUnits:
      - raw-L002834
      - raw-L002836
- id: ipg-ann-3-7-70dab3c4a227
  anchor:
    type: block
    id: ipg-b000118
    segmentId: ipg-b000118-rs-75459b35cd66
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-7-70dab3c4a227-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-7-70dab3c4a227-g01-b01
      type: paragraph
      text:
        en: This can occur in many different ways. As another example, a player might control Dusk Charger,
          but not have represented that they have the city’s blessing. If the opponent acts on the belief
          that the player does not have the city’s blessing and assumes that the Dusk Charger is only
          a 3/3, a CPV has occurred.
        zh: 这种情形会以很多方式发生。举另外一个例子，一个牌手操控暮影战马，但却没有表示其拥有黄金城祝福。如果对手因为相信他没有黄金城祝福、暮影战马仍然是3/3而采取行动，此时就发生了CPV。
      sourceRawUnits:
      - raw-L002842
      - raw-L002844
- id: ipg-ann-3-7-35171ce87622
  anchor:
    type: block
    id: ipg-b000118
    segmentId: ipg-b000118-rs-afe4c5a18a6c
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-7-35171ce87622-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-7-35171ce87622-g01-b01
      type: paragraph
      text:
        en: As above, in the example where Llanowar Elves was with the player’s lands, no CPV occurs until
          the opponent acts on the bad information. Judges should encourage clear board states even before
          an infraction occurs.
        zh: 在上面罗堰妖精和地混在一起的示例中，在对手因为错误信息做出动作前，没有CPV发生。即使还没有违规发生，裁判也应当鼓励牌手保持清晰的游戏状态。
      sourceRawUnits:
      - raw-L002850
      - raw-L002852
- id: ipg-ann-3-7-17c20d6b9a62
  anchor:
    type: block
    id: ipg-b000119
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-7-17c20d6b9a62-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-7-17c20d6b9a62-g01-b01
      type: paragraph
      text:
        en: Just misunderstanding a shortcut isn’t a CPV. Since the default shortcuts described in MTR
          4.2 are well-defined, those definitions can be applied in ambiguous situations.
        zh: 仅仅是错误理解某种简化本身并不是CPV。由于MTR4.2中描述的默认简化定义的很好，这些定义也可以在不明确的情况下适用。
      sourceRawUnits:
      - raw-L002858
      - raw-L002860
- id: ipg-ann-3-7-60602d07adb5
  anchor:
    type: block
    id: ipg-b000120
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-7-60602d07adb5-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-7-60602d07adb5-g01-b01
      type: paragraph
      text:
        en: Sometimes a violation of the communication policy doesn’t matter. Sometimes it does. Typically
          a judge, will only get calls “when it matters,” and will need to consider if a backup is appropriate.
          If when asked what the power/toughness of a creature is, the player responds “2/3,” the opponent
          might feel safe attacking with a 3/3. If during declare blockers it’s discovered to be a 3/4
          then different choices could have been made. This wasn’t a play mistake or a strategic error,
          and if a judge is being called, it is clear that a player took actions based upon that incorrect
          information. In this instance a backup to before attackers have been declared, as outlined in
          section IPG 1.4 Backing Up, should be considered.
        zh: 有些违反交流方针的行为并不会有影响，但是也有另一些会有影响。通常来说，裁判只会在交流问题会影响局面的时候才会被叫过去。这时裁判需要考虑倒回是否合适。如果问一位牌手某个生物是几几的，回答说“2/3”，对手可能就放心的拿3/3人宣攻了。但是如果在宣告阻挡者时才发现这个生物其实是3/4的，那么对手可能原本就会做出不同的选择。这不属于犯包或者策略失误，如果此时叫来裁判，很清楚就能知道一位牌手根据错误的信息做出了动作。在这种情况下可以考虑根据IPG的1.4的内容，将游戏倒回到宣告攻击者之前。
      sourceRawUnits:
      - raw-L002868
      - raw-L002872
    - id: ipg-ann-3-7-60602d07adb5-g01-b02
      type: paragraph
      text:
        en: Any backup should only go to when the opponent acted on the incorrect information, and not
          before then. Any backup should only go to when the opponent acted on the incorrect information,
          and not before then. If a Llanowar Elves were with a player’s lands since turn 1, but the opponent
          only attacked into them on turn 10, the backup isn’t to turn 1.
        zh: 任何倒回都只能倒回到对手根据错误信息做出动作的时间点，且不能比此时间点更早。如果一个罗堰妖精在第一回合开始就跟牌手的地混在一起，但对手在第十回合才宣告攻击，倒回不能直接倒到第一回合。
      sourceRawUnits:
      - raw-L002870
      - raw-L002874
- id: ipg-ann-3-8-9e09327d450b
  anchor:
    type: block
    id: ipg-b000121
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-8-9e09327d450b-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-9e09327d450b-g01-b01
      type: paragraph
      text:
        en: A card should be identifiable only from its front face. Being able to identify what a card
          is, or what card type it is, from anything other than its front face is an issue. This applies
          to physical markings, such as scratches, dings, and scuffs, as well as to physical orientation
          – for example, if all of a player’s lands are turned upside down in their deck. If a single
          card can be identified side-on (i.e. while mash shuffling), this is also a problem that needs
          to be fixed by replacing the card, or sleeve, depending on the issue. Please note, this infraction
          only addresses issues with potential abuse. If we feel there is actual abuse, then we are now
          considering Cheating.
        zh: 一张牌应该只能通过看牌面来确认它是什么。如果能从正面以外的地方判断出它是哪张牌，或者牌是什么类别都是不能允许的。这主要涵盖物理磨损的情况，包括抓痕，折痕以及磨损等，也包括牌的方向——例如，牌手套牌中所有地牌的牌套都是倒着放的。如果一张牌在插洗的时候能从侧面认出来，也是不行的，需要将那张牌或者牌套替换掉。请注意，这个违规的判罚是针对于其滥用的可能性。如果你感觉牌手已经在滥用这点来获利，那么我们应当考虑作弊。
      sourceRawUnits:
      - raw-L002886
      - raw-L002890
    - id: ipg-ann-3-8-9e09327d450b-g01-b02
      type: paragraph
      text:
        en: We only issue this infraction if the marked cards are in a player’s deck, not the sideboard.
          If the cards in the sideboard have different markings or the sleeves appear newer we should
          only issue this infraction after sideboarding the marked cards into the deck. If the sideboard
          cards are noticed during a deck check the player should be made aware of this and suggested
          to use the main deck sleeves when sideboarding.
        zh: 只有当有记号的牌在牌手套牌，而非备牌中时，才判处这个违规。如果备牌中的牌有记号、或牌套看起来更新，我们应当在这些有标记的牌被换进套牌之后才能判处这个违规。如果在套牌检查时发现这种问题，我们应当提醒牌手，建议他在换备时使用主牌的牌套。
      sourceRawUnits:
      - raw-L002888
      - raw-L002892
- id: ipg-ann-3-8-60b9c2363049
  anchor:
    type: block
    id: ipg-b000122
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-8-60b9c2363049-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-60b9c2363049-g01-b01
      type: paragraph
      text:
        en: There is not a great argument for a land, a creature, and an instant being a pattern of marked
          cards. However, cards that are individually marked in this fashion are still an issue. If the
          player notices these markings, that player can make an assumption that “this card in my 60 card
          deck is a mountain, a Loxodon Hierarch, or a Lightning Helix,” giving the player undue knowledge
          about what that card might be.
        zh: 一张地，一个生物和一个瞬间，这个情形似乎并不是刻意做了记号的牌。然而，这样的单张有记号的牌仍旧是个问题。如果牌手意识到了这个标记，那么他看到这个记号的时候就知道这张牌可能是山脉/象族大主教/闪电螺旋，这给了牌手本不应知道的牌库信息。
      sourceRawUnits:
      - raw-L002900
      - raw-L002902
- id: ipg-ann-3-8-f02274527ee4
  anchor:
    type: block
    id: ipg-b000123
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-8-f02274527ee4-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-f02274527ee4-g01-b01
      type: paragraph
      text:
        en: Foils have a tendency to bend inwards. It is possible, and with bad handling, for these cards
          to be warped in such a way that they are noticeable. Again, knowing which foils the player has
          in their deck, that player can make a more accurate assumption about what the bent card is.
          It should be noted that not all foils are marked, and not all bent cards are foils. Let’s be
          very clear here, the fact that your deck contains foils in a specific pattern (all lands, for
          example) does not mean the deck is marked; the markings arise from the bends (if they exist).
        zh: 闪卡经常会出现弯曲。如果不妥善保管，这种弯曲可能会严重到在牌库中也能看出来的程度。牌手知道自己套牌中哪张牌是闪的，他就获知了额外的牌库信息。但是需要注意并不是所有闪卡都是弯的，也并非所有弯卡都是闪的。举例的来说，就算你套牌中特定部分都用的闪牌（比如全部都用闪地）也不一定意味着你套牌是带记号的，造成记号的原因是牌弯。
      sourceRawUnits:
      - raw-L002908
      - raw-L002910
- id: ipg-ann-3-8-a8ef17ba64fd
  anchor:
    type: block
    id: ipg-b000124
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-8-a8ef17ba64fd-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-a8ef17ba64fd-g01-b01
      type: paragraph
      text:
        en: Having noticeably lighter backs makes these cards marked. Because it is all the basic lands
          this fits the upgrade path outlined in the additional remedy, since substantial advantage can
          be gained knowing if the top card of the library is a land just by seeing the different back.
        zh: 一些牌的牌背颜色显著地较淡会使这些牌成为有标记的。由于它们都是基本地，这就符合了进一步的修正一节中所说的升级条件，因为从牌背就能看出来牌库顶的牌是不是地，该牌手便会因此可观地获利。
      sourceRawUnits:
      - raw-L002916
      - raw-L002918
- id: ipg-ann-3-8-88dd801c38e0
  anchor:
    type: block
    id: ipg-b000125
    segmentId: ipg-b000125-rs-87abe8dea9e4
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-8-88dd801c38e0-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-88dd801c38e0-g01-b01
      type: paragraph
      text:
        en: Tournaments are long, with many larger tournaments involving over 8 hours of actual Magic
          gameplay. Playing Magic — especially shuffling cards — over an 8 hour period will cause sleeve
          splits, and it will cause dings, dents, and scuffs. As long as these markings do not make a
          card identifiable, it is simple enough just to point out this error, give the penalty and get
          the player to replace the sleeves. Be careful, though — if you stare long enough, you can probably
          find markings on all but the newest sleeves. This does not mean they are marked.
        zh: 比赛的时间很长，很多大比赛你实际在玩牌的时间都会超过8小时。玩牌（尤其是洗牌）8个小时经常会造成牌套的损坏，或者在牌套上产生痕迹。只要那个印记并不会使得一张牌是可辨识的，那么只要指出这个问题，给出判罚，让牌手更换牌套就行了。需要注意的是，如果长时间的观察一套牌，你可能会在新换的牌套以外的所有牌套上都能看出痕迹，但是这并不意味着这些牌是带记号的。
      sourceRawUnits:
      - raw-L002926
      - raw-L002928
- id: ipg-ann-3-8-ba5ed5df9b91
  anchor:
    type: block
    id: ipg-b000125
    segmentId: ipg-b000125-rs-5e5e2750c8a8
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-8-ba5ed5df9b91-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-ba5ed5df9b91-g01-b01
      type: paragraph
      text:
        en: It’s always important to explain why players are getting a particular penalty, but with Marked
          Cards, you need to explain how to prevent further occurrences. Typically the players won’t know
          anything is wrong until you tell them.
        zh: 向牌手说明他为什么会得到这个判罚是非常重要的，但是在有记号的牌判罚中，你同样需要告诉牌手如何防止继续吃到这个判罚。一般来说你不说的话牌手是不知道问题所在的。
      sourceRawUnits:
      - raw-L002934
      - raw-L002938
    - id: ipg-ann-3-8-ba5ed5df9b91-g01-b02
      type: paragraph
      text:
        en: There are some additional steps the players should take when sleeving up their deck. For example,
          players should shuffle their sleeves as well as their decks prior to sleeving, in case some
          sleeves are slightly shorter than others (this can happen with sleeves from different packs,
          even if they’re sold as identical). If the player shuffles the sleeves first, there may be marked
          cards, necessitating changes, but it is unlikely to be serious. If the player does not shuffle
          the sleeves first, it could be that the deck is in one size of sleeves and the sideboard in
          a different size — a much bigger problem (see below).
        zh: 牌手给套牌上牌套的时候应有一些额外的步骤。比如，牌手应该把他的牌套和套牌都洗一下，因为有的时候牌套的长度会有差异（这可能因为这些牌套出自不同的包里，即使这两包牌套是同一种）。如果牌手在上牌套之前就洗过套牌和牌套，那么这种有记号的牌可能不会被认为很严重。如果没洗过，可能最后你的备牌的牌套会跟主牌有区别，这就是个大问题了（见下文）。
      sourceRawUnits:
      - raw-L002936
      - raw-L002940
- id: ipg-ann-3-8-1142f15c4d26
  anchor:
    type: block
    id: ipg-b000126
    segmentId: ipg-b000126-rs-6c27d0fa82cb
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-8-1142f15c4d26-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-1142f15c4d26-g01-b01
      type: paragraph
      text:
        en: Let’s say a player’s whole deck is sleeved, but their sideboard is unsleeved.  Are those sideboard
          cards marked?  Of course not!  These two sentences here delineate the boundary between Marked
          Cards and cards that are marked, and that boundary is the deck.  Cards in the sideboard can
          be in any condition until they are put in the deck.  This means during a deck check, you may
          run across marked sleeves that make sideboard cards stand out, but if they aren’t in a deck,
          its legal.
        zh: 例如说，一个牌手的整个套牌都套了牌套，而备牌却没有套牌套。这些备牌是有记号的吗？当然不是！这两句话是用来划清“有记号的牌”和“牌上有记号”之间的界限，而这个界限便是套牌。在备牌中的牌可以是任何状况，直到这些牌被换入了套牌。这意味着在套牌检查中你可能会看到备牌上有标记的牌套，但只要这些牌不是套牌的一部分，便是合法的。
      sourceRawUnits:
      - raw-L002946
      - raw-L002948
- id: ipg-ann-3-8-6a8c42bbc1e8
  anchor:
    type: block
    id: ipg-b000126
    segmentId: ipg-b000126-rs-c70c25a1383c
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-8-6a8c42bbc1e8-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-6a8c42bbc1e8-g01-b01
      type: paragraph
      text:
        en: 'During a deck check, if you find some sideboard cards that are marked, please notify the
          player they will need to swap sleeves with their main deck cards.  Do not silently wait to see
          if they put those cards into the deck and then jump in with a penalty.  Tell them beforehand.  The
          exception to this is: Investigating.  If you are investigating cheats, you may opt to not tell
          them so that you can gather more information for your investigation.'
        zh: 在套牌检查时，如果你看到一些备牌上有记号，请提醒牌手他应当在换备牌时，也将主牌中的牌套一并换上。不要默不作声地等待直到牌手把有记号的牌换进套牌，然后跳出来给他判罚。请事先告诉他们。有一个例外是：调查。如果你在调查作弊，可能不告诉他们更好，这样你可以为调查收集更多的信息。
      sourceRawUnits:
      - raw-L002954
      - raw-L002956
- id: ipg-ann-3-8-e39f1ce451ce
  anchor:
    type: block
    id: ipg-b000127
    segmentId: ipg-b000127-rs-04e587dec5c8
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-8-e39f1ce451ce-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-e39f1ce451ce-g01-b01
      type: paragraph
      text:
        en: In the event that a player’s cards or sleeves are marked, they need to become unmarked. There
          are often traders at larger tournaments such as a Regional Championships, an smaller RCQs and
          other Competitive REL events are often held in a store, where sleeves may be purchased cheaply
          and quickly. If we are only talking about a few cards, most packs of sleeves come with a few
          extra, or perhaps the player can swap marked sleeves with unmarked sleeves from the sideboard.
          This is especially important in events where a player has not sleeved their decks — with the
          frequency that a deck of Magic cards must be shuffled, unsleeved cards get marked quickly.
        zh: 当发现牌手使用带记号的牌或牌套时，需要想办法把这些记号去掉。在诸如区域冠军赛这样的大型比赛赛场里通常有售牌的摊位，而较小的RCQ等其他竞争级比赛一般都是在牌店内举行，这些地方都能很方便、便宜地买到牌套。如果只有少量牌有问题，一般来说给一套牌上完牌套都会剩下几张牌套，或者牌手可以把主牌中有记号的牌套跟备牌的没记号牌套换一下。特别对于没有用牌套的牌手而言套上牌套是很重要的——比赛中的洗牌很快会让没有牌套的套牌带上记号。
      sourceRawUnits:
      - raw-L002964
      - raw-L002966
- id: ipg-ann-3-8-863924dac399
  anchor:
    type: block
    id: ipg-b000127
    segmentId: ipg-b000127-rs-9e8904f62cbc
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-8-863924dac399-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-863924dac399-g01-b01
      type: paragraph
      text:
        en: If someone trips over and spills water over a player’s deck, we don’t want it to be the end
          of that player’s tournament because they can’t play with their cards. Cards damaged or marked
          in the tournament — as well as misprinted limited product — can have proxies issued at the Head
          Judge’s discretion, as outlined in MTR 3.4.
        zh: 如果路人摔了一跤然后把水洒在了牌手的牌上，我们不希望因为这张牌无法继续使用而影响到牌手后面的比赛。在比赛中因某些原因而出现记号或损坏的牌（包括印刷有问题的限制赛产品）可以由主审做出代牌来替代。（MTR
          3.4）
      sourceRawUnits:
      - raw-L002972
      - raw-L002974
- id: ipg-ann-3-8-c7de3d00cd9f
  anchor:
    type: block
    id: ipg-b000128
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-8-c7de3d00cd9f-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-c7de3d00cd9f-g01-b01
      type: paragraph
      text:
        en: If a player can no longer play with certain cards due to them being illegal (for example,
          the player’s four foil Huntmaster of the Fells were bowed, and can’t be used, so the player
          now has a 56-card deck), the player may replace those cards with other copies of the same card,
          or with any combination of cards named Plains, Island, Swamp, Mountain or Forest. If the player
          opts to find replacement cards, please ask them to hurry, and give them 10 minutes before assessing
          a Tardiness Penalty. If the player adds any of the named basic land cards instead, the decklist
          should be changed to reflect what the player is actually now playing. We issue the player with
          a Game Loss because of the changed decklist which means they also won’t receive a Decklist Problem
          penalty if they receive a deck check later. If the player ends up finding replacements for any
          reason, we can reverse this change, this time without any penalty.
        zh: 如果牌手套牌中的有些牌不能在接下来的比赛中使用了（比如有四张闪堕者猎师弯了，把它们剔出去之后套牌变成了56张。），那位牌手可以使用同名牌来替代他们，或者拿任意组合且名称为平原、海岛、沼泽、山脉、或树林的牌来替代。如果他们决定去找替代品，请要求他们尽快并给他们10分钟，超过时限则有可能得到迟到的判罚。如果那位牌手决定加入几张以上名字的基本地，那么他的套牌登记表也应该被相应的修改。由于修改了牌表，我们判罚牌手一盘负，这也意味着他们如果稍后在比赛中遇到套牌抽查的话不会受到套牌登记表问题的处罚。如果不论什么原因，牌手最终找到了替代品，我们可以将变更复原，并且这一次不再给予任何判罚。
      sourceRawUnits:
      - raw-L002980
      - raw-L002982
- id: ipg-ann-3-8-6d6198463d9e
  anchor:
    type: block
    id: ipg-b000129
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-8-6d6198463d9e-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-8-6d6198463d9e-g01-b01
      type: paragraph
      text:
        en: 'A marking of cards that is a distinguishable pattern is normally more of a problem than the
          odd scuffed corner. For example, in a case where a player’s sleeves are not opaque, double-faced
          cards such as Huntmaster of the Fells can be seen through the back of them. Because all of the
          player’s Huntmasters of the Fells are marked in this way, it is possible to utilize the upgrade
          path on this. Other examples include: 11 cards have markings in the corner and 10 of them are
          land; all reanimation targets in a deck are slightly bent; in a post sideboard deck, sideboard
          cards are noticeably less scuffed.'
        zh: 一个有规律的记号牌通常情况下要比普通的牌套磨损要严重的多。比如，一位牌手的牌套并不是完全不透明的，看背面便可以识别出牌套里的堕者猎师。因为他所有的堕者猎师都可以这样被分辨出来，所以可以考虑将罚则升级。其他的例子包括：11个翘边的牌套里有10张是地；一套牌里所有的掘坟目标都轻微的弯曲了；在套牌中所有备牌的牌套都显得更新一些。
      sourceRawUnits:
      - raw-L002988
      - raw-L002992
    - id: ipg-ann-3-8-6d6198463d9e-g01-b02
      type: paragraph
      text:
        en: Now lets talk a bit about “substantial advantage” vs “advantage”.  If there is a pattern of
          markings, and the pattern is noticed, there is the potential for advantage.  If I know that
          one Island, one Counterspell, and one Ragavan, Nimble Pilferer, you could argue that its an
          advantage to know if one of those three cards are on top of your deck as opposed to the other
          49 other cards in your deck, but its not a substantial advantage.  We can extend this logic
          to the “pattern of one”.  You can argue “one is a pattern”, and “one isn’t a pattern”, but that
          distinction is mostly irrelevant.  The important distinction is if being able to identify that
          one card over all other cards in the deck is a substantial advantage or just an advantage.  For
          example, it is difficult to argue that having a single marked Forest in a deck is a significant
          advantage.  However if the marked card is the lone Maze’s End in a deck based on gates, then
          that would be a substantial advantage, and the upgrade applies.  Policy is written so that the
          Head Judge is able to use a lot of judgement in this upgrade.  However, we caution you from
          overthinking the issue.  Much like you can stare at a deck long enough and start to see marked
          cards, you can stare at a single card and start to concoct scenarios where it is *substantial*
          to know where that single copy of forest is in your library.
        zh: 现在我们来谈谈“实质性优势”与“优势”的区别。如果存在标记规律，且该规律被察觉，就存在获利的可能。如果我知道有一张海岛、一张反击咒语和一张巧手窃猴勒格文有记号，你可以认为：相比于套牌中其他49张牌，能知道这三张牌中的某一张位于牌库顶确实是一种优势，但这并不构成实质性优势。我们可以将这一逻辑延伸至“单张牌构成的规律”。你可以争辩“一张也算规律”或者“一张不算规律”，但这种区分大体上是无关紧要的。重要的区别在于：能够从套牌的所有其他牌中识别出这一张牌，到底会带来实质性优势，还仅仅只是某种优势。例如，你很难主张套牌中有一张有记号的树林会带来重大优势。然而，如果这张被标记的牌是门套牌中唯一的那张迷宫终点，那么这就构成了实质性优势，判罚升级适用。违规处理方针之所以这样撰写，是为了让主审在处理此类升级时拥有较大的裁量权。不过，我们也要提醒你不要对这个问题过度解读。就像你盯着一套牌看久了总能看出些记号来一样，你也完全可能盯着单单一张牌，然后脑补出各种极端场景，让你觉得知晓那张树林在牌库中的位置也是一种实质性优势。
      sourceRawUnits:
      - raw-L002990
      - raw-L002994
- id: ipg-ann-3-9-85aa8cf23a80
  anchor:
    type: block
    id: ipg-b000130
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-9-85aa8cf23a80-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-9-85aa8cf23a80-g01-b01
      type: paragraph
      text:
        en: When players shuffle their decks, the purpose is to lose track of individual cards in the
          deck and put the deck into an unknown order. If you believe it is possible for a player to know
          the rough position of a card or cards within a deck (i.e. the player knows which quarter a particular
          card is in, or hasn’t shuffled enough to break up a spell, spell, land order) then the deck
          is not shuffled enough. The exact number of shuffles needed isn’t something we can accurately
          specify, as it can change based on the number of cards to randomize, but if you feel a deck
          might not have been shuffled thoroughly enough then it probably fits this infraction. Once a
          player has shuffled their deck for any reason, that player is responsible for presenting the
          deck to the opponent for further randomization. Failure to do so falls under this infraction.
        zh: 牌手洗自己的套牌是为了让套牌排列成随机顺序，使得其中牌的分布变为未知。如果裁判相信牌手可以知道其套牌中某些牌的大致位置（比如牌手知道某一张牌在套牌的哪一段里，或者没有充分洗牌，套牌中仍是“咒语-咒语-地”的顺序），便可认为牌手未将此套牌充分洗牌。我们无法规定准确的洗牌次数，因为这个数字基于需要随机化的牌的数量，但是如果你觉得套牌没有被充分的洗过，那么此违规便可能适用于这个情况。一旦牌手因为任何原因洗牌，在洗牌完成后他便有责任呈现套牌，将套牌交由对手进行进一步随机化。未能如此做属于此违规的范畴。
      sourceRawUnits:
      - raw-L003006
      - raw-L003010
    - id: ipg-ann-3-9-85aa8cf23a80-g01-b02
      type: paragraph
      text:
        en: Generally this infraction occurs because the player is lazy, has bad shuffling habits, or
          their mind is just elsewhere while shuffling. However, if you believe the player intentionally
          did not shuffle thoroughly, consider Cheating.
        zh: 通常出现这种违规是因为牌手犯懒，或者洗牌习惯不好，亦或者他洗牌的时候走神儿了。不管怎样，如果你相信牌手是故意不充分洗牌，那么请考虑“举止违背运动道德～作弊”。
      sourceRawUnits:
      - raw-L003008
      - raw-L003012
- id: ipg-ann-3-9-cc01c2343ef0
  anchor:
    type: block
    id: ipg-b000133
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-9-cc01c2343ef0-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-9-cc01c2343ef0-g01-b01
      type: paragraph
      text:
        en: The first example is pretty simple, “Oops, I forgot to shuffle.” You would think things like
          this never happen, but with a lot going on in the game it’s possible. The second example is
          probably the more common one seen among inexperienced players, or players in a hurry — those
          who just give the library a quick one-two-cut. The third example is just an extension of the
          first, where someone doesn’t shuffle a portion of the deck, or a pile of cards that are required
          to be shuffled, either because they forget or because they don’t think they have to.
        zh: 第一个例子很简单，“诶？我忘了洗牌。”你可能认为这事儿是不可能发生的，但是如果游戏中发生了很多事情，这确实是有可能发生的。第二个例子更多的是出现在比赛经验不足的牌手身上，或者打牌很着急的牌手。第三个例子算是第一个例子的延伸，牌手忘了洗一部分的牌库，或者忘了洗一小堆牌，这一般是因为牌手忘了或者认为这不是必须的。
      sourceRawUnits:
      - raw-L003028
      - raw-L003030
- id: ipg-ann-3-9-4149350d8467
  anchor:
    type: block
    id: ipg-b000134
    segmentId: ipg-b000134-rs-893caf8dfac5
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-9-4149350d8467-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-9-4149350d8467-g01-b01
      type: paragraph
      text:
        en: This is a card game. It requires manipulation of cards. It is the player’s responsibility
          to be able to randomize those cards, and it is reasonable to expect this behavior from them.
        zh: 万智牌是卡牌游戏，需要操作卡牌。将自己的套牌随机化是牌手的责任，这是对牌手非常合理的要求。
      sourceRawUnits:
      - raw-L003038
      - raw-L003040
- id: ipg-ann-3-9-dc7231020edb
  anchor:
    type: block
    id: ipg-b000134
    segmentId: ipg-b000134-rs-32ea4ccaacc4
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-9-dc7231020edb-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-9-dc7231020edb-g01-b01
      type: paragraph
      text:
        en: It’s easy to try and take advantage of insufficient shuffling, from trying to manipulate the
          entire deck and its mana distribution, to just trying to manipulate one or two cards’ general
          position in the deck. The penalty used to be a Game Loss to reflect the potential for advantage.
          This meant that many new or lazy players would get Game Losses because they didn’t know any
          better/didn’t think shuffling was a big deal. However, now, the opponent is required to shuffle
          the library when the deck is presented. This virtually eliminates the potential for advantage.
          With that rule in place, we are comfortable with the standard penalty now being a Warning.
        zh: 试图不充分洗牌以获利是一件很容易的事情，比如操纵牌库里的法术力分布，或者把一两张牌放到牌库里的特定位置。因为获利的可能性很高，曾经这种判罚是一盘负。但是这就意味着很多新手或者犯懒的牌手将得到一盘负，只是因为他们不知道/不认为洗牌是一件很重要的事情。然而现在，每位牌手的对手需要在他洗完牌之后再洗一次牌。这样就消除了获利的可能性。在这条规则出现后，我们很高兴的看到这个违规的标准处罚变成了警告。
      sourceRawUnits:
      - raw-L003046
      - raw-L003048
- id: ipg-ann-3-9-f55315da5a1b
  anchor:
    type: block
    id: ipg-b000135
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-9-f55315da5a1b-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-9-f55315da5a1b-g01-b01
      type: paragraph
      text:
        en: The cards within the deck should not be revealed to anyone while it’s being randomized, otherwise
          it’s not random (even if the majority of the deck is). If you riffle shuffle ten times, then
          riffle shuffle one time face up to bend the cards the other way, it’s not shuffled anymore,
          and you have to start again. In Team games, shuffling away from yourself but towards your teammate
          is also bad.
        zh: 在随机化的过程中，套牌中的任何牌都不能被展示给任何人，否则这样就不算是已经随机化（即使套牌的大部分已经随机）。如果你进行十次鸽尾式洗牌（即通常洗扑克牌的方法），最后一次洗牌时为了让弯掉的牌弯回来而牌面朝上洗，那么就跟没洗一样，你必须重新开始洗牌。在团队赛中，洗牌时自己没看到却让队友看到了同样也是不行的。
      sourceRawUnits:
      - raw-L003054
      - raw-L003056
- id: ipg-ann-3-9-fe668369d0c8
  anchor:
    type: block
    id: ipg-b000136
    segmentId: ipg-b000136-rs-c0470cfc7b3a
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-9-fe668369d0c8-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-9-fe668369d0c8-g01-b01
      type: paragraph
      text:
        en: When shuffling, multiple types of shuffles should be used together to ensure randomization.
          Six to eight riffle or “mash” shuffles is sufficient to randomize a deck.  A pile shuffle is
          not shuffling. It is not part of shuffling. It doesn’t count. You can do it once per game in
          order to count your cards prior to presenting. If a player pile shuffles more than once, don’t
          give a penalty, and instead instruct the player on correct shuffling techniques.
        zh: 当洗牌时，应该使用多种方式洗你的牌库以保证随机化。六到八次的插洗或鸽尾式洗牌就足够使套牌随机化。分堆洗牌不是洗牌，它甚至不是洗牌的一部分，并不算数。你可以在游戏开始前、呈现套牌之前为了清点牌张数量，每盘游戏进行一次分堆洗牌。如果牌手分堆洗牌多于一次，不要给判罚，但应指导牌手使用正确的洗牌方式。
      sourceRawUnits:
      - raw-L003062
      - raw-L003064
- id: ipg-ann-3-9-f272ba0faf85
  anchor:
    type: block
    id: ipg-b000136
    segmentId: ipg-b000136-rs-963287c3248b
  position: after
  order: 20
  groups:
  - id: ipg-ann-3-9-f272ba0faf85-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-9-f272ba0faf85-g01-b01
      type: paragraph
      text:
        en: When a player sits down, their deck is in some order. It may be sorted alphabetically, or
          mana weaved or had cards placed in specific places in the deck. While it might raise some concern,
          all that is fine, so long as the deck is sufficiently randomized afterwards. This is because,
          so long as the deck is shuffled, any manipulation will be obliterated when the deck is randomized.
          This randomization is further ensured when the opponent also shuffles the deck. Manipulating
          a deck prior to sufficient shuffling is really done just for comfort. Manipulating a deck prior
          to insufficient shuffling is a Warning if done unintentionally, and USC—Cheating if done intentionally.
        zh: 当一位牌手就座时，他的套牌可能已经按某种顺序排好。可能是拼音顺序，或者已经经过“二一插”，或者将某些牌排在某些特定位置。这可能会让人担心有问题，但是只要这个套牌在之后的洗牌中被充分的随机化就没关系。这是因为，只要经过充分的洗牌，任何事先的操纵都会被充分随机化所破坏。对手的洗牌能够进一步保证这种随机化。因此，在充分洗牌之前排好顺序只能起到自我安慰的作用。排顺序之后不充分洗牌的情况，无意的是警告，故意的是“举止违背运动道德～作弊”。
      sourceRawUnits:
      - raw-L003070
      - raw-L003072
- id: ipg-ann-3-9-cab8f6400c4a
  anchor:
    type: block
    id: ipg-b000137
  position: after
  order: 10
  groups:
  - id: ipg-ann-3-9-cab8f6400c4a-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-3-9-cab8f6400c4a-g01-b01
      type: paragraph
      text:
        en: The remedy is simple — have them shuffle the cards. You should take some time to quickly explain
          what kinds of shuffling are necessary and why they’re necessary, as well as reminding the other
          player to shuffle their opponents deck as well. As a general practice, judges do not perform
          the shuffle, players do. This prevents the judges from getting involved if sleeves become broken
          during the shuffle, or if a card falls out. It also prevents the judge from getting blamed if
          the player draws poorly following the shuffle.
        zh: 补救措施很简单——洗牌就好了。你应该简略快速的解释一下哪种洗牌方式是必须的，为什么是必须的，同时提醒另一位牌手也要好好洗其对手的套牌。通常来讲，请让牌手洗牌，裁判不要执行洗牌。这样能够防止出现牌套破损或者牌掉出来时，会涉及到帮他洗过牌的裁判。同样这也可以防止牌手指责裁判“你帮我洗完之后我掏的就好烂。”。
      sourceRawUnits:
      - raw-L003080
      - raw-L003084
    - id: ipg-ann-3-9-cab8f6400c4a-g01-b02
      type: paragraph
      text:
        en: Keep in mind that some of the cards might be ordered within the deck, so their position should
          be maintained if they weren’t supposed to be included within the shuffle. When trying to fix
          the insufficient shuffling problem, it’s a good idea to take a look at both player’s graveyard
          as well as the permanents on the battlefield. Asking questions about the known cards in the
          library is also necessary. Try to take that into consideration whenever you’re dealing with
          shuffling.
        zh: 要注意的是，可能在牌库中某些牌的位置是已知的，所以在修正的时候需要将它们保持原位置。当你要修正不充分洗牌时，先看看两位牌手的坟墓场与场上的永久物是个非常好的习惯。询问牌手牌库中是否有已知部分同样是必要的。当你处理洗牌的时候，记得将这些因素考虑进去。
      sourceRawUnits:
      - raw-L003082
      - raw-L003086
