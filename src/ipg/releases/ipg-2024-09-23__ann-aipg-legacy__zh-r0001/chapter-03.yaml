- id: ipg-s3-7
  kind: infraction
  number: '3.7'
  title:
    en: Communication Policy Violation
    zh: 违反交流原则
  components:
  - id: ipg-c000043
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-g000047
      kind: paragraphs
      blocks:
      - id: ipg-b000113
        type: paragraph
        text:
          en: A player violates the Communication policies detailed in section 4 of the Magic Tournament
            Rules and the judge believes their opponent has taken an in-game action or clearly chosen
            not to act based on the erroneous information. This infraction only applies to violations
            of that policy and not to general communication confusion.
          zh: 牌手违反了于《万智牌比赛规则》之第4章详述的交流原则，同时裁判相信对手针对此错误信息进行了任何游戏中动作或明显的基于此错误信息而选择不做动作。此违规仅适用于违反了前述原则的情况，一般情况下的沟通不清并不适用此违规。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 21
