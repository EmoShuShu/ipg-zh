        - id: ipg-b000100-rs-92411ff38f03
          sourceRange:
          - 402
          - 631
          text:
            en: If more cards are being removed than added, prioritize ones not in the library first. If there
              are still additional cards not in the library that need replacing, they are replaced by cards from
              the random portion of the library.
            zh: 若需被移除的牌张多于需被加回的牌张，则优先替换不在牌库中的牌张。如果在此之后，仍有不在牌库中的牌张需被替换，则用牌库的随机部分中的牌张进行替换。
          legacyRawUnits:
          - raw-L002650
          - raw-L002652
        - id: ipg-b000100-rs-14fa29490781
          sourceRange:
          - 631
          - 797
          text:
            en: If the missing card(s) are with the sideboard and it isn’t the first game, choose the ones to
              be returned to the deck at random from main deck cards in the sideboard.
            zh: 若缺失的牌与备牌放在一起，且当前并非第一盘游戏，则从备牌中原本属于主牌的牌张中随机选择相应数量的牌张加回套牌。
          legacyRawUnits:
          - raw-L002658
          - raw-L002660
      - id: ipg-b000101
        type: paragraph
        text:
          en: If the error caused a violation of a companion restriction and it is a post-sideboard game
            (or a pre-sideboard game and the player has elected to continue with the deck they registered
            that does not match the revealed companion condition), locate all cards violating the restriction.
            Then, reveal all cards in the sideboard that meet the companion restriction. The opponent
            decides which of those cards replaces each illegal card. If making the deck match the companion
            condition is impossible, upgrade the penalty to a Game Loss.
          zh: 如果失误是因违反了行侣牌使用限制所导致的，且当前游戏为换备后对局（或者当前游戏为换备前对局，牌手已展示使用行侣，且选择继续用当前违反了该行侣牌使用限制的套牌进行游戏的情况），先找出套牌中所有违反该行侣牌使用限制的牌张。然后，展示备牌中所有符合该行侣牌使用限制的牌张。由对手在这些已展示的牌张中选择用哪些来对应替换不符合限制的牌张。如果无法将套牌调整至能满足该行侣牌的使用限制，则将处罚升级为一盘负。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 20
