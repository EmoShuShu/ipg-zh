          text:
            en: Truncated names of storyline characters on decklists (planeswalkers and other legendary permanents)
              are acceptable as long as they are the only representation of that character in the format and are
              treated as referring to that card, even if other cards begin with the same name.
            zh: 对于套牌登记表上故事角色的名字（鹏洛客及其他传奇永久物），只要在此赛制中含有该名称的合法卡片只有一张，便可允许使用该角色名字之缩写。这类简写被视为指代前述之合法卡片，而非其他具有相同开头名称的牌张。
          legacyRawUnits:
          - raw-L002392
          - raw-L002394
      - id: ipg-b000079
        type: paragraph
        text:
          en: The Head Judge may choose to not issue this penalty if they believe that what the player
            wrote on their decklist is obvious and unambiguous, even if not entirely accurate. In Limited
            tournaments, the Head Judge may choose not to issue this penalty for incorrectly marked basic
            land counts if they believe the correct land count is obvious. This should be determined solely
            by what is written on the decklist, and not based on intent or the actual contents of the
            deck; needing to check the deck for confirmation is a sign that the entry is not obvious.
          zh: 主审认为牌手所登记的信息明确且无歧义的情况下，就算牌手在套牌登记表上写下的名称并非牌张之准确全名，主审也可以选择不处罚牌手。在限制赛中，如果牌手错误地标记了基本地的数量，但属于主审认为可明显推知其正确地牌数量的情况下，主审也可以选择不处罚牌手。主审在进行此判断时应仅根据套牌登记表上书写的内容来进行，不得参考套牌的意图或实际组成来确定；倘若需要检查套牌来进行确认，便表明所登记的牌名不够明确。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 18
          bbox:
          - 90.0
          - 280.64
          - 557.52
          - 361.64
          extractionUnit: extract-p18-l014..extract-p18-l019
        legacyRawUnits:
        - raw-L002400
        - raw-L002402
      - id: ipg-b000080
        type: paragraph
        text:
          en: Companions affect what the player intended to play, and may produce a situation in which
            the deck and decklist match, but violate the restriction on the intended companion. In these
            situations, it is acceptable to alter the deck and sideboard configuration to meet the restriction.
          zh: 行侣牌会影响牌手的游戏计划，并且会出现一种情况，即套牌与套牌登记表相匹配，但违反了所使用行侣牌对套牌的限制。这种情况下，可以让牌手更改套牌构成以满足行侣牌的使用限制。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 18
          bbox:
          - 90.0
          - 375.44
          - 541.97
          - 415.04
          extractionUnit: extract-p18-l020..extract-p18-l022
        legacyRawUnits:
        - raw-L002416
        - raw-L002418
      - id: ipg-b000081
        type: paragraph
        text:
          en: In tournaments with open decklists, if the wrong decklist is provided to an opponent and
            it is discovered during the game, the opponent may have made strategic decisions throughout
            the game based on the error, and that cannot be fully assessed or offset.
          zh: 在使用公开牌表的比赛中，如果牌手为对手提供了错误的套牌登记表，并在比赛过程中发现，对手可能会在整个比赛中都基于该错误做出决策，而这一错误是无法完全估量和弥补的。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 18
          bbox:
          - 90.0
          - 428.84
          - 534.95
          - 468.44
          extractionUnit: extract-p18-l023..extract-p18-l025
        legacyRawUnits:
        - raw-L002424
        - raw-L002426
  - id: ipg-c000032
    role: additional-remedy
    labelCode: component.additional-remedy
    groups:
    - id: ipg-g000034
      kind: paragraphs
      blocks:
      - id: ipg-b000082
        type: paragraph
        text:
          en: If the decklist contains illegal cards, remove them. If the decklist is being adjusted to
            allow for an intended companion, the player exchanges cards between the deck and sideboard
            until the restriction is met.
          zh: '如果套牌登记表包含不合法的牌，则移除这些牌。


            如果需要调整套牌登记表以符合指定行侣牌的使用限制，则牌手需在主牌与备牌间调整直至符合行侣牌的使用限制。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 18
          bbox:
          - 90.0
          - 499.04
          - 543.76
          - 538.64
          extractionUnit: extract-p18-l027..extract-p18-l029
        legacyRawUnits:
        - raw-L002434
        - raw-L002436
        - raw-L002442
        - raw-L002444
        readingSegments:
        - id: ipg-b000082-rs-2e1c05fcf495
          sourceRange:
          - 0
          - 53
          text:
            en: If the decklist contains illegal cards, remove them.
            zh: 如果套牌登记表包含不合法的牌，则移除这些牌。
          legacyRawUnits:
          - raw-L002434
          - raw-L002436
        - id: ipg-b000082-rs-7abfa0e37ebc
          sourceRange:
          - 53
          - 210
          text:
            en: If the decklist is being adjusted to allow for an intended companion, the player exchanges cards
              between the deck and sideboard until the restriction is met.
            zh: 如果需要调整套牌登记表以符合指定行侣牌的使用限制，则牌手需在主牌与备牌间调整直至符合行侣牌的使用限制。
          legacyRawUnits:
          - raw-L002442
          - raw-L002444
      - id: ipg-b000083
        type: paragraph
        text:
          en: Alter the decklist to match the deck the player is actually playing. If the deck/sideboard
            and decklist both violate a maximum cards restriction (usually too many cards in a sideboard,
            more than four of a card, or the same card in two decks in a Unified Constructed format),
            remove cards as directed by the player to make the decklist legal.
          zh: '将登记表按照实际使用的套牌组成进行更改。


            如果套牌／备牌和套牌登记表同时违反最大张数限制（一般为备牌数量过多，同一张牌超过四张，或在使用“套牌联合构组规则”的赛制中于多于一副套牌内使用了同一张牌），则根据牌手的指示移除牌张，确保套牌登记表合法。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 18
          bbox:
          - 90.0
          - 554.24
          - 557.75
          - 607.64
          extractionUnit: extract-p18-l030..extract-p18-l033
        legacyRawUnits:
        - raw-L002450
        - raw-L002452
        - raw-L002458
        - raw-L002460
        readingSegments:
        - id: ipg-b000083-rs-07839f2e2d11
          sourceRange:
          - 0
          - 69
          text:
            en: Alter the decklist to match the deck the player is actually playing.
            zh: 将登记表按照实际使用的套牌组成进行更改。
