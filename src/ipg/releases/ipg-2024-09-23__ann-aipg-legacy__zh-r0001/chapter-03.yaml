        - raw-L002027
        - raw-L002037
        - raw-L002039
        readingSegments:
        - id: ipg-b000045-rs-8c5e3d8617f5
          sourceRange:
          - 0
          - 138
          text:
            en: Players are responsible for being on time and in the correct seat for their matches, and for completing
              registrations in a timely manner.
            zh: 牌手有责任准时抵达正确的对局桌，以及在规定的时间内完成登记。
          legacyRawUnits:
