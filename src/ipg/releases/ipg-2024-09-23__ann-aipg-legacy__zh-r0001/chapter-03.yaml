        type: paragraph
        text:
          en: A player not in their seat 10 minutes into the round will receive a Match Loss and will
            be dropped from the tournament unless they report to the Head Judge or Scorekeeper before
            the end of the round.
          zh: 升级：如果牌手在一局开始10分钟之后才入座，则将得到一局负的处罚；且除非他在该局结束之前向主审或记分员报到，否则将视为从比赛中弃权。
        officialPdfUnits:
