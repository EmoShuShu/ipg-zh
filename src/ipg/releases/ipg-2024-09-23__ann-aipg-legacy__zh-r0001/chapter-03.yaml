  - id: ipg-c000045
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-g000049
      kind: paragraphs
      blocks:
      - id: ipg-b000117
        type: paragraph
        text:
          en: Clear communication is essential when playing Magic. Though many offenses will be intentional,
            it is possible for a player to make a genuine mistake that causes confusion and these should
            not be penalized harshly.
          zh: 交流通畅是顺利进行万智牌游戏的关键要素。虽然这类违规多为蓄意，但仍有可能牌手犯下的是无心之失并使对手产生了迷惑；在这种状况下，便不该给予严厉的处罚。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 21
          bbox:
          - 90.0
          - 559.16
          - 550.13
          - 598.76
          extractionUnit: extract-p21-l027..extract-p21-l029
        legacyRawUnits:
        - raw-L002830
        - raw-L002832
      - id: ipg-b000118
        type: paragraph
        text:
          en: A player may commit this infraction in situations where they have not spoken. A physically
            ambiguous board state is not automatically a penalty, but judges are encouraged to tell players
            to fix ambiguous placements before they might become problematic.
          zh: '牌手可能在没有讲话的情况下犯下此违规。


            桌面上出现迷惑的局面并不会自动导致判罚，但是应鼓励裁判在可能出现问题之前，让牌手改正迷惑的局面。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 21
          bbox:
          - 90.0
          - 614.36
          - 554.52
          - 653.96
          extractionUnit: extract-p21-l030..extract-p21-l032
        legacyRawUnits:
        - raw-L002838
        - raw-L002840
        - raw-L002846
        - raw-L002848
        readingSegments:
        - id: ipg-b000118-rs-75459b35cd66
          sourceRange:
          - 0
          - 78
          text:
            en: A player may commit this infraction in situations where they have not spoken.
            zh: 牌手可能在没有讲话的情况下犯下此违规。
          legacyRawUnits:
          - raw-L002838
          - raw-L002840
        - id: ipg-b000118-rs-afe4c5a18a6c
          sourceRange:
          - 78
          - 252
          text:
            en: A physically ambiguous board state is not automatically a penalty, but judges are encouraged to
              tell players to fix ambiguous placements before they might become problematic.
            zh: 桌面上出现迷惑的局面并不会自动导致判罚，但是应鼓励裁判在可能出现问题之前，让牌手改正迷惑的局面。
          legacyRawUnits:
          - raw-L002846
          - raw-L002848
      - id: ipg-b000119
        type: paragraph
        text:
          en: Misapplication of a shortcut is usually not a Communication Policy Violation, as the default
            interpretation applies in ambiguous situations and the opponent is able to act on that shortcut.
            Any deviation from a tournament shortcut requires a clear explanation.
          zh: 错误的使用简化一般不是违反交流原则，因为默认的解释只适用于不明确的情况，而此时对手可以针对该简化做出动作。任何偏离比赛规定的简化都必须有清晰的解释。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 21
          bbox:
          - 90.0
          - 669.56
          - 538.2
          - 709.16
          extractionUnit: extract-p21-l033..extract-p21-l035
        legacyRawUnits:
        - raw-L002854
        - raw-L002856
  - id: ipg-c000046
    role: additional-remedy
    labelCode: component.additional-remedy
    groups:
    - id: ipg-g000050
      kind: paragraphs
      blocks:
      - id: ipg-b000120
        type: paragraph
        text:
          en: A backup may be considered to the point of the action, not the erroneous communication.
          zh: 可考虑倒回至执行动作的时点，而非产生错误交流的时点。
        officialPdfUnits:
