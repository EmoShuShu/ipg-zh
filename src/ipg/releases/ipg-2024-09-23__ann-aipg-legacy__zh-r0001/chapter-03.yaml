        - raw-L002668
      - id: ipg-b000102
        type: paragraph
        text:
          en: If the missing card(s) were in a previous or current opponent’s deck, issue penalties to
            both players.
          zh: 如果所遗失的牌是在之前或现在的对手套牌当中，则对双方牌手都予以处罚。
        officialPdfUnits:
