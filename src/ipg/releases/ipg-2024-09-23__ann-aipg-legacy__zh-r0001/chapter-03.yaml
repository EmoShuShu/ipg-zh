          - 252.8
          extractionUnit: extract-p22-l009..extract-p22-l010
        marker: A
        legacyRawUnits:
        - raw-L002896
        - raw-L002898
      - id: ipg-b000123
        type: list-item
        text:
          en: A player has several foil cards that stand out significantly from the rest of their deck.
          zh: 在一副套牌中，可以明显地辨别出部分闪卡。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 22
          bbox:
          - 108.0
          - 254.6
          - 533.09
          - 266.6
          extractionUnit: extract-p22-l011..extract-p22-l011
        marker: B
        legacyRawUnits:
        - raw-L002904
        - raw-L002906
      - id: ipg-b000124
        type: list-item
        text:
          en: The basic lands in a player’s unsleeved deck are from a set with notably lighter backs.
          zh: 在一副没有用牌套的套牌中，使用了牌背颜色略淡的基本地。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 22
          bbox:
          - 108.0
          - 268.4
          - 539.09
          - 280.4
          extractionUnit: extract-p22-l012..extract-p22-l012
        marker: C
        legacyRawUnits:
        - raw-L002912
        - raw-L002914
  - id: ipg-c000049
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-g000053
      kind: paragraphs
      blocks:
      - id: ipg-b000125
        type: paragraph
        text:
          en: Sleeves and cards often become worn over the course of a tournament, and, as long as the
            player is not attempting to take advantage of this, addressing the situation is sufficient
            in most cases. Note that almost all sleeves can be considered marked in some way; judges should
            keep this in mind when determining penalties. In cases of marked cards, educating players
            to shuffle their cards and sleeves before sleeving the cards is very important.
          zh: '牌套与牌在比赛过程中经常会持续磨损，并且，只要牌手并不准备藉此获得优势，通常来说只要提醒有此现象便已足够。请注意，几乎所有的牌套都可能在某种标准下被判定为有记号；裁判决定作出处罚时务须谨慎行事。


            遇到此类状况时，要教导牌手在上牌套之前务必要先将牌洗过。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 22
          bbox:
          - 90.0
          - 311.0
          - 553.36
          - 378.2
          extractionUnit: extract-p22-l014..extract-p22-l018
        legacyRawUnits:
        - raw-L002922
        - raw-L002924
        - raw-L002930
        - raw-L002932
        readingSegments:
        - id: ipg-b000125-rs-87abe8dea9e4
          sourceRange:
          - 0
          - 322
          text:
            en: Sleeves and cards often become worn over the course of a tournament, and, as long as the player
              is not attempting to take advantage of this, addressing the situation is sufficient in most cases.
              Note that almost all sleeves can be considered marked in some way; judges should keep this in mind
              when determining penalties.
            zh: 牌套与牌在比赛过程中经常会持续磨损，并且，只要牌手并不准备藉此获得优势，通常来说只要提醒有此现象便已足够。请注意，几乎所有的牌套都可能在某种标准下被判定为有记号；裁判决定作出处罚时务须谨慎行事。
          legacyRawUnits:
          - raw-L002922
          - raw-L002924
        - id: ipg-b000125-rs-5e5e2750c8a8
          sourceRange:
          - 322
          - 445
          text:
            en: In cases of marked cards, educating players to shuffle their cards and sleeves before sleeving
              the cards is very important.
            zh: 遇到此类状况时，要教导牌手在上牌套之前务必要先将牌洗过。
          legacyRawUnits:
          - raw-L002930
          - raw-L002932
      - id: ipg-b000126
        type: paragraph
        text:
          en: This infraction applies only to cards in a player’s deck. Differently-marked sleeves in
            the sideboard are not illegal unless they are put into the deck without being changed. Unless
            investigating, judges are encouraged to alert players about concerns with marked sideboard
            cards.
          zh: '此违规只适用于牌手套牌中的牌。牌手备牌中的牌，就算牌套上有相异的记号也不会算作不合法，但倘若牌手在此种情况下不更换牌套即将之换入套牌则不然。


            除了需进行调查的情况外，在此鼓励裁判提醒牌手注意自己备牌是否上存在记号。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 22
          bbox:
          - 90.0
          - 393.8
          - 527.76
          - 447.2
          extractionUnit: extract-p22-l019..extract-p22-l022
        legacyRawUnits:
        - raw-L002942
        - raw-L002944
        - raw-L002950
        - raw-L002952
        readingSegments:
        - id: ipg-b000126-rs-6c27d0fa82cb
          sourceRange:
          - 0
          - 175
          text:
            en: This infraction applies only to cards in a player’s deck. Differently-marked sleeves in the sideboard
              are not illegal unless they are put into the deck without being changed.
            zh: 此违规只适用于牌手套牌中的牌。牌手备牌中的牌，就算牌套上有相异的记号也不会算作不合法，但倘若牌手在此种情况下不更换牌套即将之换入套牌则不然。
          legacyRawUnits:
          - raw-L002942
          - raw-L002944
        - id: ipg-b000126-rs-c70c25a1383c
          sourceRange:
          - 175
          - 279
          text:
            en: Unless investigating, judges are encouraged to alert players about concerns with marked sideboard
              cards.
            zh: 除了需进行调查的情况外，在此鼓励裁判提醒牌手注意自己备牌是否上存在记号。
          legacyRawUnits:
          - raw-L002950
          - raw-L002952
  - id: ipg-c000050
    role: additional-remedy
    labelCode: component.additional-remedy
    groups:
    - id: ipg-g000054
      kind: paragraphs
      blocks:
      - id: ipg-b000127
        type: paragraph
        text:
          en: The player needs to replace the card(s) or sleeve(s) with an unmarked version or, if no
            sleeves are being used, use sleeves that conceal the markings. If the cards themselves have
            become marked through play in the tournament, the Head Judge may decide to issue a proxy.
          zh: '牌手必须将有记号的牌或是牌套换掉；若是并未利用牌套，则上牌套来盖掉记号。


            如果牌是在比赛中因游戏过程地磨损而有了记号，则主审可以决定给予代牌来使用。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 22
          bbox:
          - 90.0
          - 477.8
          - 541.43
          - 517.4
          extractionUnit: extract-p22-l024..extract-p22-l026
        legacyRawUnits:
        - raw-L002960
        - raw-L002962
        - raw-L002968
        - raw-L002970
        readingSegments:
        - id: ipg-b000127-rs-04e587dec5c8
          sourceRange:
          - 0
          - 151
          text:
            en: The player needs to replace the card(s) or sleeve(s) with an unmarked version or, if no sleeves
              are being used, use sleeves that conceal the markings.
