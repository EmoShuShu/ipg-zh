      blocks:
      - id: ipg-b000048
        type: paragraph
        text:
          en: A player who arrives at their seat before 1 minute has elapsed in the round receives a Warning.
          zh: 降级：如果牌手在一局比赛开始后1分钟内到达座位则得到警告。
