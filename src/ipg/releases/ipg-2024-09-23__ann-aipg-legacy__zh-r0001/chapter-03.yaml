          - 117
          text:
            en: Locate any cards missing from the deck and any incorrect cards in any game zone. Reveal those
              cards to the opponent.
            zh: 找到套牌中缺失的相应牌张，以及在各个游戏区域中的所有错误牌张。向对手展示这些牌。
          legacyRawUnits:
