    groups:
    - id: ipg-g000035
      kind: paragraphs
      blocks:
      - id: ipg-b000085
        type: paragraph
        text:
          en: The contents of a deck or sideboard do not match the decklist registered and the decklist
            represents what the player intended to play.
          zh: 套牌或备牌的内容与登记的套牌登记表不符，且牌手意图使用的套牌内容与套牌登记表登记的内容一致。
        officialPdfUnits:
