        text:
          en: '1.2: Removed specific details of how penalties are collected and stored, as it varies depending
            on the software being used.'
          zh: 1.2：由于记录和收集方式因软件而异，故取消此方面的特别说明。
        type: change-entry
      - id: ipg-app-b-change-02
        officialPdfUnit:
          bbox:
          - 54.0
          - 137.36
          - 314.64
          - 149.62
          extractionUnit: appendix-b-change-entry
          page: 31
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: '2.1: Treat missed Saga turn actions as missed triggers.'
          zh: 2.1：遗忘传纪的回合动作，视为遗漏触发来处理。
        type: change-entry
      - id: ipg-app-b-change-03
        officialPdfUnit:
          bbox:
          - 54.0
          - 151.16
          - 298.3
          - 163.42
          extractionUnit: appendix-b-change-entry
          page: 31
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: '2.1: Missed triggers still count as having triggered.'
          zh: 2.1：被遗漏的触发式异能仍认为已触发过。
        type: change-entry
      - id: ipg-app-b-change-04
        officialPdfUnit:
          bbox:
          - 54.0
          - 164.96
          - 538.49
          - 190.76
          extractionUnit: appendix-b-change-entry
          page: 31
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: '2.5: Object-in-wrong-zone changed to always be a partial fix, but only when the incorrect
            zone is the root GRV.'
          zh: 2.5：物件处于错误区域中的情况始终适用于部分修正，但仅当该GRV是由处于错误区域本身导致的。
        type: change-entry
      - id: ipg-app-b-change-05
        officialPdfUnit:
          bbox:
          - 54.0
          - 192.56
          - 532.32
          - 218.36
          extractionUnit: appendix-b-change-entry
          page: 31
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: '3.5: Wrong number of cards upgrade has been split into two paragraphs for clarity, as it
            has slightly different criteris for pre- and post-sideboard games.'
          zh: 3.5：牌张数量错误的升级被分为两段内容，以厘清换备前与换备后对局两种不同情况之判断标准的区别。
        type: change-entry
      id: ipg-app-b-c-change-log-g01
