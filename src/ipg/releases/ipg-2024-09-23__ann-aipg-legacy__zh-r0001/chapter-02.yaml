        type: paragraph
        text:
          en: If the triggered ability is usually considered detrimental for the controlling player and
            they own the card responsible for the existence of the trigger, the penalty is a Warning.
            The current game state is not a factor in determining this, though symmetrical abilities (such
            as Howling Mine) may be considered usually detrimental or not depending on who is being affected.
          zh: '升级：如果该触发式异能属于“通常认为对其操控牌手不利”，且由操控牌手拥有的牌张产生，则罚则为警告。


