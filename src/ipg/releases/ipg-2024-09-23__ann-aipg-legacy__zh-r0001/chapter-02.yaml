          - 231
          text:
            en: If the judge believes that the error was intentional, they should first consider whether an Unsporting
              Conduct — Cheating infraction has occurred.
            zh: 假如裁判认为系蓄意造成该失误，则应该先考虑此违规是否属于“举止违背运动道德～作弊”。
          legacyRawUnits:
          - raw-L000693
          - raw-L000695
      - id: ipg-s2-c-body-g01-b003
        type: paragraph
        text:
          en: With the exception of Failure to Maintain Game State, which is never upgraded, the third
            or subsequent Warning for a Game Play Error offense in the same category is upgraded to a
            Game Loss. For multi-day tournaments, the penalty count for these infractions resets between
            days.
          zh: '除了始终不会升级的“未维护游戏状态”之外，第三次或更多次犯下同类型游戏行动失误而得到的警告，均应升级为一盘负。


            对于历时多日的比赛而言，牌手当天的此类违规处罚累犯计数会在次日清零。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 7
