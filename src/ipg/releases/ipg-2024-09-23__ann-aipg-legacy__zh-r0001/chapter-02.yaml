- id: ipg-s2-2
  kind: infraction
  number: '2.2'
  title:
    en: Looking at Extra Cards
    zh: 额外看牌
  components:
  - id: ipg-s2-2-c-definition
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-s2-2-c-definition-g01
      kind: paragraphs
      blocks:
      - id: ipg-s2-2-c-definition-g01-b001
        type: paragraph
        text:
          en: A player takes an action that may have enabled them to see the faces of cards that they
            were not entitled to see.
          zh: 牌手采取之行动让他们看到了本不应能检视的牌。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 10
