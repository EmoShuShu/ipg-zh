          - 85
          text:
            en: Most Game Play Error infractions are assumed to have been committed unintentionally.
            zh: 大部分游戏行动失误的违规都假设该违规是无意间发生的。
          legacyRawUnits:
          - raw-L000681
          - raw-L000683
        - id: ipg-s2-c-body-g01-b002-rs-0c37f7b3cf90
          sourceRange:
