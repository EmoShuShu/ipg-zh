- id: ipg-s2-6
  kind: infraction
  number: '2.6'
  title:
    en: Failure to Maintain Game State
    zh: 未维护游戏状态
  components:
  - id: ipg-s2-6-c-definition
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-s2-6-c-definition-g01
      kind: paragraphs
      blocks:
      - id: ipg-s2-6-c-definition-g01-b001
        type: paragraph
        text:
          en: A player allows another player in the game to commit a Game Play Error and does not point
            it out immediately. If a judge believes a player is intentionally not pointing out other players’
            illegal actions, either for their own advantage, or in the hope of bringing it up at a more
            strategically advantageous time, they should consider an Unsporting Conduct — Cheating infraction.
            Not reminding an opponent about their triggered abilities is never Failure to Maintain Game
            State nor Cheating.
          zh: '牌手容许游戏中的其他牌手犯下了游戏行动失误，且未立刻指出该错误。


            如果裁判认为牌手系出于“此状况对己方有利”，或是“希望等到战略上对己方更有利的时候再提出”这一类的考量，而蓄意未指出其他牌手之违规行动，则应考虑适用“举止违背运动道德～作弊”之违规。


            未指出对手之触发式异能的行为不属于“未维护游戏状态”或“作弊”。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
