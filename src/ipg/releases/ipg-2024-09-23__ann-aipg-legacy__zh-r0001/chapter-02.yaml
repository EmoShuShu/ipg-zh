        - id: ipg-s2-1-c-definition-g03-b005-rs-e3d8b3c3b0d4
          sourceRange:
          - 0
          - 120
          text:
            en: If a triggered ability would have no impact on the game, it’s not an infraction to fail to demonstrate
              awareness of it.
            zh: 如果某个触发式异能不会对游戏造成影响，则就算牌手没有认识到此触发的存在，也不会算作违规。
          legacyRawUnits:
          - raw-L000876
          - raw-L000878
        - id: ipg-s2-1-c-definition-g03-b005-rs-37883304c090
          sourceRange:
          - 120
          - 311
          text:
            en: For example, if the effect of a triggered ability instructs its controller to sacrifice a creature,
              a player who controls no creatures isn’t required to demonstrate awareness of the ability.
            zh: 举例来说，若某触发式异能的效应要求此异能的操控者牺牲一个生物，则未操控生物的牌手并不需要特别指出该触发的存在。
          legacyRawUnits:
          - raw-L000884
          - raw-L000886
        - id: ipg-s2-1-c-definition-g03-b005-rs-226769445fd3
          sourceRange:
          - 311
          - 477
          text:
            en: Similarly, a player demonstrating awareness of an optional trigger with no visible effect is assumed
              to have made the affirmative choice unless the opponent responds.
            zh: 类似地，如果某牌手表明自己认识到无可见效应之非强制性触发的存在，则除非对手有回应，否则便应视为其已选择依可选项行事。
          legacyRawUnits:
          - raw-L000892
          - raw-L000894
      - id: ipg-s2-1-c-definition-g03-b006
        type: paragraph
        text:
          en: Judges do not intervene in a missed trigger situation unless they intend to issue a Warning
            or have reason to suspect that the controller is intentionally missing their triggered abilities.
          zh: 除非认为应给予警告，或有理由怀疑异能的操控者系蓄意遗忘自己的触发，否则裁判在观察到牌手遗漏触发时不应干预比赛。
        officialPdfUnits:
