          - 0
          - 110
          text:
            en: A player allows another player in the game to commit a Game Play Error and does not point it out
              immediately.
            zh: 牌手容许游戏中的其他牌手犯下了游戏行动失误，且未立刻指出该错误。
          legacyRawUnits:
