  - id: ipg-s2-2-c-philosophy
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-s2-2-c-philosophy-g01
      kind: paragraphs
      blocks:
      - id: ipg-s2-2-c-philosophy-g01-b001
        type: paragraph
        text:
          en: A player can accidentally look at extra cards easily and this infraction handles situations
            where a dexterity or rules error has led to a player seeing cards that they shouldn’t have.
            Cards in a library are considered to be there until they touch cards in another hidden set.
            Once those cards have joined another hidden set, the infraction is Hidden Card Error or Game
            Rule Violation.
          zh: '牌手容易不慎看到多余的牌。此违规用于处理牌手因手脚笨拙或规则失误导致其看到本不应看到牌张的情况。


            只要牌库中的牌张尚未触碰到其他非公开牌叠中之牌张，均视为在牌库之中。一旦相关牌张已加入其他非公开牌叠中，便应按照“非公开牌张失误”或“违反游戏规则”来处理此违规。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 10
          bbox:
          - 90.0
          - 321.8
          - 554.09
          - 375.2
          extractionUnit: extract-p10-l014..extract-p10-l017
        legacyRawUnits:
        - raw-L001388
        - raw-L001390
        - raw-L001396
        - raw-L001398
        readingSegments:
        - id: ipg-s2-2-c-philosophy-g01-b001-rs-03637edf452d
          sourceRange:
          - 0
          - 184
          text:
            en: A player can accidentally look at extra cards easily and this infraction handles situations where
              a dexterity or rules error has led to a player seeing cards that they shouldn’t have.
            zh: 牌手容易不慎看到多余的牌。此违规用于处理牌手因手脚笨拙或规则失误导致其看到本不应看到牌张的情况。
          legacyRawUnits:
          - raw-L001388
          - raw-L001390
        - id: ipg-s2-2-c-philosophy-g01-b001-rs-550f3c4ce20c
          sourceRange:
          - 184
          - 384
          text:
            en: Cards in a library are considered to be there until they touch cards in another hidden set. Once
              those cards have joined another hidden set, the infraction is Hidden Card Error or Game Rule Violation.
            zh: 只要牌库中的牌张尚未触碰到其他非公开牌叠中之牌张，均视为在牌库之中。一旦相关牌张已加入其他非公开牌叠中，便应按照“非公开牌张失误”或“违反游戏规则”来处理此违规。
          legacyRawUnits:
          - raw-L001396
          - raw-L001398
      - id: ipg-s2-2-c-philosophy-g01-b002
        type: paragraph
        text:
          en: Players should not use this penalty to get a “free shuffle” or to attempt to shuffle away
            cards they don’t want to draw; doing so may be Unsporting Conduct — Cheating. Players also
            are not allowed to use this penalty as a stalling mechanism. The library is already randomized,
            so shuffling in the revealed cards should not involve excessive effort.
          zh: '牌手不应该利用此处罚来得到“免费洗牌”，或是企图将不想抓的牌洗到别处去；如此会被视为是“举止违背运动道德~作弊”。


            牌手也不应该将此处罚当做拖延的手段。


            由于牌库都已经充分随机化，所以将展示的牌洗回去并不会造成太大的影响。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 10
          bbox:
          - 90.0
