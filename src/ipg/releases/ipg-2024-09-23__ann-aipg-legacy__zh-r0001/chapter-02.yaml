          text:
            en: A player commits an error in the game that cannot be corrected by only publicly available information.
            zh: 牌手在游戏中发生失误，但此类失误仅凭可公开获知的信息无法修正。
          legacyRawUnits:
          - raw-L001444
          - raw-L001446
        - id: ipg-s2-3-c-definition-g01-b001-rs-4595bc2d1aa5
          sourceRange:
          - 103
          - 261
          text:
            en: It is not a Hidden Card Error if the opponent acknowledges the action or controls the continuous
              effect modifying the game rule that made the action illegal.
            zh: 如果牌手的行动得到对手许可或由对手操控改变游戏规则的持续性效应使牌手的行动不合法，则这不是一个非公开牌张失误。
          legacyRawUnits:
          - raw-L001452
          - raw-L001454
        - id: ipg-s2-3-c-definition-g01-b001-rs-13acafecdf4a
          sourceRange:
          - 261
          - 405
          text:
            en: This infraction only applies when a card whose identity is known to only one player is in a hidden
              set of cards both before and after the error.
            zh: 仅在只有一位牌手知晓内容之牌张在发生失误前后均处于非公开牌叠当中的情况下，此违规才适用。
          legacyRawUnits:
          - raw-L001468
          - raw-L001470
      - id: ipg-s2-3-c-definition-g01-b002
        type: paragraph
        text:
          en: If an additional card is seen but not added to the set, the infraction is Game Play Error
            — Looking at Extra Cards.
          zh: 如果牌手看到了额外的牌，但并未将其加入任何牌叠，这属于游戏行动失误～额外看牌。
