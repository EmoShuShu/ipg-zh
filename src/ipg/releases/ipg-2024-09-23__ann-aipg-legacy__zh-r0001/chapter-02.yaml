      - id: ipg-s2-1-c-definition-g03-b007
        type: paragraph
        text:
          en: A player controlling another player is responsible for that player’s triggers in addition
            to their own.
          zh: 若某牌手正在操控其他牌手之回合，则他除了需留意自己的触发外，还有责任准确处理其所操控之牌手的触发。
