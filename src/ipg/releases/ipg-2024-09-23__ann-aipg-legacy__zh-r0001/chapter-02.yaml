          sourceRange:
          - 116
          - 318
          text:
            en: Players are expected to remember their own triggered abilities; intentionally ignoring one may
              be Unsporting Conduct — Cheating (unless the ability would have no impact on the game as described
              above).
            zh: 牌手应记得属于自己的触发式异能；蓄意忽略触发式异能的行为应视作“举止违背运动道德～作弊”（除非该异能如上文所述，对游戏没有任何影响）。
          legacyRawUnits:
          - raw-L000964
          - raw-L000966
        - id: ipg-s2-1-c-philosophy-g01-b001-rs-a4501dc191ea
          sourceRange:
          - 318
          - 647
          text:
            en: Even if an opponent is involved in the announcement or resolution of the ability, the controller
              is still responsible for ensuring the opponents make the appropriate choices and take the appropriate
              actions. Opponents are not required to point out triggered abilities that they do not control, though
              they may do so if they wish.
            zh: 就算在异能宣告或结算的时候，需要对手进行相应选择，该异能的操控者也应对此负责，确保对手作出恰当的决定或执行了合适的动作。对手不需指出不由自己操控的遗漏触发，不过如果他们希望指出的话，也可以如此作。
          legacyRawUnits:
          - raw-L000972
          - raw-L000974
      - id: ipg-s2-1-c-philosophy-g01-b002
        type: paragraph
        text:
          en: Triggered abilities are assumed to be remembered until otherwise indicated, and the impact
            on the game state may not be immediately apparent. The opponent’s benefit is in not having
            to point out triggered abilities, although this does not mean that they can cause triggers
            to be missed. If an opponent requires information about the precise timing of a triggered
            ability or needs details about a game object that may be affected by a resolved triggered
            ability, that player may need to acknowledge that ability’s existence before its controller
            does. A player who makes a play that may or may not be legal depending on whether an opponent’s
            uncommunicated trigger has been remembered has not committed an infraction; their play either
            succeeds, confirming that the trigger has been missed, or is rewound.
          zh: '除非有迹象表明触发式异能已遭遗忘，否则应视作牌手始终记得触发式异能的存在，同时触发式异能对游戏状态产生的影响也有可能不会即刻显现出来。


            对于对手而言，虽然无须指出触发式异能这点对己有利，但这并不意味着可以主动致使他人遗漏触发。


            如果对手要求知道某个触发式异能的确切触发时机，或需要了解可能会受到已结算之触发式异能影响的某个游戏物件的详细信息，则该牌手便可能需要在该异能的操控者尚未表明自己认识到该异能存在的情况下，提前指出这个触发式异能。


            如果牌手做出的某个游戏动作，其结果需根据是否记得未进行过沟通的对手的触发式异能才能判断是否合法，则这位牌手的行为并未触犯任何违规；他们这一游戏动作或就此成功～同时确认该触发确已遗漏～或会被倒回。'
