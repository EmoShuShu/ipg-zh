        text:
          en: If an error is caught before a player could gain advantage, then the dangers of the ongoing
            game state becoming corrupted are much lower. If the error is allowed to persist, at least
            some of the fault lies with the opponent, who has also failed to notice the error.
          zh: '如果失误能在有牌手能够藉此获得优势之前发现，则对于接下来游戏状态的伤害就会减少许多。


            如果失误持续下去，对手必然也有错，因为他也没有去注意到该失误。'
