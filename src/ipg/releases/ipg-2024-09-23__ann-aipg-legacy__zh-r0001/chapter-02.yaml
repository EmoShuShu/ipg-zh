        - raw-L001412
        - raw-L001414
        - raw-L001420
        - raw-L001422
        readingSegments:
        - id: ipg-s2-2-c-philosophy-g01-b002-rs-710f095f9d96
          sourceRange:
          - 0
          - 168
          text:
            en: Players should not use this penalty to get a “free shuffle” or to attempt to shuffle away cards
              they don’t want to draw; doing so may be Unsporting Conduct — Cheating.
            zh: 牌手不应该利用此处罚来得到“免费洗牌”，或是企图将不想抓的牌洗到别处去；如此会被视为是“举止违背运动道德~作弊”。
          legacyRawUnits:
          - raw-L001404
          - raw-L001406
        - id: ipg-s2-2-c-philosophy-g01-b002-rs-bd73f34011fc
          sourceRange:
          - 168
          - 242
          text:
            en: Players also are not allowed to use this penalty as a stalling mechanism.
            zh: 牌手也不应该将此处罚当做拖延的手段。
