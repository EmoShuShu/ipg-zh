            zh: 如果牌手做出的某个游戏动作，其结果需根据是否记得未进行过沟通的对手的触发式异能才能判断是否合法，则这位牌手的行为并未触犯任何违规；他们这一游戏动作或就此成功～同时确认该触发确已遗漏～或会被倒回。
