  - id: ipg-s2-3-c-philosophy
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-s2-3-c-philosophy-g01
      kind: paragraphs
      blocks:
      - id: ipg-s2-3-c-philosophy-g01-b001
        type: paragraph
        text:
          en: Though the game state cannot be reversed to the ‘correct’ state, this error can be mitigated
            by giving the opponent sufficient knowledge and ability to offset the error so that it is
            less likely to generate advantage.
          zh: 虽然犯下此失误之后，没有办法将游戏状态倒回至“正确”的状态，但此类失误也有弥补之法，即是让对手充分获取信息，依其意愿来减轻失误造成的影响，从而使牌手较难从中渔利。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 11
          bbox:
          - 90.0
          - 199.04
          - 549.7
          - 238.64
          extractionUnit: extract-p11-l010..extract-p11-l012
        legacyRawUnits:
        - raw-L001532
        - raw-L001534
      - id: ipg-s2-3-c-philosophy-g01-b002
        type: paragraph
        text:
          en: If cards are placed into a public zone, then their order is known and the infraction can
            be handled as a Game Rule Violation. Order cannot be determined from card faces only visible
            to one player unless the card is in a uniquely identifiable position (such as on top of the
            library, or as the only card in hand.)
          zh: '如果牌张被置入公开区域，这样就能够知晓其顺序，之后便可依照“违反游戏规则”处理此违规。


            如果仅有一位牌手能看到牌面，便无法确定牌张之顺序，但牌张处于可唯一辨识之位置时（例如牌库顶、手上唯一的一张手牌）除外。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 11
          bbox:
          - 90.0
          - 254.24
          - 556.84
          - 307.64
          extractionUnit: extract-p11-l013..extract-p11-l016
        legacyRawUnits:
        - raw-L001540
        - raw-L001542
        - raw-L001548
        - raw-L001550
        readingSegments:
        - id: ipg-s2-3-c-philosophy-g01-b002-rs-290cb52c48d5
          sourceRange:
          - 0
          - 126
          text:
            en: If cards are placed into a public zone, then their order is known and the infraction can be handled
              as a Game Rule Violation.
            zh: 如果牌张被置入公开区域，这样就能够知晓其顺序，之后便可依照“违反游戏规则”处理此违规。
          legacyRawUnits:
          - raw-L001540
          - raw-L001542
        - id: ipg-s2-3-c-philosophy-g01-b002-rs-2d602b02eeb4
          sourceRange:
          - 126
          - 312
          text:
            en: Order cannot be determined from card faces only visible to one player unless the card is in a
              uniquely identifiable position (such as on top of the library, or as the only card in hand.)
            zh: 如果仅有一位牌手能看到牌面，便无法确定牌张之顺序，但牌张处于可唯一辨识之位置时（例如牌库顶、手上唯一的一张手牌）除外。
          legacyRawUnits:
          - raw-L001548
          - raw-L001550
      - id: ipg-s2-3-c-philosophy-g01-b003
        type: paragraph
        text:
          en: Be careful not to apply this infraction in situations where a publicly-correctable error
            subsequently leads to an uncorrectable situation such as a Brainstorm cast using green mana.
            In these situations, the infraction is based on that root cause.
          zh: 但应注意，如果是原本可通过公开方式修正的失误引致无法修复之状况的情形（例如利用绿色法术力来施放脑力激荡/Brainstorm），不要适用此违规。应根据这类情形的根本原因来适用对应的违规。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 11
          bbox:
          - 90.0
          - 323.24
          - 548.28
          - 362.84
          extractionUnit: extract-p11-l017..extract-p11-l019
        legacyRawUnits:
        - raw-L001556
        - raw-L001558
      - id: ipg-s2-3-c-philosophy-g01-b004
        type: paragraph
        text:
          en: Information about cards previously known by the opponent, such as cards previously revealed
            while on the top of the library or by a previous look at the hand, may be taken into account
            while determining the set of cards to which the remedy applies.
          zh: 若存在对手先前已知晓的牌张,例如之前展示过的牌库顶牌或检视手牌时看到的牌,则可考虑在此信息的基础上来确定要对哪部分牌叠适用修正。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 11
          bbox:
          - 90.0
          - 378.44
          - 555.53
          - 418.04
          extractionUnit: extract-p11-l020..extract-p11-l022
        legacyRawUnits:
        - raw-L001564
        - raw-L001566
      - id: ipg-s2-3-c-philosophy-g01-b005
        type: paragraph
        text:
          en: Always operate on the smallest set possible to remedy the error. This may mean applying
            the remedy to only part of a set defined by an instruction. For example, if a player resolves
            Collected Company, picks up three cards with one hand and then four cards with the other,
            the last drawn set of four cards should be used for the remedy, instead of the full set of
            seven cards..
          zh: 修正失误时,应尽量从相关牌叠中牌张数量最少者入手。这可能意味着仅对叙述规定之牌叠中的某一部分适用修正。举例来说,如果某牌手在结算征召军伍/Collected Company时用一只手拿起了三张牌，再用另一只手拿起了四张牌，则应对后抓起的这四张牌进行修正，而不是对全部七张。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 11
          bbox:
          - 90.0
          - 433.64
          - 556.8
          - 487.04
          extractionUnit: extract-p11-l023..extract-p11-l026
        legacyRawUnits:
        - raw-L001572
        - raw-L001574
  - id: ipg-s2-3-c-additional-remedy
    role: additional-remedy
    labelCode: component.additional-remedy
    groups:
    - id: ipg-s2-3-c-additional-remedy-g01
      kind: paragraphs
      blocks:
      - id: ipg-s2-3-c-additional-remedy-g01-b001
        type: paragraph
        text:
          en: In cases where the infraction was immediately followed by moving a card from the affected
            set to a known location, such as by discarding, putting cards on top of the library, or playing
            a land, a simple backup to the point just after the error may be performed.
          zh: 如果属于违规发生后会立即将牌张从相关牌叠移至已知位置，例如弃牌、将牌置于牌库顶或是使用地，则可以简易倒回至错误刚发生的时点。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 11
          bbox:
          - 90.0
          - 517.64
          - 551.16
          - 557.24
          extractionUnit: extract-p11-l028..extract-p11-l030
        legacyRawUnits:
        - raw-L001582
        - raw-L001584
      - id: ipg-s2-3-c-additional-remedy-g01-b002
        type: paragraph
        text:
          en: If the set of cards that contained the problem no longer exists, there is no remedy to be
            applied.
          zh: 如果存在问题之牌叠已不存在，则无需应用修正。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 11
          bbox:
          - 90.0
          - 572.84
          - 546.48
          - 584.84
          extractionUnit: extract-p11-l031..extract-p11-l031
        legacyRawUnits:
        - raw-L001594
        - raw-L001596
      - id: ipg-s2-3-c-additional-remedy-g01-b003
        type: paragraph
        text:
          en: If the error put cards into a set prematurely and other operations involving cards in the
            set should have been performed first, the player reveals the set of cards that contains the
            excess and their opponent chooses a number of previously-unknown cards. Put those cards aside
            until the point at which they should have been legally added, then return them to the set.
          zh: 如果错误属于未进行本应对相关牌叠中的牌张执行其他行动的情况下，便先行将牌张置入该牌叠中的情形，则该牌手展示包含过量牌张的牌叠，其对手从中选出先前未知的牌张。将这些选出的牌张放在一旁，直到进行到他们应能合乎规则地加入牌叠之后，再将他们移回牌叠。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 11
          bbox:
          - 90.0
          - 600.44
          - 555.7
          - 653.84
          extractionUnit: extract-p11-l032..extract-p11-l035
        legacyRawUnits:
        - raw-L001602
        - raw-L001604
      - id: ipg-s2-3-c-additional-remedy-g01-b004
        type: paragraph
        text:
          en: If the error involves one or more cards that were supposed to be revealed, the player reveals
            the set of cards that contains the unrevealed cards and their opponent chooses that many previously-unknown
            cards. Treat those as the cards that were ‘revealed’ and return them to the set that was being
            selected from; the player then reperforms the action. If recreating the original selection
            set and reperforming the action would be too disruptive, leave the selected cards in hand.
          zh: 如果错误涉及本应展示但实际未展示之牌张，则该牌手展示包含此类牌张之牌叠，其对手从中选出等量之先前未知的牌张。将选出的这些牌视作需“展示”的部分，并将它们移回其原本所在之牌叠，然后该牌手重新执行有关动作。如果复原待选牌叠并重新执行动作会对游戏产生过量干扰，则将所选牌张留在手上。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 11
          bbox:
          - 90.0
          - 669.44
          - 552.52
          - 709.04
          extractionUnit: extract-p11-l036..extract-p11-l038
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 12
          bbox:
          - 90.0
          - 56.84
          - 552.82
          - 82.64
          extractionUnit: extract-p12-l001..extract-p12-l002
        legacyRawUnits:
        - raw-L001610
        - raw-L001612
      - id: ipg-s2-3-c-additional-remedy-g01-b006
        type: paragraph
        text:
          en: If a set affected by the error contains more cards than it is supposed to contain, the player
            reveals the set of cards that contains the excess and their opponent chooses a number of previously-unknown
            cards sufficient to reduce the set to the correct size. These excess cards are returned to
            the correct location. If that location is the library, they should be shuffled into the random
            portion unless the owner previously knew the identity of the card/cards illegally moved; that
            many cards, chosen by the opponent, are returned to the original location instead. For example,
            if a player playing with Sphinx of Jwar Isle illegally draws a card, that card should be returned
            to the top of the library.
          zh: 如果受失误影响之牌叠中包含的牌张数量较其应有数量为多，则该牌手向对手展示包含过量牌张的牌叠，其对手从中选出适量之先前未知的牌张，修正牌叠中的牌张数量。将过量牌张移回其原本所处位置。如果将移回的位置为牌库，则应将其洗回随机的部分；但如果其拥有者先前知道错误移动之牌张的内容，则改为由对手选择同等数量之牌张，并将其移至原本的位置。举例来说，如果某牌手场上有爪尔岛史芬斯，但他错误地抓了一张牌，则应将该牌移回牌库顶。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 12
          bbox:
          - 90.0
          - 98.24
          - 557.88
          - 206.84
          extractionUnit: extract-p12-l003..extract-p12-l010
        legacyRawUnits:
        - raw-L001618
        - raw-L001620
  - id: ipg-c000013
    role: upgrade
    labelCode: component.upgrade
    groups:
    - id: ipg-g000013
      kind: paragraphs
      blocks:
      - id: ipg-s2-3-c-additional-remedy-g01-b007
        type: paragraph
        text:
          en: If a face-down card cast using a morph or disguise ability is on the battlefield during
            the game and does not have the relevant ability printed on the card, the penalty is a Game
            Loss. If the player has one or more cards with the same ability in hand, has not added previously
            unknown cards to their hand since casting the card found in violation, and has self-reported
            the error before an effect that would reveal it is played, the upgrade does not apply and
            they may swap the card for a card with the appropriate ability in hand.
          zh: 升级：如果曾以变身或伪装异能施放之牌面朝下的牌张在游戏过程中发现实际上不具相关异能，则处罚为一盘负。如果牌手手上有一张或数张相应具变身或伪装异能的牌，自施放引致违规之牌张后未曾将其他之前未知的牌张加入手牌，且又是在某个效应会将其展示之前自行上报该失误，则不适用此升级，可将手上任一此类牌张与此引致违规之牌张交换。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 12
          bbox:
          - 90.0
          - 222.44
          - 547.8
          - 303.44
          extractionUnit: extract-p12-l011..extract-p12-l016
        legacyRawUnits:
        - raw-L001626
        - raw-L001628
  classification: game-play-error
  penaltyCode: penalty.warning
- id: ipg-s2-4
  kind: infraction
  number: '2.4'
  title:
    en: Mulligan Procedure Error
    zh: 再调度失误
  components:
  - id: ipg-s2-4-c-definition
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-s2-4-c-definition-g01
      kind: paragraphs
      blocks:
      - id: ipg-s2-4-c-definition-g01-b001
        type: paragraph
        text:
          en: A player makes an error in one of the steps of the mulligan process. Once the mulligan process
            is complete and the game begins, excess cards arising from an improper mulligan is a Game
            Play Error — Hidden Card Error and too few cards is a Game Play Error — Game Rule Violation.
          zh: 牌手再调度流程中的一步出现失误。一旦再调度流程完成并且游戏开始后，由于错误的再调度而产生额外牌张属于游戏行动失误～非公开牌张失误，而牌张过少则属于游戏行动失误～违反游戏规则。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 12
          bbox:
          - 90.0
