          zh: 恶名骑士/Knight of Infamy（2/1生物，具颂威异能）单独攻击。其操控者说“中两点。”
        type: list-item
      - id: ipg-s2-1-c-examples-g01-b002
        marker: B
        officialPdfUnit:
          bbox:
          - 108.0
          - 416.84
          - 550.07
          - 442.64
          extractionUnit: page-8-line-block
          page: 8
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player forgets to remove the final time counter from a suspended spell and then draws
            a card during their draw step.
          zh: 牌手忘记从已延缓的咒语上移去最后一个计时指示物，并在其抓牌步骤中抓了一张牌。
        type: list-item
      - id: ipg-s2-1-c-examples-g01-b003
        marker: C
        officialPdfUnit:
          bbox:
          - 108.0
          - 444.44
          - 557.8
          - 470.24
          extractionUnit: page-8-line-block
          page: 8
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player casts Manic Vandal, then forgets its triggered ability by not choosing a target
            for it. They realize this only after casting another spell.
          zh: 牌手施放了疯狂莽夫/Manic Vandal，但并未为其触发式异能选择目标，遗忘了此触发。等到施放另外一个咒语的时候，他们才发现遗忘了此触发。
        type: list-item
      - id: ipg-s2-1-c-examples-g01-b004
        marker: D
        officialPdfUnit:
          bbox:
          - 108.0
          - 472.04
          - 557.04
          - 497.84
          extractionUnit: page-8-line-block
          page: 8
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player forgets to exile the Angel token created by Geist of Saint Traft at end of combat.
            They realize the error when declaring blockers during the next turn.
          zh: 在战斗结束的时候，牌手忘记放逐圣沙弗的游魂/Geist of Saint Traft产生的天使衍生物。等到下一个回合宣告阻挡者的时候，他们才发现这个失误。
        type: list-item
      id: ipg-s2-1-c-examples-g01
      kind: ordered-list
    id: ipg-s2-1-c-examples
    labelCode: component.examples
    role: examples
  - groups:
    - blocks:
      - id: ipg-s2-1-c-philosophy-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 528.44
          - 543.72
          - 637.04
          extractionUnit: page-8-line-block
          page: 8
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Triggered abilities are common and invisible, so players should not be harshly penalized
            when forgetting about one. Players are expected to remember their own triggered abilities;
            intentionally ignoring one may be Unsporting Conduct — Cheating (unless the ability would
            have no impact on the game as described above). Even if an opponent is involved in the announcement
            or resolution of the ability, the controller is still responsible for ensuring the opponents
            make the appropriate choices and take the appropriate actions. Opponents are not required
            to point out triggered abilities that they do not control, though they may do so if they wish.
          zh: ''
        type: paragraph
      - id: ipg-s2-1-c-philosophy-g01-b002
        officialPdfUnit:
          bbox:
          - 90.0
          - 652.64
          - 557.02
          - 719.84
          extractionUnit: page-8-line-block
          page: 8
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Triggered abilities are assumed to be remembered until otherwise indicated, and the impact
            on the game state may not be immediately apparent. The opponent’s benefit is in not having
            to point out triggered abilities, although this does not mean that they can cause triggers
            to be missed. If an opponent requires information about the precise timing of a triggered
            ability or needs details about a game object that may be affected by a resolved triggered
            ability, that player may need to
          zh: ''
        type: paragraph
      - id: ipg-s2-1-c-philosophy-g01-b003
        officialPdfUnit:
          bbox:
          - 90.0
          - 56.84
          - 551.76
          - 110.24
          extractionUnit: page-9-line-block
          page: 9
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: acknowledge that ability’s existence before its controller does. A player who makes a play
            that may or may not be legal depending on whether an opponent’s uncommunicated trigger has
            been remembered has not committed an infraction; their play either succeeds, confirming that
            the trigger has been missed, or is rewound.
          zh: ''
        type: paragraph
      - id: ipg-s2-1-c-philosophy-g01-b004
        officialPdfUnit:
          bbox:
          - 90.0
          - 125.84
          - 557.04
          - 206.84
          extractionUnit: page-9-line-block
          page: 9
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Players may not cause triggered abilities controlled by an opponent to be missed by taking
            game actions or otherwise prematurely advancing the game. During an opponent’s turn, if a
            trigger’s controller demonstrates awareness of the trigger before they take an active role
            (such as taking an action or explicitly passing priority), the trigger is remembered. The
            Out-of-Order Sequencing rules (MTR section 4.3) may also be applicable, especially as they
            relate to batches of actions or resolving items on the stack in an improper order.
          zh: ''
        type: paragraph
      - id: ipg-s2-1-c-philosophy-g01-b005
        officialPdfUnit:
          bbox:
          - 90.0
          - 222.44
          - 557.76
          - 248.24
          extractionUnit: page-9-line-block
          page: 9
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A triggered ability is considered to have triggered even if it was subsequently missed.
            Effects that count or restrict the number of times a triggered ability can trigger will count
            the missed one.
          zh: 即使一个触发式异能在触发后被遗忘，它仍被视作已触发。计算或限制异能触发次数的效应，会将被遗漏的触发计算在内。
        type: paragraph
      id: ipg-s2-1-c-philosophy-g01
      kind: paragraphs
    id: ipg-s2-1-c-philosophy
    labelCode: component.philosophy
    role: philosophy
  - groups:
    - blocks:
      - id: ipg-s2-1-c-additional-remedy-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 278.84
          - 511.13
          - 318.44
          extractionUnit: page-9-line-block
          page: 9
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If the triggered ability is an enters-the-battlefield trigger of an Aura that affects only
            the enchanted permanent and causes a visible change to that permanent, resolve the ability
            immediately.
          zh: 若该触发式异能系由进战场之灵气触发，仅影响其所结附的永久物并对其产生可见变化，则立即结算之。
        type: paragraph
      - id: ipg-s2-1-c-additional-remedy-g01-b002
        officialPdfUnit:
          bbox:
          - 90.0
          - 334.04
          - 546.57
          - 401.24
          extractionUnit: page-9-line-block
          page: 9
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If the triggered ability is a delayed triggered ability that undoes a zone change (including
            token creation) caused by the effect that created the delayed triggered ability, the opponent
            chooses whether to resolve the ability the next time a player would get priority or when a
            player would get priority at the start of the next phase. The new zone does not need to be
            the same as the one the card was originally moved from.
          zh: 若该触发式异能系由改变某物件区域（包括派出衍生物）之效应产生、用于复原前述区域改变的延迟式触发异能，则由对手选择是令其在下一次将有牌手获得优先权时结算，还是在下一个阶段开始、有牌手将获得优先权时结算。新的区域不需要与牌原本来自的区域相同。
        type: paragraph
      - id: ipg-s2-1-c-additional-remedy-g01-b003
        officialPdfUnit:
          bbox:
          - 90.0
          - 416.84
          - 557.28
          - 456.44
          extractionUnit: page-9-line-block
          page: 9
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: For all other triggered abilities, if the ability was missed prior to the current phase
            in the previous turn, instruct the players to continue playing. If the triggered ability created
            an effect whose duration has already expired, instruct the players to continue playing.
          zh: ''
        type: paragraph
      - id: ipg-s2-1-c-additional-remedy-g01-b004
        officialPdfUnit:
          bbox:
          - 90.0
          - 472.04
          - 557.4
          - 553.04
          extractionUnit: page-9-line-block
          page: 9
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If the triggered ability isn’t covered by the previous paragraphs, the opponent chooses
            whether the triggered ability is added to the stack. If it is, it’s inserted at the appropriate
            place on the stack if possible or on the bottom of the stack. No player may make choices for
            the triggered ability involving objects that would not have been legal choices when the ability
            should have triggered. For example, if the ability instructs a player to sacrifice a creature,
            that player can't sacrifice a creature that wasn't on the battlefield when the ability should
            have triggered.
          zh: ''
        type: paragraph
      - id: ipg-s2-1-c-additional-remedy-g01-b005
        officialPdfUnit:
          bbox:
          - 90.0
          - 568.64
          - 550.08
          - 608.24
          extractionUnit: page-9-line-block
          page: 9
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If the player is in the process of, or has just completed, an action that indicates the
            trigger has been missed, and completing that action would change the effect of the trigger,
            a simple backup may be performed on that action.
          zh: 如果牌手正在进行或刚刚完成一个动作表明其遗漏了触发，并且完成该动作会改变该触发式异能的效应，则可以对该动作进行简易倒回。
        type: paragraph
      - id: ipg-s2-1-c-additional-remedy-g01-b006
        officialPdfUnit:
          bbox:
          - 90.0
          - 623.84
          - 551.52
          - 691.04
          extractionUnit: page-9-line-block
          page: 9
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: 'Upgrade: If the triggered ability is usually considered detrimental for the controlling
            player and they own the card responsible for the existence of the trigger, the penalty is
            a Warning. The current game state is not a factor in determining this, though symmetrical
            abilities (such as Howling Mine) may be considered usually detrimental or not depending on
            who is being affected.'
          zh: ''
        type: paragraph
      id: ipg-s2-1-c-additional-remedy-g01
      kind: paragraphs
    id: ipg-s2-1-c-additional-remedy
    labelCode: component.additional-remedy
    role: additional-remedy
  id: ipg-s2-1
  kind: infraction
  number: '2.1'
  penaltyCode: penalty.none
  title:
    en: Missed Trigger
    zh: 遗漏触发
- components:
  - groups:
    - blocks:
      - id: ipg-s2-2-c-definition-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 126.2
          - 549.91
          - 152.0
          extractionUnit: page-10-line-block
          page: 10
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player takes an action that may have enabled them to see the faces of cards that they
            were not entitled to see.
          zh: 牌手采取之行动让他们看到了本不应能检视的牌。
        type: paragraph
      - id: ipg-s2-2-c-definition-g01-b002
        officialPdfUnit:
          bbox:
          - 90.0
          - 167.6
          - 553.36
          - 193.4
          extractionUnit: page-10-line-block
          page: 10
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: This penalty is applied only once if one or more cards are seen in the same action or sequence
            of actions.
          zh: 在同一动作或同一系列动作中看到了一张牌或数张牌，此处罚也只适用一次。
        type: paragraph
      id: ipg-s2-2-c-definition-g01
      kind: paragraphs
    id: ipg-s2-2-c-definition
    labelCode: component.definition
    role: definition
  - groups:
    - blocks:
      - id: ipg-s2-2-c-examples-g01-b001
        marker: A
        officialPdfUnit:
          bbox:
          - 108.0
          - 224.0
          - 544.16
          - 249.8
          extractionUnit: page-10-line-block
          page: 10
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player accidentally reveals (drops, flips over) a card while shuffling their opponent’s
            library.
          zh: 牌手在洗对手牌库时意外地翻开（掉落，翻转）一张牌。
        type: list-item
      - id: ipg-s2-2-c-examples-g01-b002
        marker: B
        officialPdfUnit:
          bbox:
          - 108.0
          - 251.6
          - 435.12
          - 263.6
          extractionUnit: page-10-line-block
          page: 10
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player pulls up an extra card while drawing from their library.
          zh: 牌手抓牌时多带起了一张牌。
        type: list-item
      - id: ipg-s2-2-c-examples-g01-b003
        marker: C
        officialPdfUnit:
          bbox:
          - 108.0
          - 265.4
          - 526.09
          - 291.2
          extractionUnit: page-10-line-block
          page: 10
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player sees the bottom card of their deck when presenting it to their opponent for cutting/shuffling.
          zh: 牌手在将套牌给对手洗或切时看到了牌库底的牌。
        type: list-item
      id: ipg-s2-2-c-examples-g01
      kind: ordered-list
    id: ipg-s2-2-c-examples
    labelCode: component.examples
    role: examples
  - groups:
    - blocks:
      - id: ipg-s2-2-c-philosophy-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 321.8
          - 554.09
          - 375.2
          extractionUnit: page-10-line-block
          page: 10
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player can accidentally look at extra cards easily and this infraction handles situations
            where a dexterity or rules error has led to a player seeing cards that they shouldn’t have.
            Cards in a library are considered to be there until they touch cards in another hidden set.
            Once those cards have joined another hidden set, the infraction is Hidden Card Error or Game
            Rule Violation.
          zh: ''
        type: paragraph
      - id: ipg-s2-2-c-philosophy-g01-b002
        officialPdfUnit:
          bbox:
          - 90.0
          - 390.8
          - 556.44
          - 444.2
          extractionUnit: page-10-line-block
          page: 10
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Players should not use this penalty to get a “free shuffle” or to attempt to shuffle away
            cards they don’t want to draw; doing so may be Unsporting Conduct — Cheating. Players also
            are not allowed to use this penalty as a stalling mechanism. The library is already randomized,
            so shuffling in the revealed cards should not involve excessive effort.
          zh: ''
        type: paragraph
      id: ipg-s2-2-c-philosophy-g01
      kind: paragraphs
    id: ipg-s2-2-c-philosophy
    labelCode: component.philosophy
    role: philosophy
  - groups:
    - blocks:
      - id: ipg-s2-2-c-additional-remedy-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 474.8
          - 549.94
          - 514.4
          extractionUnit: page-10-line-block
          page: 10
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If the cards were in the library, shuffle any previously unknown cards from a deck back
            into the random portion of the library, then put any previously known cards back in their
            correct locations.
          zh: 如果额外看的牌在牌库中，则将此前套牌中未知的牌张洗入牌库的随机部分，然后将此前已知牌张置于正确位置。
        type: paragraph
      id: ipg-s2-2-c-additional-remedy-g01
      kind: paragraphs
    id: ipg-s2-2-c-additional-remedy
    labelCode: component.additional-remedy
    role: additional-remedy
  id: ipg-s2-2
  kind: infraction
  number: '2.2'
  penaltyCode: penalty.warning
  title:
    en: Looking at Extra Cards
    zh: 额外看牌
- components:
  - groups:
    - blocks:
      - id: ipg-s2-3-c-definition-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 585.56
          - 546.12
          - 652.76
          extractionUnit: page-10-line-block
          page: 10
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player commits an error in the game that cannot be corrected by only publicly available
            information. It is not a Hidden Card Error if the opponent acknowledges the action or controls
            the continuous effect modifying the game rule that made the action illegal. This infraction
            only applies when a card whose identity is known to only one player is in a hidden set of
            cards both before and after the error.
          zh: ''
        type: paragraph
      - id: ipg-s2-3-c-definition-g01-b002
        officialPdfUnit:
          bbox:
          - 90.0
          - 668.36
          - 517.44
          - 694.16
          extractionUnit: page-10-line-block
          page: 10
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If an additional card is seen but not added to the set, the infraction is Game Play Error
            — Looking at Extra Cards.
          zh: ''
        type: paragraph
      id: ipg-s2-3-c-definition-g01
      kind: paragraphs
    id: ipg-s2-3-c-definition
    labelCode: component.definition
    role: definition
  - groups:
    - blocks:
      - id: ipg-s2-3-c-examples-g01-b001
        marker: A
        officialPdfUnit:
          bbox:
          - 108.0
          - 73.64
          - 398.36
          - 85.64
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player draws four cards after casting Ancestral Recall.
          zh: 牌手施放Ancestral Recall之后抓了四张牌。
        type: list-item
      - id: ipg-s2-3-c-examples-g01-b002
        marker: B
        officialPdfUnit:
          bbox:
          - 108.0
          - 87.44
          - 439.8
          - 99.44
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player scries two cards when they should only have scried one.
          zh: 牌手在只该占卜一张牌的情况下占卜了两张牌。
        type: list-item
      - id: ipg-s2-3-c-examples-g01-b003
        marker: C
        officialPdfUnit:
          bbox:
          - 108.0
          - 101.24
          - 555.29
          - 127.04
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player resolves a Dark Confidant trigger, but forgets to reveal the card before putting
            it into their hand.
          zh: 牌手结算了黑暗亲信/Dark Confidant的触发，但在将牌张置入手中之前忘了展示。
        type: list-item
      - id: ipg-s2-3-c-examples-g01-b004
        marker: D
        officialPdfUnit:
          bbox:
          - 108.0
          - 128.84
          - 435.48
          - 140.84
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player has more cards in their hand than can be accounted for.
          zh: 牌手的手牌数量比其应有的数量多。
        type: list-item
      - id: ipg-s2-3-c-examples-g01-b005
        marker: E
        officialPdfUnit:
          bbox:
          - 108.0
          - 142.64
          - 473.81
          - 154.64
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player casts Anticipate and picks up the top four cards of their library.
          zh: 牌手施放预先考虑/Anticipate，并拿起了其牌库顶的四张牌。
        type: list-item
      - id: ipg-s2-3-c-examples-g01-b006
        marker: F
        officialPdfUnit:
          bbox:
          - 108.0
          - 156.44
          - 325.18
          - 168.44
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player, going first, draws for their turn.
          zh: 先手的牌手在第一回合开始时抓了牌。
        type: list-item
      id: ipg-s2-3-c-examples-g01
      kind: ordered-list
    id: ipg-s2-3-c-examples
    labelCode: component.examples
    role: examples
  - groups:
    - blocks:
      - id: ipg-s2-3-c-philosophy-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 199.04
          - 549.7
          - 238.64
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Though the game state cannot be reversed to the ‘correct’ state, this error can be mitigated
            by giving the opponent sufficient knowledge and ability to offset the error so that it is
            less likely to generate advantage.
          zh: 虽然犯下此失误之后，没有办法将游戏状态倒回至“正确”的状态，但此类失误也有弥补之法，即是让对手充分获取信息，依其意愿来减轻失误造成的影响，从而使牌手较难从中渔利。
        type: paragraph
      - id: ipg-s2-3-c-philosophy-g01-b002
        officialPdfUnit:
          bbox:
          - 90.0
          - 254.24
          - 556.84
          - 307.64
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If cards are placed into a public zone, then their order is known and the infraction can
            be handled as a Game Rule Violation. Order cannot be determined from card faces only visible
            to one player unless the card is in a uniquely identifiable position (such as on top of the
            library, or as the only card in hand.)
          zh: ''
        type: paragraph
      - id: ipg-s2-3-c-philosophy-g01-b003
        officialPdfUnit:
          bbox:
          - 90.0
          - 323.24
          - 548.28
          - 362.84
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Be careful not to apply this infraction in situations where a publicly-correctable error
            subsequently leads to an uncorrectable situation such as a Brainstorm cast using green mana.
            In these situations, the infraction is based on that root cause.
          zh: 但应注意，如果是原本可通过公开方式修正的失误引致无法修复之状况的情形（例如利用绿色法术力来施放脑力激荡/Brainstorm），不要适用此违规。应根据这类情形的根本原因来适用对应的违规。
        type: paragraph
      - id: ipg-s2-3-c-philosophy-g01-b004
        officialPdfUnit:
          bbox:
          - 90.0
          - 378.44
          - 555.53
          - 418.04
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Information about cards previously known by the opponent, such as cards previously revealed
            while on the top of the library or by a previous look at the hand, may be taken into account
            while determining the set of cards to which the remedy applies.
          zh: 若存在对手先前已知晓的牌张,例如之前展示过的牌库顶牌或检视手牌时看到的牌,则可考虑在此信息的基础上来确定要对哪部分牌叠适用修正。
        type: paragraph
      - id: ipg-s2-3-c-philosophy-g01-b005
        officialPdfUnit:
          bbox:
          - 90.0
          - 433.64
          - 556.8
          - 487.04
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Always operate on the smallest set possible to remedy the error. This may mean applying
            the remedy to only part of a set defined by an instruction. For example, if a player resolves
            Collected Company, picks up three cards with one hand and then four cards with the other,
            the last drawn set of four cards should be used for the remedy, instead of the full set of
            seven cards..
          zh: ''
        type: paragraph
      id: ipg-s2-3-c-philosophy-g01
      kind: paragraphs
    id: ipg-s2-3-c-philosophy
    labelCode: component.philosophy
    role: philosophy
  - groups:
    - blocks:
      - id: ipg-s2-3-c-additional-remedy-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 517.64
          - 551.16
          - 557.24
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: In cases where the infraction was immediately followed by moving a card from the affected
            set to a known location, such as by discarding, putting cards on top of the library, or playing
            a land, a simple backup to the point just after the error may be performed.
          zh: 如果属于违规发生后会立即将牌张从相关牌叠移至已知位置，例如弃牌、将牌置于牌库顶或是使用地，则可以简易倒回至错误刚发生的时点。
        type: paragraph
      - id: ipg-s2-3-c-additional-remedy-g01-b002
        officialPdfUnit:
          bbox:
          - 90.0
          - 572.84
          - 546.48
          - 584.84
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If the set of cards that contained the problem no longer exists, there is no remedy to be
            applied.
          zh: 如果存在问题之牌叠已不存在，则无需应用修正。
        type: paragraph
      - id: ipg-s2-3-c-additional-remedy-g01-b003
        officialPdfUnit:
          bbox:
          - 90.0
          - 600.44
          - 555.7
          - 653.84
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If the error put cards into a set prematurely and other operations involving cards in the
            set should have been performed first, the player reveals the set of cards that contains the
            excess and their opponent chooses a number of previously-unknown cards. Put those cards aside
            until the point at which they should have been legally added, then return them to the set.
          zh: 如果错误属于未进行本应对相关牌叠中的牌张执行其他行动的情况下，便先行将牌张置入该牌叠中的情形，则该牌手展示包含过量牌张的牌叠，其对手从中选出先前未知的牌张。将这些选出的牌张放在一旁，直到进行到他们应能合乎规则地加入牌叠之后，再将他们移回牌叠。
        type: paragraph
      - id: ipg-s2-3-c-additional-remedy-g01-b004
        officialPdfUnit:
          bbox:
          - 90.0
          - 669.44
          - 552.52
          - 709.04
          extractionUnit: page-11-line-block
          page: 11
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If the error involves one or more cards that were supposed to be revealed, the player reveals
            the set of cards that contains the unrevealed cards and their opponent chooses that many previously-
            unknown cards. Treat those as the cards that were ‘revealed’ and return them to the set that
            was
          zh: ''
        type: paragraph
      - id: ipg-s2-3-c-additional-remedy-g01-b005
        officialPdfUnit:
          bbox:
          - 90.0
          - 56.84
          - 552.82
          - 82.64
          extractionUnit: page-12-line-block
          page: 12
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: being selected from; the player then reperforms the action. If recreating the original selection
            set and reperforming the action would be too disruptive, leave the selected cards in hand.
          zh: ''
        type: paragraph
      - id: ipg-s2-3-c-additional-remedy-g01-b006
        officialPdfUnit:
          bbox:
          - 90.0
          - 98.24
          - 557.88
          - 206.84
          extractionUnit: page-12-line-block
          page: 12
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If a set affected by the error contains more cards than it is supposed to contain, the player
            reveals the set of cards that contains the excess and their opponent chooses a number of previously-
            unknown cards sufficient to reduce the set to the correct size. These excess cards are returned
            to the correct location. If that location is the library, they should be shuffled into the
            random portion unless the owner previously knew the identity of the card/cards illegally moved;
            that many cards, chosen by the opponent, are returned to the original location instead. For
            example, if a player playing with Sphinx of Jwar Isle illegally draws a card, that card should
            be returned to the top of the library.
          zh: ''
        type: paragraph
      - id: ipg-s2-3-c-additional-remedy-g01-b007
        officialPdfUnit:
          bbox:
          - 90.0
          - 222.44
          - 547.8
          - 303.44
          extractionUnit: page-12-line-block
          page: 12
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: 'Upgrade: If a face-down card cast using a morph or disguise ability is on the battlefield
            during the game and does not have the relevant ability printed on the card, the penalty is
            a Game Loss. If the player has one or more cards with the same ability in hand, has not added
            previously unknown cards to their hand since casting the card found in violation, and has
            self-reported the error before an effect that would reveal it is played, the upgrade does
            not apply and they may swap the card for a card with the appropriate ability in hand.'
          zh: 升级：如果曾以变身或伪装异能施放之牌面朝下的牌张在游戏过程中发现实际上不具相关异能，则处罚为一盘负。如果牌手手上有一张或数张相应具变身或伪装异能的牌，自施放引致违规之牌张后未曾将其他之前未知的牌张加入手牌，且又是在某个效应会将其展示之前自行上报该失误，则不适用此升级，可将手上任一此类牌张与此引致违规之牌张交换。
        type: paragraph
      id: ipg-s2-3-c-additional-remedy-g01
      kind: paragraphs
    id: ipg-s2-3-c-additional-remedy
    labelCode: component.additional-remedy
    role: additional-remedy
  id: ipg-s2-3
  kind: infraction
  number: '2.3'
  penaltyCode: penalty.warning
  title:
    en: Hidden Card Error
    zh: 非公开牌张失误
- components:
  - groups:
    - blocks:
      - id: ipg-s2-4-c-definition-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 374.6
          - 556.07
          - 414.2
          extractionUnit: page-12-line-block
          page: 12
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player makes an error in one of the steps of the mulligan process. Once the mulligan process
            is complete and the game begins, excess cards arising from an improper mulligan is a Game
            Play Error — Hidden Card Error and too few cards is a Game Play Error — Game Rule Violation.
          zh: 牌手再调度流程中的一步出现失误。一旦再调度流程完成并且游戏开始后，由于错误的再调度而产生额外牌张属于游戏行动失误～非公开牌张失误，而牌张过少则属于游戏行动失误～违反游戏规则。
        type: paragraph
      - id: ipg-s2-4-c-definition-g01-b002
        officialPdfUnit:
          bbox:
          - 90.0
          - 429.8
          - 544.68
          - 455.6
          extractionUnit: page-12-line-block
          page: 12
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Unintentional process errors that provide no advantage, such as declaring an intent to mulligan
            early or exiling too many cards to Serum Powder, are not an infraction.
          zh: 流程上无意的失误如不会带来优势，例如提前表明再调度之意图，或使用浆液粉末放逐了太多牌，不属于违规。
        type: paragraph
      id: ipg-s2-4-c-definition-g01
      kind: paragraphs
    id: ipg-s2-4-c-definition
    labelCode: component.definition
    role: definition
  - groups:
    - blocks:
      - id: ipg-s2-4-c-examples-g01-b001
        marker: A
        officialPdfUnit:
          bbox:
          - 108.0
          - 486.2
          - 458.4
          - 498.2
          extractionUnit: page-12-line-block
          page: 12
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player draws eight cards at the start of the game (instead of seven).
          zh: 牌手在游戏开始的时候抓了八张牌（应为七张）。
        type: list-item
      - id: ipg-s2-4-c-examples-g01-b002
        marker: B
        officialPdfUnit:
          bbox:
          - 108.0
          - 500.0
          - 552.67
          - 525.8
          extractionUnit: page-12-line-block
          page: 12
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player chooses to not take a mulligan then takes a mulligan after seeing their opponent
            choose to take a mulligan.
          zh: 牌手先选择不进行再调度，后在看见对手再调度后也进行再调度。
        type: list-item
      id: ipg-s2-4-c-examples-g01
      kind: ordered-list
    id: ipg-s2-4-c-examples
    labelCode: component.examples
    role: examples
  - groups:
    - blocks:
      - id: ipg-s2-4-c-philosophy-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 556.4
          - 553.06
          - 582.2
          extractionUnit: page-12-line-block
          page: 12
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Errors prior to the beginning of the game have a less disruptive option—a forced mulligan—that
            is not available at any other point during the game.
          zh: 较之游戏中的其他时点，在游戏还没开始便发生的失误，还可以采用强制再调度这种影响较小的方式来修正，而其他时点就无法做到这点。
        type: paragraph
      id: ipg-s2-4-c-philosophy-g01
      kind: paragraphs
    id: ipg-s2-4-c-philosophy
    labelCode: component.philosophy
    role: philosophy
  - groups:
    - blocks:
      - id: ipg-s2-4-c-additional-remedy-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 612.8
          - 283.32
          - 624.8
          extractionUnit: page-12-line-block
          page: 12
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: The player takes an additional mulligan.
          zh: 牌手再额外进行一次再调度。
        type: paragraph
      id: ipg-s2-4-c-additional-remedy-g01
      kind: paragraphs
    id: ipg-s2-4-c-additional-remedy
    labelCode: component.additional-remedy
    role: additional-remedy
  id: ipg-s2-4
  kind: infraction
  number: '2.4'
  penaltyCode: penalty.warning
  title:
    en: Mulligan Procedure Error
    zh: 再调度失误
- components:
  - groups:
    - blocks:
      - id: ipg-s2-5-c-definition-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 126.2
          - 556.8
          - 165.8
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: This infraction covers the majority of game situations in which a player makes an error
            or fails to follow a game procedure correctly. It handles violations of the Comprehensive
            Rules that are not covered by the other Game Play Errors.
          zh: 此违规涵盖了大多数关于牌手发生失误，或是没有正确的执行游戏程序而造成的游戏状况。这也用来处理违反完整规则、且未包含在其他游戏行动失误中的违规。
        type: paragraph
      id: ipg-s2-5-c-definition-g01
      kind: paragraphs
    id: ipg-s2-5-c-definition
    labelCode: component.definition
    role: definition
  - groups:
    - blocks:
      - id: ipg-s2-5-c-examples-g01-b001
        marker: A
        officialPdfUnit:
          bbox:
          - 108.0
          - 196.4
          - 397.44
          - 208.4
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player casts Wrath of God for 3W (actual cost 2WW).
          zh: 牌手支付{三}{白}来施放神之愤怒/Wrath of God（正确费用为{二}{白}{白}）。
        type: list-item
      - id: ipg-s2-5-c-examples-g01-b002
        marker: B
        officialPdfUnit:
          bbox:
          - 108.0
          - 210.2
          - 446.16
          - 222.2
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player does not attack with a creature that must attack each turn.
          zh: 牌手没有让每回合都必须攻击的生物来进行攻击。
        type: list-item
      - id: ipg-s2-5-c-examples-g01-b003
        marker: C
        officialPdfUnit:
          bbox:
          - 108.0
          - 224.0
          - 544.8
          - 249.8
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player fails to put a creature with lethal damage into a graveyard and it is not noticed
            until several turns later.
          zh: 牌手没有将受到致命伤害的生物放进坟墓场，且在数个回合之后才发现。
        type: list-item
      - id: ipg-s2-5-c-examples-g01-b004
        marker: D
        officialPdfUnit:
          bbox:
          - 108.0
          - 251.6
          - 523.85
          - 263.6
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A Phyrexian Revoker is on the battlefield that should have had a card named for it.
          zh: 非瑞克西亚断念妖/Phyrexian Revoker 在战场上，当初应为其说一张牌名时却没有说。
        type: list-item
      - id: ipg-s2-5-c-examples-g01-b005
        marker: E
        officialPdfUnit:
          bbox:
          - 108.0
          - 265.4
          - 522.46
          - 277.4
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: A player casts Brainstorm and forgets to put two cards back on top of their library.
          zh: 牌手施放脑力激荡/Brainstorm，却忘记将两张牌放回牌库顶。
        type: list-item
      id: ipg-s2-5-c-examples-g01
      kind: ordered-list
    id: ipg-s2-5-c-examples
    labelCode: component.examples
    role: examples
  - groups:
    - blocks:
      - id: ipg-s2-5-c-philosophy-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 308.0
          - 540.96
          - 361.4
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: While Game Rule Violations can be attributed to one player, they usually occur publicly
            and both players are expected to be mindful of what is happening in the game. It is tempting
            to try and “fix” these errors, but it is important that they be handled consistently, regardless
            of their impact on the game.
          zh: 虽然违反游戏规则通常是归咎于其中一位牌手，但此类情况通常是公开地发生，且双方牌手都应留意游戏中所发生的事情。处理者应尝试去“修复”这些失误，但很重要的是：不论这些失误对游戏有多少影响，处理方式都必须一致。
        type: paragraph
      id: ipg-s2-5-c-philosophy-g01
      kind: paragraphs
    id: ipg-s2-5-c-philosophy
    labelCode: component.philosophy
    role: philosophy
  - groups:
    - blocks:
      - id: ipg-s2-5-c-additional-remedy-g01-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 392.0
          - 323.76
          - 404.0
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: First, consider a simple backup (see section 1.4).
          zh: 首先，考虑是否简易倒回（参见1.4章节）。
        type: paragraph
      - id: ipg-s2-5-c-additional-remedy-g01-b002
        officialPdfUnit:
          bbox:
          - 90.0
          - 419.6
          - 530.88
          - 445.4
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: 'If a simple backup is not sufficient and the infraction falls into one or more of the following
            categories, and only into those categories, perform the appropriate partial fix:'
          zh: 如果简易倒回不足以完全修正，且违规属于下列某种情形或同属多种情形（但不得超出各情形规定之内容），则进行部分修正：
        type: paragraph
      id: ipg-s2-5-c-additional-remedy-g01
      kind: paragraphs
    - blocks:
      - id: ipg-s2-5-c-additional-remedy-g02-b001
        marker: bullet
        officialPdfUnit:
          bbox:
          - 108.0
          - 460.8
          - 544.34
          - 487.64
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If a player forgot to untap one or more permanents at the start of their turn and it is
            still the same turn, untap them.
          zh: 如果牌手在自己回合开始时忘记重置一个或数个永久物，并且当前依然是同一个回合，则重置它们。
        type: list-item
      - id: ipg-s2-5-c-additional-remedy-g02-b002
        marker: bullet
        officialPdfUnit:
          bbox:
          - 108.0
          - 489.24
          - 554.16
          - 516.08
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If a player made an illegal choice (including no choice where required) for a static ability
            generating a continuous effect still on the battlefield, that player makes a legal choice.
          zh: 如果某牌手为某个在战场上之静止式异能产生的持续性效应作出的选择不合法（包括在需要作选择时未如此作），则该牌手重新作出一个符合游戏规则的选择。
        type: list-item
      - id: ipg-s2-5-c-additional-remedy-g02-b003
        marker: bullet
        officialPdfUnit:
          bbox:
          - 108.0
          - 517.68
          - 547.21
          - 544.64
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If a player failed to draw cards, discard cards, or return cards from their hand to another
            zone, that player does so.
          zh: 如果某牌手未能抓牌、弃牌或忘记将牌从手上移至其他区域，则该牌手如此作。
        type: list-item
      - id: ipg-s2-5-c-additional-remedy-g02-b004
        marker: bullet
        officialPdfUnit:
          bbox:
          - 108.0
          - 546.24
          - 548.71
          - 600.68
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If an object is not in the correct zone, the exact object is still known to all players,
            and it can be moved with only minor disruption to the current state of the game, put the object
            in the correct zone. This only applies if the object being in the wrong zone is the Game Rule
            Violation, and not if it is the consequence of a different error.
          zh: 如果一个物件处于错误的区域中，且该物件依然为所有牌手所知悉、移动此物件仅会对游戏当前状态造成轻微影响，则将该物件放入正确区域。此修正仅适用于，当“违反游戏规则”的问题本身，是由于有物件处于错误的区域中而产生的，而非因其他错误导致此类结果的情况。
        type: list-item
      - id: ipg-s2-5-c-additional-remedy-g02-b005
        marker: bullet
        officialPdfUnit:
          bbox:
          - 108.0
          - 602.28
          - 539.5
          - 629.12
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If damage assignment order has not been declared, the appropriate player chooses that order.
          zh: 如果未宣告伤害分配次序，对应牌手决定此顺序。
        type: list-item
      id: ipg-s2-5-c-additional-remedy-g02
      kind: unordered-list
    - blocks:
      - id: ipg-s2-5-c-additional-remedy-g03-b001
        officialPdfUnit:
          bbox:
          - 90.0
          - 644.72
          - 546.89
          - 684.32
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: For each of these fixes, a simple backup may be performed beforehand if it makes applying
            the fix smoother. Triggered abilities are generated from these partial fixes only if they
            would have occurred had the action been taken at the correct time.
          zh: 对于以上各修正而言，如果能让修正更平滑，可以在此之前进行一次简易倒回。对于在部分修正中产生的触发式异能，只有在这些动作在正确的时间进行也会触发的情况下，才会在这些部分修正中产生。
        type: paragraph
      - id: ipg-s2-5-c-additional-remedy-g03-b002
        officialPdfUnit:
          bbox:
          - 90.0
          - 699.92
          - 469.56
          - 711.92
          extractionUnit: page-13-line-block
          page: 13
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: Otherwise, a full backup may be considered or the game state may be left as is.
          zh: 若属于其他情况，则可以考虑进行完整倒回，或保留当前游戏状态不做修正。
        type: paragraph
      - id: ipg-s2-5-c-additional-remedy-g03-b003
        officialPdfUnit:
          bbox:
          - 90.0
          - 56.84
          - 557.93
          - 179.24
          extractionUnit: page-14-line-block
          page: 14
          pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
        text:
          en: If the game has proceeded past a point where an opponent could reasonably be expected to
            notice the error, the opponent has also committed an infraction. In most cases, the infraction
            is Game Play Error — Failure to Maintain Game State. However, if the judge believes that both
            players were responsible for the Game Rule Violation, such as due to the opponent controlling
            the continuous effect modifying the rules of the game that led to the Game Rule Violation
            or a player taking action based on another player’s instruction, they have instead committed
            a Game Play Error — Game Rule Violation. For example, if a player casts Path to Exile on an
            opponent’s creature and the opponent puts the creature into the graveyard, once the game has
            continued both players will have committed a Game Rule Violation.
          zh: 如果对手没能在预期其能注意到失误的合理时间点前指出游戏行动失误，则对手也犯下违规。大多数情况下是“游戏行动失误～未维护游戏状态”。然而如果裁判认为双方牌手在本次违反游戏规则的过程中均有责任，例如是由于对手操控的改变游戏规则的持续性效应导致的，或是某位牌手根据另一位牌手的指示执行行动，则对手也犯下了“游戏行动失误～违反游戏规则”违规。例如，如果牌手向对手的生物施放流放之径/Path
            to Exile，且该对手将此生物放进坟墓场，一旦游戏继续进行则双方牌手均犯下“游戏行动失误～违反游戏规则”违规。
        type: paragraph
      id: ipg-s2-5-c-additional-remedy-g03
      kind: paragraphs
    id: ipg-s2-5-c-additional-remedy
    labelCode: component.additional-remedy
    role: additional-remedy
