          text:
            en: Triggered abilities are common and invisible, so players should not be harshly penalized when
              forgetting about one.
            zh: 触发式异能属于常见异能，且其机制较为隐蔽，因此不应在牌手忘记处理该类异能时即对其采取严厉的惩罚措施。
          legacyRawUnits:
