- id: ipg-s2-1
  kind: infraction
  number: '2.1'
  title:
    en: Missed Trigger
    zh: 遗漏触发
  components:
  - id: ipg-s2-1-c-definition
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-s2-1-c-definition-g01
      kind: paragraphs
      blocks:
      - id: ipg-s2-1-c-definition-g01-b001
        type: paragraph
        text:
          en: A triggered ability triggers, but the player controlling the ability doesn’t demonstrate
            awareness of the trigger’s existence by the first time that it would affect the game in a
            visible fashion.
          zh: 某个触发式异能触发，但于该异能将首度对游戏产生可见影响时，操控该异能的牌手未能表明自己认识到此触发的存在。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 7
          bbox:
          - 90.0
          - 320.6
          - 549.35
          - 346.4
          extractionUnit: extract-p07-l014..extract-p07-l015
        legacyRawUnits:
        - raw-L000727
        - raw-L000729
      - id: ipg-s2-1-c-definition-g01-b002
        type: paragraph
        text:
          en: 'The point by which the player needs to demonstrate this awareness depends on the impact
            that the trigger would have on the game:'
          zh: 根据不同的触发对游戏产生之影响不同，牌手需要表明自己认识触发存在的最迟时点也有所差异：
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 7
          bbox:
          - 90.0
          - 362.0
          - 542.86
          - 387.8
          extractionUnit: extract-p07-l016..extract-p07-l017
        legacyRawUnits:
        - raw-L000743
        - raw-L000745
    - id: ipg-s2-1-c-definition-g02
      kind: unordered-list
      blocks:
      - id: ipg-s2-1-c-definition-g02-b001
        type: list-item
        text:
          en: 'A triggered ability that requires its controller to choose targets (other than ''target
            opponent''), modes, or other choices made when the ability is put onto the stack: The controller
            must announce those choices before they next pass priority.'
          zh: 对于需要其操控者选择目标（注记“目标对手”者除外）、模式，或具在将异能放进堆叠时便需作出决定之其他选择的触发式异能而言：其操控者必须在其下一次让出优先权之前宣告该些决定。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 7
          bbox:
          - 108.0
          - 403.2
          - 553.92
          - 443.84
          extractionUnit: extract-p07-l018..extract-p07-l020
        marker: bullet
        legacyRawUnits:
        - raw-L000751
        - raw-L000753
      - id: ipg-s2-1-c-definition-g02-b002
        type: list-item
        text:
          en: 'A triggered ability that causes a change in the visible game state (including life totals)
            or requires a choice upon resolution: The controller must take the appropriate physical action
            or acknowledge the specific trigger before taking any game actions (such as casting a sorcery
            spell or explicitly taking an action in the next step or phase) that can be taken only after
            the triggered ability should have resolved. Note that passing priority, casting an instant
            spell or activating an ability doesn’t mean a triggered ability has been forgotten, as it
            could still be on the stack.'
          zh: '对于会对游戏的可见状态（包括牌手的总生命）产生影响，或是需要在结算时作出决定的触发式异能而言：其操控者在执行只有在该触发式异能结算完毕之后才有可能进行的任何游戏动作（例如施放法术咒语，或明确执行了下一个步骤或阶段中的动作）之前，就必须作出与此类触发式异能相对应的实际动作，或表明自己认识此触发的存在。


            请注意，让过优先权、施放瞬间咒语或起动异能这类动作并不表明牌手已遗忘触发式异能，因为在此情况下该触发式异能可能仍在堆叠之上。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 7
          bbox:
          - 108.0
          - 445.44
          - 552.53
          - 541.28
          extractionUnit: extract-p07-l021..extract-p07-l027
        marker: bullet
        legacyRawUnits:
        - raw-L000767
        - raw-L000769
        - raw-L000783
        - raw-L000785
        readingSegments:
        - id: ipg-s2-1-c-definition-g02-b002-rs-db2aac908f8f
          sourceRange:
          - 0
          - 417
          text:
            en: 'A triggered ability that causes a change in the visible game state (including life totals) or
              requires a choice upon resolution: The controller must take the appropriate physical action or acknowledge
              the specific trigger before taking any game actions (such as casting a sorcery spell or explicitly
              taking an action in the next step or phase) that can be taken only after the triggered ability should
              have resolved.'
            zh: 对于会对游戏的可见状态（包括牌手的总生命）产生影响，或是需要在结算时作出决定的触发式异能而言：其操控者在执行只有在该触发式异能结算完毕之后才有可能进行的任何游戏动作（例如施放法术咒语，或明确执行了下一个步骤或阶段中的动作）之前，就必须作出与此类触发式异能相对应的实际动作，或表明自己认识此触发的存在。
          legacyRawUnits:
          - raw-L000767
          - raw-L000769
        - id: ipg-s2-1-c-definition-g02-b002-rs-da5b4f0e4bc6
          sourceRange:
          - 417
          - 582
          text:
            en: Note that passing priority, casting an instant spell or activating an ability doesn’t mean a triggered
              ability has been forgotten, as it could still be on the stack.
            zh: 请注意，让过优先权、施放瞬间咒语或起动异能这类动作并不表明牌手已遗忘触发式异能，因为在此情况下该触发式异能可能仍在堆叠之上。
          legacyRawUnits:
          - raw-L000783
          - raw-L000785
      - id: ipg-s2-1-c-definition-g02-b003
        type: list-item
        text:
          en: 'A triggered ability that changes the rules of the game: The controller must acknowledge
            the trigger or stop an opponent who tries to take any resulting illegal action.'
          zh: 对于改变了游戏规则的触发式异能而言：其操控者必须认识此触发，或在对手尝试执行因此变为不合法的动作时阻止之。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 7
          bbox:
          - 108.0
          - 542.88
          - 556.2
          - 569.84
          extractionUnit: extract-p07-l028..extract-p07-l029
        marker: bullet
        legacyRawUnits:
        - raw-L000791
        - raw-L000793
      - id: ipg-s2-1-c-definition-g02-b004
        type: list-item
        text:
          en: 'A triggered ability that affects the game state in non-visible ways: The controller must
            make the change known by the first time the change has an effect on the visible game state.'
          zh: 对于会以不可见的方式对游戏状态产生影响的触发式异能而言：其操控者必须于此类触发首度对游戏的可见状态造成影响时，让所有人知晓影响为何。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 7
          bbox:
          - 108.0
          - 571.44
          - 533.78
          - 612.08
          extractionUnit: extract-p07-l030..extract-p07-l032
        marker: bullet
        legacyRawUnits:
        - raw-L000811
        - raw-L000813
    - id: ipg-s2-1-c-definition-g03
      kind: paragraphs
      blocks:
      - id: ipg-s2-1-c-definition-g03-b001
        type: paragraph
        text:
          en: Once any of the above obligations has been fulfilled, further problems are treated as a
            Game Play Error — Game Rule Violation.
          zh: 只要牌手履行了上述各项义务的任意一项，由此产生的其他问题便应按照“游戏行动失误～违反游戏规则”来处理。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 7
          bbox:
          - 90.0
          - 627.68
          - 557.52
          - 653.48
          extractionUnit: extract-p07-l033..extract-p07-l034
        legacyRawUnits:
        - raw-L000827
        - raw-L000829
      - id: ipg-s2-1-c-definition-g03-b002
        type: paragraph
        text:
          en: If the turn-based action of putting a lore counter on a Saga is missed, it should be handled
            as though it was a missed trigger.
          zh: 如果在传纪上放置学问指示物的回合动作被遗忘了，将这个问题视作遗漏触发来处理。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 7
          bbox:
          - 90.0
          - 669.08
          - 533.39
          - 694.88
          extractionUnit: extract-p07-l035..extract-p07-l036
        legacyRawUnits:
        - raw-L000840
        - raw-L000842
      - id: ipg-s2-1-c-definition-g03-b003
        type: paragraph
        text:
          en: Triggered abilities that do nothing except create delayed triggered abilities automatically
            resolve without requiring acknowledgment. Awareness of the resulting delayed trigger must
            be demonstrated at the appropriate point. Triggered abilities that do nothing except create
            one or more copies of a spell or ability (such as storm or cipher) automatically resolve,
            but awareness of the resulting objects must be demonstrated using the same requirements as
            described above (even though the objects may not be triggered abilities).
          zh: '对于只会产生延时触发式异能，而没有其他效应的触发式异能而言，此类触发会自动结算，牌手不需特别指出此类触发的存在。牌手必须在恰当的时点，表明自己认识到因此产生之延时触发式异能的存在。


            对于只会产生咒语或异能之一个或数个复制品，而没有其他效应的触发式异能（例如风暴或暗码）而言，此类触发会自动结算，但牌手仍需依照上文所述的要求，在相应时点表明自己认识到由此产生之各物件的存在（就算此类物件不属于触发式异能也是一样）。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 8
          bbox:
          - 90.0
          - 56.84
          - 556.84
          - 137.84
          extractionUnit: extract-p08-l001..extract-p08-l006
        legacyRawUnits:
        - raw-L000852
        - raw-L000854
        - raw-L000860
        - raw-L000862
        readingSegments:
        - id: ipg-s2-1-c-definition-g03-b003-rs-5a8a3388a024
          sourceRange:
          - 0
          - 224
          text:
            en: Triggered abilities that do nothing except create delayed triggered abilities automatically resolve
              without requiring acknowledgment. Awareness of the resulting delayed trigger must be demonstrated
              at the appropriate point.
            zh: 对于只会产生延时触发式异能，而没有其他效应的触发式异能而言，此类触发会自动结算，牌手不需特别指出此类触发的存在。牌手必须在恰当的时点，表明自己认识到因此产生之延时触发式异能的存在。
          legacyRawUnits:
          - raw-L000852
          - raw-L000854
        - id: ipg-s2-1-c-definition-g03-b003-rs-1bca48e427be
          sourceRange:
          - 224
          - 528
          text:
            en: Triggered abilities that do nothing except create one or more copies of a spell or ability (such
              as storm or cipher) automatically resolve, but awareness of the resulting objects must be demonstrated
              using the same requirements as described above (even though the objects may not be triggered abilities).
            zh: 对于只会产生咒语或异能之一个或数个复制品，而没有其他效应的触发式异能（例如风暴或暗码）而言，此类触发会自动结算，但牌手仍需依照上文所述的要求，在相应时点表明自己认识到由此产生之各物件的存在（就算此类物件不属于触发式异能也是一样）。
          legacyRawUnits:
          - raw-L000860
          - raw-L000862
      - id: ipg-s2-1-c-definition-g03-b004
        type: paragraph
        text:
          en: Abilities consisting of an action followed by “when you do” in the same ability are considered
            communicated by the announcement of the action. This is most commonly the case for exert and
            similar abilities.
          zh: 一些异能包括一个动作以及紧跟其后的“当你如此作”异能。此类异能视为在宣告该动作之后就已声明。这种情形通常包括耗竭和其他一些类似的异能。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 8
          bbox:
          - 90.0
          - 153.44
          - 553.8
          - 193.04
          extractionUnit: extract-p08-l007..extract-p08-l009
        legacyRawUnits:
        - raw-L000868
        - raw-L000870
      - id: ipg-s2-1-c-definition-g03-b005
        type: paragraph
        text:
          en: If a triggered ability would have no impact on the game, it’s not an infraction to fail
            to demonstrate awareness of it. For example, if the effect of a triggered ability instructs
            its controller to sacrifice a creature, a player who controls no creatures isn’t required
            to demonstrate awareness of the ability. Similarly, a player demonstrating awareness of an
            optional trigger with no visible effect is assumed to have made the affirmative choice unless
            the opponent responds.
          zh: '如果某个触发式异能不会对游戏造成影响，则就算牌手没有认识到此触发的存在，也不会算作违规。


            举例来说，若某触发式异能的效应要求此异能的操控者牺牲一个生物，则未操控生物的牌手并不需要特别指出该触发的存在。


            类似地，如果某牌手表明自己认识到无可见效应之非强制性触发的存在，则除非对手有回应，否则便应视为其已选择依可选项行事。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 8
          bbox:
          - 90.0
