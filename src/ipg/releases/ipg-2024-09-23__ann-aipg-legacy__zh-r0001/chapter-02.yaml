          - 379
          text:
            en: If a judge believes a player is intentionally not pointing out other players’ illegal actions,
              either for their own advantage, or in the hope of bringing it up at a more strategically advantageous
              time, they should consider an Unsporting Conduct — Cheating infraction.
            zh: 如果裁判认为牌手系出于“此状况对己方有利”，或是“希望等到战略上对己方更有利的时候再提出”这一类的考量，而蓄意未指出其他牌手之违规行动，则应考虑适用“举止违背运动道德～作弊”之违规。
