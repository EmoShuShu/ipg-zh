publicationAnnotations:
- id: ipg-ann-section-2-5-definition-context
  anchor:
    type: block
    id: ipg-s2-5-c-definition-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-section-2-5-definition-context-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-section-2-5-definition-context-g01-b01
      type: paragraph
      text:
        en: “Game Rule Violation” does not refer to any particular type of error. Rather, Game Rule Violations
          are specifically defined as errors that aren’t another infraction. Newer judges will sometimes
          talk about how “mis-resolving a spell” is a Game Rule Violation. In actuality, resolving a spell
          improperly could result in one of several different infractions, such as Looking at Extra Cards
          (e.g. forgetting that Courser of Kruphix left the battlefield) to Hidden Card Error (e.g. mis-reading
          Divination and drawing three cards).
        zh: “违反游戏规则”不指代任何特定类型的错误。然而，违反游戏规则明确定义为所有不能归类为其他违规的错误。新裁判有时会讨论“错误地结算一个咒语”是否应当是违反游戏规则。事实上，不正确的结算咒语可能会导致另一些违规，像是额外看牌（如忘记了克罗芬斯的骏马已经离开战场）及非公开牌张失误（看错了卜卦的叙述而抓了3张牌）等。
      sourceRawUnits:
      - raw-L001717
      - raw-L001719
- id: ipg-ann-2-5-philosophy-consistency
  anchor:
    type: block
    id: ipg-s2-5-c-philosophy-g01-b001
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-5-philosophy-consistency-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-philosophy-consistency-g01-b01
      type: paragraph
      text:
        en: Consistency is a core principle of the IPG. Even though there are thousands of judges adjudicating
          tournaments across the world, it is important for each of these tournaments to be run and judged
          to the same standard. For this reason, we strive to handle penalties neutrally. Fundamentally,
          both players are responsible for maintaining a proper game state. Our core role as judges is
          not to “correct” or “fix” the players’ mistakes, but to dispassionately interpret and apply
          the fixes prescribed by the IPG.
        zh: 一致性是IPG的核心原则。以同样的标准执法世界各地的比赛是很重要的事，即使这些比赛由数以千计的不同裁判来执法。因此，我们致力于处理处罚的中立性。从根本上来说，双方牌手都有责任保持正确的游戏状态。作为裁判，我们的核心作用不是改正或者修复牌手的错误，而是冷静地解释并应用IPG中规定的修正。
      sourceRawUnits:
      - raw-L001749
      - raw-L001751
- id: ipg-ann-2-5-partial-fix-list
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g01-b002
  position: after
  order: 30
  groups:
  - id: ipg-ann-2-5-partial-fix-list-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-partial-fix-list-g01-b01
      type: paragraph
      text:
        en: So right here we are going to have a list of partial fixes. Try to do a simple backup (see
          Backing Up 1.4 for more information about back ups) then, if you can’t, you can try to do a
          partial fix. If you cannot apply a simple backup or a partial fix  you evaluate if you need
          to do a back up or leave alone. If the error fits more than one of these categories, it’s ok
          to partial fix, but be careful that the error only fits into those categories. If there are
          multiple fixes within the same bullet point, you’re still fine to use that partial fix.
        zh: 以下是部分修正的列表。首先试着进行简易倒回（关于倒回，详见一节）；如果简易倒回不够，你可以试着执行部分修正。如果你既不能进行简易倒回、也不能执行部分修正，那么你可以考虑倒回或者保留当前状态不修正。如果失误属于一种类别以上，可以使用部分修正，但必须小心注意该失误只属于这些类别。如果在同一条目中满足了多个修正条件，你仍然可以使用这种部分修正。
      sourceRawUnits:
      - raw-L001763
      - raw-L001765
- id: ipg-ann-2-5-untap
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g02-b001
  position: after
  order: 40
  groups:
  - id: ipg-ann-2-5-untap-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-untap-g01-b01
      type: paragraph
      text:
        en: Out-of-Order-Sequencing has always been a viable option when this type of situation arises,
          and it does so with some regularity. Players get excited, or simply lose focus and forget to
          untap everything before advancing into the turn. If that happens, we simply issue the warning
          and fix the mistake, by untapping those permanents now.
        zh: 发生这种情况时，判定为“次序不当的行事顺序”也是一个合适的选项，过去我们也一直这样做。在进入回合之前，牌手容易因为激动或者注意力不集中而忘记对场面进行重置。发生这种情况时，我们只需给予警告并通过重置本该重置的永久物来修正错误。
      sourceRawUnits:
      - raw-L001771
      - raw-L001773
- id: ipg-ann-2-5-illegal-choice
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g02-b002
  position: after
  order: 50
  groups:
  - id: ipg-ann-2-5-illegal-choice-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-illegal-choice-g01-b01
      type: paragraph
      text:
        en: This partial fix refers to cards such as True-Name Nemesis, Voice of All or a Siege from Fate
          Reforged, which require the choice of a player or color as they enter the battlefield. The reasoning
          for this is similar to why we apply state-based actions — it is impossible for these cards to
          exist on the battlefield without a choice being made for them, so we correct that immediately.
          While this could lead to the perception of advantage for one player, such errors always occur
          publicly, so it is in both player’s interest to be attentive.So, if Nick casts Doom Blade on
          Albert’s Voice of All, we can have Albert chose a color now. If Albert chooses Black, Doom Blade
          is now illegal. Then, we can do a simple backup to just before Doom Blade was cast.
        zh: 这种部分修正是指像真名宿敌、万物使者或是龙命殊途™中的围攻牌，这些需要于其进场时选择牌手或颜色之类选项的牌。这样做的原因与我们执行状态动作的原因差不多——这些牌没有做出选择的话就无法进入战场，所以我们应当立刻纠正。虽然这可能会让人产生其中一个牌手会获得优势的看法，但错误是公开发生的，所以双方牌手都需要注意。所以，如果Nick对Albert的万物使者施放送终刀锋，我们可以让Albert现在选择一种颜色。如果Albert选择了黑色，送终刀锋的目标就会变得不合法。接着，我们可以进行一次简易倒回，回到送终刀锋被施放之前的状态。
      sourceRawUnits:
      - raw-L001779
      - raw-L001781
- id: ipg-ann-2-5-hand-zone
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g02-b003
  position: after
  order: 60
  groups:
  - id: ipg-ann-2-5-hand-zone-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-hand-zone-g01-b01
      type: paragraph
      text:
        en: Players will generally be able to determine with high accuracy if they failed to draw or discard
          cards. Note that this partial fix does not expire, even if the error was many turns ago.
        zh: 牌手如果未能抓牌或者弃牌他们一般都能较为准确地确定。注意，这种部分修正没有时效限制，即使错误是数回合前发生的，也应执行修正。
      sourceRawUnits:
      - raw-L001787
      - raw-L001789
- id: ipg-ann-2-5-wrong-zone
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g02-b004
  position: after
  order: 70
  groups:
  - id: ipg-ann-2-5-wrong-zone-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-wrong-zone-g01-b01
      type: paragraph
      text:
        en: There is a fair amount to consider here. There are four tests to determine if this partial
          fix is relevant. 1) Is the object not in the correct zone.  This covers when a creature died
          but shouldn’t have, or when a creatures shouldn’t have died but did.  It also covers if a card
          was supposed to be bounced as wasn’t or a card was put in the GY when it should have been exiled.  Basically,
          if the game was played correctly, that card should be somewhere else. 2) The identity of the
          object was known to all players. This means that all players know what the object is. This could
          be because the card was revealed or it could be because the card is in a location known by both
          players such as the top of a library. 3) The movement of the card (or lack of movement) is the
          error, not the result of some other error.  For example, if a Path to Exile was case for {C},
          and the card was put in exile; that is not eligible for this partial fix because the error was
          in casting Path for {C}.
        zh: 这里有不少需要考量的因素。要确定此项部分修正是否适用，需要进行四项测试：该物件是否不在正确的区域？这涵盖了生物本不该死却死了，或者生物本该死却没死的情况。这也包括牌本该被回手却没移回，或者牌本该被放逐却进了坟墓场的情况。简而言之，如果游戏进行正确，该牌应当处于其他位置。是否所有牌手都知晓该物件的身份？这意味着所有牌手都知道那个物件具体是什么。这可能是因为该牌曾被展示过，或者因为它处于双方都知道的位置，例如已知的牌库顶。失误是否是牌的移动（或未移动）本身，而非其他失误导致的后果？例如，如果某人用方片施放了流放之径并将目标牌放逐了；这种情况就不适用此项部分修正，因为错误的根源在于用方片施放了流放之径。
      sourceRawUnits:
      - raw-L001795
      - raw-L001799
    - id: ipg-ann-2-5-wrong-zone-g01-b02
      type: paragraph
      text:
        en: '– “and it can be moved with only minor disruption to the current game state”: Things disappearing
          from the battlefield mid-combat tends to be disruptive. Same with things disappearing from the
          GY while certain spells are on the stack. Be sure to look at what decisions and actions are
          currently being made based on that card being where it is.'
        zh: ——“移动此物件仅会对游戏当前状态造成轻微影响”：在战斗阶段中让东西从战场消失往往会造成严重的干扰。当堆叠上有特定咒语时，让东西从坟墓场消失也是如此。务必审视当前正在做出的决定和动作是否基于该牌当前所处的位置。
      sourceRawUnits:
      - raw-L001797
      - raw-L001801
- id: ipg-ann-2-5-damage-order
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g02-b005
  position: after
  order: 80
  groups:
  - id: ipg-ann-2-5-damage-order-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-damage-order-g01-b01
      type: paragraph
      text:
        en: This is a dead partial fix.  Damage assignment order has been removed from the CR.  The IPG
          just hasn’t had an update since then.
        zh: 这是一个已经失效的部分修正。伤害分配顺序已经从CR中移除了。只是 IPG 自那以后还没有进行更新。
      sourceRawUnits:
      - raw-L001807
      - raw-L001809
- id: ipg-ann-2-5-partial-fix-backup
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g03-b001
  position: after
  order: 90
  groups:
  - id: ipg-ann-2-5-partial-fix-backup-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-partial-fix-backup-g01-b01
      type: paragraph
      text:
        en: A simple backup is backing up the last action completed (or one currently in progress) and
          is sometimes used to make another portion of the prescribed remedy smoother. A simple backup
          should not involve any random elements. Also while applying a partial fix consider the triggered
          abilities if they would have occurred while taking the action at the correct time.
        zh: 简易倒回意指倒回上一个已完成的（或正在进行的）游戏动作，有时可用来使前述之修正的某一部分更加平滑。简易倒回不应涉及任何随机元素。另外，在执行部分修正时，应将在正确的时点作该动作时本应发生的触发式异能考虑在内。
      sourceRawUnits:
      - raw-L001815
      - raw-L001817
- id: ipg-ann-2-5-full-backup
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g03-b002
  position: after
  order: 100
  groups:
  - id: ipg-ann-2-5-full-backup-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-full-backup-g01-b01
      type: paragraph
      text:
        en: So, we look to see if any of the partial fixes apply, and if not, we either rewind or don’t.
          Please see 1.4 Backing Up for information on if it’s appropriate to back up. For example, if
          players missed a Day/Night change in the game, it may make since to back up to the point of
          day/night transformation. However, if a full backup is ill advised, the day/night state will
          remain as it is.
        zh: 所以，我们先试图执行简易倒回；如果简易倒回不能适用，再看看是否有任何一个部分修正能够适用，如果没有，我们可以选择是否倒回。关于如何确定倒回是否恰当的信息，请参阅IPG 1.4节。例如，如果牌手遗漏了游戏中的白昼/黑夜转换，那么倒回到转换发生的那个时间点可能是合理的。然而，如果不建议进行完全倒回，那么白昼/黑夜状态将保持现状。
      sourceRawUnits:
      - raw-L001823
      - raw-L001825
- id: ipg-ann-2-5-opponent-responsibility
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g03-b003
  position: after
  order: 110
  groups:
  - id: ipg-ann-2-5-opponent-responsibility-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-opponent-responsibility-g01-b01
      type: paragraph
      text:
        en: This is simply the definition of Game Play Error – Failure to Maintain Game State, and goes
          back to the concept that keeping the game in a legal and clear state is both players responsibility.
        zh: 这就是游戏行动失误～未维护游戏状态的定义。它涉及的概念就是双方牌手都有责任去维护合法、清晰的游戏状态。
      sourceRawUnits:
      - raw-L001831
      - raw-L001833
- id: ipg-ann-2-5-shared-grv
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g03-b003
  position: after
  order: 120
  groups:
  - id: ipg-ann-2-5-shared-grv-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-5-shared-grv-g01-b01
      type: paragraph
      text:
        en: As always, both players are responsible for maintaining a clear game state. If my card tells
          you to take an action, and you do it incorrectly, whose fault is it? Yours for doing the action
          incorrectly, or mine for not making sure my spell resolved correctly? Turns out, in this case,
          it’s reasonable to say we are both equally at fault. Fundamentally if the judge thinks that
          both players share the responsibility for the error, because of continuous effects or both participating
          in the action, then both players receive this penalty. Another example of a situation that both
          players are responsible for, is the transition from day/night or night/day, provided there are
          permanents on the battlefield that care about night/day
        zh: 一如既往地，双方牌手都有责任维护清晰的游戏状态。如果我的牌要求你做一个动作，而你做错了，那是谁的错？是你错误的动作还是我没有确保咒语正确结算？事实上，我们有理由说，在这种情况下双方都是有过错的。基本上，如果裁判认为两位牌手对失误都有责任，无论是因为持续性效应还是因为两人均参与了动作，两位牌手都会受到此判罚。另一个双方牌手都要负责的例子是白昼/黑夜的转换，前提是战场上有在意白昼/黑夜的永久物。
      sourceRawUnits:
      - raw-L001835
      - raw-L001839
    - id: ipg-ann-2-5-shared-grv-g01-b02
      type: paragraph
      text:
        en: Note that this double GRV only applies *after* the game has moved on from the point of the
          error. If, in the example above, one player puts the creature into the graveyard, it’s not a
          double GRV until the game continues on. Instead, if one player points out the error, play can
          continue on with the error corrected and no infraction assessed.
        zh: 请注意，这种双方都判GRV仅在游戏从错误发生点继续进行之后才适用。在上述例子中，如果一名牌手将生物放入坟墓场，在游戏继续进行之前，这还不算双方都判GRV。相反，如果当时有一名牌手指出了错误，游戏可以在纠正错误后继续，而不判处违规。
      sourceRawUnits:
      - raw-L001837
      - raw-L001841
- id: ipg-ann-2-4c4a03e8c186
  anchor:
    type: block
    id: ipg-s2-c-body-g01-b001
    segmentId: ipg-s2-c-body-g01-b001-rs-eb6eab424795
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-4c4a03e8c186-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-4c4a03e8c186-g01-b01
      type: paragraph
      text:
        en: This is the first of three broad categories of infractions. This covers unintentional violations
          of the Comprehensive Rules — errors in actually playing the game, and not violations of tournament
          policy or other negative behavior.
        zh: 这是三大类违规行为的第一类。这类违规包含的是游戏中无意中违反CR造成的违规，而非违反比赛方针或犯下其他负面行为。
      sourceRawUnits:
      - raw-L000657
      - raw-L000661
    - id: ipg-ann-2-4c4a03e8c186-g01-b02
      type: paragraph
      text:
        en: These are errors committed by at least one player during a match by unintentionally violating
          a Comprehensive Rule. Game Play Errors can occur for many reasons. Players get tired, get distracted,
          play too fast, or don’t know the cards or the rules that apply to a complex situation well enough.
          These situations are not exceptional, which is why Game Play Errors are a common category of
          error.
        zh: 这些失误是由于至少一位牌手在比赛中无意违反《万智牌完整规则》中的某一条而造成的。游戏行动失误发生的原因可能有很多：牌手累了，分心了，打得太快，不熟悉牌或不够了解某些复杂情况下的适用的规则等。不幸的是，这些情况非常容易发生，这就是为什么游戏行动失误这类失误十分常见。
      sourceRawUnits:
      - raw-L000659
      - raw-L000663
- id: ipg-ann-2-9383ba27f8e1
  anchor:
    type: block
    id: ipg-s2-c-body-g01-b001
    segmentId: ipg-s2-c-body-g01-b001-rs-e182026d8083
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-9383ba27f8e1-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-9383ba27f8e1-g01-b01
      type: paragraph
      text:
        en: Given the complexity of the game, it is impossible to make a list of all the types of errors
          that can occur, so we, as judges, don’t try. We want this document to be understandable and
          learnable. If we list everything and handle all special cases, this document would be hundreds
          of pages long and unusable. Instead, we divide these errors into general categories, known as
          the 5 Game Play Errors defined by the IPG.
        zh: 鉴于万智牌游戏的复杂性，将所有可能发生的错误之类型一一列举是不可能的。所以我们作为裁判，也不打算尝试去列举。我们希望这份文件是可以被理解和学习的。如果我们列举了所有东西、顾及了所有特殊情形，这份文件就可能有几百页长，无法使用。因此，我们将这些错误进行大致的分类，也就是IPG中定义的5种游戏行动失误。
      sourceRawUnits:
      - raw-L000669
      - raw-L000671
- id: ipg-ann-2-9715c6f11fcc
  anchor:
    type: block
    id: ipg-s2-c-body-g01-b001
    segmentId: ipg-s2-c-body-g01-b001-rs-f3518a80e04a
  position: after
  order: 30
  groups:
  - id: ipg-ann-2-9715c6f11fcc-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-9715c6f11fcc-g01-b01
      type: paragraph
      text:
        en: While it may be difficult, at first glance, to see which category that some particular infraction
          falls into, careful reading of the entire infraction — the definition, philosophy, and remedy,
          can help make the determination.
        zh: 虽然某些违规第一眼看上去很难将其归类，但经过对违规的仔细阅读——包括定义、原则、修正等——可以帮你确定违规的类型。
      sourceRawUnits:
      - raw-L000677
      - raw-L000679
- id: ipg-ann-2-acedf406bd07
  anchor:
    type: block
    id: ipg-s2-c-body-g01-b002
    segmentId: ipg-s2-c-body-g01-b002-rs-6f34188f0894
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-acedf406bd07-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-acedf406bd07-g01-b01
      type: paragraph
      text:
        en: 'Errors committed intentionally, of course, may fall into a different category altogether:
          Unsporting Conduct — Cheating. However, it’s important to notice that not all game errors are
          cheating. In fact, very few actually are.'
        zh: 故意犯下的违规，显然属于另一种违规：举止违背运动道德～作弊。很重要的一点，是记住并非所有游戏错误都是作弊。事实上，只有极少部分才是作弊。
      sourceRawUnits:
      - raw-L000685
      - raw-L000689
    - id: ipg-ann-2-acedf406bd07-g01-b02
      type: paragraph
      text:
        en: We like to assume players are nice, and when we walk up to a table, we aren’t accusing people
          of cheating. That might change once we ask a few questions, but when we start out, our baseline
          assumption is that we are dealing with an honest mistake.
        zh: 我们通常会假设牌手是正直的，当我们走到桌前，我们并不指责任何人在作弊。也许我们问了几个问题后会改变想法，但是当我们开始时，我们的基础假设是我们正在处理一个诚实的错误。
      sourceRawUnits:
      - raw-L000687
      - raw-L000691
- id: ipg-ann-2-2c8bc9b604c3
  anchor:
    type: block
    id: ipg-s2-c-body-g01-b002
    segmentId: ipg-s2-c-body-g01-b002-rs-0c37f7b3cf90
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-2c8bc9b604c3-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-2c8bc9b604c3-g01-b01
      type: paragraph
      text:
        en: This is the other side of the coin; even if the task of a judge is always to help the players,
          we must never forget that they can lie or cheat to get an advantage. The experience and advice
          of more experienced judges can help to frame the situation correctly and to find out if a player
          was aware of committing an offense or not.
        zh: 如同硬币的另一面，即使帮助牌手是裁判的任务，我们也决不能忘记他们可能会通过撒谎以及作弊来获取优势。来自经验更加丰富裁判的经验和建议有助于正确分析情形，并推断出牌手的违规是否明知故犯。
      sourceRawUnits:
      - raw-L000697
      - raw-L000699
- id: ipg-ann-2-24e2a860a3f7
  anchor:
    type: block
    id: ipg-s2-c-body-g01-b003
    segmentId: ipg-s2-c-body-g01-b003-rs-42523c863539
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-24e2a860a3f7-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-24e2a860a3f7-g01-b01
      type: paragraph
      text:
        en: We want players to learn something from their mistakes and take care to not commit them again
          in the future. If a player repeatedly makes mistakes, the Warning is not doing its job of reinforcing
          the lesson, and therefore we must increase the severity of the penalty to a Game Loss. When
          giving a Game Play Error to a player, be sure to ask if they have received the infraction before.
          Note that this is the third warning in a category, not the third infraction. If a player has
          received 2 Hidden Card Errors that have been upgraded to Game Losses, and they commit a third
          Hidden Card Error that does not meet the upgrade criteria, that warning is not upgraded to a
          Game Loss.
        zh: 我们希望牌手从错误中学到教训并在未来小心不再犯。如果一个牌手重复犯错，警告已经不足以加强教训，因此我们必须增加判罚的严厉程度到一盘负。当我们给予一个牌手游戏行动失误判罚时，一定要询问他们此前有没收到同种判罚。注意这是同一个问题的第三次警告，而不是第三次判罚。如果一个牌手已经两次因非公开牌张失误的升级判罚而获得过一盘负，之后犯下了第三次非公开牌张失误但并没有达到升级的标准，那么该警告不会被升级为一盘负。
      sourceRawUnits:
      - raw-L000705
      - raw-L000709
    - id: ipg-ann-2-24e2a860a3f7-g01-b02
      type: paragraph
      text:
        en: 'Regarding the Failure to Maintain Game State infraction, be prepared for some players to
          not understand why they are getting a Warning. “But judge, I didn’t do anything wrong?” Take
          a few seconds to explain to the player why they are getting the Warning, and if they still wishes
          to discuss it, you can talk about it after the match. While they still get the Warning, we do
          not upgrade this infraction as we do other tournament errors. This is because we do not want
          players to fear calling a judge. Being awarded a Game Loss because my opponents made play mistakes
          and I didn’t catch doesn’t make sense. And, if this is the third time that my opponent has made
          a play mistake that I didn’t catch right away, , I might be reluctant to call a judge and have
          my Failure to Maintain Game State upgraded, so I choose to pretend that I didn’t notice. We
          don’t want our policy to encourage cheating. If we don’t upgrade this penalty, though, why give
          Warnings at all? There are two reasons: the first is that the act of receiving a Warning is
          generally enough to remind a player to pay more attention. The second is so we can track them.
          If a player tends to get Failure to Maintain Game State a lot, and the related error is always
          in their favor, this gives judges the ability to track these infractions — and when added to
          the larger infraction database, we can track across events too.'
        zh: 对于未维护游戏状态这个判罚，很多牌手不理解为什么他们要吃到警告：“裁判，我没做错啥啊？”请花费一点时间跟牌手解释一下为什么他们会得到这个判罚，如果牌手仍然想要讨论这个问题，请让他们在对局结束后再讨论。虽然他们吃了警告，但与其他很多判罚不同，我们不会将这个判罚升级。这是因为我们不想让牌手对叫裁判产生恐惧感。因为对手犯下游戏错误却自己吃到一盘负是不合理的。假如未维护游戏状态要升级的话，我可能会在第三次对手犯错而我没能立刻发现的时候不愿意主动叫裁判，为了避免我的判罚被升级，我还不如假装自己没看到这个错误。这样做如同鼓励作弊，而我们并不想让方针鼓励作弊。从另一方面讲，如果我们不升级判罚，那为什么还要给这个判罚呢？有两个原因：一是警告判罚通常足以引起玩家的注意，让他们进行游戏时多加小心。二是我们可以追踪这些判罚。如果某牌手总是获得一大堆未维护游戏状态，而相关的错误又通常是对他有利的，这让裁判能追踪该牌手的行为。并且，把这些判罚加入判罚数据库之后，我们也可以在多场赛事中持续追踪牌手的行为。
      sourceRawUnits:
      - raw-L000707
      - raw-L000711
- id: ipg-ann-2-cd6d667eafea
  anchor:
    type: block
    id: ipg-s2-c-body-g01-b003
    segmentId: ipg-s2-c-body-g01-b003-rs-91da8199bece
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-cd6d667eafea-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-cd6d667eafea-g01-b01
      type: paragraph
      text:
        en: Multi-day tournaments reset between days because it was determined to be unreasonable that
          the upgrade path was held at three regardless of the number of rounds in an event — it’s much
          easier to accumulate three GPEs over a fifteen round Regional Championship than a five round
          RCQ.
        zh: 历时多日的比赛会在次日重置判罚累计次数是因为无论几轮的比赛都是三次累积升级是不公平的——在15轮的区域冠军赛上累积三次游戏行动失误远比在5轮的区域冠军赛预选赛上容易。
      sourceRawUnits:
      - raw-L000717
      - raw-L000719
- id: ipg-ann-2-1-2bcf7510f31c
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-2bcf7510f31c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-2bcf7510f31c-g01-b01
      type: paragraph
      text:
        en: 'To quote the Comprehensive Rules:'
        zh: 引用CR：
      sourceRawUnits:
      - raw-L000731
      - raw-L000737
    - id: ipg-ann-2-1-2bcf7510f31c-g01-b02
      type: paragraph
      text:
        en: 603.1 Triggered abilities have a trigger condition and an effect. They are written as “[Trigger
          condition], [effect],” and begin with the word “when,” “whenever,” or “at.” They can also be
          expressed as “[When/Whenever/At] [trigger event], [effect].” A triggered ability is said to
          “trigger” whenever the above-mentioned [trigger condition] has been met.
        zh: 603.1：触发式异能具有触发条件和效应。其格式为“[触发条件]，[效应]”，且由“当”、“每当”或“在”等词开头。它们也可以被展开为“[当/每当/在][触发事件]，[效应]”。当前述提到的[触发条件]满足时，触发式异能就会触发。
      sourceRawUnits:
      - raw-L000733
      - raw-L000739
    - id: ipg-ann-2-1-2bcf7510f31c-g01-b03
      type: paragraph
      text:
        en: Generally speaking, the point at which a player needs to demonstrate awareness of a triggered
          ability is after it has triggered, but no later than when that ability would “first matter.”
          The finer details of when things “first matter” will be covered throughout this definition.
        zh: 通常来说，牌手需要表明自己认识触发存在的时点是在其触发后、且在该触发式异能将要“第一次产生作用”之前。关于何为“第一次产生作用”，我们将在这一部分中进行详解。
      sourceRawUnits:
      - raw-L000735
      - raw-L000741
- id: ipg-ann-2-1-12dc5d9af4be
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g01-b002
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-12dc5d9af4be-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-12dc5d9af4be-g01-b01
      type: paragraph
      text:
        en: This is another way of saying that in order to figure out whether or not a player has missed
          a trigger, you must first consider what the ability does. The point at which the ability first
          matters depends on which of the below four categories that ability belongs to. Note that this
          is intended to be an exhaustive list — all triggered abilities in the game may be categorized
          in one of the following ways.
        zh: 这是用另一种方式来说，要判断牌手是否遗漏了触发，首先应该先看这个触发式异能会做什么事情。该异能第一次产生作用的时点取决于这个异能属于以下四类中的哪一类。注意，下面的分类涵盖了游戏中所有的触发式异能，你一定可以为某异能找到其所属的类型。
      sourceRawUnits:
      - raw-L000747
      - raw-L000749
- id: ipg-ann-2-1-a9e83d527c29
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g02-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-a9e83d527c29-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-a9e83d527c29-g01-b01
      type: paragraph
      text:
        en: These are triggered abilities that first matter as they are put onto the stack. In order to
          avoid missing these triggers, the controller of these abilities must remember to make the choices
          involved with these right away.
        zh: 这些触发式异能第一次产生作用的时候就是它们放进堆叠的时候。这些异能的操控者必须记住要立即做出这些选择，才能避免忘记这些异能。
      sourceRawUnits:
      - raw-L000755
      - raw-L000761
    - id: ipg-ann-2-1-a9e83d527c29-g01-b02
      type: paragraph
      text:
        en: 'Examples: Anointed Deacon, Academy Journeymage, Rhonas’s Monument'
        zh: 例如：祝圣助祭、学院老练法师、罗纳斯纪念碑。
      sourceRawUnits:
      - raw-L000757
      - raw-L000763
    - id: ipg-ann-2-1-a9e83d527c29-g01-b03
      type: paragraph
      text:
        en: For the purposes of triggered abilities, the choice of a “target opponent” is automatically
          assumed in a two-player game. The controller is not required to explicitly make this choice
          to avoid missing the trigger. A player isn’t off the hook just yet, though — they will still
          need to demonstrate awareness at some later point according to whichever of the three remaining
          groups the effect fits into. Also, the opponent is not assumed to be the target when the trigger
          requires a “target player,” even if it’s “obvious” that you want to target the opponent.
        zh: 触发式异能中，“目标对手”的选择在两人游戏中是默认的。其操控者不需要明确做出此选择来避免遗漏触发，但是这并不代表牌手就可以不管这个异能了，这个异能是否遗漏还要看它属于其他三类中的哪一类，并以该类的判定标准来判定。对于“目标牌手”而言，对手不会自动成为该触发的目标，即使这个异能你很“显然”想要以对手为目标。
      sourceRawUnits:
      - raw-L000759
      - raw-L000765
- id: ipg-ann-2-1-906eca34cdf5
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g02-b002
    segmentId: ipg-s2-1-c-definition-g02-b002-rs-db2aac908f8f
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-906eca34cdf5-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-906eca34cdf5-g01-b01
      type: paragraph
      text:
        en: These are triggered abilities that first matter at resolution. In order to avoid missing these
          triggers, the controller of these abilities must remember to make the choice or take the visible
          action when the trigger would resolve (or prompt the opponent to do so). The player may also
          avoid missing the trigger by making it clear to the opponent what outcome will be taken when
          the trigger resolves.
        zh: 这些是结算时第一次产生作用的触发式异能。其操控者必须记住在这些异能将要结算时做出选择或作出实际动作（或提示对手如此做），才能避免忘记这些异能。牌手也可以向对手清楚地表示该触发式异能结算会产生什么样的结果，来避免遗漏这个触发。说“触发”是不够的。你需要清楚地表明这个触发是什么。
      sourceRawUnits:
      - raw-L000771
      - raw-L000777
    - id: ipg-ann-2-1-906eca34cdf5-g01-b02
      type: paragraph
      text:
        en: 'Examples: Banewhip Punisher, Anointer Priest, Sparring Construct'
        zh: 例如：驱邪鞭手、圣洗僧侣、战训组构体。
      sourceRawUnits:
      - raw-L000773
      - raw-L000779
    - id: ipg-ann-2-1-906eca34cdf5-g01-b03
      type: paragraph
      text:
        en: As it turns out, this is by far the most common type of triggered ability in the game. Most
          triggered abilities involve obvious visible actions such as drawing cards, moving objects from
          zone to zone, or modifying the state of permanents. Note that life totals are considered part
          of the visible representation of the game — this implies that triggered abilities that cause
          a player to take damage or gain life first matter at the point that a score pad should be updated.
        zh: 这是游戏中最常见的触发式异能。大多数触发式异能都涉及明显的实际动作，例如抓牌、将物件从一个区域移到另一个、或更改永久物的状态。注意，总生命视为游戏的可见表示之一，这意味着让牌手受到伤害或获得生命的触发式异能产生作用时，牌手应当在记血纸上写下新的生命值。
      sourceRawUnits:
      - raw-L000775
      - raw-L000781
- id: ipg-ann-2-1-d00f70635b66
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g02-b002
    segmentId: ipg-s2-1-c-definition-g02-b002-rs-da5b4f0e4bc6
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-1-d00f70635b66-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-d00f70635b66-g01-b01
      type: paragraph
      text:
        en: When making this determination, a lot of benefit of the doubt is given to players — they usually
          have to go well out of their way to show that they’ve missed a trigger. For example, if a player
          casts a spell during upkeep, it is assumed that upkeep triggers are still on the stack, not
          missed.
        zh: 在确定是否是此种情况时，牌手通常会得到很多疑点利益（即假定牌手是没有忘记的）——在这种情况下牌手要遗忘一个触发可是真心很不容易的。例如，如果牌手在维持施放一个咒语，我们会假定维持的触发仍在堆叠上，而非被遗忘。
      sourceRawUnits:
      - raw-L000787
      - raw-L000789
- id: ipg-ann-2-1-fa2657c2275a
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g02-b003
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-fa2657c2275a-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-fa2657c2275a-g01-b01
      type: paragraph
      text:
        en: These are triggered abilities that first matter at the point at which an opponent tries to
          take an illegal action due to the trigger. In order to avoid missing these triggers, the controller
          of these abilities must announce the trigger at the correct time and/or actively prevent an
          opponent from taking an action that wouldn’t be possible had the triggered ability resolved.
        zh: 这些触发式异能第一次产生作用的时点是对手尝试作出因此异能而不合法的动作之时。这些异能的操控者必须在合适的时机宣告异能，或主动阻止对手作出因此异能而不合法的动作，才能避免忘记这些异能。
      sourceRawUnits:
      - raw-L000795
      - raw-L000803
    - id: ipg-ann-2-1-fa2657c2275a-g01-b02
      type: paragraph
      text:
        en: 'Examples: Brine Elemental, Lavinia of the Tenth, Wall of Frost, Cunning Survivor'
        zh: 例如：盐湖元素、第十区的拉温妮、霜墙、狡黠遗民。
      sourceRawUnits:
      - raw-L000797
      - raw-L000805
    - id: ipg-ann-2-1-fa2657c2275a-g01-b03
      type: paragraph
      text:
        en: If an opponent hasn’t acknowledged the trigger then players are welcome to behave as if it
          was forgotten, but they must expect to be stopped by that opponent.
        zh: 如果对手没有声明触发，牌手可以假设这个触发被遗忘了，但他们必须意识到自己的动作可能会被对手阻止。
      sourceRawUnits:
      - raw-L000799
      - raw-L000807
    - id: ipg-ann-2-1-fa2657c2275a-g01-b04
      type: paragraph
      text:
        en: For example, suppose after cycling a card Alex attacks Nat with a Cunning Survivor and doesn’t
          immediately mention their trigger. Nat is allowed to animate a Mutavault and try to declare
          it alone as a blocker. If Alex does not speak up about this blocking assignment being illegal
          before taking a later action or continuing with combat, Alex has missed their trigger.If a player
          chooses to perform this “Missed Trigger gambit,” so to speak, they risk giving away information
          like the identity of cards in their hand or intended plays. Worse yet, a player banking on a
          forgotten trigger of this type may lock themself into a play they would otherwise not want to
          take.In the above example, if Alex prevents Nat from blocking with Mutavault alone, Nat wouldn’t
          get to undo the activation of Mutavault.
        zh: 例如，循环了一张牌后，Alex使用狡黠遗民攻击Nat，但没有立即提到其触发式异能。我们允许Nat将他的易形地窖变成生物，并试图宣告单独阻挡。如果Alex在此时不表明这次阻挡非法，而继续采取其他动作、或进行下一个战斗步骤，Alex就遗忘了这个触发。如果牌手想要“赌”对手忘了异能，他们便需要冒着一些风险，诸如暴露其手牌内容或游戏意图。更糟的是，他们可能需要做出一些原本不想做的游戏动作。例如上面的例子中，如果Alex阻止了Nat用易形地窖单独阻挡，Nat将无法撤销将异形地窖变生物的操作。
      sourceRawUnits:
      - raw-L000801
      - raw-L000809
- id: ipg-ann-2-1-18e1ec7170f3
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g02-b004
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-18e1ec7170f3-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-18e1ec7170f3-g01-b01
      type: paragraph
      text:
        en: These are triggered abilities that aren’t immediately visually apparent, but would first matter
          at some point after resolution. Examples include causing a creature to gain some ability or
          giving a creature a power and toughness bonus (but not a counter or targeted)The result of these
          effects may cause some later visible change to the game state. For example, suppose Nat controls
          an Aether Flash at the time that Alex casts a 3/3 Hill Giant, and neither player mentions the
          trigger. If, later that turn, Nat deals 1 additional damage to Alex’s creature, Nat will have
          not missed the Aether Flash trigger if they prompt Alex to put their creature into the graveyard
          at that time. In this case, Aether Flash’s trigger first matters at the point when Alex’s creature
          receives lethal damage.
        zh: 这些触发式异能不会立即产生可见影响，但会在结算后的某个时间点第一次产生作用。例子包括使生物获得某些异能、给生物力量/防御力修正（而非被放上指示物或被目标）。但是，这些效应的结果可能接下来会导致游戏状态的可见变化。例如，Nat操控乙太闪光（每当一个生物进入战场时，乙太闪光对其造成2点伤害。）Alex施放了3/3的山丘巨人，两位牌手都没有提及触发。如果在该回合中，稍后Nat对Alex的生物又造成的1点伤害，若Nat提示Alex将该生物放进坟墓场，Nat便没有遗漏乙太闪光的触发。在这个例子中，乙太闪光的触发是异能第一次产生作用的时点便是Alex的生物获得致命伤害之时。
      sourceRawUnits:
      - raw-L000815
      - raw-L000821
    - id: ipg-ann-2-1-18e1ec7170f3-g01-b02
      type: paragraph
      text:
        en: 'Examples: Boros Elite, Steppe Lynx, Zhur-Taa Ancient, Emrakul, the Aeons Torn.'
        zh: 例如：波洛斯精兵、草原山猫、筑塔族祖兽、万世创伤伊莫库。
      sourceRawUnits:
      - raw-L000817
      - raw-L000823
    - id: ipg-ann-2-1-18e1ec7170f3-g01-b03
      type: paragraph
      text:
        en: This is something that people get hung up on, and will be addressed in more detail below.
          But the default assumption of the opponent should be that the trigger happened when it was supposed
          to.
        zh: 这类异能经常让人混淆不清，下面还会有进一步的说明。但对手的默认假设应当是触发式异能在其应当发生作用的时候发生。
      sourceRawUnits:
      - raw-L000819
      - raw-L000825
- id: ipg-ann-2-1-c05ed78b3298
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g03-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-c05ed78b3298-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-c05ed78b3298-g01-b01
      type: paragraph
      text:
        en: As convenient as it may be for judges to consider previously acknowledged but problematically-executed
          triggered abilities to be missed, they must nonetheless be treated as a different infraction.
        zh: 对于牌手已表明其存在、但错误执行的触发式异能来讲，裁判应该用另一个违规来进行处理，而非将其当做遗漏触发（虽然看起来很方便）。
      sourceRawUnits:
      - raw-L000831
      - raw-L000835
    - id: ipg-ann-2-1-c05ed78b3298-g01-b02
      type: paragraph
      text:
        en: For example, suppose Alex attacks Nat with an unblocked Arbor Elf equipped with Sword of Feast
          and Famine. During the combat damage step, Alex untaps their lands but both players forget about
          Nat discarding. Even if this is noticed during the post combat main phase, this must be treated
          as a Game Rules Violation by either rewinding the game or applying the appropriate partial fix,
          and not by simply asking Nat whether to place the trigger on the stack. It is also a Game Rules
          Violation if you acknowledge a trigger at the proper time or earlier, and then, because of multiple
          things on the stack, you forget to resolve it.
        zh: 例如，Alex使用佩带了丰馑剑的乔木妖精攻击Nat，且没有被阻挡。在战斗伤害步骤，Alex重置了自己的地，但两位牌手都忘了Nat没有弃牌。即使这件事在战斗后行动阶段才被发现，这也必须以违反游戏规则（GRV）进行处理，要么进行倒回，要么适用合适的部分修正，而不能询问Nat是否将弃牌异能放进堆叠。如果你在合适的时间（或更早）表明了触发式异能的存在，但因为堆叠上的东西太多而忘记了结算该异能，这也属于GRV。
      sourceRawUnits:
      - raw-L000833
      - raw-L000837
- id: ipg-ann-2-1-4fff80a4d71e
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g03-b002
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-4fff80a4d71e-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-4fff80a4d71e-g01-b01
      type: paragraph
      text:
        en: While putting a lore counter on a Saga isn’t a trigger, it feels an awful lot like one, especially
          when the immediate result of putting the lore counter on is the creation of a trigger. Now,
          instead of handling this with our standard Game Rule Violation fixes of “back up” or “leave
          the game alone,” we handle this like we’d handle any missed trigger.
        zh: 尽管为传纪放置学问指示物并非一个触发式异能，但它给人的感觉与触发式异能极为相似，尤其是当放置指示物的直接结果就是产生一个触发式异能时。因此现在，我们不再采用倒回或维持现状这类标准的处理违反游戏规则的修正方式，而是将其视同遗漏触发来处理。
      sourceRawUnits:
      - raw-L000844
      - raw-L000848
    - id: ipg-ann-2-1-4fff80a4d71e-g01-b02
      type: paragraph
      text:
        en: Note that this does not apply in the rare case where a player plays a Saga and doesn’t put
          the first lore counter on it. That’s still a Game Rule Violation.
        zh: 请注意：这不适用于牌手在结算一个传纪咒语进场时，忘记放置第一个学问指示物的罕见情况。那种情况依然属于违反游戏规则。
      sourceRawUnits:
      - raw-L000846
      - raw-L000850
- id: ipg-ann-2-1-72f3afacfaa8
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g03-b003
    segmentId: ipg-s2-1-c-definition-g03-b003-rs-5a8a3388a024
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-72f3afacfaa8-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-72f3afacfaa8-g01-b01
      type: paragraph
      text:
        en: The first sentence implies that it is impossible to miss, for example, Grave Betrayal’s triggered
          ability. However, the second sentence means that the delayed triggered ability itself, which
          makes a visible change to the game state, may be missed if not acknowledged by the time it would
          first matter. If Nat’s creature dies while Alex controls a Grave Betrayal, the trigger happens.
          However Alex can still miss the resulting delayed trigger by later passing the turn without
          returning the creature to the battlefield or otherwise calling attention to the ability. This
          is a concession to the way players play. The delayed trigger’s creation isn’t “relevant,” but
          its resolution is.
        zh: 第一句话说明牌手不可能遗漏诸如坟场叛行这样的触发式异能。但是，第二句话说明，产生的延迟触发式异能会对游戏状态产生可见影响，所以如果其操控者没有在其第一次产生影响之时表明了该异能的存在，它便会被遗漏。如果于Alex操控坟场叛行的时候，Nat的生物死去，该触发式异能自动结算。但Alex仍然可能会在没有将该生物移回战场（或以其他方式表明对该异能的注意）就让过回合，从而遗漏该触发式异能产生的延迟触发。这是对牌手游戏方式的一种妥协。延迟触发的创造并不重要；延迟触发的结算才是关键。
      sourceRawUnits:
      - raw-L000856
      - raw-L000858
- id: ipg-ann-2-1-d9b601d1cc5d
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g03-b003
    segmentId: ipg-s2-1-c-definition-g03-b003-rs-1bca48e427be
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-1-d9b601d1cc5d-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-d9b601d1cc5d-g01-b01
      type: paragraph
      text:
        en: For example, the storm ability of Empty the Warrens is not considered missed even if the spell’s
          controller does not specifically announce the trigger before passing priority after casting
          the spell. However, if that player then forgets to put the additional Goblins onto the battlefield
          before moving on with their turn, the storm trigger would be considered missed. Again, this
          is a concession to the way players actually play Magic.
        zh: 例如，即使净空繁殖地的操控者在施放咒语并让过优先权之前没有宣告其风暴异能，我们也不认为牌手遗漏了这个触发。但是，如果该牌手忘记将多产生的鬼怪放进战场就继续进行其他行动，我们便认为牌手遗漏了这个风暴触发。这也是我们对牌手游戏方式妥协的结果。
      sourceRawUnits:
      - raw-L000864
      - raw-L000866
- id: ipg-ann-2-1-4e3c414b3249
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g03-b004
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-4e3c414b3249-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-4e3c414b3249-g01-b01
      type: paragraph
      text:
        en: Announcing the action that makes the trigger ability to trigger is sufficient to demonstrate
          the awareness of the Reflexive triggers.
        zh: 牌手宣告使触发式异能触发的动作足以表示其对该自身触发异能的认识。
      sourceRawUnits:
      - raw-L000872
      - raw-L000874
- id: ipg-ann-2-1-beb77138e6e3
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g03-b005
    segmentId: ipg-s2-1-c-definition-g03-b005-rs-e3d8b3c3b0d4
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-beb77138e6e3-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-beb77138e6e3-g01-b01
      type: paragraph
      text:
        en: There has to be no impact to the game, not that it’s obvious a choice wouldn’t be made. You
          shouldn’t take into account how likely an opponent is to perform some optional action permitted
          by the ability. For example, a tapped Desecration Demon should still have its triggered ability
          acknowledged and the opponent should be prompted for choice of a sacrifice even though Desecration
          Demon is already tapped.
        zh: 此处指的是不会对游戏造成影响的触发，并不是指没有做出一个显而易见的选择。你不应考虑对手采取该异能允许对手所做的一些可选项的可能性。例如，对于一个已横置的渎圣恶魔，其操控者仍应表明它的触发式异能，并提示对手是否选择牺牲生物。
      sourceRawUnits:
      - raw-L000880
      - raw-L000882
- id: ipg-ann-2-1-b77b1b7801f9
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g03-b005
    segmentId: ipg-s2-1-c-definition-g03-b005-rs-37883304c090
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-1-b77b1b7801f9-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-b77b1b7801f9-g01-b01
      type: paragraph
      text:
        en: Another example of a triggered ability that would have no impact on the game may occur in
          a scenario in which a player controls no other creatures and attacks with a Chasm Drake. The
          Chasm Drake itself is the only legal target for the ability, but giving a Chasm Drake a second
          instance of flying would be redundant. So, this trigger would not matter and intentionally ignoring
          it would not be an infraction.
        zh: 对游戏没有影响的触发式异能的另一个例子是牌手仅操控一个深峡龙兽（每当深峡龙兽攻击时，目标由你操控的生物获得飞行异能直到回合结束）并用其进行攻击。深峡龙兽本身是其异能的唯一合法目标，但再次赋予深峡龙兽飞行异能又没有作用。所以这个触发对游戏没有影响，即使故意忽略这个异能也没有违规。
      sourceRawUnits:
      - raw-L000888
      - raw-L000890
- id: ipg-ann-2-1-852fec6a385c
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g03-b005
    segmentId: ipg-s2-1-c-definition-g03-b005-rs-226769445fd3
  position: after
  order: 30
  groups:
  - id: ipg-ann-2-1-852fec6a385c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-852fec6a385c-g01-b01
      type: paragraph
      text:
        en: This is the old ‘may’ trigger. If a player points out an optional trigger, and it has no visible
          effect, when it resolves, it’s assumed that they chose to for the ‘may’ part to happen. However,
          this assumption only holds unless the opponent responds. If they do, then you have to specify
          if you did or didn’t choose the ‘may’. This is relevant in formats with Eldrazi Mimic and Dismember.
        zh: 这就是通常说的“可以”触发。如果牌手指出了一个可选的触发、且这个触发结算时没有可见的效应，我们假定该牌手会让“可以”的部分生效。然而，这种假定只有在对手没有响应时才有效。如果对手响应了，那么牌手必须说明“可以”的部分是否生效。这在具有拟态奥札奇和肢解的赛制中是有意义的。
      sourceRawUnits:
      - raw-L000896
      - raw-L000898
- id: ipg-ann-2-1-5cb76b05e93d
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g03-b006
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-5cb76b05e93d-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-5cb76b05e93d-g01-b01
      type: paragraph
      text:
        en: This is another very important detail to keep in mind when observing a match as either a spectator
          or judge. Simply asking a player if they acknowledged a triggered ability is itself a reminder
          of that ability. Worse still, calling attention to a particular triggered ability before it
          would first matter provides an opportunity for a player to acknowledge it then. Depending on
          the circumstances, making this mistake could be perceived by an opponent as a lack of impartiality
          or even as significant coaching. Furthermore, if a spectator makes this mistake, it could be
          considered Tournament Error — Outside Assistance. Clearly, this should be avoided.
        zh: 这是另一个非常重要的细节，当你作为旁观者或裁判观看比赛时一定要记住。询问牌手是否表明了触发式异能，这个问题本身便是对该异能的提醒。更糟的是，如果在触发式异能第一次产生作用之前让牌手注意到该异能，会使该牌手有机会在合适的时机表明这个异能。根据情况的不同，对手可能会认为犯下这种错误是你不够公正，甚至在教牌手打牌。此外，如果旁观者犯下此错误，可以认为是比赛失误——外来协助。显然这种做法应该避免。
      sourceRawUnits:
      - raw-L000904
      - raw-L000908
    - id: ipg-ann-2-1-5cb76b05e93d-g01-b02
      type: paragraph
      text:
        en: The only exception to this, of course, is when a judge needs to issue a Warning or investigate
          a player for Cheating. The needs of the tournament — specifically, ensuring its integrity —
          exceed those of an individual match.
        zh: 当然，唯一的例外是裁判需要判处警告、或需要调查牌手是否作弊的情况下。对于整个比赛——特别是保证比赛的公正性——而言，其重要性要高于某一场对局的重要性。
      sourceRawUnits:
      - raw-L000906
      - raw-L000910
- id: ipg-ann-2-1-1a07e3672fb1
  anchor:
    type: block
    id: ipg-s2-1-c-definition-g03-b007
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-1a07e3672fb1-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-1a07e3672fb1-g01-b01
      type: paragraph
      text:
        en: If one player is controlling another player then the controlling player is responsible for
          remembering that player’s triggers.  There aren’t any differences to this infraction other than
          the controlling player cannot forget any triggers, theirs or the player’s they are controlling.
          For the purposes of any fixes below, the controlled player is the opponent.
        zh: 如果牌手正在操控其他牌手，那么前者应当对后者的触发负责。除了该牌手不能忘记任何触发——无论是他们自己的还是正在操控的牌手的——以外，对于违规本身而言并没有任何区别。下文所提及的修正中，对手指的便是被操控的牌手。
      sourceRawUnits:
      - raw-L000916
      - raw-L000918
- id: ipg-ann-2-1-26506e1373fb
  anchor:
    type: block
    id: ipg-s2-1-c-examples-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-26506e1373fb-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-26506e1373fb-g01-b01
      type: paragraph
      text:
        en: (Whenever a creature you control attacks alone, that creature gets +1/+1 until end of turn.)
          In this scenario, this ability first matters during the combat damage step. This is a triggered
          ability that affects the game state in non-visible ways. By indicating the Knight is attacking
          for 2 damage, the player has missed their trigger, even if they are stating the knight is attacking
          for 2 prior to the combat damage step.
        zh: （每当一个由你操控的生物单独攻击时，该生物得+1/+1直到回合结束。）在此例中，这个异能在战斗伤害步骤第一次产生作用。这是一个以不可见方式影响游戏状态的触发式异能。该牌手表示骑士造成2点伤害，意味着其遗漏了触发，即使该牌手在战斗伤害步骤之前如此声明也是如此。
      sourceRawUnits:
      - raw-L000926
      - raw-L000928
- id: ipg-ann-2-1-c24efb2a8161
  anchor:
    type: block
    id: ipg-s2-1-c-examples-g01-b002
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-c24efb2a8161-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-c24efb2a8161-g01-b01
      type: paragraph
      text:
        en: (At the beginning of your upkeep, if this card is suspended, remove a time counter from it)
          In this scenario, this ability first matters before the player draws for the turn. This is a
          triggered ability that causes a change in the visible game state. Once the player draws a card,
          they have advanced the game past the point where the visible game state would first be altered
          had the trigger resolved.
        zh: （在你的维持开始时，若此牌被延缓，从它上面移除一个计时指示物）在此例中，这个异能在牌手抓本回合的牌之前第一次产生作用。这是一个对游戏产生可见影响的触发式异能。一旦牌手抓了牌，游戏进程便已经进行至可见游戏状态本应因为触发式异能的结算而被改变的时间点之后。
      sourceRawUnits:
      - raw-L000934
      - raw-L000936
- id: ipg-ann-2-1-63bfcaa59286
  anchor:
    type: block
    id: ipg-s2-1-c-examples-g01-b003
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-63bfcaa59286-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-63bfcaa59286-g01-b01
      type: paragraph
      text:
        en: (When Manic Vandal enters the battlefield, destroy target artifact.) In this scenario, this
          ability first matters before the player passes priority. This is a triggered ability that requires
          its controller to choose targets.
        zh: （当疯狂莽夫进战场时，消灭目标神器。）在此例中，这个异能在牌手让过优先权之前第一次产生作用。这是一个需要其操控者选择目标的触发式异能。
      sourceRawUnits:
      - raw-L000942
      - raw-L000944
- id: ipg-ann-2-1-f9fa7ae5bbb0
  anchor:
    type: block
    id: ipg-s2-1-c-examples-g01-b004
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-f9fa7ae5bbb0-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-f9fa7ae5bbb0-g01-b01
      type: paragraph
      text:
        en: In this scenario, this ability first matters before the player indicates that they have moved
          past the combat phase. This is a delayed triggered ability that causes a change in the visible
          game state.
        zh: 在此例中，这个异能在牌手表明战斗阶段已过之前第一次产生作用。这是一个导致可见游戏状态产生变化的延迟触发式异能。
      sourceRawUnits:
      - raw-L000950
      - raw-L000952
- id: ipg-ann-2-1-768b9465925e
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b001
    segmentId: ipg-s2-1-c-philosophy-g01-b001-rs-99c04601b676
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-768b9465925e-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-768b9465925e-g01-b01
      type: paragraph
      text:
        en: It’s pretty easy to forget triggers, there are a lot of them and there are often no visual
          components to them. They are also typically beneficial, and the ones that aren’t, the opponent
          is motivated to be aware of. Furthermore, triggered abilities have sort of a “natural” handling
          if they’re forgotten — most of the time, they can simply just not happen without any additional
          cleanup or situation-specific remedy being needed.
        zh: 人们非常容易忘记触发式异能。触发式异能很多，却通常没有可见的方式去提醒它们的存在。通常来说触发式异能是有利的，而对于不利的触发式异能，对手也有动力去注意它们。此外，处理忘记触发式异能时有一种很自然的办法——大多数时候，可以直接不做额外修正，就当做它们没发生过即可。
      sourceRawUnits:
      - raw-L000960
      - raw-L000962
- id: ipg-ann-2-1-89c88a6dbc1a
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b001
    segmentId: ipg-s2-1-c-philosophy-g01-b001-rs-2a027a802380
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-1-89c88a6dbc1a-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-89c88a6dbc1a-g01-b01
      type: paragraph
      text:
        en: So, while forgetting your trigger is not to be harshly penalized, intentionally missing your
          trigger is much more serious. Note the subtle usage of the word “may,” in the sentence above.
          If you suspect a player of cheating, read the definition of Cheating to see if it applies. Another
          exception to this being Unsporting Conduct – Cheating is if the player in question were not
          aware that intentionally ignoring one’s own triggered abilities is against the rules. It was
          pointed out that now, with the Pacts, a player can “forget” their trigger and then say “oops
          I forgot” when the opponent notices; this is a case where an investigation for Cheating can
          be a good idea.
        zh: 即使忘记触发式异能不应被严厉的处罚，故意遗漏触发是更加严重的情形。注意这里使用了“may”（可能）一词。如果你怀疑牌手作弊，请先阅读作弊的定义，并分析是否符合作弊的判断条件。如果当事牌手并不知道故意忽略自己的触发式异能是规则不允许的行为，也不应视作“举止违背运动道德～作弊”。需要指出的是，现在牌手可以“忘记”他们的条约触发式异能，然后在对手发现时才说“哎呀，我忘了”；这种情况下调查牌手是否作弊可能会是一个好主意。
      sourceRawUnits:
      - raw-L000968
      - raw-L000970
- id: ipg-ann-2-1-35b462565d53
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b001
    segmentId: ipg-s2-1-c-philosophy-g01-b001-rs-a4501dc191ea
  position: after
  order: 30
  groups:
  - id: ipg-ann-2-1-35b462565d53-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-35b462565d53-g01-b01
      type: paragraph
      text:
        en: Remembering one’s trigger is always the responsibility of the player who controls the ability.
          This is usually, but not always, the controller of the object that has the ability. It doesn’t
          matter that the triggered ability may allow an opponent to take an optional action — the controller
          of the trigger is responsible for remembering it and prompting the opponent to make a choice.
          Examples include things like Frost Titan, Desecration Demon and Rhystic Study.
        zh: 记住自己的触发式异能永远是其操控者的责任。其操控者通常（但不一定）是具有该异能的物件之操控者。触发式异能是否允许对手采取某些可选动作与此没有关联——触发式异能的操控者有责任记住这个触发，并提示对手作出选择。例子包括冰霜泰坦、渎圣恶魔和琉晶研究。
      sourceRawUnits:
      - raw-L000976
      - raw-L000982
    - id: ipg-ann-2-1-35b462565d53-g01-b02
      type: paragraph
      text:
        en: One of the many skills tested in Magic is the ability of players to remember their own triggered
          abilities. Players should not be punished for the inabilities or poor memories of their opponents.
        zh: 万智牌游戏考验牌手的很多技能之一便是记住自己的触发式异能。牌手不应因没有记住对手的触发式异能而受到惩罚。
      sourceRawUnits:
      - raw-L000978
      - raw-L000984
    - id: ipg-ann-2-1-35b462565d53-g01-b03
      type: paragraph
      text:
        en: Why might a player want to remind an opponent of their triggered ability? It’s possible that
          the trigger might benefit themselves more than their opponent or it might inconvenience their
          opponent so reminding them makes sense.
        zh: 为什么牌手会想要提醒对手操控的触发式异能呢？可能是因为这个异能对自己比对对手更有利，或者只是为了干扰对手。
      sourceRawUnits:
      - raw-L000980
      - raw-L000986
- id: ipg-ann-2-1-b3b817cf5334
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b002
    segmentId: ipg-s2-1-c-philosophy-g01-b002-rs-60d6dc8ed03e
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-b3b817cf5334-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-b3b817cf5334-g01-b01
      type: paragraph
      text:
        en: Triggered abilities are assumed to be remembered not only by both the player and opponent,
          but also by any judges watching the match. By failing to acknowledge a triggered ability by
          when it would first matter, the player effectively disproves this assumption. This sentence
          also answers the question of “How can I tell if my opponent missed their exalted trigger?”
        zh: 不仅应当假设牌手和对手记得触发式异能的存在，对于观看对局的裁判，也应假设他们记得这些异能。如果牌手没有在某个触发式异能将要第一次产生作用时表达该异能，他就打破了这个假设。这一句话也回答了下面这个问题：“我怎么知道对手忘记了他的颂威触发？”
      sourceRawUnits:
      - raw-L000992
      - raw-L000998
    - id: ipg-ann-2-1-b3b817cf5334-g01-b02
      type: paragraph
      text:
        en: You are to assume it happened until you have evidence that it didn't. This is an important
          point. Just as you can acknowledge a trigger happened earlier than required, you can also indicate
          the trigger didn't happen earlier than required.
        zh: 你应当假设颂威触发了，直到你获得了对手忘记这个触发的证据。这是很重要的一点。如同你可以在所要求的时点之前表达某个触发一样，你同样可以在这个时点之前表现出触发没有发生。
      sourceRawUnits:
      - raw-L000994
      - raw-L001000
    - id: ipg-ann-2-1-b3b817cf5334-g01-b03
      type: paragraph
      text:
        en: For example, if you untap with a Kragma Butcher and say nothing indicating the trigger, it
          is assumed to be a 4/3. However, the controller can indicate earlier than combat damage that
          they forgot the trigger. Attacking with an Ensnaring Bridge on the battlefield might indicate
          its trigger was missed. Answering "what's that creature's power?" with "it's a 2/3" is an indication
          it was missed.
        zh: 例如，如果你操控的夸格玛屠夫（每当夸格玛屠夫成为未横置时，它得+2/+0直到回合结束。）重置了，却没有说明这个触发，我们假设它是一个4/3生物。但是，操控者可以在战斗伤害之前表现出忘记了这个触发。如果场上有陷阱桥的时候宣告它攻击，可能表明这个触发被遗漏了。如果问这个生物的力量是多少，回答“它是2/3”说明这个触发已经被遗漏了。
      sourceRawUnits:
      - raw-L000996
      - raw-L001002
- id: ipg-ann-2-1-c01c14063472
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b002
    segmentId: ipg-s2-1-c-philosophy-g01-b002-rs-5129b64f3c87
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-1-c01c14063472-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-c01c14063472-g01-b01
      type: paragraph
      text:
        en: To repeat an earlier annotation, players are never responsible for remembering their opponent’s
          triggers. Players are allowed to remain quiet about triggers controlled by an opponent being
          missed, even if the triggered ability would do something harmful to its controller. There is
          never a time when a player should be issued an infraction, be it Unsporting Conduct — Cheating,
          Game Play Error — Failure to Maintain Game State, etc., for either accidentally or intentionally
          not calling attention to an opponent’s missed trigger. Players do not have to help their opponents
          beat them; however, they cannot trick their opponents into missing triggers.
        zh: 重复刚才的一段注解，牌手永远没有责任记住对手的触发。我们允许牌手在对手的触发被遗漏时保持沉默。无论是举止违背运动道德～作弊、还是游戏行动失误～未维护游戏状态，还是什么其他判罚也好，牌手永远不应该因为无意或故意地不注意对手的遗漏触发而吃到这些判罚。牌手没有理由帮助对手击败自己；但牌手不允许诱导对手遗漏触发。
      sourceRawUnits:
      - raw-L001008
      - raw-L001010
- id: ipg-ann-2-1-e066abdc4eab
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b002
    segmentId: ipg-s2-1-c-philosophy-g01-b002-rs-e4b62bad448b
  position: after
  order: 30
  groups:
  - id: ipg-ann-2-1-e066abdc4eab-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-e066abdc4eab-g01-b01
      type: paragraph
      text:
        en: Suppose Alex controls Cathedral of War and attacks with a single 2/2 Bear Cub, proceeding
          through to the declare blockers step without mentioning the triggered ability. After declaring
          blockers, Nat considers casting Shock targeting the unblocked Bear Cub.
        zh: 假设Alex操控战事圣堂（颂威）并使用一个2/2幼熊进行攻击。他直接进入了宣告阻挡者步骤，而并没有提及触发式异能。在宣告阻挡者之后，对手Nat考虑对这个未被阻挡的幼熊施放电震。
      sourceRawUnits:
      - raw-L001016
      - raw-L001024
    - id: ipg-ann-2-1-e066abdc4eab-g01-b02
      type: paragraph
      text:
        en: Nat has two options — they could simply cast Shock, targeting the Bear Cub, hoping that Alex
          forgot about the trigger. However, by doing so, Nat risks Alex acknowledging the trigger by
          not putting the Bear Cub into the graveyard. In other words, just because Alex didn’t explicitly
          announce the trigger doesn’t mean they missed it — the point at which the trigger would first
          matter in this case would be after Shock resolves. So, if Nat were to attempt this ploy, they
          risk wasting the Shock.
        zh: Nat有两个选择。要么他以幼熊为目标施放电震，希望Alex忘记触发。如果他这么做，他便冒着Alex记住这个触发，不将幼熊置入坟墓场的风险。换句话说，Alex即使没有声明这个触发，也不说明他就遗忘了——在此例中，触发第一次产生作用的时点是电震结算以后。如果Nat想要这样冒险的话，他可能会浪费他的电震。
      sourceRawUnits:
      - raw-L001018
      - raw-L001026
    - id: ipg-ann-2-1-e066abdc4eab-g01-b03
      type: paragraph
      text:
        en: Alternatively, Nat could ask Alex what Bear Cubs current power/toughness is. This is derived
          information, so Alex isn’t required to answer, but if they do, Nat knows if the trigger is missed
          or not.
        zh: 要么Nat可以先问Alex幼熊现在的攻击力和防御力是多少。这是推断信息，Alex并不必回答这个问题。但如果他回答了，Nat便会知道触发是否被遗忘。
      sourceRawUnits:
      - raw-L001020
      - raw-L001028
    - id: ipg-ann-2-1-e066abdc4eab-g01-b04
      type: paragraph
      text:
        en: This may seem somewhat unsatisfactory to Nat, since asking questions about the toughness of
          the Bear Cub will probably remind Alex about the trigger and give them one last opportunity
          to acknowledge it. However, as the IPG says, “triggered abilities are assumed to be remembered
          until otherwise indicated.” The policy isn’t designed to let Nat trap Alex, it’s designed to
          reflect the way players actually play the game.
        zh: 这对于Nat可能不怎么有利，因为询问幼熊的防御力可能就会提醒Alex的触发。这会给她一个机会来表达这个异能。但是IPG说，“应视作牌手始终记得触发式异能的存在。”方针的编写意图并非是为了让Nat给Alex下套，而是为了反映牌手实际打牌的方式。
      sourceRawUnits:
      - raw-L001022
      - raw-L001030
- id: ipg-ann-2-1-6f6e922720ec
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b002
    segmentId: ipg-s2-1-c-philosophy-g01-b002-rs-cb512ffb0a08
  position: after
  order: 40
  groups:
  - id: ipg-ann-2-1-6f6e922720ec-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-6f6e922720ec-g01-b01
      type: paragraph
      text:
        en: It isn’t up to the opponent to confirm whether or not a player has missed their trigger before
          making a play that may be illegal. For example, if Alex is attacking with Pyreheart Wolf, it
          is not illegal for Nat to block the wolf with one creature. When that block is proposed, it
          is up to Alex to indicate the illegality of the block or not, and this will determine if the
          play needs to be rewound.
        zh: 对手在做游戏动作之前没有责任确认是否牌手遗忘了触发，即使这些触发的结算会导致这些游戏动作成为不合法。举例来说，如果Alex使用葬火心狼攻击，Nat使用一个生物进行阻挡它并非不合法。当Nat提出阻挡时，Alex有责任表示阻挡是不合法的。如果Alex如此表示了，那么这个动作会被倒回。
      sourceRawUnits:
      - raw-L001036
      - raw-L001038
- id: ipg-ann-2-1-be7edd5bbbee
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b004
    segmentId: ipg-s2-1-c-philosophy-g01-b004-rs-93a43883e6f9
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-be7edd5bbbee-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-be7edd5bbbee-g01-b01
      type: paragraph
      text:
        en: This sentence has a lot of philosophical weight, and provides guidance on how to deal with
          triggered abilities controlled by one player that trigger during another player’s turn. Triggered
          abilities fitting this description deserve some special consideration. Generally speaking, the
          active player — that’s the player whose turn it is — controls the flow of the game by taking
          each turn-based action as they move through that turn’s steps and phases. Magic players rarely
          explicitly pass priority, most of the time just shortcutting through nearly all of the technical
          rigmarole.
        zh: 这句话有很多原则上的分量。它提供了如何处理在一位牌手的回合中另一位牌手操控的触发式异能的指导。符合这种条件触发式异能需要特殊对待。通常来说，主动牌手控制游戏的进程，因为他们要按照回合中阶段和步骤的顺序来执行回合动作。牌手很少声明自己让过优先权，略过大部分繁杂的规则叙述，而通常只是采取简化方式来进行游戏。
      sourceRawUnits:
      - raw-L001044
      - raw-L001052
    - id: ipg-ann-2-1-be7edd5bbbee-g01-b02
      type: paragraph
      text:
        en: The reason that policy allows for players to acknowledge triggers just after an opponent takes
          a game action that would otherwise cause the trigger to be missed is precisely because players
          do not usually prompt their opponents for actions before moving ahead with their turns. For
          example, players will often proceed straight from their main phase to declaring attackers without
          asking the opponent if they want to first do anything — such as announcing any beginning of
          combat triggers.
        zh: 方针允许牌手在对手执行会使触发式异能被遗漏的游戏动作之后立即表达触发，正是因为牌手在进行自己的回合时，通常不会提示对手做动作。例如，牌手通常会从行动阶段直接进入宣告攻击者，而并不问对手是否想要做任何事——诸如宣告战斗开始时的触发等。
      sourceRawUnits:
      - raw-L001046
      - raw-L001054
    - id: ipg-ann-2-1-be7edd5bbbee-g01-b03
      type: paragraph
      text:
        en: The missed trigger policy was written to address the way that players already play the game
          and not the other way around.
        zh: 遗漏触发的方针是为了适应解决牌手实际打牌的方式而写的，而非严格按照CR。
      sourceRawUnits:
      - raw-L001048
      - raw-L001056
    - id: ipg-ann-2-1-be7edd5bbbee-g01-b04
      type: paragraph
      text:
        en: A player that says nothing about their opponent’s Braids, Cabal Minion trigger before attempting
          to draw for the turn hasn’t committed an infraction. If an opponent speaks up about the trigger
          as soon as the card is drawn, the trigger has not been missed.
        zh: 例如，牌手没有表示对手的柯帮干部布蕾德的触发，就抓了本回合的牌，并没有犯下违规。如果对手在牌手抓牌之时就立即表示了触发，这个触发便没有被遗漏。
      sourceRawUnits:
      - raw-L001050
      - raw-L001058
- id: ipg-ann-2-1-919f9b77cfff
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b004
    segmentId: ipg-s2-1-c-philosophy-g01-b004-rs-8b9248d5d48d
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-1-919f9b77cfff-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-919f9b77cfff-g01-b01
      type: paragraph
      text:
        en: This sentence simply further clarifies what has been stated above. If a player has a trigger
          that would happen on an opponent’s turn, that player has to actively “miss” it, they can’t be
          moved past the point of acknowledging the trigger by the active player’s actions in their own
          turn. It is also to prevent players from trying to use a loophole in the policy to rush past
          their opponents trigger, so that they can deny their opponent the trigger. This sentence closes
          the perception of that loophole. You cannot force your opponent to miss their trigger.
        zh: 这句话进一步说明了上面的方针。如果牌手操控一个将在对手回合触发的异能，不能因为主动牌手（即对手）因为其回合中的行动越过了表达触发的时点，就判断牌手遗漏了这个触发。这也避免了牌手试图利用方针中的漏洞，快速进行游戏以越过对手的触发时点，来阻止对手的异能触发。这句话填补了漏洞的可能性。你不能强迫对手忘记触发。
      sourceRawUnits:
      - raw-L001064
      - raw-L001066
- id: ipg-ann-2-1-8eea1a81a563
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b004
    segmentId: ipg-s2-1-c-philosophy-g01-b004-rs-3d9c1fb881cb
  position: after
  order: 30
  groups:
  - id: ipg-ann-2-1-8eea1a81a563-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-8eea1a81a563-g01-b01
      type: paragraph
      text:
        en: 'From MTR 4.3:'
        zh: '引用MTR 4.3:'
      sourceRawUnits:
      - raw-L001072
      - raw-L001086
    - id: ipg-ann-2-1-8eea1a81a563-g01-b02
      type: paragraph
      text:
        en: Due to the complexity of accurately representing a game of Magic, it is acceptable for players
          to engage in a block of actions that, while technically in an incorrect order, arrive at a legal
          and clearly understood game state once they are complete.
        zh: 由于要想准确进行一盘万智牌游戏十分复杂，因此牌手在进行一组动作的时候，即便严格说来次序不当，但只要在动作全部完成之后仍能呈现出合法及清晰游戏状态，便是可以接受的。
      sourceRawUnits:
      - raw-L001074
      - raw-L001088
    - id: ipg-ann-2-1-8eea1a81a563-g01-b03
      type: paragraph
      text:
        en: All actions taken must be legal if they were executed in the correct order, and any opponent
          can ask the player to do the actions in the correct sequence so that they can respond at the
          appropriate time (at which point players will not be held to any still-pending actions).
        zh: 所有动作在其以正确顺序执行的情况下必须都是合法的，并且任何对手都可以在任何时候要求牌手以正确顺序执行动作，以便他可以在合适的时间响应（此时不要求牌手继续执行先前尚待执行的动作）。
      sourceRawUnits:
      - raw-L001076
      - raw-L001090
    - id: ipg-ann-2-1-8eea1a81a563-g01-b04
      type: paragraph
      text:
        en: An out-of-order sequence must not result in a player prematurely gaining information which
          could reasonably affect decisions made later in that sequence.
        zh: 次序不当的行事顺序不能导致牌手提前获得可能影响后续行动决定的信息。
      sourceRawUnits:
      - raw-L001078
      - raw-L001092
    - id: ipg-ann-2-1-8eea1a81a563-g01-b05
      type: paragraph
      text:
        en: This means that, in certain situations, players may acknowledge a trigger as part of a block
          of actions, some of which may technically be later than the point at which the trigger would
          first matter, without the trigger being missed.
        zh: 这意味着在一些情况下，牌手可以在一系列行动之后表达某个触发，且这系列行动中的一部分严格来说本应在触发第一次产生影响之后才会发生，而不会被视为遗漏触发。
      sourceRawUnits:
      - raw-L001080
      - raw-L001094
    - id: ipg-ann-2-1-8eea1a81a563-g01-b06
      type: paragraph
      text:
        en: For example, a player may, in quick succession, sacrifice Pitchburn Devils to pay the cost
          of their Carrion Feeder’s activated ability, then put a counter on the Carrion Feeder, and then
          say “you take 3,” without Pitchburn Devils’s trigger being considered missed. If the player
          takes these actions all at once without leaving an opportunity for the opponent to indicate
          responses or provide additional information, this should usually be ruled a legal out-of-order
          sequence of actions.
        zh: 例如，牌手可以快速连续地为腐食怪（牺牲一个生物：在腐食怪上放置一个+1/+1指示物）牺牲燃沥青魔鬼（当燃沥青魔鬼死去时，它对目标生物或牌手造成3点伤害），在腐食怪上放置一个+1/+1指示物，然后再说“打你3”，而不会被视为遗漏触发。如果牌手一次性执行了这些动作，而没有留给对手表示回应或提供额外信息的机会，这通常在判决时应视为合法的次序不当的行事顺序。
      sourceRawUnits:
      - raw-L001082
      - raw-L001096
    - id: ipg-ann-2-1-8eea1a81a563-g01-b07
      type: paragraph
      text:
        en: A player could not, however, remove the last counter from a Rift Bolt, then draw for the turn,
          and then say “I’ll Rift Bolt your creature.” Even if the player performs these actions in quick
          succession and without the opponent saying anything, they would still have gained the knowledge
          of the card drawn for the turn before choosing their Rift Bolt target. This should usually be
          ruled a Missed Trigger.
        zh: 但是，牌手不能从时缝之雷（延缓1，对目标生物或牌手造成3点伤害）上移除最后一个指示物，然后抓本回合的牌，再说“我要用时缝之雷打你的生物”。即使牌手快速连续地执行这些动作，对手也还来不及说话，他仍然还是从本回合抓的牌中获得额外信息之后，再选择时缝之雷的目标。这通常在判决时被视为遗漏触发。
      sourceRawUnits:
      - raw-L001084
      - raw-L001098
- id: ipg-ann-2-1-afa9544e4422
  anchor:
    type: block
    id: ipg-s2-1-c-philosophy-g01-b005
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-afa9544e4422-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-afa9544e4422-g01-b01
      type: paragraph
      text:
        en: This applies to cards like Welcoming Vampire and others that “trigger only once each turn”
          or similar. It stands to reason that if a trigger is missed, it must have happened – otherwise,
          how could it have been missed? If a player has one 2/2 enter and forgets the trigger, they won’t
          get a subsequent one this turn if they play another 2/2.
        zh: 此规则适用于像迎宾吸血鬼这类具有“每回合只会触发一次”或类似措辞的牌。按照常理，如果一个触发被遗漏了，那它必然已经发生过——否则，它又怎么能被称为遗漏了呢？因此，如果一位牌手有一个2/2生物进场并忘记了迎宾吸血鬼的触发，那么在本回合中，即使他再出一个符合条件的2/2生物，也不会得到再次的触发机会。
      sourceRawUnits:
      - raw-L001104
      - raw-L001108
    - id: ipg-ann-2-1-afa9544e4422-g01-b02
      type: paragraph
      text:
        en: Be cautious, though, and read triggered abilities carefully, as this would not apply to something
          like Omnath, Locus of Creation that cares about how many times the trigger has resolved. That
          is, if a player missed the first landfall trigger to gain 4 life, the next one won’t “skip”
          to the second time and add mana.
        zh: 然而，务必谨慎并仔细阅读触发式异能的文本，因为此规则不适用于像生机核欧那斯这类异能——它的效应取决于该触发在本回合中已经结算了多少次。也就是说，如果一位牌手错过了第一次地落触发来获得4点生命，那么下一次的地落触发也不会“跳过”第一次的效应，直接进入第二次的效应产生法术力。
      sourceRawUnits:
      - raw-L001106
      - raw-L001110
- id: ipg-ann-2-1-17fa012946dd
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-17fa012946dd-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-17fa012946dd-g01-b01
      type: paragraph
      text:
        en: Mostly these will be Auras that tap the permanent such as Malfunction, once the missed trigger
          has been noticed the trigger will be resolved tapping the permanent immediately.
        zh: 这类异能绝大多数是横置其结附之永久物的异能。一旦注意到了遗漏触发，该异能将结算，立即横置该永久物。
      sourceRawUnits:
      - raw-L001118
      - raw-L001120
- id: ipg-ann-2-1-7194ce86f67b
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b002
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-7194ce86f67b-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-7194ce86f67b-g01-b01
      type: paragraph
      text:
        en: This type of triggered ability, known as delayed zone-change triggers, frequently exist in
          order to “clean things up.” While this type of trigger includes a lot of delayed sacrifices
          of tokens (Kiki-Jiki, Mirror Breaker, Thatcher Revolt, Geist of Saint Traft, etc.), it also
          includes many abilities that are utterly vital to the continued use of the associated object
          or objects. For example, the delayed triggered abilities that return AEtherling and Obzedat,
          Ghost Council to the battlefield are included in this category. These triggers are necessary
          for the creatures’ controllers to be able to continue using them that game. The opponent chooses
          whether the trigger occurs “now” (when a player would get priority) or “in a moment” (when a
          player would get priority at the start of the next phase).
        zh: 这类触发式异能通常称作改变区域的延迟触发，经常在做“清理性工作”的异能中出现。这类异能不仅包括牺牲衍生物的延迟触发（例如裂镜奇奇几奇、屋匠起义、圣沙弗的游魂等），还包括一些为了使相关的一个或多个物件能够持续使用而至关重要的异能。例如，将乙太精怪和欧节达鬼影议会移回战场的延迟触发式异能就属此类。为了让其操控者能在该盘游戏中继续使用这些生物，这些触发应当存在。对手选择它们“现在”（当牌手将获得优先权时）结算，或者“一会儿”（当牌手在下一个阶段开始将获得优先权时）结算。
      sourceRawUnits:
      - raw-L001126
      - raw-L001136
    - id: ipg-ann-2-1-7194ce86f67b-g01-b02
      type: paragraph
      text:
        en: The timing option here allows for a bit of control over creatures appearing and disappearing
          from the battlefield mid-combat. Putting the control in the hands of the opponent is acceptable
          because the opponent isn’t the one who missed their trigger, and this allows the opponent to
          minimize the impact of the player “suddenly” remembering the trigger. It does also allow the
          opponent to notice and wait to point it out even if this is to their advantage.
        zh: 这个时机的选项可以稍微控制生物在战斗中出现或消失的情况。将选择权交给对手是可以接受的，因为遗漏触发的人并不是对手，这样做也能让对手尽量减少牌手“突然记住”触发带来的影响。这个选项也允许对手在注意到遗漏触发之后，等到对他最有利的时机再指出。
      sourceRawUnits:
      - raw-L001128
      - raw-L001138
    - id: ipg-ann-2-1-7194ce86f67b-g01-b03
      type: paragraph
      text:
        en: Resolving a delayed zone-change trigger that returns a creature to the battlefield at the
          start of the next phase means that if a player notices their own missed trigger during their
          opponent’s end step, the opponent may choose to have the creature remain exiled until the player’s
          upkeep. That means this creature will have summoning sickness and won’t be able to attack that
          turn. Of course, an opponent can still opt to have that creature returned to the battlefield
          when a player got priority during that end step if they really want to.
        zh: 结算一个在下个阶段开始时将生物返回战场的延迟触发意味着，如果牌手在对手的结束步骤注意到了遗漏触发，对手可以选择让这个生物在该牌手的维持再移回战场。这意味着这个生物会召唤失调，该回合不能攻击。当然，对手也可以让它在他的结束步骤下一次牌手获得优先权时移回战场，如果他真的想如此做的话。
      sourceRawUnits:
      - raw-L001130
      - raw-L001140
    - id: ipg-ann-2-1-7194ce86f67b-g01-b04
      type: paragraph
      text:
        en: 'Finally, wherever the opponent chooses to place the trigger, it is resolved immediately,
          without using the stack. This is to prevent responding to these triggers that should have already
          happened. Notably, the opponent gets to choose the “when,” but not the “if.” One reason for
          this has to do with the fact that many zone-change triggers are, as pointed out above, utterly
          vital to the continued use of the associated objects. If an opponent got to choose whether these
          triggers happened at all, this infraction might be a little too harsh on players who, for example,
          suddenly find their Ætherling exiled forever just because they forgot to return it last turn.
          From the previous section: “Triggered abilities are common and invisible, so players should
          not be harshly penalized when forgetting about one.” So, policy has to have some special consideration
          here.'
        zh: 最后，无论对手如何选择把异能放在什么时候，该异能会立刻结算而不使用堆叠。这是为了防止本应发生的触发被牌手响应。注意，对手能选择的是“何时”而非“是否”结算。这样处理的一个原因是很多改变区域的触发式异能对于持续使用相关物件是至关重要的。如果对手可以选择这些触发是否发生，对于那些忘了上回合把乙太精怪移回场，结果发现乙太精怪因此被永远放逐的牌手而言，这个判罚会显得过重了。上一段中说：“触发式异能属于常见异能，且其机制较为隐蔽，因此不应在牌手忘记处理该类异能时即对其采取严厉的惩罚措施。”因此，方针不得不作出一些特殊的考虑。
      sourceRawUnits:
      - raw-L001132
      - raw-L001142
    - id: ipg-ann-2-1-7194ce86f67b-g01-b05
      type: paragraph
      text:
        en: Also of interest is that even though these abilities don’t expire, players are still under
          no obligation to remind the opponent of their existence. A player is perfectly within policy
          by remaining quiet for several turns despite having noticed that their opponent’s Obzedat, Ghost
          Council never returned from exile. The final sentence is to make it clear that even though the
          concept of undoing a zone change implies returning it to the zone it came from it covers delayed
          triggered abilities that put the card in a completely different zone, Sneak Attack being a good
          example.
        zh: 有意思的是，即使这些异能的持续时限不会结束，牌手仍然没有义务提醒对手这些异能的存在。牌手对于对手的欧节达鬼影议会呆在放逐区好几个回合没回来保持沉默是完全符合方针的。最后一句旨在明确：尽管撤销区域变更这一概念通常意味着将牌张移回其原本区域，但该规则同样涵盖了那些会将牌张置入一个完全不同区域的延迟触发式异能。偷袭便是一个很好的例子。
      sourceRawUnits:
      - raw-L001134
      - raw-L001144
- id: ipg-ann-2-1-2bf8e2626daa
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b003
    segmentId: ipg-s2-1-c-additional-remedy-g01-b003-rs-779b8c1abcbc
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-2bf8e2626daa-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-2bf8e2626daa-g01-b01
      type: paragraph
      text:
        en: If it’s been more than a turn since the trigger was missed, the ability is skipped with no
          further resolution. Remember, though, that if that ability were detrimental for the controlling
          player, they should still receive a penalty no matter how long it’s been.
        zh: 如果遗漏触发以后过了一个回合以上，那么异能便会被忽略，也不会再结算。但是要记住，如果异能对于其操控者是不利的，无论过了多久，该牌手仍然应该获得警告判罚。
      sourceRawUnits:
      - raw-L001150
      - raw-L001152
- id: ipg-ann-2-1-9d5505bcbe04
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b003
    segmentId: ipg-s2-1-c-additional-remedy-g01-b003-rs-605cd232e937
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-1-9d5505bcbe04-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-9d5505bcbe04-g01-b01
      type: paragraph
      text:
        en: For example, if the missed triggered ability lasts “until [some amount of time]” or “for as
          long as [some condition],” then the ability has a duration. If a missed trigger is not noticed
          until after the amount of time has elapsed or the condition is no longer true, the ability is
          skipped with no further resolution.
        zh: 例如，遗漏的触发式异能具有“直到[时限]”或“只要于[条件]的时间内”，此异能便具有持续时限。如果直到该时限结束、或提及的条件不再成立，该触发式异能都没有被注意到，该异能便会被忽略，也不会再结算。
      sourceRawUnits:
      - raw-L001158
      - raw-L001162
    - id: ipg-ann-2-1-9d5505bcbe04-g01-b02
      type: paragraph
      text:
        en: 'Examples: Battlegrace Angel, Colossal Whale, Nivix Cyclops'
        zh: 例如：战华天使、超巨鲸、尼米斯独眼巨人。
      sourceRawUnits:
      - raw-L001160
      - raw-L001164
- id: ipg-ann-2-1-7e715a59d925
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b004
    segmentId: ipg-s2-1-c-additional-remedy-g01-b004-rs-9036afe9b4bc
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-7e715a59d925-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-7e715a59d925-g01-b01
      type: paragraph
      text:
        en: So, run through the checks above. If none of them fit, this is our default.
        zh: 如果经过检查，异能都不符合上面的情况，那么下面就是预设的解决方法。
      sourceRawUnits:
      - raw-L001170
      - raw-L001174
    - id: ipg-ann-2-1-7e715a59d925-g01-b02
      type: paragraph
      text:
        en: The opponent should be explicitly asked if they would like the ability to go on the stack.
          Judges should not just assume that players won’t want triggers harmful to them or helpful to
          an opponent to be skipped, no matter how silly asking might seem.
        zh: 裁判应当明确询问对手是否想要将该异能放进堆叠。即使问起来可能显得很愚蠢，裁判也不能默认牌手一定想让对其不利或对对手有利的异能被略过。
      sourceRawUnits:
      - raw-L001172
      - raw-L001176
- id: ipg-ann-2-1-7c372e0064a2
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b004
    segmentId: ipg-s2-1-c-additional-remedy-g01-b004-rs-26b996c9fbb4
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-1-7c372e0064a2-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-7c372e0064a2-g01-b01
      type: paragraph
      text:
        en: One case in which it might not be possible to insert the trigger in the appropriate place
          on the stack is if some of the other abilities that triggered at the same time as the missed
          trigger have since resolved and are no longer there.
        zh: 有一种不能将异能插入原本应处的位置的情况是，另一些与被遗漏的触发同时触发的异能已经结算并不在堆叠里。
      sourceRawUnits:
      - raw-L001182
      - raw-L001184
- id: ipg-ann-2-1-b1daec471a78
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b004
    segmentId: ipg-s2-1-c-additional-remedy-g01-b004-rs-da5f76ea3791
  position: after
  order: 30
  groups:
  - id: ipg-ann-2-1-b1daec471a78-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-b1daec471a78-g01-b01
      type: paragraph
      text:
        en: When placing missed triggers on the stack, players may make choices only about objects that
          could have been chosen had the trigger not been missed. Because there is one-turn expiration
          on placing missed triggers on the stack, it’s unlikely that many permanents have moved around
          in the interim. For this reason, remembering which objects were in which zones shouldn’t be
          too taxing to either player’s memory.
        zh: 在将遗漏的触发放进堆叠时，牌手只能做出如果该堆叠没有遗漏的情况下可以做出的选择。因为将异能放回堆叠只有一回合的时效，通常不太可能在这段时间内有很多永久物改变区域。因此，记住哪个物件在哪个区域应该不会耗费双方牌手过多的记忆。
      sourceRawUnits:
      - raw-L001190
      - raw-L001192
- id: ipg-ann-2-1-782a66f64f2c
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b004
    segmentId: ipg-s2-1-c-additional-remedy-g01-b004-rs-45cd63bf4be3
  position: after
  order: 40
  groups:
  - id: ipg-ann-2-1-782a66f64f2c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-782a66f64f2c-g01-b01
      type: paragraph
      text:
        en: If a player unintentionally misses their own Smokestack trigger (At the beginning of each
          player’s upkeep, that player sacrifices a permanent for each soot counter on Smokestack), but
          this is not noticed until after the player has moved into their first main phase and played
          a land, the player should receive a Warning and the opponent should be asked if they would like
          the trigger to go on the stack. If the trigger is placed on the stack, then the player may not
          choose the land they just played for the turn as one of the permanents to sacrifice.
        zh: 如果牌手无意中忘记了他自己的烟囱的触发（在每位牌手的维持开始时，烟囱上每有一个油烟指示物，该牌手便牺牲一个永久物。），但直到该牌手的战斗前行动阶段下了一块地以后才注意到，该牌手应当获得一个警告，并且裁判应当询问对手是否想让该触发进入堆叠。如果该触发被放进堆叠，该牌手不得在结算烟囱的异能时选择牺牲他这回合刚下的这块地。
      sourceRawUnits:
      - raw-L001198
      - raw-L001200
- id: ipg-ann-2-1-0c1945be01b0
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b005
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-0c1945be01b0-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-0c1945be01b0-g01-b01
      type: paragraph
      text:
        en: Simple backups are now allowed for specific missed trigger situations. For a 38 word single
          sentence, there’s a lot to talk about in the blue box.
        zh: 针对特定的遗漏触发情况，现在允许进行简易倒回了。对于这一句只有38个单词的规则，注解里有很多值得探讨的内容。
      sourceRawUnits:
      - raw-L001206
      - raw-L001234
    - id: ipg-ann-2-1-0c1945be01b0-g01-b02
      type: paragraph
      text:
        en: There are three questions to ask before using this new tool.
        zh: 在使用这个新工具之前，需要问三个问题：
      sourceRawUnits:
      - raw-L001207
      - raw-L001236
  - id: ipg-ann-2-1-0c1945be01b0-g02
    kind: unordered-list
    blocks:
    - id: ipg-ann-2-1-0c1945be01b0-g02-b01
      type: list-item
      text:
        en: Will you be giving a warning? (This is more of a guideline than an absolute and discussed
          below )
        zh: 你会给出警告吗？（这更多是一个指导方针而非绝对标准，将在下文讨论）
      sourceRawUnits:
      - raw-L001209
      - raw-L001238
      marker: bullet
    - id: ipg-ann-2-1-0c1945be01b0-g02-b02
      type: list-item
      text:
        en: Does the missed trigger affect the action you are considering reversing?
        zh: 遗漏的触发是否影响了你正在考虑撤销的那个动作？
      sourceRawUnits:
      - raw-L001211
      - raw-L001240
      marker: bullet
    - id: ipg-ann-2-1-0c1945be01b0-g02-b03
      type: list-item
      text:
        en: Does your simple backup stick to a single action and avoid pitfalls like reversing draw steps
          with a shuffle effect on board?
        zh: 你的简易倒回是否仅限于单一动作，并避免了诸如在场上有洗牌效应时倒回抓牌等隐患？
      sourceRawUnits:
      - raw-L001213
      - raw-L001242
      marker: bullet
  - id: ipg-ann-2-1-0c1945be01b0-g03
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-0c1945be01b0-g03-b01
      type: paragraph
      text:
        en: As long as you answer “Yes” to each of these questions, performing a backup may be sensible.
          Not doing the backup is still an option which is why you should let the player know if you’re
          offering a simple backup when giving them the choice to put the trigger on the stack. Let’s
          take an example of Artemis missing their Chalice of the Void trigger when casting Green Sun’s
          Zenith for X=0 tutoring up a Dryad Arbor immediately after fetching for a green source to cast
          it. Before Austin takes their next action, Nevil says, “Hey, X=0 means the spell should have
          been countered by your Chalice on 1.” then calls a judge.
        zh: 只要你对所有这些问题的回答都是“是”，那么执行倒回就是合理的。当然，不进行倒回仍然是一个选项，这就是为什么当你让牌手选择是否将触发放入堆叠时，如果你同时也提供简易倒回作为方案，你应该告知他们。让我们看一个例子：Artemis在施放
          X=0 的绿阳当空时遗漏了他操控的虚空圣杯的触发。为了施放它，他先掰找地地找了一个绿色法术力源，然后结算绿阳当空找出了树灵乔木。在Artemis采取下一个行动之前，Nevil说：“嘿，X=0
          意味着这咒语应该被你的一豆圣杯反击才对。”然后叫了裁判。
      sourceRawUnits:
      - raw-L001215
      - raw-L001217
      - raw-L001244
    - id: ipg-ann-2-1-0c1945be01b0-g03-b02
      type: paragraph
      text:
        en: Does this fit the situation above?
        zh: 这符合上述情况吗？
      sourceRawUnits:
      - raw-L001219
      - raw-L001246
  - id: ipg-ann-2-1-0c1945be01b0-g04
    kind: unordered-list
    blocks:
    - id: ipg-ann-2-1-0c1945be01b0-g04-b01
      type: list-item
      text:
        en: Will you be giving a warning? Yes, this upgrades since Artemis missed a triggered ability
          usually considered detrimental for Artemis, the controlling player.
        zh: 你会给出警告吗？是的，判罚会升级，因为 Artemis 遗漏了一个通常被认为对操控者不利的触发式异能。
      sourceRawUnits:
      - raw-L001221
      - raw-L001248
      marker: bullet
    - id: ipg-ann-2-1-0c1945be01b0-g04-b02
      type: list-item
      text:
        en: Will backing up help the missed trigger fix…? Again, yes. Prior to this change a judge could
          ask Nevil if they wanted the trigger put on the stack; however, since the spell was already
          fully resolved this would do nothing. With this change, we can back up the search and shuffle
          to counter the spell.
        zh: 倒回是否有助于修正遗漏的触发？同样，是的。在这项改动推出之前，裁判会询问Nevil是否希望将触发放入堆叠；然而，由于咒语已经完全结算，这样做毫无意义。有了这项改动，我们可以倒回搜寻和洗牌的动作，从而让圣杯反击该咒语。
      sourceRawUnits:
      - raw-L001222
      - raw-L001250
      marker: bullet
    - id: ipg-ann-2-1-0c1945be01b0-g04-b03
      type: list-item
      text:
        en: Does the backup change just the last action and leave the game in a better state? While some
          judges may be nervous about backing up through a shuffle and search, there is no reason to avoid
          this backup. After all, the Dryad Arbor will be returned to the deck and the Green Sun’s Zenith
          will be removed from it and put in the graveyard prior to the deck’s randomization.
        zh: 倒回是否只改变了最后一个动作并让游戏处于更好的状态？虽然有些裁判可能对倒回洗牌和搜寻动作感到紧张，但没有理由避免这种倒回。毕竟，树灵乔木会被放回牌库，绿阳当空会从牌库中移除并放入坟墓场，这一切都发生在牌库随机化之前。
      sourceRawUnits:
      - raw-L001224
      - raw-L001252
      marker: bullet
  - id: ipg-ann-2-1-0c1945be01b0-g05
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-0c1945be01b0-g05-b01
      type: paragraph
      text:
        en: 'Note: We are using “Will you give a warning?” as a stand-in for several complex items. The
          policy here is indicating that a player takes an action that indicates their own trigger was
          missed. In the case above, if Nevil cast the spell and Artemis didn’t point out the trigger,
          we would either rule that Artemis missed their trigger and Nevil gets to put it on the stack
          -or- investigation would reveal that Nevil tried to advance the game improperly past Artemis’
          trigger. However, in neither case would Artemis get a warning. Additionally if we are in a case
          where a player misses their own trigger and completes an action, and the trigger was good for
          the player, the opponent is not going to choose to put the trigger on the stack. So, in general,
          the opponent will only wish to put the trigger on the stack when the trigger is detrimental.
          And missing a detrimental trigger comes with a warning.  There are exceptions, but we are basically
          in a corner case of a corner case of a corner case and this annotation is already long enough.'
        zh: 注意：我们使用“你会发出警告吗？”来代表几个复杂的事项。这里的方针是指牌手采取了一个动作，表明他们遗漏了自己的触发。在上述案例中，如果是Nevil施放咒语而Artemis没有指出触发，我们要么判Artemis遗漏了触发且Nevil可以选择将其放入堆叠，要么调查显示Nevil试图不正当地跳过Artemis的触发来推进游戏。然而，无论哪种情况，Artemis都不会收到警告。此外，如果牌手遗漏了自己的触发并完成了一个动作，而该触发对该牌手是有利的，对手是不会选择将触发放入堆叠的。所以，通常情况下，对手只有在触发对操控牌手不利的时候才希望将其放入堆叠。而遗漏不利的触发会伴随着一个警告。虽然有例外，但我们基本上是在讨论极端情况中的极端情况，而这条注解已经够长了。
      sourceRawUnits:
      - raw-L001226
      - raw-L001254
    - id: ipg-ann-2-1-0c1945be01b0-g05-b02
      type: paragraph
      text:
        en: 'Likewise, most triggered abilities do not require this backup because they fail on question
          #2. A missed Dictate of Kruphix trigger ends up with the same outcome as a recognized trigger
          even if you are giving a warning–the player who didn’t get to draw a card at the correct time
          draws one now.'
        zh: '同样，大多数触发式异能不需要这种回溯，因为它们不符合问题 #2。遗漏克罗芬斯的旨意触发的结果与被未被遗漏的触发结果相同，即使你发出了警告——原本没能在正确时间抓牌的牌手现在抓一张即可。'
      sourceRawUnits:
      - raw-L001228
      - raw-L001256
    - id: ipg-ann-2-1-0c1945be01b0-g05-b03
      type: paragraph
      text:
        en: 'Regarding question #3, this reminds us to look at potential random elements such as drawing
          cards, shuffling, coinflips, etc. If the spell that should have been countered by the caster’s
          Chalice is a resolved Brainstorm followed by a fetch land activation, you will still give the
          warning; however, you won’t backup.'
        zh: '关于问题 #3，这提醒我们要关注潜在的随机因素，如抓牌、洗牌、掷硬币等。如果一个已结算的脑力激荡本该被其施放者的圣杯反击，他紧接着使用了找地地，你仍然要发出警告；但是，你不能进行倒回。'
      sourceRawUnits:
      - raw-L001230
      - raw-L001258
    - id: ipg-ann-2-1-0c1945be01b0-g05-b04
      type: paragraph
      text:
        en: Finally, the simple backup as the authorized fix means we cannot backup multiple steps such
          as backing up through Abe’s missed Desecration Demon trigger after attacks have been declared,
          blockers chosen, damage assigned, and Abe played a land in the second main phase before either
          player notices. You will still give the warning and offer to put the trigger on the stack.
        zh: 最后，简易回溯作为一种经授权的修正手段，意味着我们不能回溯多个步骤。例如：在Abe遗漏了渎圣恶魔的触发，且已经宣告攻击、选择阻挡者、分配伤害，并且Abe在第二行动阶段下了一块地之后，双方才发现。这种情况下不能进行倒回。你仍然要发出警告，并提供将触发放入堆叠的选项。
      sourceRawUnits:
      - raw-L001232
      - raw-L001260
- id: ipg-ann-2-1-4dbe639fb8e9
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b006
    segmentId: ipg-s2-1-c-additional-remedy-g01-b006-rs-c0a23d290ec3
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-1-4dbe639fb8e9-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-4dbe639fb8e9-g01-b01
      type: paragraph
      text:
        en: “Usually detrimental” triggers are often all-downside triggers that have been added to some
          card in order to balance out some other above-the-curve stats or other beneficial effects. Other
          times, “usually detrimental” triggers are ones that “clean up” a game state by causing the controller
          to sacrifice some temporarily-created tokens or to give a momentarily nullified permanent back
          to an opponent.
        zh: “通常认为对其操控牌手不利”的触发通常是全为负面的异能，这些异能通常加在一些高于曲线属性或其他正面效应的牌之上，以进行平衡。另一些“通常不利”的异能是用于“清理”游戏状态的异能，例如使其操控者牺牲一些临时创造的衍生物、或将暂时去除的永久物还给对手的异能。
      sourceRawUnits:
      - raw-L001266
      - raw-L001276
    - id: ipg-ann-2-1-4dbe639fb8e9-g01-b02
      type: paragraph
      text:
        en: 'Furthermore, “usually detrimental” means that you should consider the card associated with
          the trigger in a vacuum and not take into account any game-specific information in order to
          determine whether or not a trigger is detrimental. Toby Elliott once said (on his blog) that
          one guideline for making this determination is to ask yourself: “If the trigger didn’t exist,
          would the card be played?” If the answer is no, then the ability is probably not detrimental.'
        zh: 进一步说明，你可以在不涉及任何具体游戏信息的情况下考虑这张牌，来判断一个异能是否是“通常认为对其操控牌手不利”。Toby Elliott曾（在其[博客](http://blogs.magicjudges.org/telliott/2012/09/17/missed-triggers-2/)上）说明了如何进行这种判断：“如果这个触发不存在，这张牌会变更好还是变更差？”问问自己这个问题，如果答案是“变更差”，那这个异能一般不是不利的异能。
      sourceRawUnits:
      - raw-L001268
      - raw-L001278
    - id: ipg-ann-2-1-4dbe639fb8e9-g01-b03
      type: paragraph
      text:
        en: In theory, all triggered abilities in Magic could be classified as either detrimental or non-detrimental
          — in fact, a small group of judges are endeavoring to accomplish this very thing with the Missed
          Trigger Guides project.
        zh: 理论上，万智牌中所有的触发式异能都可以分成有利或不利的。有一群裁判致力于这件事情，你可以在这里查看他们的成果：http://wiki.magicjudges.org/en/w/Missed_Trigger_Guides|遗漏触发指南
      sourceRawUnits:
      - raw-L001270
      - raw-L001280
    - id: ipg-ann-2-1-4dbe639fb8e9-g01-b04
      type: paragraph
      text:
        en: The last sentence is added for cards like The Tabernacle at Pendrell Vale or Kataki, War’s
          Wage. They have a mostly-defunct template which creates triggers on other objects, notably opponents’
          objects.
        zh: 最后一句话是为诸如潘卓欧谷大礼拜堂或是战仇祸太奇这类牌增加的。这些牌的异能写法现在几乎已经不再用，它们会为其他物件（尤其是对手的物件）赋予触发式异能。
      sourceRawUnits:
      - raw-L001272
      - raw-L001282
    - id: ipg-ann-2-1-4dbe639fb8e9-g01-b05
      type: paragraph
      text:
        en: We cleaned up the default action. What about the Warning? How do we make these triggers not
          detrimental? It turns out there’s an intuitive solution – a trigger is only detrimental for
          you if you caused its existence. Always take responsibility for your creations!
        zh: 我们现在去掉了预设动作。那警告怎么办？我们如何不把这类触发式异能看成是不利的？有一种很直观的解决方法——只有你造成了触发式异能的存在，它对你才是不利的。永远都要为你自己创造的东西负起责任！
      sourceRawUnits:
      - raw-L001274
      - raw-L001284
- id: ipg-ann-2-1-5616e7959a29
  anchor:
    type: block
    id: ipg-s2-1-c-additional-remedy-g01-b006
    segmentId: ipg-s2-1-c-additional-remedy-g01-b006-rs-795d7a45d875
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-1-5616e7959a29-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-1-5616e7959a29-g01-b01
      type: paragraph
      text:
        en: When determining if a trigger is ‘usually detrimental,’ we do not look at the game state.
          A Dark Confidant trigger at 20 life is the same as a Dark Confidant trigger at 1 life. This
          is because we want consistent rulings and there is no way to take game state into account and
          have every judge answer the same way.
        zh: 当判断触发式异能是不是“通常不利”的时，我们不考虑游戏状态。黑暗亲信的异能在20生命与1点生命时没有区别。这是因为我们需要判决的一致性，而游戏状态千变万化，并且每个裁判可能都会对游戏状态做出不同的判断。
      sourceRawUnits:
      - raw-L001290
      - raw-L001298
    - id: ipg-ann-2-1-5616e7959a29-g01-b02
      type: paragraph
      text:
        en: 'However, we are allowed to consider symmetrical abilities differently based on who is affected.
          What exactly is a symmetrical ability? Symmetrical abilities are triggered abilities that meet
          two conditions. They: 1. are likely to trigger multiple times per game, triggering for different
          players 2. have the same effect on both players.'
        zh: 但是，我们可以根据所影响的牌手来判断对等触发的异能是否是通常不利的。什么是对等触发？对等触发需要满足两个条件：1. 每盘游戏会触发多次，并对不同的牌手都会触发；2. 对于每位牌手会产生同样的效应。
      sourceRawUnits:
      - raw-L001292
      - raw-L001300
    - id: ipg-ann-2-1-5616e7959a29-g01-b03
      type: paragraph
      text:
        en: Examples include Howling Mine, Sulfuric Vortex, and Burning Earth. A symmetrical ability may
          either do something positive to both players, or do something negative to both players, but
          would never do something positive to one player and negative to the other player. Furthermore,
          a symmetrical ability must have its effect on each player during separate instances of the same
          ability. For example, Sire of Insanity’s triggered ability (At the beginning of each end step,
          each player discards their hand.) is not symmetrical.
        zh: 这类异能的例子有：嚎叫的矿井、硫磺旋风、燃烧土地等。对等触发异能可能对双方牌手都是有利的，也可能对双方牌手都是不利的，但从不会对其中一位牌手是有利的而对另一位牌手是不利的。并且，对等触发异能在每次触发时，都应当只影响其中一位牌手。例如，疯狂君父的触发式异能（在每个结束步骤开始时，每位牌手弃掉其手牌。）不是对等触发异能。
      sourceRawUnits:
      - raw-L001294
      - raw-L001302
    - id: ipg-ann-2-1-5616e7959a29-g01-b04
      type: paragraph
      text:
        en: If a player misses a symmetrical trigger that would be either bad for them or good for an
          opponent, they should receive a Warning.
        zh: 如果牌手遗漏了对其不利或对对手有利的对等触发，他应当得到警告判罚。
      sourceRawUnits:
      - raw-L001296
      - raw-L001304
- id: ipg-ann-2-2-6de92d7c0531
  anchor:
    type: block
    id: ipg-s2-2-c-definition-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-2-6de92d7c0531-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-2-6de92d7c0531-g01-b01
      type: paragraph
      text:
        en: This infraction is pretty easy to commit. Any time that a library is touched, it is possible
          that a card will be dropped, or flipped over; or when drawing a card, two cards may get stuck
          or picked up together. Additionally mistakes aren’t limited to cards seen from the deck. Sideboard
          cards and facedown cards can count as well.
        zh: 这种违规是相当容易犯的。当你接触牌库时，你有可能会碰掉一张牌，或者翻开一张牌；又或者在你抓牌时抓了一张或两张并看到了下一张的牌面。此外，这类错误并不仅限于看到牌库里的牌。备牌和面朝下的牌也算在内。
      sourceRawUnits:
      - raw-L001316
      - raw-L001338
    - id: ipg-ann-2-2-6de92d7c0531-g01-b02
      type: paragraph
      text:
        en: Generally, when we are talking about Looking at Extra Cards (L@EC), we are talking about a
          player seeing the face of some card in his or her own deck. However, you might also see some
          cards in your opponent’s deck while shuffling it.
        zh: 一般来说，当提及额外看牌时，我们是在说牌手看到了自己套牌的某些牌的牌面，但是，你也有可能在洗对手套牌时看到其中的某些牌。
      sourceRawUnits:
      - raw-L001318
      - raw-L001340
    - id: ipg-ann-2-2-6de92d7c0531-g01-b03
      type: paragraph
      text:
        en: Be careful not to confuse this infraction with the Hidden Card Error infraction. In particular,
          the Hidden Card Error infraction also covers situations where you are looking at some number
          of cards on the top of your library and you look at too many of them. So, in this specific case,
          you are looking at extra cards, but you aren’t Looking At Extra Cards.  Does your brain hurt?
          Mine does.
        zh: 请小心，不要将这个违规与非公开牌张失误混淆。具体来说，非公开牌张失误也包含了你检视牌库顶数张牌时检视了过多牌的情形。在这种情况中虽然你是额外看了牌，但违规却不是额外看牌。头疼吗？我是挺头疼的。
      sourceRawUnits:
      - raw-L001320
      - raw-L001342
    - id: ipg-ann-2-2-6de92d7c0531-g01-b04
      type: paragraph
      text:
        en: As mentioned in the section above, HCE touches similar space to the Looking at Extra Cards
          infraction.  When you are manipulating a set of cards from the top of the library, and you manipulate
          too many of them, that’s considered HCE. For the purpose of HCE, once the drawn cards have significantly
          left the library as part of a draw, they can no longer be considered Looking at Extra Cards.
        zh: 正如上面所提到的，非公开牌张失误（HCE）与额外看牌这两个违规涉及的范围有相似之处。当你操纵牌库顶的一些牌却操纵多了时，这属于非公开牌张失误。在考虑HCE时，一旦所抓的牌在抓的过程中显著离开了牌库，违规便不再是额外看牌。
      sourceRawUnits:
      - raw-L001322
      - raw-L001344
    - id: ipg-ann-2-2-6de92d7c0531-g01-b05
      type: paragraph
      text:
        en: From the explanation released with a recent change to this infraction, it is stated that “the
          key [to determining the LEC/HCE border] is to look at whether the opponent intended (mistakenly
          or not) to pick up that many cards, or if they were trying to pick up the correct number and
          failed to do so thanks to bad dexterity (as opposed to bad counting!)”
        zh: 在对这项违规近期一次更动的同时发布的解释中如此说：「[确定LEC和HCE边界线]的关键是看对手是本意（无论这种本意是否出于错误）就是拿起这么多牌，还是在本想拿起正确数量的牌时因为手脚笨拙（而不是因为数错了数！）而没能做到。」
      sourceRawUnits:
      - raw-L001324
      - raw-L001346
    - id: ipg-ann-2-2-6de92d7c0531-g01-b06
      type: paragraph
      text:
        en: Sets are defined in section 1.5, so head there if you need a refresher.  Basically, once the
          card you are just looking at is added to a set of cards, you aren’t looking at it anymore, and
          the infraction is no longer L@EC but rather HCE.  But if you are supposed to Scry 1, and you
          instead pick up two cards, you didn’t add that second card to the Scry set until you actually
          start to Scry. Get it? It’s ok if this is a little confusing because this distinction is probably
          the least clear of anything in this entire guide.  Basically, there is a point when picking
          up those two cards where we transition from “oops, I grabbed a second card” to “I have a second
          card that I can perform actions on”. Its that point that marks the line between L@EC and HCE
          in this case.
        zh: 牌叠的定义在1.5节，如果你不记得的话可以去看一下。简单地说， 一旦你额外看到的牌已经加入了其他牌叠，那么这便不再属于“看牌”，违规应该是非公开牌张失误，而不是额外看牌。但是，如果你应当占卜1，却拿起了两张牌，直到你实际开始占卜之前，你都不算是把第二张牌加入了占卜的牌叠。明白了吗？即使还没明白也没关系，因为这里面的区别可能是这整个AIPG里面最为模糊的部分了。简而言之，在拿起这两张牌时，从「哎呀，我多拿起了一张牌」到「我有第二张牌可以用来执行动作」之间有一个分界点。在这个情形下就是这个分界点区分了LEC和HCE。
      sourceRawUnits:
      - raw-L001326
      - raw-L001348
    - id: ipg-ann-2-2-6de92d7c0531-g01-b07
      type: paragraph
      text:
        en: Looking at Extra Cards also covers when you knock over a card, drop a card while shuffling
          an opponent’s deck, start to draw a card when you shouldn’t, and milling or dredging too many
          cards. Milling and Dredging are covered by Looking at Extra Cards because the cards are being
          placed into a public zone we can all see.  However, this only applies if we catch the error
          right away. If we start to take other actions, we have moved past the point where we can claim
          we accidentally saw an extra card, and we have instead accepted that card is supposed to be
          in the graveyard.
        zh: 额外看牌也适用于你不小心碰掉了一张牌、洗对手的牌时掉了一张牌、当你不应抓牌时却开始抓牌、磨掉了或者发掘了太多牌。磨牌库和发掘归在额外看牌的原因是这些牌张放进了公开区域。但是，这只会在立即发现错误时才算做额外看牌。如果我们开始执行其他动作，我们就越过了可以称为「不小心看到一张额外的牌」的时间点，而变成已经接受了这张牌就应该在坟墓场。
      sourceRawUnits:
      - raw-L001328
      - raw-L001350
    - id: ipg-ann-2-2-6de92d7c0531-g01-b08
      type: paragraph
      text:
        en: Sometimes players put cards on the table face down before drawing them, for the purpose of
          counting the cards or for thinking before putting the cards into the hand. This is not forbidden
          and judges should not penalize it. In this situation the difference is that the player does
          it intentionally and takes care about not seeing any cards improperly.  This statement also
          applies to the HCE infraction.
        zh: 有时牌手在抓牌前将牌面朝下的置于桌面上以计算数量或在放入手牌前思考。这并不是被禁止的，裁判也不该惩处此类行为。这种情况与额外看牌的不同是，牌手有意识地做出这样的动作，并且小心不会看到任何不该看的牌。在考虑非公开牌张失误时同样应当注意这一点。
      sourceRawUnits:
      - raw-L001330
      - raw-L001352
    - id: ipg-ann-2-2-6de92d7c0531-g01-b09
      type: paragraph
      text:
        en: Dropping a card while shuffling your own library is not Looking at Extra Cards. Just put the
          card back and continue to randomize your deck.
        zh: 在洗你自己的牌库时掉落一张牌并不是额外看牌。将牌放回牌库继续随机化即可。
      sourceRawUnits:
      - raw-L001332
      - raw-L001354
    - id: ipg-ann-2-2-6de92d7c0531-g01-b10
      type: paragraph
      text:
        en: 'Observing the face of a card your opponent dropped or flipped is also not Looking at Extra
          Cards. There are two reasons for this: 1) If a player could drop a card and get their opponent
          a Warning, they are going to messy-shuffle their way into a top 8. 2) MTR 3.13 allows players
          to reveal hidden information to their opponent that they are entitled to know.'
        zh: 观察到你对手掉落或者翻开的牌面同样也不是额外看牌。原因有两点：1）如果牌手可以掉落一张牌而使对手获得警告，他就可以胡乱洗牌将自己送入8强。2）MTR3.13允许牌手展示自己知悉的隐藏信息给对手知道。
      sourceRawUnits:
      - raw-L001334
      - raw-L001356
    - id: ipg-ann-2-2-6de92d7c0531-g01-b11
      type: paragraph
      text:
        en: It’s important to note that this infraction doesn’t just apply to cards in a library (or sideboard).  If
          you accidentally look at cards exiled by a Bomat Courier, that’s also Looking at Extra Cards.
        zh: 请记住，这个违规并不只对牌库中（或备牌中）的牌适用。如果你不小心看到了被博默区讯使放逐的牌，那也是额外看牌。
      sourceRawUnits:
      - raw-L001336
      - raw-L001358
- id: ipg-ann-2-2-04adc3b88119
  anchor:
    type: block
    id: ipg-s2-2-c-definition-g01-b002
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-2-04adc3b88119-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-2-04adc3b88119-g01-b01
      type: paragraph
      text:
        en: We don’t penalize a player for each card seen if all the cards are seen during the same game
          action or sequence of game actions.
        zh: 如果这些看到的牌是在同一个或同一系列游戏动作中看到的，我们并不会为每一张看到的牌都惩罚一次牌手。
      sourceRawUnits:
      - raw-L001364
      - raw-L001366
- id: ipg-ann-2-2-7795d8411a71
  anchor:
    type: block
    id: ipg-s2-2-c-examples-g01-b003
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-2-7795d8411a71-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-2-7795d8411a71-g01-b01
      type: paragraph
      text:
        en: 'In Example B, please consider ‘pulls’ up, as ‘lifts up, but not so much that it could reasonably
          be considered separate from the library’. Other examples could be: A player flips over an extra
          card while resolving a Cascade ability. A player flips over extra cards when milling their deck,
          and this is noticed immediately.'
        zh: 在例子B中，请将“带起”理解为“将牌拿起，但没有达到应视为离开牌库的距离”。其他一些例子：牌手在结算倾曳异能时多翻开了一张牌。牌手在磨牌库时额外翻开一张牌，并立刻发现。
      sourceRawUnits:
      - raw-L001382
      - raw-L001384
- id: ipg-ann-2-2-e8f659ae1998
  anchor:
    type: block
    id: ipg-s2-2-c-philosophy-g01-b001
    segmentId: ipg-s2-2-c-philosophy-g01-b001-rs-03637edf452d
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-2-e8f659ae1998-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-2-e8f659ae1998-g01-b01
      type: paragraph
      text:
        en: Players touch their decks a lot. They touch to shuffle, they touch to draw, they touch to
          search. And every time a deck is touched, there is the possibility that you are going to see
          something you shouldn’t. Since it is easy to do, easy to notice, and easy to fix, a Warning
          is the appropriate penalty.
        zh: 牌手经常接触他们的套牌。他们洗牌、抓牌、搜寻牌库时都会接触套牌。每当牌手接触套牌时，都有一定概率看到不该看到的东西。鉴于此行为容易发生，容易发现也容易修正，警告是恰当的处罚。
      sourceRawUnits:
      - raw-L001392
      - raw-L001394
- id: ipg-ann-2-2-46c29f234226
  anchor:
    type: block
    id: ipg-s2-2-c-philosophy-g01-b001
    segmentId: ipg-s2-2-c-philosophy-g01-b001-rs-550f3c4ce20c
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-2-46c29f234226-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-2-46c29f234226-g01-b01
      type: paragraph
      text:
        en: We all know that drawing is different from looking but sometimes the line is not easy to see.
          The line here is when the card we are looking at is added to another set of cards, either the
          hand, or seven other cards from Dig Through Time. Keep in mind that for this infraction, we
          do allow you to use your judgement a bit when it comes to “I meant to pick up one card and instead
          I picked up two.” That’s not “adding to a set” just yet.
        zh: 我们都知道抓牌不同于看牌，但是有时他们的界限并不容易区分。界限在于额外看到的牌是否加入了其他牌叠。这个牌叠可能是手牌，也可能是历时挖掘看到的其他7张牌。当你处理这类违规时请牢记，在判断“我本想拿起一张牌时拿起了两张牌”这类情形时你可以使用你的判断力。仅凭这一点还不能算是“加入了牌叠”。
      sourceRawUnits:
      - raw-L001400
      - raw-L001402
- id: ipg-ann-2-2-b3aa7f0fd615
  anchor:
    type: block
    id: ipg-s2-2-c-philosophy-g01-b002
    segmentId: ipg-s2-2-c-philosophy-g01-b002-rs-710f095f9d96
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-2-b3aa7f0fd615-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-2-b3aa7f0fd615-g01-b01
      type: paragraph
      text:
        en: This point involves judge ability to understand if a player is lying. Some players know that
          the additional fix for Looking at Extra Cards is a shuffle, so they might “accidentally” peek
          at a card in order to try to get a shuffle. This is cheating, and helps to emphasize the point
          that we need to determine if there are any known cards before we apply the additional fix. When
          you arrive at the table ask both players some questions to get a sense of what is really happening.
        zh: 判断这一点需要裁判具有阅读牌手是否在说谎的能力。有些牌手知道额外看牌的额外修正是洗牌，所以他们可能会“不小心”偷看到一张牌以试图获得洗牌。这是作弊，并且这也强调了我们在进行额外修正前确定是否有已知的牌。当你到达桌前时，问双方牌手一些问题以了解实际发生了什么事情。
      sourceRawUnits:
      - raw-L001408
      - raw-L001410
- id: ipg-ann-2-2-842fe98b8e8f
  anchor:
    type: block
    id: ipg-s2-2-c-philosophy-g01-b002
    segmentId: ipg-s2-2-c-philosophy-g01-b002-rs-bd73f34011fc
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-2-842fe98b8e8f-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-2-842fe98b8e8f-g01-b01
      type: paragraph
      text:
        en: Shuffling a deck requires some time, and players know this. As judges we must prevent players
          taking advantage of the time limit and understand when a player is trying to do that. This is
          also considered cheating, but will be very hard to discover. If it is close to the end of the
          round, stick around and watch if you suspect this may be the case.
        zh: 洗牌库需要一定的时间，而牌手们知道这点。作为裁判我们必须防止牌手用这个判罚来获得时间优势，并在牌手试图这么干的时候发现他的意图。这也算作作弊，但是很难被发现。如果本轮时间快到了，而且你怀疑很有可能属于这种情况，你应当留在附近观察。
      sourceRawUnits:
      - raw-L001416
      - raw-L001418
- id: ipg-ann-2-2-4791eb20dbf4
  anchor:
    type: block
    id: ipg-s2-2-c-philosophy-g01-b002
    segmentId: ipg-s2-2-c-philosophy-g01-b002-rs-592edaac19aa
  position: after
  order: 30
  groups:
  - id: ipg-ann-2-2-4791eb20dbf4-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-2-4791eb20dbf4-g01-b01
      type: paragraph
      text:
        en: This means that the player doesn’t have to waste time by shuffling as they would for the pregame
          procedure. A few mash shuffles or 3-5 riffle shuffles should be sufficient. The purpose is to
          “lose” the seen cards in the deck.
        zh: 这意味着牌手不用在洗牌时像进行游戏前流程时一样大费周章。几次插洗或3-5次鸽尾式洗牌（扑克牌洗法）就足够了。其目的是让被看见的牌在牌库中“失踪”。
      sourceRawUnits:
      - raw-L001424
      - raw-L001426
- id: ipg-ann-2-2-bb5913551888
  anchor:
    type: block
    id: ipg-s2-2-c-additional-remedy-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-2-bb5913551888-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-2-bb5913551888-g01-b01
      type: paragraph
      text:
        en: 'See IPG 1.3 on the details on how to randomize a deck. A summary is: figure out what cards
          are legally know from things like scry or cascade, and, leaving those cards where they are supposed
          to be, shuffle any cards left over. If the cards accidentally seen were previously known (like
          from Brainstorm) you don’t have to do this. If the cards accidentally seen don’t belong in the
          library (a player accidentally looks at an opponent’s sideboard, or a player accidentally looks
          at a stack of cards exiled by their own Bomat Courier), then there is no fix.'
        zh: 关于如何随机化套牌，参见IPG 1.3节。总的来说，确定牌库中有哪些牌是牌手合法知道的（例如因为占卜或倾曳异能所致），并且将这些部分放在他们应当在的位置，然后将剩余的部分洗牌。如果额外看到的牌原本就是合法知道的（例如因脑力激荡所致），则无需做此修正。如果意外看到的牌不属于牌库（例如牌手意外看到了对手的备牌，或牌手意外看到了被自己的博默区讯使放逐的一叠牌），则没有修正方案。
      sourceRawUnits:
      - raw-L001434
      - raw-L001436
- id: ipg-ann-2-3-0d3606aea6a9
  anchor:
    type: block
    id: ipg-s2-3-c-definition-g01-b001
    segmentId: ipg-s2-3-c-definition-g01-b001-rs-fbd1e45f820e
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-0d3606aea6a9-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-0d3606aea6a9-g01-b01
      type: paragraph
      text:
        en: Most Game Play Errors can be observed by both players. The window might be small, but it’s
          visible. Failing to discard a card, casting a spell for the wrong mana; these are things you
          can see. All the information is out in the open. This isn’t an infraction for those type of
          errors. This is for when an error occurs and at the point of the error, the opponent has lost
          the ability to detect how things went wrong, and has no insight into how to fix the game.
        zh: 绝大多数的游戏行动失误对双方牌手都是可见的。有时发现错误的时机可能很短，但仍然存在可见的时机。例如忘记弃牌、支付错误的法术力施放咒语等；这些都是能看到的部分。信息是公开的。这项违规不是关于这类失误的。这项违规适用于在失误发生时对手没有能力察觉什么地方出了问题，也无法知晓如何修正游戏状态的一类失误。
      sourceRawUnits:
      - raw-L001448
      - raw-L001450
- id: ipg-ann-2-3-96da4bb493d8
  anchor:
    type: block
    id: ipg-s2-3-c-definition-g01-b001
    segmentId: ipg-s2-3-c-definition-g01-b001-rs-4595bc2d1aa5
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-3-96da4bb493d8-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-96da4bb493d8-g01-b01
      type: paragraph
      text:
        en: 'This sentence has two parts that involve the opponent.  If the opponent acknowledges the
          draw, the player has given warning that something is about to go wrong.  In a very real sense,
          this error was correctable with publicly available information. In this case, we do not want
          to overly penalize the player as the error was ‘visible’ to both players, or incentivize the
          opponent to “agree” to an action that will get their opponent a harsher penalty.  The second
          part involves continuous effects the opponent controls. This is essentially a clause for Narset,
          Parter of Veils. Here we want to put a bit more of a burden on the owner of the effect to be
          proactive in preventing problems. Keeping your mouth shut and then getting a free Thoughtseize
          is too good, and makes these effects a bit strong by allowing the player to play the IPG instead
          of Magic: The Gathering.'
        zh: 这句话包含两个涉及对手的部分。如果对手许可了这次抓牌，说明该牌手已经对即将发生的错误给出了预警。从非常现实的角度来看，这个错误本可以通过公开信息来纠正。在这种情况下，我们不想过度惩罚该牌手，因为该错误对双方都是“可见的”；我们也不希望鼓励对手为了让对方受到更严厉的惩罚而“同意”某个会导致对方受罚的动作。第二部分涉及对手操控的持续性效应。这本质上是针对揭帷娜尔施的一项条款。在这里，我们希望让该效应的拥有者承担更多责任，主动去预防问题的发生。保持沉默然后获得一次免费的思绪实在太赚了；如果允许牌手玩弄IPG而不是好好玩万智牌，会使得这些效应变得过于强力。
      sourceRawUnits:
      - raw-L001456
      - raw-L001462
    - id: ipg-ann-2-3-96da4bb493d8-g01-b02
      type: paragraph
      text:
        en: In both cases, consider a Game Rule Violation instead, and for the second case, double GRV
          is probably appropriate.
        zh: 在这两种情况下，都应考虑违反游戏规则；对于第二种情况，双方都判违反游戏规则可能是恰当的。
      sourceRawUnits:
      - raw-L001458
      - raw-L001464
    - id: ipg-ann-2-3-96da4bb493d8-g01-b03
      type: paragraph
      text:
        en: Note that if the action would be illegal without the opponent’s continuous effect then it
          should still be treated as a Hidden Card Error. For example if instructed to scry a player draws
          a card instead, it is still a Hidden Card Error even if an opponent controls a Narset.
        zh: 注意，如果该动作在没有对手持续性效应的情况下本身就是非法的，那么它仍应被视为非公开牌张失误。例如，如果牌手被指示占卜却抓了一张牌，即使对手操控揭帷娜尔施，这依然是一个非公开牌张失误。
      sourceRawUnits:
      - raw-L001460
      - raw-L001466
- id: ipg-ann-2-3-c75d31583fe1
  anchor:
    type: block
    id: ipg-s2-3-c-definition-g01-b001
    segmentId: ipg-s2-3-c-definition-g01-b001-rs-13acafecdf4a
  position: after
  order: 30
  groups:
  - id: ipg-ann-2-3-c75d31583fe1-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-c75d31583fe1-g01-b01
      type: paragraph
      text:
        en: In this case, hidden locations are the hand, the library, face down cards on the battlefield
          and face down cards in exile. Unknown cards are when one or more of the players don’t know what
          the cards are. Note that the identity of the top card of the library is unknown, but the location
          of the top card is public, something that isn’t always obvious, so a tutor effect that searches
          for a specific card and puts it on top of the library is putting the card into a “known” position.
        zh: 我们这里说的“非公开位置”指的是手牌、牌库、战场上牌面朝下的牌、以及放逐区中牌面朝下的牌。未知牌张指的是一个或多个牌手不知道这些牌是什么。注意其中一点，牌库顶牌是什么属于未知的信息，但牌库顶牌的位置是双方都知道的。因此，一个搜寻特定牌并将其放在牌库顶的导师效应是将该牌放到了一个“已知”的位置。
      sourceRawUnits:
      - raw-L001472
      - raw-L001474
- id: ipg-ann-2-3-e9c389a01157
  anchor:
    type: block
    id: ipg-s2-3-c-definition-g01-b002
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-e9c389a01157-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-e9c389a01157-g01-b01
      type: paragraph
      text:
        en: This line is here to give a distinction between when a player action should be considered
          Hidden Card Error versus GPE – Looking at Extra Cards.
        zh: 这句话是用来区分牌手的行为是属于非公开牌张失误还是额外看牌的。
      sourceRawUnits:
      - raw-L001480
      - raw-L001486
    - id: ipg-ann-2-3-e9c389a01157-g01-b02
      type: paragraph
      text:
        en: If we use Dig Through Time as an example, if a player resolving this spell looks at eight
          cards rather than seven, we have the wrong number in the set. This is HCE, as the set contains
          a card it should not, and that set is hidden. If, however, during the resolution of Dig Through
          Time, a player looks at seven cards, but knocks the eighth card off the deck while picking up
          those seven, then that eighth card is not a part of the set, and should be treated as a GPE
          – Looking at Extra Cards infraction.
        zh: 我们拿历时挖掘举个例子，如果牌手在结算该咒语时检视了八张而不是七张牌，牌叠中的牌数量便是不正确的。这就是非公开牌张失误，因为牌叠中有一张牌是不应该在这个牌叠中的，且该牌叠是非公开的。然而，如果在历时挖掘结算过程中，牌手检视了七张牌，却不小心在拿起这七张牌时把第八张牌碰掉了，那么这第八张牌便不是牌叠的一部分，且应该使用额外看牌处理该违规。
      sourceRawUnits:
      - raw-L001482
      - raw-L001488
    - id: ipg-ann-2-3-e9c389a01157-g01-b03
      type: paragraph
      text:
        en: Additionally, if a player goes to scry one card, and accidentally picks up two, This could
          still be Looking at Extra Cards.  The difference does require a bit of common sense, as defining
          an exact technical line between HCE and Looking at Extra Cards is would require a lot of text
          and examples and still not cover everything.  Take a moment to consider whether Looking at Extra
          Cards is a more appropriate infraction, whether the player made a mistake in the number of cards
          or the number of cards was an accident, and whether the player has already started to make decisions
          about the set of cards.
        zh: 进一步说，如果一位牌手应该占卜一张牌，却不小心拿起了两张牌，这也可能属于额外看牌。区分这两种违规需要具有一定的常识判断力，给非公开牌张失误和额外看牌从定义上划分一个非常明确的界限，需要使用大量的文字和案例，即便这样也无法涵盖所有可能发生的情况。因此在下结论之前要多想，额外看牌是不是更适用的判罚，牌手是拿取了错误的牌张数，还是因为某种意外不小心导致张数错误，以及牌手是不是已经开始对这个发生错误的牌叠采取思考或行动。
      sourceRawUnits:
      - raw-L001484
      - raw-L001490
- id: ipg-ann-2-3-7ab92c617502
  anchor:
    type: block
    id: ipg-s2-3-c-examples-g01-b006
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-7ab92c617502-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-7ab92c617502-g01-b01
      type: paragraph
      text:
        en: Some of these examples look like the infraction Looking at Extra Cards. The important distinction
          is that if a player ends up with more cards than they are supposed to, either in their hand,
          or in a set of cards they are performing an action on, then it falls under the Hidden Card Error
          infraction. If they’ve only seen one or more extra cards because the card has been flipped over
          or some other dexterity issue that reveals a card to the player then treat the infraction as
          Looking at Extra Cards.
        zh: 其中的一些范例看起来很像额外看牌。关键的区别在于牌手得到了较应得数目为多的牌（不论是手牌还是他们将要执行动作的一堆牌），违规便应当是非公开牌张失误。如果牌手只是翻起了、或因为手脚笨拙导致看到了一张或多张牌，按照额外看牌处理违规。
      sourceRawUnits:
      - raw-L001518
      - raw-L001524
    - id: ipg-ann-2-3-7ab92c617502-g01-b02
      type: paragraph
      text:
        en: Example C only applies if the player remembers the Dark Confidant trigger and doesn’t reveal
          the card before putting the card into their hand. If the player draws for the turn before remembering,
          it’s treated as a missed trigger.
        zh: 例子C只在牌手记得黑暗亲信的触发，但却在将牌放进手里之前没有展示时才是非公开牌张失误。如果牌手在想起触发之前就先抓了本回合的牌，这属于遗漏触发。
      sourceRawUnits:
      - raw-L001520
      - raw-L001526
    - id: ipg-ann-2-3-7ab92c617502-g01-b03
      type: paragraph
      text:
        en: Example F looks a lot like it might fall under Mulligan Procedure Error, but it doesn’t because
          the error occurs after the game has begun. Drawing a card on the opening turn while on the play
          is an example of adding a card that should not be added to a hidden zone, and thus falls under
          Hidden Card Error.
        zh: 例子F看起来非常像再调度失误，但却并不是。因为失误发生在游戏已经开始之后。在你先手时抓了第一回合的牌是一个将不应该加入隐藏区域的牌加入其中的例子，因此它应该是非公开牌张失误。
      sourceRawUnits:
      - raw-L001522
      - raw-L001528
- id: ipg-ann-2-3-25d12234903f
  anchor:
    type: block
    id: ipg-s2-3-c-philosophy-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-25d12234903f-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-25d12234903f-g01-b01
      type: paragraph
      text:
        en: The player with the extra cards has gained information, and that information has been potentially
          commingled with other cards. Being able to see other information you aren’t supposed to and
          potentially make decisions or take action on the information or use those resources (cards)
          is a big deal. We can’t fix it. But we can mitigate it. Your opponent couldn’t witness the error,
          but by allowing the opponent to participate in the fix, we eliminate any advantage gained from
          the error, and still provide a strong incentive not to attempt to cheat.
        zh: 多牌的牌手获得了不应有的信息，并且这个信息可能和其他牌的信息混在一起。能够看到你不应看到的信息、且可能基于这个信息作出决定、采取行动或使用这些资源（牌）是一件大事。我们无法修正信息的获取，但我们可以抵消它带来的影响。虽然对手没有见到错误发生的时刻，但我们可以让对手参与到修正中，来阻止因违规带来的优势，与此同时还能有效地鼓励牌手不要试图作弊。
      sourceRawUnits:
      - raw-L001536
      - raw-L001538
- id: ipg-ann-2-3-da5ebf48987c
  anchor:
    type: block
    id: ipg-s2-3-c-philosophy-g01-b002
    segmentId: ipg-s2-3-c-philosophy-g01-b002-rs-290cb52c48d5
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-da5ebf48987c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-da5ebf48987c-g01-b01
      type: paragraph
      text:
        en: If cards are revealed for something like a mill effect, where both players can see what’s
          happening, the infraction isn’t Hidden Card Error, because the cards aren’t hidden. For a mill
          effect, order is not lost. The information is revealed to everyone and order is maintained.
          Sounds like all players have all the knowledge, and the judge doesn’t have to worry about one
          player having information the other doesn’t. In this case, go to the Game Rule Violation infraction.
        zh: 如果涉及到的牌是被展示出来的（例如磨牌库），双方牌手都能看到发生了什么，那么违规就不是非公开牌张失误，因为这些牌不是非公开的。对于磨牌库效应来说，顺序还没有乱，信息展示给了所有牌手，顺序也能确定，因此所有牌手都有相同的信息，裁判也不用担心其中一位牌手比另一位获得了更多的信息。在此情况下，使用违反游戏规则这项违规。
      sourceRawUnits:
      - raw-L001544
      - raw-L001546
- id: ipg-ann-2-3-7c0d8b596dd8
  anchor:
    type: block
    id: ipg-s2-3-c-philosophy-g01-b002
    segmentId: ipg-s2-3-c-philosophy-g01-b002-rs-2d602b02eeb4
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-3-7c0d8b596dd8-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-7c0d8b596dd8-g01-b01
      type: paragraph
      text:
        en: This sentence is in here to prevent arguments about which card was the extra card drawn, or
          what the third card picked up on a scry 2 was. Unless it was visible to both players, you have
          to treat the cards like they were mixed up. Note, this is different from some cases of Looking
          at Extra Cards, where the cards are still being separated from the library where there is a
          clear order. The line between Looking at Extra Cards and Hidden Card Error is when the cards
          leave the library and the card faces are only visible to one player.
        zh: 这句话是用来防止牌手争论哪张是额外抓的牌、或占卜2时看到的第三张牌是哪张。除非这张牌对双方牌手都可见，否则你必须将这些牌视为混在一起。注意，这与额外看牌的一些情形（牌在与牌库离开了一定距离的情况下仍然保持了清楚的顺序）有区别。额外看牌与非公开牌张失误的界限在于牌是否离开了牌库并且其牌面只对其中一个牌手可见。
      sourceRawUnits:
      - raw-L001552
      - raw-L001554
- id: ipg-ann-2-3-0b2cbc38f0eb
  anchor:
    type: block
    id: ipg-s2-3-c-philosophy-g01-b003
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-0b2cbc38f0eb-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-0b2cbc38f0eb-g01-b01
      type: paragraph
      text:
        en: Look at the root cause. Just because we are now in a spot where information has been lost
          doesn’t mean we started out this way. Another example would be the case of casting Elvish Visionary
          for UU, and then the player draws a card when the enters the battlefield trigger resolves. Once
          that card is drawn, that information is lost, but the original problem was the casting of the
          spell incorrectly and visible to both players.
        zh: 寻找根本原因。即使现在信息已经泄露，也并不意味着问题的原因是由信息的泄露造成的。另一个例子是使用UU施放了妖精幻视师，然后牌手因其进战场触发抓了一张牌。一旦这张牌抓起来了，信息便泄露了，但造成问题的原因是不正确地施放了咒语，而这个原因是双方牌手都可见的。
      sourceRawUnits:
      - raw-L001560
      - raw-L001562
- id: ipg-ann-2-3-7609eb1a5a36
  anchor:
    type: block
    id: ipg-s2-3-c-philosophy-g01-b004
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-7609eb1a5a36-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-7609eb1a5a36-g01-b01
      type: paragraph
      text:
        en: Even though the contents of a previously revealed hand are not public information, the knowledge
          of those cards, when agreed upon by both players (such as from notes taken about the hand) may
          be useful in reconstructing as correct a game state as possible. There is a “may” here, however.
          If there is doubt or disagreement about what has been revealed some turns back, and you aren’t
          confident that the set is correct, you may treat the entire set as the grouping to which to
          apply the remedy.
        zh: 即使先前展示的内容并非公开信息，对这些牌张的双方牌手都同意的知晓（例如根据手牌内容做的笔记）在尽可能地修复游戏状态时可能会有所帮助。但是，这里有一个“可以”。一旦牌手对先前几个回合展示了什么产生了怀疑或不一致，你又不能确认该部分牌叠的正确性，你仍然可以将整个牌叠作为应修正的部分进行修正。
      sourceRawUnits:
      - raw-L001568
      - raw-L001570
- id: ipg-ann-2-3-83a51061c3d7
  anchor:
    type: block
    id: ipg-s2-3-c-philosophy-g01-b005
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-83a51061c3d7-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-83a51061c3d7-g01-b01
      type: paragraph
      text:
        en: This section really just enforces that we use common sense to restore the game without too
          much disruption. In the example given, the player should have looked at six cards on resolution,
          but looked at seven. Because of the physical way that action was performed, however, it is clear
          that the first three cards were correct and maintained a clear distance from the other, physically
          distinct set of four cards. This allows us to apply the fix to that smaller set (four cards
          versus seven) without advantage gained or lost unduly. Be sure to gain a full understanding
          of the actions taken with the cards in question before determining if a smaller set will be
          appropriate (ensure sets didn’t touch or mingle).
        zh: 这一部分再次强调了我们应该使用常识判断力来尽量恢复游戏状态，减少对游戏的干扰。在上述的例子中，牌手在结算时应该检视六张牌却检视了七张。但是，由于牌手执行该指示使用了这样的动作，我们可以明确前三张牌是正确的、且与其他四张牌保持了清晰的距离。因此我们可以对一个较小的牌叠执行修正，又不会有牌手因此获得或失去利益。请确保你在决定是否对较小的牌叠执行修正前，完全理解牌手使用的动作（保证牌叠之间没有接触或混淆）。
      sourceRawUnits:
      - raw-L001576
      - raw-L001578
- id: ipg-ann-2-3-99876fb7802c
  anchor:
    type: block
    id: ipg-s2-3-c-additional-remedy-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-99876fb7802c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-99876fb7802c-g01-b01
      type: paragraph
      text:
        en: This portion of the remedy exists so that the actions taken to mitigate advantage may be applied
          to all of the cards that should have been involved. A simple backup allows for the set of affected
          cards to be reconstructed in order for the game to be restored as fairly as possible. This type
          of action is most likely to arise when a player mistakenly puts too many cards directly into
          their hand, then makes a play or completes some other action before realizing the error has
          occurred. In this case, consider the benefits of that simple backup before applying the remedy,
          so that the card set is as correct as possible. This is not a backup to before the error, though,
          so make sure it is used to restore the set for which the remedy of Hidden Card Error is applied,
          not to backup to before the Hidden Card Error happened.
        zh: 这部分修正可以让接下来抵消牌手潜在获利的修正尽量应用于所有受影响的牌张。简易倒回可以修复应当修正的牌叠，使得游戏状态的修复尽可能地公平。这种情况通常发生于牌手错误地多抓了牌，然后在意识到错误之前又做了其他游戏动作。此时应当在应用修正之前先考虑简易倒回，使得应修正的牌叠尽可能地正确。这并不是倒回到错误发生之前，请记住，这个倒回是用来让非公开牌张失误接下来的修正更加正确的，而不是倒回到非公开牌张失误发生之前的。
      sourceRawUnits:
      - raw-L001586
      - raw-L001590
    - id: ipg-ann-2-3-99876fb7802c-g01-b02
      type: paragraph
      text:
        en: An example of this would be if someone draws 4 cards from a Brainstorm, puts 2 cards on top
          of their library, then the error is detected. We will return those two cards to the hand before
          applying any other fix.
        zh: 举个例子，某牌手脑力激荡抓了4张牌，然后在牌库顶放了2张牌，然后才发现了失误。我们应当先将这两张牌放回手牌，再应用其他修正。
      sourceRawUnits:
      - raw-L001588
      - raw-L001592
- id: ipg-ann-2-3-9e883a048753
  anchor:
    type: block
    id: ipg-s2-3-c-additional-remedy-g01-b002
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-9e883a048753-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-9e883a048753-g01-b01
      type: paragraph
      text:
        en: If, during a series of game actions, the affected set of cards has been lost by shuffling
          them away, and the set cannot reasonably be reconstructed, then there is no set left to which
          we can apply the remedy. The infraction still exists in this case, and a penalty issued.
        zh: 如果，在一系列的游戏动作之中，受影响的牌叠已经被洗走而不存在，那么这个牌叠便无法还原，因此便不再存在可以应用修正的牌叠。尽管如此，违规仍然存在，我们仍然要给予判罚。
      sourceRawUnits:
      - raw-L001598
      - raw-L001600
- id: ipg-ann-2-3-1df2b0db1609
  anchor:
    type: block
    id: ipg-s2-3-c-additional-remedy-g01-b003
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-1df2b0db1609-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-1df2b0db1609-g01-b01
      type: paragraph
      text:
        en: 'This is really saying that you can address a complicated situation such as that of “looting”
          instead of “rummaging.” If a card gave an instruction such as ‘discard a card: draw a card,’
          but the player resolves ‘draw a card, then discard a card,’ then we have this remedy available,since
          the hand now contains a card that shouldn’t be there, but a discard still needs to occur. Since
          one route to advantage here is the ability to discard the card just drawn, we allow the opponent
          to identify the card “to be drawn,” and set it aside before applying the remedy. Then, once
          the remedy has been applied, we return the card to the hand/set, and continue from there.'
        zh: 这句话是告诉你如何解决诸如应当“掠夺”时却执行了“翻拣”这种复杂的问题。如果一张牌指示牌手“弃一张牌：抓一张牌”，但牌手结算的是“抓一张牌，然后弃一张牌”，我们就应该使用这种修正方式，因为手牌中现在包含了一张不应在其中的牌，但我们仍然要弃一张牌。因为如果让牌手现在弃掉刚抓的牌可能就会带来优势，我们现在让对手来确认哪张牌是“应当抓起来的”，然后在执行修正之前将其放在一旁。等修正完成之后，我们将这张牌放回原来的手牌/牌叠，然后从此继续。
      sourceRawUnits:
      - raw-L001606
      - raw-L001608
- id: ipg-ann-2-3-b630fa17a34c
  anchor:
    type: block
    id: ipg-s2-3-c-additional-remedy-g01-b004
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-b630fa17a34c-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-b630fa17a34c-g01-b01
      type: paragraph
      text:
        en: 'This involve cards put into a hidden zone whose characteristics should have been checked
          before they moved to that zone. An example of this is Domri Rade’s first ability, which reads
          “+1: Look at the top card of your library. If it’s a creature card, you may reveal it and put
          it into your hand.” If the card is put into the hand without being revealed, we can remedy that
          by revealing the set with the unrevealed card (this case, the hand) and allowing the opponent
          to choose which card should be treated as the “revealed card(s)”. Then, the player reperforms
          the action (the Domri Rade’s 1 ability in our example). If, for instance, the opponent chooses
          a non-creature card in the Domri Rade example, that card no longer fits legally in the set (the
          hand) and should be returned to the top of the library.'
        zh: 这一条主要涵盖一些使牌在进入隐藏区域之前，先验证牌的某些特征的异能。例如多密雷德的第一个异能：“+1：检视你的牌库顶牌。如果它是生物牌，你可以展示之并将其放入手中。”如果该牌未经展示便放进了手中，我们可以展示包含未展示牌张的牌叠（在这个例子里就是手牌）然后让对手从中选择“应当展示的牌”来进行修正。然后牌手重新执行动作（如上例中多密雷德的第一个异能）。在上面的多密例子中，如果对手选择了一张非生物牌，那么这张牌便无法合乎规则地属于这个牌叠（手牌）并且应当移回牌库顶。
      sourceRawUnits:
      - raw-L001614
      - raw-L001616
- id: ipg-ann-2-3-20eef5243e66
  anchor:
    type: block
    id: ipg-s2-3-c-additional-remedy-g01-b006
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-20eef5243e66-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-20eef5243e66-g01-b01
      type: paragraph
      text:
        en: This is the commonly termed “Thoughtseize” fix. The player with too many cards in the set
          reveals that set to the opponent, and they choose which card is to be the “excess card(s).”
          This allows the game to continue while offsetting the very large advantage of an extra card
          or cards being in hand or another set. Return the excess cards to the location they came from.
          If that location is the library, we typically do this by shuffling them into the random portion.
          If the cards were previously known from the top of the library before adding to a set, we return
          them to the top of the library instead.  This exists to remove a minor cheating angle where
          a player would attempt to use HCE to get a free shuffle if their hand and top of library were
          bad.
        zh: 通常把这种修正方式称为“攫取思绪”修正。牌叠中多了牌的牌手将该牌叠展示给对手，然后由对手来选择哪张是“多余的牌”。这样做可以让游戏继续进行，又不至于让多了牌的牌手获得巨大的优势。处理这些多余的牌的方式就是将它们移回其原本所在的位置。如果该位置是牌库，我们通常会将其洗入牌库的随机部分。如果牌库顶的牌在加入牌叠之前就是已知的，我们应改为将其移回牌库顶。这样做是为了消除牌手可能会在手牌和牌库顶都不好的时候试图利用HCE来获取免费洗牌这种作弊的可能性。
      sourceRawUnits:
      - raw-L001622
      - raw-L001624
- id: ipg-ann-2-3-9b9216d0e726
  anchor:
    type: block
    id: ipg-s2-3-c-additional-remedy-g01-b007
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-3-9b9216d0e726-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-3-9b9216d0e726-g01-b01
      type: paragraph
      text:
        en: In all but a very few cases, Magic play allows both players be fully aware and notice errors.
          This is why it’s reasonable for both players to be responsible for correct game states. Opponents
          can notice if a player casts a spell while paying the wrong mana. Likewise, if a players puts
          too many counters on a creature, the opponent (even a spectator) can see that. However, accidentally
          casting a card as though it had the morph or disguise ability cannot be confirmed by the opponent
          who only is authorized to see the back side of the card (something non-morphs and non-disguised
          cards also have). Playing Highland Game thinking it is Temur Charger fits this upgrade path.
        zh: 除了极少数情况外，万智牌游戏允许双方牌手充分了解游戏状况并发现错误。这就是为什么要求双方牌手都有责任维护正确游戏状态是合理的。如果牌手在施放咒语时支付了错误的法术力，对手是可以注意到的。同样，如果牌手在一个生物上放置了过多的指示物，对手（甚至是旁观者）也是看得到的。然而，如果牌手意外地将一张牌当作拥有变身或伪装异能来施放，这是对手无法确认的，因为对手有权看到的只有牌背（而非变身或非伪装的牌也有牌背）。误以为是铁木尔战马而面朝下施放了高地猎物，就符合这种升级判罚的情形。
      sourceRawUnits:
      - raw-L001630
      - raw-L001634
    - id: ipg-ann-2-3-9b9216d0e726-g01-b02
      type: paragraph
      text:
        en: 'Before issuing the upgrade, see if either exception applies:  First, ignore this upgrade
          if the player discovers it themselves and hasn’t added cards to their hand since casting it.
          Second, ignore the upgrade if when the face-down creature is bounced to the hand or the spell
          being casted is returned to the hand by an effect like casting Unsubstantiate. Of course, when
          you’re investigating this call to apply the exception you will want to see a card with the relevant
          ability in hand.'
        zh: 在执行判罚升级之前，请检查是否适用以下两种例外情况之一：第一，如果牌手自己发现了错误，且自施放该牌后尚未有牌加入其手牌，则忽略此升级。第二，如果面朝下的生物被移回手中，或者正在施放的咒语被像消解这样的效应移回手中，则忽略此升级。当然，当你在调查是否适用这一例外时，你需要确认该牌手的手牌中确实有一张具有相关异能的牌。
      sourceRawUnits:
      - raw-L001632
      - raw-L001636
- id: ipg-ann-2-4-8e7e3f82e43d
  anchor:
    type: block
    id: ipg-s2-4-c-definition-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-4-8e7e3f82e43d-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-4-8e7e3f82e43d-g01-b01
      type: paragraph
      text:
        en: Mulligan Procedure Error covers actions before the game begins, but once the game has started,
          those same errors become Hidden Card Error or Game Rule Violation and are fixed by those respective
          infractions.
        zh: 再调度失误涵盖的是游戏开始前的动作；但一旦游戏开始，同样的失误将转变为非公开牌张失误或违反游戏规则，并按照这些相应违规的修正方案进行处理。
      sourceRawUnits:
      - raw-L001648
      - raw-L001650
- id: ipg-ann-2-4-79dc8a95df3f
  anchor:
    type: block
    id: ipg-s2-4-c-definition-g01-b002
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-4-79dc8a95df3f-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-4-79dc8a95df3f-g01-b01
      type: paragraph
      text:
        en: 'Try not to overthink this infraction. If a player does something wrong that isn’t listed
          in the examples, compare the impact of that error and decide if it’s trivial or not. Examples:'
        zh: 尽量不要对这种违规过度解读。如果牌手犯了未在示例中列出的错误，请衡量该错误的影响，并判定其是否属于无关紧要的小错。示例：
      sourceRawUnits:
      - raw-L001656
      - raw-L001657
      - raw-L001665
  - id: ipg-ann-2-4-79dc8a95df3f-g02
    kind: unordered-list
    blocks:
    - id: ipg-ann-2-4-79dc8a95df3f-g02-b01
      type: list-item
      text:
        en: A player on the draw declares that they will keep before the player on the play
        zh: 后手牌手在先手牌手之前宣布保留手牌。
      sourceRawUnits:
      - raw-L001659
      - raw-L001667
      marker: bullet
    - id: ipg-ann-2-4-79dc8a95df3f-g02-b02
      type: list-item
      text:
        en: One player puts a Leyline onto the battlefield before their opponent finishes their mulligans
        zh: 一名牌手在对手完成调度之前就将地脉放进了战场。
      sourceRawUnits:
      - raw-L001661
      - raw-L001669
      marker: bullet
  - id: ipg-ann-2-4-79dc8a95df3f-g03
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-4-79dc8a95df3f-g03-b01
      type: paragraph
      text:
        en: Technically these are procedural errors, but at this time in the match the impact is very
          low and should not be treated as an infraction.
        zh: 严格来说这些属于程序失误，但在对局的这一阶段，其影响微乎其微，因此不应被视为违规。
      sourceRawUnits:
      - raw-L001663
      - raw-L001671
- id: ipg-ann-2-4-d81b91e07a58
  anchor:
    type: block
    id: ipg-s2-4-c-philosophy-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-4-d81b91e07a58-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-4-d81b91e07a58-g01-b01
      type: paragraph
      text:
        en: Even with the new London Mulligan it can still be easy to make an error in the pre-game procedure,
          drawing too many cards the most common one, so we have the player take an additional mulligan.
        zh: 即使已采用新的伦敦调度，在游戏前程序中犯错依然很容易，其中多抓牌是最常见的情况，因此我们让该牌手再多调度一次。
      sourceRawUnits:
      - raw-L001689
      - raw-L001693
    - id: ipg-ann-2-4-d81b91e07a58-g01-b02
      type: paragraph
      text:
        en: Note that counting cards face down onto the table does not count as drawing, encourage this
          practice to count the cards before drawing, so any extra cards counted onto the table can be
          returned to the top of the library.
        zh: 请注意，将牌面朝下数到桌面上并不算作抓牌，应鼓励牌手养成在抓入手中之前先这样数牌的习惯，这样任何多数到桌面上的牌都可以直接放回牌库顶。
      sourceRawUnits:
      - raw-L001691
      - raw-L001695
- id: ipg-ann-2-4-9fc2974ada02
  anchor:
    type: block
    id: ipg-s2-4-c-additional-remedy-g01-b001
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-4-9fc2974ada02-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-4-9fc2974ada02-g01-b01
      type: paragraph
      text:
        en: This is self explanatory, the player shuffles their hand and redraws, which means they will
          be returning an additional card to the bottom of the library.
        zh: 这不言自明，牌手将手牌洗回牌库并重新抓牌，这意味着他们将额外放一张牌回牌库底。
      sourceRawUnits:
      - raw-L001703
      - raw-L001705
- id: ipg-ann-2-6-c06a5225ae2b
  anchor:
    type: block
    id: ipg-s2-6-c-definition-g01-b001
    segmentId: ipg-s2-6-c-definition-g01-b001-rs-b7e235582cfc
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-6-c06a5225ae2b-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-6-c06a5225ae2b-g01-b01
      type: paragraph
      text:
        en: There are actually several things going on here. The first is that a player committing a Game
          Play Error can never earn Failure to Maintain Game State. The only person that can get Failure
          to Maintain Game State is the opponent. A player earns Failure to Maintain Game State when they
          do not catch an error made by the opponent. Also note that if a player points out the opponent’s
          error right away, they do not earn this infraction. For example, if Abe casts Wrath of God for
          RRRW and Ned notices before any further actions are taken, Ned will not receive Failure to Maintain
          Game State.
        zh: 这句话实际上包含几方面内容。首先就是违反游戏规则的牌手永远不会获得未维护游戏状态处罚。唯一可能获得未维护游戏状态处罚的是他的对手。牌手在未发现其对手违反规则时获得未维护游戏状态。另外请注意，如果牌手立刻指出了对手的错误则不会获得此违规。例如，如果Abe支付RRRW施放神之愤怒，Ned没有进行任何其他动作就立刻注意到了这点，那么Ned不会获得未维护游戏状态。
      sourceRawUnits:
      - raw-L001853
      - raw-L001855
- id: ipg-ann-2-6-4aefec50ebce
  anchor:
    type: block
    id: ipg-s2-6-c-definition-g01-b001
    segmentId: ipg-s2-6-c-definition-g01-b001-rs-dfab3954e975
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-6-4aefec50ebce-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-6-4aefec50ebce-g01-b01
      type: paragraph
      text:
        en: Generally we think of Cheating as actively and intentionally doing something against the rules
          and for an advantage. However, it may also also be Cheating to notice your opponent doing something
          against the rules and not call a judge, or to only call a judge when it is to your advantage.
          For example, Abe controls a Juggernaut and forgets to attack with it. Ned says nothing, because
          he doesn’t want to take the damage. Depending on Ned’s knowledge of game rules and player responsibilities,
          this may be Cheating.
        zh: 一般来说，我们认为作弊是主动地、故意地违反规则并寻求获益。但是，发现对手违规而不呼叫裁判，或是在对你有利时才呼叫裁判一样有可能是作弊。例如，Abe操控攻城巨车但是忘了用它攻击。Ned什么都没说因为他不想受到伤害。根据Ned对游戏规则和牌手责任的了解情况来判断，这有可能是作弊。
      sourceRawUnits:
      - raw-L001861
      - raw-L001863
- id: ipg-ann-2-6-1e7bbdc96568
  anchor:
    type: block
    id: ipg-s2-6-c-definition-g01-b001
    segmentId: ipg-s2-6-c-definition-g01-b001-rs-d7cd4a14bf58
  position: after
  order: 30
  groups:
  - id: ipg-ann-2-6-1e7bbdc96568-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-6-1e7bbdc96568-g01-b01
      type: paragraph
      text:
        en: This is a very important exception to the “you must point out your opponent’s errors” rule.
          Missed triggers are handled differently. A player is allowed to not point out their opponent’s
          missed triggers. Since it is allowed, it cannot be an infraction. See the Missed Trigger section
          for more details.
        zh: 这是对于“你必须指出你对手的错误”这条规则的一个重要例外。遗漏触发的处理方式不同。规则允许牌手不指出其对手的遗漏触发。既然这是允许的，那自然不是违规。查看遗漏触发部分以获得更多细节。
      sourceRawUnits:
      - raw-L001869
      - raw-L001871
- id: ipg-ann-2-6-7c97d21ca7dd
  anchor:
    type: block
    id: ipg-s2-6-c-examples-g01-b002
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-6-7c97d21ca7dd-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-6-7c97d21ca7dd-g01-b01
      type: paragraph
      text:
        en: In both of these cases, the player’s opponent committed a Game Rule Violation, and the player
          didn’t notice it right away.
        zh: 在这两个例子中，该牌手的对手违反了游戏规则而该牌手没有立刻发现。
      sourceRawUnits:
      - raw-L001883
      - raw-L001885
- id: ipg-ann-2-6-832696668f5f
  anchor:
    type: block
    id: ipg-s2-6-c-philosophy-g01-b001
    segmentId: ipg-s2-6-c-philosophy-g01-b001-rs-f9c983665a49
  position: after
  order: 10
  groups:
  - id: ipg-ann-2-6-832696668f5f-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-6-832696668f5f-g01-b01
      type: paragraph
      text:
        en: This is really just a fancy way of saying “the sooner an error is caught, the less likely
          it is to cause a large problem.” It should be a fairly obvious statement.
        zh: 这只是“错误越早被发现，越不容易造成大问题”的另一个说法。这很显然是一句正确的话。
      sourceRawUnits:
      - raw-L001893
      - raw-L001895
- id: ipg-ann-2-6-2a45a36a4dd8
  anchor:
    type: block
    id: ipg-s2-6-c-philosophy-g01-b001
    segmentId: ipg-s2-6-c-philosophy-g01-b001-rs-592f09b23206
  position: after
  order: 20
  groups:
  - id: ipg-ann-2-6-2a45a36a4dd8-g01
    kind: paragraphs
    blocks:
    - id: ipg-ann-2-6-2a45a36a4dd8-g01-b01
      type: paragraph
      text:
        en: The key point here is that both players are responsible for the game state. If the opponent
          is being observant, they can help catch a player’s error before the problem becomes more severe.
          It doesn’t matter who gained an advantage from it. Note that there are some situations where
          one player controls the effect, and the other player takes the action, but did so in a way that
          caused an error. In this case, please refer to the Game Rule Violation section, as there are
          some cases where both players have committed the same infraction.
        zh: 这里的关键点在于，双方牌手都要为游戏状态负责。如果对手足够敏锐，他可以在错误变的更严重前发现它。谁从中获得优势并不重要。请注意在某些情况下一个牌手操控效应，而另一个牌手采取行动，却以错误的方式采取了这些行动。在这种情况下，请参阅违反游戏规则部分，其中某些例子是双方牌手同时犯下违规。
      sourceRawUnits:
      - raw-L001901
      - raw-L001903
