documentId: ipg-chapter-02-pilot
publicationAnnotations:
- id: ipg-ann-section-2-5-definition-context
  anchor:
    type: section
    id: ipg-s2-5
  position: inside-start
  text:
    en: “Game Rule Violation” does not refer to any particular type of error. Rather, Game Rule Violations
      are specifically defined as errors that aren’t another infraction. Newer judges will sometimes talk
      about how “mis-resolving a spell” is a Game Rule Violation. In actuality, resolving a spell improperly
      could result in one of several different infractions, such as Looking at Extra Cards (e.g. forgetting
      that Courser of Kruphix left the battlefield) to Hidden Card Error (e.g. mis-reading Divination
      and drawing three cards).
    zh: “违反游戏规则”不指代任何特定类型的错误。然而，违反游戏规则明确定义为所有不能归类为其他违规的错误。新裁判有时会讨论“错误地结算一个咒语”是否应当是违反游戏规则。事实上，不正确的结算咒语可能会导致另一些违规，像是额外看牌（如忘记了克罗芬斯的骏马已经离开战场）及非公开牌张失误（看错了卜卦的叙述而抓了3张牌）等。
  sourceRawUnits:
  - raw-L001717
  - raw-L001719
- id: ipg-ann-2-5-philosophy-consistency
  anchor:
    type: component
    id: ipg-s2-5-c-philosophy
  position: inside-end
  text:
    en: Consistency is a core principle of the IPG. Even though there are thousands of judges adjudicating
      tournaments across the world, it is important for each of these tournaments to be run and judged
      to the same standard. For this reason, we strive to handle penalties neutrally. Fundamentally, both
      players are responsible for maintaining a proper game state. Our core role as judges is not to “correct”
      or “fix” the players’ mistakes, but to dispassionately interpret and apply the fixes prescribed
      by the IPG.
    zh: 一致性是IPG的核心原则。以同样的标准执法世界各地的比赛是很重要的事，即使这些比赛由数以千计的不同裁判来执法。因此，我们致力于处理处罚的中立性。从根本上来说，双方牌手都有责任保持正确的游戏状态。作为裁判，我们的核心作用不是改正或者修复牌手的错误，而是冷静地解释并应用IPG中规定的修正。
  sourceRawUnits:
  - raw-L001749
  - raw-L001751
- id: ipg-ann-2-5-partial-fix-list
  anchor:
    type: group
    id: ipg-s2-5-c-additional-remedy-g02
  position: inside-start
  text:
    en: So right here we are going to have a list of partial fixes. Try to do a simple backup (see Backing
      Up 1.4 for more information about back ups) then, if you can’t, you can try to do a partial fix.
      If you cannot apply a simple backup or a partial fix you evaluate if you need to do a back up or
      leave alone. If the error fits more than one of these categories, it’s ok to partial fix, but be
      careful that the error only fits into those categories. If there are multiple fixes within the same
      bullet point, you’re still fine to use that partial fix.
    zh: 以下是部分修正的列表。首先试着进行简易倒回（关于倒回，详见一节）；如果简易倒回不够，你可以试着执行部分修正。如果你既不能进行简易倒回、也不能执行部分修正，那么你可以考虑倒回或者保留当前状态不修正。如果失误属于一种类别以上，可以使用部分修正，但必须小心注意该失误只属于这些类别。如果在同一条目中满足了多个修正条件，你仍然可以使用这种部分修正。
  sourceRawUnits:
  - raw-L001763
  - raw-L001765
- id: ipg-ann-2-5-wrong-zone
  anchor:
    type: block
    id: ipg-s2-5-c-additional-remedy-g02-b004
  position: after
  text:
    en: There is a fair amount to consider here. There are four tests to determine if this partial fix
      is relevant. 1) Is the object not in the correct zone. This covers when a creature died but shouldn’t
      have, or when a creatures shouldn’t have died but did. It also covers if a card was supposed to
      be bounced as wasn’t or a card was put in the GY when it should have been exiled. Basically, if
      the game was played correctly, that card should be somewhere else. 2) The identity of the object
      was known to all players. This means that all players know what the object is. This could be because
      the card was revealed or it could be because the card is in a location known by both players such
      as the top of a library. 3) The movement of the card (or lack of movement) is the error, not the
      result of some other error. For example, if a Path to Exile was case for {C}, and the card was put
      in exile; that is not eligible for this partial fix because the error was in casting Path for {C}.
    zh: 这里有不少需要考量的因素。要确定此项部分修正是否适用，需要进行四项测试：该物件是否不在正确的区域？这涵盖了生物本不该死却死了，或者生物本该死却没死的情况。这也包括牌本该被回手却没移回，或者牌本该被放逐却进了坟墓场的情况。简而言之，如果游戏进行正确，该牌应当处于其他位置。是否所有牌手都知晓该物件的身份？这意味着所有牌手都知道那个物件具体是什么。这可能是因为该牌曾被展示过，或者因为它处于双方都知道的位置，例如已知的牌库顶。失误是否是牌的移动（或未移动）本身，而非其他失误导致的后果？例如，如果某人用方片施放了流放之径并将目标牌放逐了；这种情况就不适用此项部分修正，因为错误的根源在于用方片施放了流放之径。
  sourceRawUnits:
  - raw-L001795
  - raw-L001799
