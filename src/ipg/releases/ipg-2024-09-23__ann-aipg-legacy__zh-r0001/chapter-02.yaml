          en: A triggered ability is considered to have triggered even if it was subsequently missed.
            Effects that count or restrict the number of times a triggered ability can trigger will count
            the missed one.
          zh: 即使一个触发式异能在触发后被遗忘，它仍被视作已触发。计算或限制异能触发次数的效应，会将被遗漏的触发计算在内。
