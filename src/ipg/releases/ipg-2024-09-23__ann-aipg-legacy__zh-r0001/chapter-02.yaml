sections:
- id: ipg-s2
  kind: chapter
  number: '2'
  title:
    en: Game Play Errors
    zh: 游戏行动失误
  components:
  - id: ipg-s2-c-body
    role: body
    labelCode: component.body
    groups:
    - id: ipg-s2-c-body-g01
      kind: paragraphs
      blocks:
      - id: ipg-s2-c-body-g01-b001
        type: paragraph
        text:
          en: Game Play Errors are caused by incorrect or inaccurate play of the game such that it results
            in violations of the Magic Comprehensive Rules. Many offenses fit into this category and it
            would be impossible to list them all. The guide below is designed to give judges a framework
            for assessing how to handle a Game Play Error.
          zh: '游戏行动失误是以不正确或是不精准的行动来进行游戏，而导致违反《万智牌完整规则》的结果。


            许多违规都属于此类情况，但不可能全数详列。


            以下的方针是设计给裁判参考的构架，用来决定如何处理游戏行动失误。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 7
          bbox:
          - 90.0
          - 85.64
          - 551.64
          - 139.04
          extractionUnit: extract-p07-l002..extract-p07-l005
        legacyRawUnits:
        - raw-L000653
        - raw-L000655
        - raw-L000665
