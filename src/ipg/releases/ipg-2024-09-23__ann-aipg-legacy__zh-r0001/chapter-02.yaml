      - id: ipg-s2-1-c-philosophy-g01-b004
        type: paragraph
        text:
          en: Players may not cause triggered abilities controlled by an opponent to be missed by taking
            game actions or otherwise prematurely advancing the game. During an opponent’s turn, if a
            trigger’s controller demonstrates awareness of the trigger before they take an active role
            (such as taking an action or explicitly passing priority), the trigger is remembered. The
            Out-of-Order Sequencing rules (MTR section 4.3) may also be applicable, especially as they
            relate to batches of actions or resolving items on the stack in an improper order.
          zh: '牌手不得通过执行游戏动作或其他贸然推进游戏进程的手段，以致使对手遗漏由其操控的触发式异能。


            在对手的回合中，如果触发的操控者在他们担任主动角色之前（例如进行游戏动作或明确让过优先权）表明自己认识到触发存在，便视作他们记得此触发。


            次序不当的行事顺序之相关规则（MTR第4.3节）亦应纳入考量，因为这部分规则与未以恰当顺序进行一系列动作或结算堆叠上的多个物件有关。'
