  number: '4.4'
  title:
    en: Bribery and Wagering
    zh: 贿赂与赌博
  components:
  - id: ipg-c000070
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-g000074
      kind: paragraphs
      blocks:
      - id: ipg-b000174
        type: paragraph
        text:
          en: A player offers an incentive to entice an opponent into conceding, drawing, or changing
            the results of a match, encourages such an offer, or accepts such an offer. Refer to section
            5.2 of the Magic Tournament Rules for a more detailed description of what constitutes bribery.
          zh: 牌手提供奖励来诱使对手认输、约和，或改变对局结果，牌手鼓动此类行为，或是接受对方提出的此类条件。若想知道贿赂的详细定义与构成要素，请参照《万智牌比赛规则》第 5.2 节的详细叙述。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 26
          bbox:
          - 90.0
          - 542.96
          - 551.13
          - 582.82
          extractionUnit: extract-p26-l026..extract-p26-l028
        legacyRawUnits:
        - raw-L003638
        - raw-L003640
      - id: ipg-b000175
        type: paragraph
        text:
          en: Wagering occurs when a player or spectator at a tournament places or offers to place a bet
            on the outcome of a tournament, match or any portion of a tournament or match. The wager does
            not need to be monetary, nor is it relevant if a player is not betting on their own match.
          zh: 赌博指的是比赛的牌手或是观众对比赛的结果、对局或是比赛和对局的任何部分来下注或提议下注。赌博不一定只指现金形式，也不论牌手下注的是否是自己的对局。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 26
