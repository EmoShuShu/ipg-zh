  - id: ipg-c000060
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-g000064
      kind: paragraphs
      blocks:
      - id: ipg-b000148
        type: paragraph
        text:
          en: All participants should expect a safe and enjoyable environment at a tournament, and a player
            needs to be made aware if their behavior is unacceptable so that this environment may be maintained.
          zh: "所有参赛者都该享有一个安全且舒适的赛场环境，牌手做出不可接受的行为时，需要让其知悉这一点，如此才能维护赛场环境。"
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 24
