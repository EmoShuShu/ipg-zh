sections:
- id: ipg-s4
  kind: chapter
  number: '4'
  title:
    en: Unsporting Conduct
    zh: 举止违背运动道德
  components:
  - id: ipg-c000057
    role: body
    labelCode: component.body
    groups:
    - id: ipg-g000061
      kind: paragraphs
      blocks:
      - id: ipg-b000138
        type: paragraph
        text:
          en: Unsporting conduct is disruptive behavior that may affect the safety, competitiveness, enjoyment,
            or integrity of a tournament in a significantly negative fashion.
          zh: 举止违背运动道德是具干扰性的行为，可能会对比赛的安全、竞争性、乐趣或公平性有严重的负面影响。
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 24
          bbox:
          - 90.0
          - 73.64
          - 502.56
          - 99.44
          extractionUnit: extract-p24-l002..extract-p24-l003
        legacyRawUnits:
        - raw-L003090
        - raw-L003092
      - id: ipg-b000139
        type: paragraph
        text:
          en: Unsporting behavior is not the same as a lack of sporting behavior. There is a wide middle
            ground of “competitive” behavior that is certainly neither “nice” nor “sporting” but still
            doesn’t qualify as “unsporting.” The Head Judge is the final arbiter on what constitutes unsporting
            conduct.
          zh: "举止违背运动道德和缺乏运动家精神并不一样。“竞争性”的行为有很多的灰色地带，它们确实不“友好”，也非“具有运动家精神”，但也不能算是“举止违背运动道德”。\n\n主审是判定举止是否违背运动道德的最终仲裁者。"
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 24
          bbox:
          - 90.0
          - 115.04
          - 548.98
          - 168.44
          extractionUnit: extract-p24-l004..extract-p24-l007
        legacyRawUnits:
        - raw-L003098
        - raw-L003100
        - raw-L003106
        - raw-L003108
        readingSegments:
        - id: ipg-b000139-rs-ba75ffdba825
          sourceRange:
          - 0
          - 215
          text:
            en: Unsporting behavior is not the same as a lack of sporting behavior. There is a wide middle ground
              of “competitive” behavior that is certainly neither “nice” nor “sporting” but still doesn’t qualify
              as “unsporting.”
            zh: 举止违背运动道德和缺乏运动家精神并不一样。“竞争性”的行为有很多的灰色地带，它们确实不“友好”，也非“具有运动家精神”，但也不能算是“举止违背运动道德”。
          legacyRawUnits:
          - raw-L003098
          - raw-L003100
        - id: ipg-b000139-rs-8dcd07836dc6
          sourceRange:
          - 215
          - 290
          text:
            en: The Head Judge is the final arbiter on what constitutes unsporting conduct.
            zh: "主审是判定举止是否违背运动道德的最终仲裁者。"
          legacyRawUnits:
          - raw-L003106
          - raw-L003108
      - id: ipg-b000140
        type: paragraph
        text:
          en: Judges should inform the player how their conduct is disruptive. The player is expected
            to correct the situation and behavior immediately. However, while making sure that the player
            understands the severity of their actions is important, judges should focus first on calming
            a situation, and deal with infractions and penalties afterwards.
          zh: "裁判应当告知该牌手，其举止如何造成干扰。该牌手应当立刻改正状况和行为。虽然确保该牌手了解其行为的严重性很重要，但裁判应先设法平息当前局势，之后再处理违规与处罚。"
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
          page: 24
          bbox:
          - 90.0
          - 184.04
          - 530.21
          - 237.44
          extractionUnit: extract-p24-l008..extract-p24-l011
        legacyRawUnits:
        - raw-L003114
        - raw-L003116
