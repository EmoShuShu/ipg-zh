        type: paragraph
        text:
          en: Players enter a tournament expecting that their materials will be protected. This does not
            absolve the players from their responsibility to keep an eye on their possessions, but they
            should expect to be able to retain the product they began with or were given for the tournament.
            Other instances of theft not involving tournament materials are the responsibility of the
            Tournament Organizer, though judges are encouraged to help in any way possible.
          zh: "牌手加入比赛之后，他们的物品就应该受到保护。\n\n这并不是免除牌手留意自我财物的责任；但他们应当能够保有开赛时的产品，或是给他们比赛用的物品。\n\n其他未牵涉比赛物品的偷窃，便是比赛承办人的责任，同时也鼓励裁判尽可能提供帮助。"
