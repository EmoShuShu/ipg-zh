  - id: ipg-c000061
    role: additional-remedy
    labelCode: component.additional-remedy
    groups:
    - id: ipg-g000065
      kind: paragraphs
      blocks:
      - id: ipg-b000149
        type: paragraph
        text:
          en: The player must correct the problem immediately. Subsequent Unsporting Conduct — Minor infractions,
            even for different offenses, will result in a Game Loss. If a Game Loss is issued for repeated
            infractions, and it occurs at the end of a game, it is acceptable for the judge to apply the
            penalty to the next game instead.
          zh: '该牌手必须立即更正问题。


            再次犯下举止违背运动道德～轻微，会导致一盘负；即使是不同类型的违犯也一样。


            如果因为累犯而给予一盘负，且是在发生在一盘游戏结束时，裁判可以改为在下一盘才让处罚生效。'
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
