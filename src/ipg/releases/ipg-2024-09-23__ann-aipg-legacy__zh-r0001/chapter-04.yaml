          sourceRange:
          - 0
          - 134
          text:
            en: A safe environment is a basic expectation of any tournament attendee. Harassment undermines the
              safety and integrity of a tournament.
            zh: 安全的比赛环境是所有参赛者最基本的预期。对他人进行骚扰会破坏比赛的安全与公正。
          legacyRawUnits:
          - raw-L003392
          - raw-L003394
        - id: ipg-b000158-rs-db8a053d25ad
          sourceRange:
          - 134
          - 303
          text:
            en: Players who purposefully create harmful or unwelcoming situations in a tournament are expected
              to immediately correct the behavior and demonstrate remorse or be removed.
            zh: "在比赛中故意制造有害或不友好情境的牌手，应立即改正行为并表现出懊悔，否则便会被逐出赛场。"
          legacyRawUnits:
          - raw-L003400
          - raw-L003402
      - id: ipg-b000159
        type: paragraph
        text:
          en: Because of the confrontational nature of this infraction, judges need to end any match in
            progress and separate the players. Care should be taken not to escalate the situation if at
            all possible. The offender will be removed from the area to receive the penalty, and education
            about why the behavior is unacceptable regardless of excuse. They may need a few moments to
            cool down afterwards. Apologizing is encouraged, but the desire of the other individuals to
            not interact with their harasser must be respected.
          zh: "由于出现此违规时双方牌手会在情绪上有所对立，裁判要终止涉事的、正在进行的对局，并将双方牌手分开。\n\n同时应尽力进行安抚，保证事态不致升级。裁判应将犯下此违规的牌手带离比赛区域，给予处罚，并教育牌手不管理由为何，都不应该进行这类行为。\n\n此后牌手可能需要一段时间冷静。\n\n应鼓励道歉，但必须尊重其他人不愿再与骚扰者接触的意愿。"
