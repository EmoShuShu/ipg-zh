  - id: ipg-c000064
    role: philosophy
    labelCode: component.philosophy
    groups:
    - id: ipg-g000068
      kind: paragraphs
      blocks:
      - id: ipg-b000158
        type: paragraph
        text:
          en: A safe environment is a basic expectation of any tournament attendee. Harassment undermines
            the safety and integrity of a tournament. Players who purposefully create harmful or unwelcoming
            situations in a tournament are expected to immediately correct the behavior and demonstrate
            remorse or be removed.
          zh: "安全的比赛环境是所有参赛者最基本的预期。对他人进行骚扰会破坏比赛的安全与公正。\n\n在比赛中故意制造有害或不友好情境的牌手，应立即改正行为并表现出懊悔，否则便会被逐出赛场。"
        officialPdfUnits:
        - pdfSha256: 056b1687bae4a6c5d7bc4fe4e15d66613e725197cc2a45e18084c2eaf1b5aae0
