      text:
        en: 'All of these are examples of a player intentionally violating game rules, tournament rules,
          or lying. While this is not an exhaustive list, it covers many of the most common cases. One
          thing that is noticeably absent: not pointing out your opponents Missed Trigger. This is never
          cheating, even if you point out the Missed Trigger at a point in time that is beneficial to
          you.'
        zh: 这些例子都是牌手在故意违反游戏规则、比赛规则或者撒谎。尽管这些例子无法涵盖所有的作弊情况，它涵盖了很多常见的情况。注意，有一种情况不属于作弊：没有指出对手的遗漏触发。这永远不是作弊，即使你在更有利于你的时间才指出对手的遗漏触发，也是一样。
