        type: paragraph
        text:
          en: A player takes action that is disruptive to the tournament or its participants. It may affect
            the comfort level of those around the individual, but determining whether this is the case
            is not required.
          zh: '牌手的个人行为对比赛或是参与者产生干扰。


            这可能会妨碍到该人周遭的舒适气氛，不过是否造成妨碍并非判定的必要条件。'
