- id: ipg-s4-3
  kind: infraction
  number: '4.3'
  title:
    en: Improperly Determining a Winner
    zh: 不当决定胜方
  components:
  - id: ipg-c000067
    role: definition
    labelCode: component.definition
    groups:
    - id: ipg-g000071
      kind: paragraphs
      blocks:
      - id: ipg-b000163
        type: paragraph
        text:
          en: A player uses or offers to use a method that is not part of the current game (including
            actions not legal in the current game) to determine the outcome of a game or match, or uses
            language designed to trick someone who may not know it’s against the rules to make such an
            offer.
          zh: "牌手利用或提议不属于当前游戏的方法（包括当前游戏中不合法的行动），来决定某盘游戏或某对局的结果，或用言语诱使可能不知悉此行为属于违规的某人做出提议。"
        officialPdfUnits:
