      kind: paragraphs
      blocks:
      - id: ipg-b000150
        type: paragraph
        text:
          en: A player takes action towards one or more individuals that could reasonably be expected
            to create a feeling of being harassed, threatened, bullied, or stalked. This may include insults
            based on race, color, religion, national origin, age, gender, disability, or sexual orientation.
            Threats of physical violence should be treated as Unsporting Conduct – Aggressive Behavior.
          zh: "牌手向一人或多人做出易使对方产生受骚扰、威胁、欺侮、尾随感受的不端行为。\n\n这包括侮辱他人的人种、肤色、宗教、国籍、年龄、性别、残疾或是性取向。\n\n肢体暴力威胁应依照“举止违背运动道德～攻击性举止”进行处理。"
        officialPdfUnits:
