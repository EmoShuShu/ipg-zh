          zh: '如果某违规并未同时满足上述两个要素，则该行为便不属于“作弊”，且应依照其他种类之违规进行处理。


            作弊这类违规表面上看起来通常很类似游戏行动失误或是比赛失误，裁判必须经过调查方得以断定牌手背后之意图及其对规则的了解程度。'
