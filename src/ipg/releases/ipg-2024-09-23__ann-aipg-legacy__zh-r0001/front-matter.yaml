      - id: ipg-b000002
        type: paragraph
        text:
          en: 'This document is divided into two major parts: General Definitions and Philosophy (section
            1), and Infractions (sections 2-4). Infractions are broken down into general classes (Game
            Play Errors, Tournament Errors, and Unsporting Conduct), and further into subclasses for specific
            infractions.'
          zh: 此文件分为两个主要部份：一般定义和原则（第1节），以及违规（第2-4节）。违规分为一些主分类（游戏行动失误、比赛失误及举止违背运动道德），以及为特定违规进一步区分副分类。
