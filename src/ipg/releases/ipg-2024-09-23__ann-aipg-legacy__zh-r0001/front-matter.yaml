      - id: ipg-b000001
        type: paragraph
        text:
          en: 'The Magic: The Gathering™ (“Magic”) Infraction Procedure Guide provides judges the appropriate
            penalties and procedures to handle rules violations that occur during a tournament held at
            Competitive or Professional Rules Enforcement Level (REL), as well as the underlying philosophy
            that guides their implementation. It exists to protect players from potential misconduct and
            to protect the integrity of the tournament itself. Rules violations usually require a penalty
            or they are unenforceable. Tournaments run at Regular REL use the Judging at Regular REL document.'
          zh: 《万智牌违规处理方针》此份文档，是用来在执法严格度（REL）为“竞争”或“专业”级别的比赛中发生违反规则事件时，为提供裁判适当的罚则与处理程序，并阐述其背后的原则。这是用来保护牌手免于犯下潜在的失误，也保护比赛本身的公正性。违反规则的行为通常应受处罚，否则规则将无法执行。执法严格度为一般等级的比赛使用《一般级别执法严格度执法指南》。
