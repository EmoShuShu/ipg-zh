[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ipg-zh"
version = "0.1.0"
description = "Pilot pipeline for the Simplified Chinese Magic Infraction Procedure Guide"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "pdfplumber>=0.11,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
ipg-pilot = "ipg_pipeline.cli:main"
ipg-p3 = "ipg_pipeline.p3:main"
ipg-p4 = "ipg_pipeline.p4:main"
ipg-review = "ipg_pipeline.review_assistant:main"

[tool.hatch.build.targets.wheel]
packages = ["ipg_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

