[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ipg-zh"
version = "0.1.0"
description = "Local maintenance pipeline for the Simplified Chinese Magic Infraction Procedure Guide"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "pdfplumber>=0.11,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
test = ["pytest>=8.3,<9"]

[project.scripts]
ipg-check-official-update = "ipg_pipeline.official_update:main"
ipg-snapshot = "ipg_pipeline.snapshot:main"
ipg-validate = "ipg_pipeline.production:validate_main"
ipg-build = "ipg_pipeline.production:build_main"
ipg-validate-output = "ipg_pipeline.production:output_main"
ipg-pilot = "ipg_pipeline.cli:main"
ipg-p3 = "ipg_pipeline.p3:main"
ipg-p4 = "ipg_pipeline.p4:main"
ipg-review = "ipg_pipeline.review_assistant:main"
ipg-review-workflow = "ipg_pipeline.review_assistant:main"
ipg-export-omegat = "ipg_pipeline.maintenance:export_main"
ipg-review-status = "ipg_pipeline.maintenance:status_main"
ipg-audit-terminology = "ipg_pipeline.maintenance:terminology_main"

[tool.hatch.build.targets.wheel]
packages = ["ipg_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

